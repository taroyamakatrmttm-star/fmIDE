name: Tests

on:
  # Tests run once per change: on a pull request (the change as it would be merged), and on
  # main after a merge. A push to any other branch runs nothing (its pull request does).
  push:
    branches: [main]
  pull_request:
  # The live site picks up packs merged into the community library by itself: every hour
  # (only when the library changed), or at once with "Run workflow" in the Actions tab.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  # The suite runs in 4 parts at once, each on its own machine, so a run takes about a quarter
  # of the time. tools/test-parts.js puts every test file into exactly one part, spread by how
  # long each took in a measured run (tests/test-durations.json), so the parts end together.
  # Every test still runs on every change. The job "test" below goes green only when
  # all 4 parts passed; it is the one check to wait for, and what deploy waits on.
  test-part:
    # An hourly or manual publish runs main's code, already tested when it was merged.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: test (part ${{ matrix.part }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # A newer push to a pull request replaces the run of the older one.
      group: test-${{ github.head_ref || github.ref_name }}-${{ matrix.part }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      # Every part runs to the end even when another fails, so one run shows every failure.
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated apps match src/
        run: |
          npm run build
          git diff --exit-code apps/

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install LibreOffice (for the recalculation tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Run tests (part ${{ matrix.part }} of 4)
        run: |
          node tools/test-parts.js ${{ matrix.part }} 4
          npx playwright test $(node tools/test-parts.js ${{ matrix.part }} 4)

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-part-${{ matrix.part }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  test:
    # Green only when all 4 parts passed (a part that failed, was cancelled or didn't run
    # makes it red). Skipped, like the parts, on an hourly or manual publish.
    needs: test-part
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All 4 parts passed?
        env:
          RESULT: ${{ needs.test-part.result }}
        run: |
          echo "The 4 parts: $RESULT"
          [ "$RESULT" = success ]

  # Publishes the web app (site/) to Cloudflare Pages once the tests pass: a merge into
  # main updates the live site; a pull request from this repository gets its own preview
  # address, posted on the pull request. Needs the repository secrets CLOUDFLARE_API_TOKEN
  # (a token with the Cloudflare Pages: Edit permission) and CLOUDFLARE_ACCOUNT_ID; without
  # them the job only notes that it skipped. See docs/step5-publish.md.
  # The site includes the community library's catalogue (/library). The live site is built
  # from the library's latest main (every pack there was checked and merged in the library);
  # a pull request's preview from the library/ submodule at the commit this repository pins.
  # The library is public, so GitHub's normal token fetches it. The build checks it again
  # and publishes nothing if a pack fails, or if the library is missing (a site without it
  # would take the live catalogue down). If the latest library fails this fmIDE's checks,
  # the live site is built from the pinned commit instead and the run ends in an error.
  # The hourly run publishes only when the library differs from the live site's.
  deploy:
    needs: test
    # Wrapped in ${{ }}: a condition starting with "!" is otherwise not read as one.
    if: >-
      ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.head_ref || github.ref_name }}
      # A newer push to a pull request replaces its preview; the live site's runs wait their turn.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: fmide
    steps:
      - name: Check the Cloudflare secrets are set
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not published: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not set (see docs/step5-publish.md)."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          submodules: true   # library/, the community library, at its pinned commit
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: lts/*

      - name: Build the site
        id: build
        if: steps.secrets.outputs.ready == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node tools/build.js --site site --require-library
            exit 0
          fi
          # The live site: the library's latest main, else the pinned commit.
          pinned=$(git -C library rev-parse HEAD)
          git -C library fetch -q --depth=1 origin main
          latest=$(git -C library rev-parse FETCH_HEAD)
          git -C library checkout -q "$latest"
          if node tools/build.js --site site --require-library; then
            echo "Built with the library's latest main, $latest."
            echo "### Library: latest main, ${latest:0:7}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The library's latest main ($latest) failed fmIDE's checks (above). Building with the pinned commit $pinned instead."
            echo "fallback=$latest" >> "$GITHUB_OUTPUT"
            git -C library checkout -q "$pinned"
            rm -rf site   # --site writes into the folder; nothing of the failed try may stay
            node tools/build.js --site site --require-library
            echo "### Library: pinned ${pinned:0:7} (the latest, ${latest:0:7}, failed the checks)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Anything new for the live site? (hourly run)
        id: changed
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'schedule'
        run: |
          # The catalogue's list holds every pack's id, details and hash, so an unchanged list
          # means an unchanged library.
          if curl -fsS --max-time 30 https://fmide.pages.dev/library/index.json -o "$RUNNER_TEMP/live-index.json" &&
             cmp -s "$RUNNER_TEMP/live-index.json" site/library/index.json; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "The live site already has this library; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the Pages project (first time only)
        if: steps.secrets.outputs.ready == 'true' && steps.changed.outputs.publish != 'false'
        run: |
          if out=$(npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main 2>&1); then
            echo "$out"
          elif echo "$out" | grep -qi "already exist"; then
            echo "Pages project $PROJECT already exists."
          else
            echo "$out"; exit 1
          fi

      - name: Publish
        id: publish
        if: steps.secrets.outputs.ready == 'true' && steps.changed.outputs.publish != 'false'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          # the pull request's own latest commit (GITHUB_SHA is GitHub's temporary merge commit there)
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          log="$RUNNER_TEMP/deploy.log"   # outside the checkout, so wrangler sees no uncommitted files
          npx --yes wrangler@4 pages deploy site --project-name="$PROJECT" --branch="$BRANCH" --commit-hash="$COMMIT" --commit-dirty=false | tee "$log"
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' "$log" | head -n 1 || true)
          alias=$(grep -Ei 'alias' "$log" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | tail -n 1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias=${alias:-$url}" >> "$GITHUB_OUTPUT"
          echo "### Published: ${alias:-$url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Post the preview link on the pull request
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW: ${{ steps.publish.outputs.alias }}
          THIS_VERSION: ${{ steps.publish.outputs.url }}
        with:
          script: |
            const marker = '<!-- fmide-preview -->';
            // The per-version address is new for every push, so no copy the browser saved
            // earlier (the offline copy) can stand in for it; the branch address can.
            const body = marker + '\n**Try this version (' + context.payload.pull_request.head.sha.slice(0, 7) + '):** ' + process.env.THIS_VERSION +
              '\n\nAlways the latest of this pull request: ' + process.env.PREVIEW +
              ' (if it shows an older version, use Reload on its "new version" notice)' +
              '\n\nThe live site changes only when this pull request is merged.';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Say if the latest library was left out
        if: steps.build.outputs.fallback != ''
        env:
          LATEST: ${{ steps.build.outputs.fallback }}
        run: |
          echo "::error::The library's latest main ($LATEST) failed fmIDE's checks, so the live site kept the library/ pointer's commit. See the step 'Build the site'."
          exit 1
