    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel';
    const okBtn = document.createElement('button');
    okBtn.className = 'danger';
    okBtn.textContent = 'OK';
    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    box.appendChild(p);
    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function close(){ overlay.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(ev){ if(ev.key === 'Escape') close(); }
    cancelBtn.addEventListener('click', close);
    overlay.addEventListener('mousedown', (ev) => { if(ev.target === overlay) close(); });
    okBtn.addEventListener('click', () => { close(); onConfirm(); });
    document.addEventListener('keydown', onKey);
    okBtn.focus();
  }

  function showMessage(message){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    const p = document.createElement('p');
    p.textContent = message;
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const okBtn = document.createElement('button');
    okBtn.className = 'primary';
    okBtn.textContent = 'OK';
    actions.appendChild(okBtn);
    box.appendChild(p);
    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function close(){ overlay.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(ev){ if(ev.key === 'Escape' || ev.key === 'Enter') close(); }
    okBtn.addEventListener('click', close);
    overlay.addEventListener('mousedown', (ev) => { if(ev.target === overlay) close(); });
    document.addEventListener('keydown', onKey);
    okBtn.focus();
  }

  function clearCanvasInteractive(){
    if(nodes.length === 0 && edges.length === 0) return;
    showConfirm('Remove all rectangles and connections?', () => fm.clearCanvas());
  }

  // ---------- save / load ----------
  // ============================================================
  // File formats — every JSON file fmIDE writes carries { kind, version }. Every file it
  // reads goes through readFmFile(), which:
  //   1. identifies the kind (older files without "kind" are recognised by their shape),
  //   2. rejects the wrong kind of file with a message saying what it is and where to open it,
  //   3. upgrades older versions one step at a time via FILE_MIGRATIONS,
  //   4. flags a file saved by a NEWER fmIDE (version above what this build reads), so the
  //      caller can warn before a best-effort open,
  //   5. does the same for nested content (a workspace's system, each template's model).
  // To change a format: bump its "current" here, and add FILE_MIGRATIONS[kind][oldVersion]
  // that upgrades a copy of an old payload by exactly one version. The system and
  // workspace formats are shared with ExcelExporter: change those in src/shared/file-formats.js.
  // ============================================================
  // ---------- file formats (shared: src/shared/file-formats.js, used by both apps) ----------
  // The two kinds both apps read — a system and a workspace — keep their current version
  // and their upgrade steps here, once. Each app builds its own FILE_FORMATS and
  // FILE_MIGRATIONS from these, adding its own kinds, labels and messages
  // (docs/file-formats.md). To change one of these formats: raise its version here and add
  // SHARED_FILE_MIGRATIONS[kind][oldVersion], which upgrades a copy of an old payload by
  // exactly one version.
  const SHARED_FILE_VERSIONS = { 'system': 2, 'fmIDE-workspace': 1 };
  const SHARED_FILE_MIGRATIONS = {
    // v1 systems were accepted with fields the loader already defaults (periods, ids…);
    // the only structural difference handled here is a single-canvas file that kept its
    // nodes/edges at the top level.
    'system': {
      1: d => {
        if(!Array.isArray(d.canvases) && Array.isArray(d.nodes)){
          d.canvases = [{ id: 'c1', name: d.name || 'Canvas 1', nodes: d.nodes, edges: Array.isArray(d.edges) ? d.edges : [] }];
          d.activeCanvasId = 'c1';
          delete d.nodes; delete d.edges;
        }
      }
    }
  };
  // A file's kind: its "kind" field, or — for files saved before kinds were written — its
  // shape, so either app can say where a file belongs.
  function inferFileKind(d){
    if(Array.isArray(d)) return 'fmIDE-macros';                       // a bare macro list
    if(typeof d.kind === 'string') return d.kind;
    if(Array.isArray(d.canvases)) return 'system';
    if(Array.isArray(d.nodes) && Array.isArray(d.edges)) return 'module';
    if(Array.isArray(d.tabs) && Array.isArray(d.rows)) return 'fmIDE-excel-mapping'; // an ExcelExporter mapping saved before versions were written
    if(Array.isArray(d.templates)) return 'fmIDE-templates';
    if(Array.isArray(d.presets)) return 'fmIDE-format-presets';
    if(d.bindings && typeof d.bindings === 'object') return 'fmIDE-shortcuts';
    if(Array.isArray(d.macros)) return 'fmIDE-macros';
    return null;
  }
  // The version check and step-by-step upgrade, applied in place to `data` (a copy of the
  // file, of a kind listed in `formats`). A file from a NEWER version is left as it is so the
  // caller can ask before a best-effort open. Returns { fromVersion, newer }.
  function upgradeFileData(data, kind, formats, migrations){
    const fmt = formats[kind];
    let version = Number(data.version);
    if(!Number.isInteger(version) || version < 1) version = 1;          // files from before versions were written
    const newer = version > fmt.current;
    if(!newer){
      for(let v = version; v < fmt.current; v++){
        const step = migrations[kind] && migrations[kind][v];
        if(step) step(data);
      }
      data.version = fmt.current;
    }
    data.kind = kind;
    return { fromVersion: version, newer };
  }
  const FILE_FORMATS = {
    'system':               { current: SHARED_FILE_VERSIONS['system'], label: 'system', where: 'File → Load System' },
    'module':               { current: 1, label: 'module',              where: 'File → Load Module' },
    'fmIDE-workspace':      { current: SHARED_FILE_VERSIONS['fmIDE-workspace'], label: 'workspace', where: 'File → Import Workspace' },
    'fmIDE-templates':      { current: 1, label: 'templates file',      where: 'Templates → Import Templates' },
    'fmIDE-format-presets': { current: 1, label: 'format presets file', where: 'Format Presets → Import Presets' },
    'fmIDE-shortcuts':      { current: 2, label: 'shortcuts file',      where: 'Keyboard Shortcuts → Import Shortcuts' },
    'fmIDE-macros':         { current: 1, label: 'macros file',         where: 'Macro Builder → Import' }
  };
  const FILE_MIGRATIONS = Object.assign({}, SHARED_FILE_MIGRATIONS, {
    // v1 shortcut files stored combos in the old notation.
    'fmIDE-shortcuts': {
      1: d => { Object.keys(d.bindings || {}).forEach(k => { d.bindings[k] = canonicalCombo(d.bindings[k], true); }); }
    }
  });
  function fileKindLabel(kind){ return FILE_FORMATS[kind] ? FILE_FORMATS[kind].label : 'file'; }
  // Returns { error } or { kind, data (a migrated copy), fromVersion, newer, warnings }.
  function readFmFile(raw, accept){
    if(!raw || typeof raw !== 'object') return { error: "That file doesn't contain fmIDE data." };
    const kind = inferFileKind(raw);
    const fmt = kind && FILE_FORMATS[kind];
    if(!fmt){
      return { error: kind === 'fmIDE-excel-mapping'
        ? 'That is an ExcelExporter mapping file — open it in ExcelExporter (Import Mapping JSON).'
        : "That file isn't an fmIDE file this version recognises" + (kind ? ` (kind "${String(kind).slice(0, 40)}")` : '') + '.' };
    }
    if(!accept.includes(kind)){
      const wanted = accept.map(fileKindLabel);
      return { error: `That is an fmIDE ${fmt.label}, not a ${wanted.join(' or ')}. Open it with ${fmt.where}.` };
    }
    let data = cloneData(Array.isArray(raw) ? { kind, version: 1, macros: raw } : raw);
    const { fromVersion: version, newer } = upgradeFileData(data, kind, FILE_FORMATS, FILE_MIGRATIONS);
    const warnings = [];
    // Nested content.
    const nestedTemplates = (list) => (list || []).map(t => {
      if(!t || !t.data || (t.kind !== 'module' && t.kind !== 'system')) return t;
      const r = readFmFile(t.data, [t.kind]);
      if(r.error){ warnings.push(`Template "${String(t.name || '').slice(0, 60)}" was skipped: ${r.error}`); return null; }
      if(r.newer) warnings.push(`Template "${String(t.name || '').slice(0, 60)}" was saved by a newer fmIDE and may not load completely.`);
      return Object.assign({}, t, { data: r.data });
    }).filter(Boolean);
    if(kind === 'fmIDE-workspace'){
      if(data.system){
        const r = readFmFile(data.system, ['system']);
        if(r.error) return { error: 'The workspace\'s system is unreadable: ' + r.error };
        data.system = r.data;
        if(r.newer) warnings.push('Its system was saved by a newer fmIDE and may not load completely.');
      }
      data.templates = nestedTemplates(data.templates);
      // shortcuts embedded in a v1 workspace may still use the old combo notation
      if(data.shortcutBindings && typeof data.shortcutBindings === 'object' && !(data.shortcutBindingsVersion >= 2)){
        Object.keys(data.shortcutBindings).forEach(k => { data.shortcutBindings[k] = canonicalCombo(data.shortcutBindings[k], true); });
        data.shortcutBindingsVersion = 2;
      }
    }
    if(kind === 'fmIDE-templates') data.templates = nestedTemplates(data.templates);
    return { kind, data, fromVersion: version, newer, warnings };
  }
  // UI wrapper: parse → read → (warn if newer) → onOk(data, result). Returns nothing.
  function openFmFileText(text, accept, onOk){
    let raw;
    try{ raw = JSON.parse(text); }
    catch(err){ showMessage('That file is not valid JSON.'); return; }
    const r = readFmFile(raw, accept);
    if(r.error){ showMessage(r.error); return; }
    const go = () => onOk(r.data, r);
    // Anything to flag (a newer format, or nested parts that are newer / were skipped)
    // is asked about ONCE, before the normal import flow starts.
    if(r.newer || r.warnings.length){
      const fmt = FILE_FORMATS[r.kind];
      const lines = [];
      if(r.newer) lines.push(`This ${fmt.label} was saved by a newer version of fmIDE (format version ${r.fromVersion}; this fmIDE reads up to version ${fmt.current}). Updating fmIDE is the safe option; anything the newer version added may be lost.`);
      r.warnings.forEach(w => lines.push(w));
      lines.push('Continue?');
      showConfirm(lines.join('\n\n'), go);
      return;
    }
    go();
  }

  function downloadJSON(payload, filename){
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function timestamp(){ return new Date().toISOString().replace(/[:.]/g,'-'); }

  // Whole system: every canvas, replaces everything on load.
  function buildSystemPayload(){
    syncActiveIntoRegistry();
    return {
      version: 2, kind: 'system',
      nextId, nextCanvasId, activeCanvasId,
      periods, currentPeriod,
      canvases: canvases.map(c => ({ id:c.id, name:c.name, nodes:c.nodes, edges:c.edges })),
      // format roles/presets ride along so ExcelExporter formats a plain system export too
      formatPresets: FORMAT_PRESETS.map(p => ({ id: p.id, name: p.name, style: p.style }))
    };
  }

  function saveSystemToFile(){
    downloadJSON(buildSystemPayload(), `fmIDE-system-${timestamp()}.json`);
  }

  // ---------- whole-workspace persistence (system + templates + format presets + shortcuts) ----------
  // The workspace autosaves to the browser's IndexedDB (database 'fmIDE') under this key —
  // the same key and JSON text older versions kept in localStorage, copied across once.
  // ---------- browser storage (shared: src/shared/store.js, used by both apps) ----------
  // createStore(dbName): a small promise-based key–value store on IndexedDB, one database
  // per app, one object store ('kv'). Values are mostly strings (the apps store JSON text,
  // exactly what they used to keep in localStorage); IndexedDB also keeps other values the
  // browser can store, such as file handles. Where IndexedDB is missing or will not open
  // (some browsers block it for pages opened from disk, or in private windows) the same
  // calls fall back to localStorage, so the app keeps working — it never fails for that.
  //   ready                        resolves once the store is usable (never rejects)
  //   get(key)                     the stored value, or null
  //   put(key, value)              rejects with the browser's error (e.g. QuotaExceededError,
  //                                or DataCloneError for a value it cannot store); on the
  //                                localStorage fallback, anything but a string is refused
  //   canStoreObjects()            whether put accepts more than strings (after ready)
  //   remove(key)
  //   keys(prefix)                 every stored key that starts with prefix
  //   migrateFromLocalStorage(fn)  once per browser: copy localStorage keys for which fn(key)
  //                                is true into IndexedDB (never over a key already there);
  //                                the localStorage copies are kept
  //   requestPersistence()         ask the browser once, ever, to keep this app's data
  //                                (navigator.storage.persist); the answer is remembered
  function createStore(dbName){
    const KV = 'kv';
    const META_MIGRATED = dbName + '/migrated-from-localStorage';
    const META_PERSIST = dbName + '/persistence-requested';
    let db = null;   // the open IndexedDB database, or null when using localStorage

    const ready = new Promise(resolve => {
      let settled = false;
      const done = (openDb) => {
        if(settled){ if(openDb) openDb.close(); return; }
        settled = true;
        db = openDb || null;
        if(db) db.onversionchange = () => { db.close(); };
        resolve();
      };
      let req;
      try{
        if(!window.indexedDB){ done(null); return; }
        req = window.indexedDB.open(dbName, 1);
      }catch(err){ done(null); return; }
      req.onupgradeneeded = () => { req.result.createObjectStore(KV); };
      req.onsuccess = () => done(req.result);
      req.onerror = (ev) => { if(ev && ev.preventDefault) ev.preventDefault(); done(null); };
      // A browser that never answers must not hold the app up.
      setTimeout(() => done(null), 5000);
    });

    // Runs fn(objectStore) in one transaction; resolves with the result of the request fn
    // returns (if any) once the transaction has committed.
    function run(mode, fn){
      return ready.then(() => new Promise((resolve, reject) => {
        let result;
        try{
          const t = db.transaction(KV, mode);
          t.oncomplete = () => resolve(result);
          t.onabort = t.onerror = () => reject(t.error || new DOMException('The browser did not store the data.', 'UnknownError'));
          const r = fn(t.objectStore(KV));
          if(r) r.onsuccess = () => { result = r.result; };
        }catch(err){ reject(err); }
      }));
    }

    function get(key){
      return ready.then(() => db
        ? run('readonly', s => s.get(key)).then(v => (v === undefined ? null : v))
        : localStorage.getItem(key));
    }
    function put(key, value){
      return ready.then(() => {
        if(db) return run('readwrite', s => { s.put(value, key); });
        if(typeof value !== 'string') throw new TypeError('Only text can be stored in this browser.');
        localStorage.setItem(key, value);
      });
    }
    function remove(key){
      return ready.then(() => db ? run('readwrite', s => { s.delete(key); }) : localStorage.removeItem(key));
    }
    function keys(prefix){
      return ready.then(() => {
        if(db) return run('readonly', s => s.getAllKeys(IDBKeyRange.bound(prefix, prefix + '￿')))
          .then(ks => (ks || []).filter(k => typeof k === 'string' && k.startsWith(prefix)));
        const out = [];
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          if(k !== null && k.startsWith(prefix)) out.push(k);
        }
        return out;
      });
    }

    // The marker makes this happen once: without it, a key deleted later (e.g. a layout
    // reset) would be copied back from the old localStorage copy on the next start.
    function migrateFromLocalStorage(match){
      return ready.then(() => {
        if(!db) return 0; // already using localStorage: nothing to move
        return get(META_MIGRATED).then(migrated => {
          if(migrated) return 0;
          const items = [];
          try{
            for(let i = 0; i < localStorage.length; i++){
              const k = localStorage.key(i);
              if(k !== null && match(k)){ const v = localStorage.getItem(k); if(v !== null) items.push([k, v]); }
            }
          }catch(err){ /* localStorage unavailable: nothing to move */ }
          let copied = 0;
          return run('readwrite', s => {
            items.forEach(([k, v]) => {
              const r = s.get(k);
              r.onsuccess = () => { if(r.result === undefined){ s.put(v, k); copied++; } };
            });
            s.put(new Date().toISOString(), META_MIGRATED);
          }).then(() => copied);
        });
      }).catch(() => 0); // a failed copy leaves the old data where it was; try again next start
    }

    let persistenceRequested = false;
    function requestPersistence(){
      if(persistenceRequested) return;
      persistenceRequested = true;
      const sm = navigator.storage;
      if(!sm || typeof sm.persist !== 'function') return;
      get(META_PERSIST).then(asked => {
        if(asked) return;
        return Promise.resolve(sm.persist()).then(granted =>
          put(META_PERSIST, JSON.stringify({ granted: !!granted, at: new Date().toISOString() })));
      }).catch(() => { /* silent */ });
    }

    return { ready, get, put, remove, keys, migrateFromLocalStorage, requestPersistence, canStoreObjects: () => !!db };
  }
  const WORKSPACE_STORAGE_KEY = 'fmIDE-workspace-v1';
  const workspaceStore = createStore('fmIDE');

  function buildWorkspacePayload(){
    return {
      version: 1, kind: 'fmIDE-workspace',
      system: buildSystemPayload(),
      templates: TEMPLATES.filter(t => !t.builtin).map(t => ({
        id: t.id, name: t.name, description: t.description, group: t.group, kind: t.kind, data: t.data
      })),
      formatPresets: FORMAT_PRESETS.map(p => ({ id: p.id, name: p.name, style: p.style })),
      shortcutBindings: Object.assign({}, shortcutBindings),
      shortcutBindingsVersion: 2,
      macros: cloneData(MACROS),
      ui: buildUiPayload()
    };
  }

  // A file's format presets replace the ones with the same name (so its roles win, and
  // no name appears twice); presets only the user has are kept, new ones are added.
  function mergeFormatPresets(list){
    list.forEach(p => {
      if(!p || typeof p.name !== 'string' || !p.style) return;
      const i = FORMAT_PRESETS.findIndex(x => x.name === p.name);
      if(i >= 0) FORMAT_PRESETS[i] = { id: FORMAT_PRESETS[i].id, name: p.name, style: p.style };
      else FORMAT_PRESETS.push({ id: p.id || ('fmt' + (nextFormatPresetId++)), name: p.name, style: p.style });
    });
  }

  function applyWorkspacePayload(data){
    if(data.system && Array.isArray(data.system.canvases) && data.system.canvases.length){
      applySystemDataDirect(data.system);
    }
    if(Array.isArray(data.templates)){
      data.templates.forEach(t => {
        if(!t || typeof t.name !== 'string' || !t.data) return;
        TEMPLATES.push({
          id: t.id || ('usr' + (nextTemplateId++)), name: t.name, description: t.description || '',
          group: t.group || 'My Templates', kind: t.kind === 'system' ? 'system' : 'module',
          builtin: false, data: t.data
        });
      });
    }
    if(Array.isArray(data.formatPresets)) mergeFormatPresets(data.formatPresets);
    // ribbon/KeyTips settings, then macros (so macro commands exist before their
    // shortcut bindings are applied below); syncMacroCommands re-renders the ribbon
    if(data.ui) applyUiPayload(data.ui);
    if(Array.isArray(data.macros)) importMacros(data.macros, 'replace');
    if(data.ui || Array.isArray(data.macros)) syncMacroCommands();
    if(data.shortcutBindings && typeof data.shortcutBindings === 'object'){
      Object.keys(data.shortcutBindings).forEach(cmdId => {
        if(COMMANDS.some(c => c.id === cmdId)) shortcutBindings[cmdId] = canonicalCombo(data.shortcutBindings[cmdId], !(data.shortcutBindingsVersion >= 2));
      });
      dedupeBindings();
      rebuildShortcutMap();
    }
  }

  // Autosave runs every 8 s, about 2 s after each change (20), when the page is hidden, and on close. If the browser refuses
  // to store (storage full, or unavailable e.g. in some private-browsing modes) a banner
  // says so ONCE per failure streak — fmIDE keeps working, but nothing done from now on
  // would survive a reload unless exported. It clears itself as soon as a save succeeds.
  // Writes are asynchronous; the browser applies them in the order they were made.
  let autosaveFailing = false, autosaveBannerDismissed = false;
  let workspaceRestored = false; // no autosave before the stored workspace is read: it would overwrite it
  function saveWorkspace(){
    if(!workspaceRestored) return;
    let text;
    try{ text = JSON.stringify(buildWorkspacePayload()); }
    catch(err){ onAutosaveFailed(err); return; }
    // The workspace, plus which document is open and whether it has unsaved changes (20).
    Promise.all([workspaceStore.put(WORKSPACE_STORAGE_KEY, text), workspaceStore.put(SESSION_KEY, documentSessionText())]).then(() => {
      if(autosaveFailing){ autosaveFailing = false; autosaveBannerDismissed = false; hideAutosaveBanner(); }
    }, onAutosaveFailed);
  }
  function onAutosaveFailed(err){
    autosaveFailing = true;
    if(!autosaveBannerDismissed) showAutosaveBanner(err);
  }
  // Asks the browser (once, ever) to keep fmIDE's data — called on the first change to the
  // model rather than at start-up, since some browsers show the user a question.
  function requestStoragePersistence(){ workspaceStore.requestPersistence(); }
  function showAutosaveBanner(err){
    if(document.getElementById('autosaveBanner')) return;
    const full = err && (err.name === 'QuotaExceededError' || err.code === 22 || err.code === 1014);
    const bar = document.createElement('div');
    bar.id = 'autosaveBanner';
    bar.setAttribute('role', 'alert');
    bar.style.cssText = 'position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:2000; max-width:640px; ' +
      'display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px; background:#7f1d1d; color:#fff; ' +
      'font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.35);';
    const msg = document.createElement('span');
    msg.textContent = (full ? "Autosave failed: the browser's storage for fmIDE is full." : 'Autosave failed: this browser is not letting fmIDE store data.') +
      ' Changes from now on will be lost on reload unless you export your workspace.';
    const exp = document.createElement('button');
    exp.textContent = 'Export workspace now';
    exp.style.cssText = 'flex:none; padding:6px 10px; border-radius:6px; border:none; background:#fff; color:#7f1d1d; font-weight:700; cursor:pointer;';
    exp.addEventListener('click', () => exportWorkspaceToFile());
    const dis = document.createElement('button');
    dis.textContent = 'Dismiss';
    dis.style.cssText = 'flex:none; padding:6px 10px; border-radius:6px; border:1px solid rgba(255,255,255,.5); background:transparent; color:#fff; cursor:pointer;';
    dis.addEventListener('click', () => { autosaveBannerDismissed = true; hideAutosaveBanner(); });
    bar.append(msg, exp, dis);
    document.body.appendChild(bar);
  }
  function hideAutosaveBanner(){ const b = document.getElementById('autosaveBanner'); if(b) b.remove(); }

  // Resolves true when the autosaved workspace was restored. A workspace left in
  // localStorage by an older fmIDE is copied into IndexedDB first (once).
  function loadWorkspaceFromStore(){
    return workspaceStore.migrateFromLocalStorage(k => k === WORKSPACE_STORAGE_KEY)
      .then(() => workspaceStore.get(WORKSPACE_STORAGE_KEY))
      .then(raw => {
        if(typeof raw !== 'string' || !raw) return false;
        let parsed;
        try{ parsed = JSON.parse(raw); }
        catch(err){ return false; }
        // Same reader as file imports (migrates an older autosave). A newer-format autosave
        // (after going back to an older fmIDE) still loads, best effort — there is no UI yet.
        const r = readFmFile(parsed, ['fmIDE-workspace']);
        if(r.error) return false;
        try{
          applyWorkspacePayload(r.data);
          return true;
        }catch(err){ return false; }
      }, () => false);
  }

  function exportWorkspaceToFile(){
    downloadJSON(buildWorkspacePayload(), `fmIDE-workspace-${timestamp()}.json`);
  }

  function importWorkspaceFromFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      openFmFileText(reader.result, ['fmIDE-workspace'], (data) => {
      showConfirm('Import this workspace? It will replace your current system, and add in the file\'s templates, format presets, and shortcut bindings. (You can Undo the canvas change afterward if needed.)', () => {
        pushHistory();
        applyWorkspacePayload(data);
        ensureDefaultFormatPresets();
        renderCanvasTabs();
        render();
        saveWorkspace();
        showMessage('Workspace imported.');
      });
      });
    };
    reader.onerror = () => showMessage('Could not read that file.');
    reader.readAsText(file);
  }

  function showCanvasMergeDecisionModal(collisions, onContinue){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    box.style.minWidth = '380px';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); }
    overlay.addEventListener('mousedown', (ev) => { if(ev.target === overlay) close(); });

    const title = document.createElement('p');
    title.textContent = 'Some canvases already exist';
    box.appendChild(title);
    const desc = document.createElement('p');
    desc.className = 'template-desc';
    desc.textContent = "This import shares canvas names with your current system. For each one, choose whether it's the same dependency (merge — extra content gets added in, references get pointed at your existing canvas) or a separate copy.";
    box.appendChild(desc);

    const decisions = {};
    const rows = document.createElement('div');
    rows.className = 'picker-list';
    collisions.forEach(c => {
      decisions[c.name] = 'merge';
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 0;';
      const label = document.createElement('span');
      label.textContent = c.name;
      label.style.cssText = 'flex:1;font-size:13px;';
      const group = document.createElement('div');
      group.className = 'btngroup';
      const mergeBtn = document.createElement('button');
      mergeBtn.className = 'tbtn seg active-choice';
      mergeBtn.textContent = 'Merge into existing';
      const keepBtn = document.createElement('button');
      keepBtn.className = 'tbtn seg';
      keepBtn.textContent = 'Keep as separate copy';
      mergeBtn.addEventListener('click', () => { decisions[c.name] = 'merge'; mergeBtn.classList.add('active-choice'); keepBtn.classList.remove('active-choice'); });
      keepBtn.addEventListener('click', () => { decisions[c.name] = 'keep'; keepBtn.classList.add('active-choice'); mergeBtn.classList.remove('active-choice'); });
      group.appendChild(mergeBtn);
      group.appendChild(keepBtn);
      row.appendChild(label);
      row.appendChild(group);
      rows.appendChild(row);
    });
    box.appendChild(rows);

    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel Import';
    cancelBtn.addEventListener('click', close);
    const continueBtn = document.createElement('button');
    continueBtn.className = 'primary';
    continueBtn.textContent = 'Continue';
    continueBtn.addEventListener('click', () => { close(); onContinue(decisions); });
    actions.appendChild(cancelBtn);
    actions.appendChild(continueBtn);
    box.appendChild(actions);
  }

  function performAddSystem(data, decisions){
    pushHistory();
    const canvasIdMap = {};
    const nodeIdMap = {};
    const mergeTargets = {};

    data.canvases.forEach((c, idx) => {
      const norm = (c.name || '').trim().toLowerCase();
      const existing = canvases.find(ec => ec.name.trim().toLowerCase() === norm);
      if(existing && decisions[c.name || 'Canvas'] === 'merge'){
        canvasIdMap[c.id] = existing.id;
        mergeTargets[idx] = existing;
      } else {
        canvasIdMap[c.id] = 'c' + (nextCanvasId++);
      }
    });

    const staged = data.canvases.map((c, idx) => {
      const target = mergeTargets[idx];
      const srcNodes = Array.isArray(c.nodes) ? c.nodes : [];
      const srcEdges = Array.isArray(c.edges) ? c.edges : [];
      const localNodeMap = {};
      const nodesToAdd = [];

      function addFresh(n, overrides){
        const newId = uid('n');
        localNodeMap[n.id] = newId;
        nodeIdMap[n.id] = newId;
        nodesToAdd.push(Object.assign({}, n, overrides || {}, { id: newId }));
      }

      if(!target){
        srcNodes.forEach(n => addFresh(n));
        const edgesToAdd = srcEdges
          .filter(e => !e.auto && localNodeMap[e.from] !== undefined && localNodeMap[e.to] !== undefined)
          .map(e => Object.assign({}, e, { id: uid('e'), from: localNodeMap[e.from], to: localNodeMap[e.to] }));
        return { name: (c.name || 'Canvas').toString(), target, nodesToAdd, edgesToAdd, newCanvasId: canvasIdMap[c.id] };
      }

      // Pass 1: value rectangles, matched by name (existing anchors for everything else)
      const existingValueByName = {};
      target.nodes.forEach(n => {
        if(n.type === 'value'){
          const nm = (parseNode(n).name || '').trim().toLowerCase();
          if(nm) existingValueByName[nm] = n.id;
        }
      });
      const structural = []; // operators, aliases, blockInstances — resolved in later passes
      srcNodes.forEach(n => {
        if(n.type === 'value'){
          const nm = (parseNode(n).name || '').trim().toLowerCase();
          if(nm && existingValueByName[nm] !== undefined){
            localNodeMap[n.id] = existingValueByName[nm];
            nodeIdMap[n.id] = existingValueByName[nm];
          } else {
            addFresh(n);
          }
        } else {
          structural.push(n);
        }
      });

      // Pass 2: aliases — identity is their resolved (sourceCanvasId, sourceNodeId); value targets are already resolved
      const existingAliasIndex = {};
      target.nodes.forEach(n => {
        if(n.type === 'alias') existingAliasIndex[n.sourceCanvasId + '::' + n.sourceNodeId] = n.id;
      });
      const remaining = [];
      structural.forEach(n => {
        if(n.type !== 'alias'){ remaining.push(n); return; }
        const rCanvas = canvasIdMap[n.sourceCanvasId] !== undefined ? canvasIdMap[n.sourceCanvasId] : n.sourceCanvasId;
        const rNode = nodeIdMap[n.sourceNodeId] !== undefined ? nodeIdMap[n.sourceNodeId] : n.sourceNodeId;
        const sig = rCanvas + '::' + rNode;
        if(existingAliasIndex[sig] !== undefined){
          localNodeMap[n.id] = existingAliasIndex[sig];
          nodeIdMap[n.id] = existingAliasIndex[sig];
        } else {
          addFresh(n, { sourceCanvasId: rCanvas, sourceNodeId: rNode });
        }
      });

      // Pass 3: operators & block instances — identity is symbol/definition + resolved incoming sources.
      // Iterated to a fixed point since one operator's output can feed another.
      function existingOpSig(exId){ return target.edges.filter(e => e.to === exId).map(e => e.from).sort().join(','); }
      function existingBlockSig(exId, portCount){
        const arr = [];
        for(let i=0;i<portCount;i++){ const e = target.edges.find(e2 => e2.to === exId && e2.toPort === i); arr.push(e ? e.from : ''); }
        return arr.join(',');
      }
      const existingOpIndex = {};
      const existingBlockIndex = {};
      target.nodes.forEach(n => {
        if(n.type === 'operator') existingOpIndex[n.text + '|' + existingOpSig(n.id)] = n.id;
        if(n.type === 'blockInstance'){
          const def = canvases.find(cc => cc.id === n.blockDefCanvasId);
          const portCount = def ? blockPortsOf(def).inputs.length : 0;
          existingBlockIndex[n.blockDefCanvasId + '|' + existingBlockSig(n.id, portCount)] = n.id;
        }
      });

      let pending = remaining;
      let progress = true;
      while(pending.length && progress){
        progress = false;
        const next = [];
        pending.forEach(n => {
          if(n.type === 'operator'){
            const incoming = srcEdges.filter(e => e.to === n.id);
            const resolved = [];
            let ok = true;
            incoming.forEach(e => { if(nodeIdMap[e.from] !== undefined) resolved.push(nodeIdMap[e.from]); else ok = false; });
            if(!ok){ next.push(n); return; }
            const sig = n.text + '|' + resolved.sort().join(',');
            if(existingOpIndex[sig] !== undefined){
              localNodeMap[n.id] = existingOpIndex[sig];
              nodeIdMap[n.id] = existingOpIndex[sig];
            } else {
              addFresh(n);
            }
            progress = true;
          } else if(n.type === 'blockInstance'){
            const rDef = canvasIdMap[n.blockDefCanvasId] !== undefined ? canvasIdMap[n.blockDefCanvasId] : n.blockDefCanvasId;
            const def = canvases.find(cc => cc.id === rDef);
            const portCount = def ? blockPortsOf(def).inputs.length : 0;
            const resolvedPorts = [];
            let ok = true;
            for(let i=0;i<portCount;i++){
              const e = srcEdges.find(e2 => e2.to === n.id && e2.toPort === i);
              if(!e){ resolvedPorts.push(''); continue; }
              if(nodeIdMap[e.from] !== undefined) resolvedPorts.push(nodeIdMap[e.from]); else ok = false;
            }
            if(!ok){ next.push(n); return; }
            const sig = rDef + '|' + resolvedPorts.join(',');
            if(existingBlockIndex[sig] !== undefined){
              localNodeMap[n.id] = existingBlockIndex[sig];
              nodeIdMap[n.id] = existingBlockIndex[sig];
            } else {
              addFresh(n, { blockDefCanvasId: rDef });
            }
            progress = true;
          }
        });
        pending = next;
      }
      // Fallback for anything that couldn't be resolved (shouldn't normally happen): add fresh rather than drop it.
      pending.forEach(n => {
        if(n.type === 'blockInstance'){
          const rDef = canvasIdMap[n.blockDefCanvasId] !== undefined ? canvasIdMap[n.blockDefCanvasId] : n.blockDefCanvasId;
          addFresh(n, { blockDefCanvasId: rDef });
        } else {
          addFresh(n);
        }
      });

      const edgesToAdd = srcEdges
        .filter(e => !e.auto && localNodeMap[e.from] !== undefined && localNodeMap[e.to] !== undefined)
        .map(e => Object.assign({}, e, { id: uid('e'), from: localNodeMap[e.from], to: localNodeMap[e.to] }));

      return { name: (c.name || 'Canvas').toString(), target, nodesToAdd, edgesToAdd, newCanvasId: canvasIdMap[c.id] };
    });

    staged.forEach(s => {
      s.nodesToAdd.forEach(n => {
        if(n.type === 'alias' && n.sourceCanvasId && canvasIdMap[n.sourceCanvasId] !== undefined){
          n.sourceCanvasId = canvasIdMap[n.sourceCanvasId];
          if(nodeIdMap[n.sourceNodeId] !== undefined) n.sourceNodeId = nodeIdMap[n.sourceNodeId];
        }
        if(n.type === 'blockInstance' && n.blockDefCanvasId && canvasIdMap[n.blockDefCanvasId] !== undefined){
          n.blockDefCanvasId = canvasIdMap[n.blockDefCanvasId];
        }
      });
    });

    let firstTouchedCanvasId = null;
    staged.forEach(s => {
      if(s.target){
        const edgeKey = e => e.from + '->' + e.to;
        const existingKeys = new Set(s.target.edges.map(edgeKey));
        const newEdgesFiltered = s.edgesToAdd.filter(e => !existingKeys.has(edgeKey(e)));
        s.target.nodes = s.target.nodes.concat(s.nodesToAdd);
        s.target.edges = s.target.edges.concat(newEdgesFiltered);
        if(firstTouchedCanvasId === null) firstTouchedCanvasId = s.target.id;
      } else {
        canvases.push({
          id: s.newCanvasId, name: s.name,
          nodes: s.nodesToAdd, edges: s.edgesToAdd,
          computedValues: {}, computeErrors: {}, portValues: {}, portErrors: {}
        });
        if(firstTouchedCanvasId === null) firstTouchedCanvasId = s.newCanvasId;
      }
    });

    activeCanvasId = firstTouchedCanvasId || activeCanvasId;
    reconcilePeriodValuesInCanvasList(canvases);
    loadCanvasState(canvases.find(c => c.id === activeCanvasId));
    syncAutoConnections();
    clearSelection();
    renderCanvasTabs();
    evaluateAll();
  }

  function applySystemData(data, mode){
    if(!data || !Array.isArray(data.canvases) || data.canvases.length === 0){
      showMessage('That does not look like an fmIDE system (expected a "canvases" array). Use a Module instead.');
      return;
    }

    if(mode === 'add'){
      const collisions = data.canvases
        .filter(c => canvases.some(ec => ec.name.trim().toLowerCase() === (c.name || '').trim().toLowerCase()))
        .map(c => ({ name: c.name || 'Canvas' }));

      if(collisions.length === 0){
        performAddSystem(data, {});
      } else {
        showCanvasMergeDecisionModal(collisions, (decisions) => performAddSystem(data, decisions));
      }
      return;
    }

    showConfirm('Load this system? It will replace everything currently open — all canvases. (You can Undo afterward if needed.)', () => {
      pushHistory();
      applySystemDataDirect(data);
    });
  }

  // Core of a full system replace, with no confirm/undo bookkeeping — used both by the
  // confirmed "Load System" flow above and by silent boot-time workspace restore.
  function applySystemDataDirect(data){
    let maxId = 0, maxCanvasNum = 0;
    data.canvases.forEach(c => {
      const cm = /(\d+)$/.exec(c.id || ''); if(cm) maxCanvasNum = Math.max(maxCanvasNum, +cm[1]);
      (c.nodes||[]).forEach(n => { const m=/(\d+)$/.exec(n.id||''); if(m) maxId=Math.max(maxId,+m[1]); });
      (c.edges||[]).forEach(e => { const m=/(\d+)$/.exec(e.id||''); if(m) maxId=Math.max(maxId,+m[1]); });
    });
    nextCanvasId = Math.max(nextCanvasId, maxCanvasNum + 1, typeof data.nextCanvasId === 'number' ? data.nextCanvasId : 0);
    canvases = data.canvases.map(c => ({
      id: c.id || ('c' + (nextCanvasId++)),
      name: (c.name || 'Canvas').toString(),
      nodes: Array.isArray(c.nodes) ? c.nodes : [],
      edges: Array.isArray(c.edges) ? c.edges : [],
      computedValues: {}, computeErrors: {}, portValues: {}, portErrors: {}
    }));
    nextId = Math.max(nextId, maxId + 1, typeof data.nextId === 'number' ? data.nextId : 0);
    activeCanvasId = (typeof data.activeCanvasId === 'string' && canvases.some(c => c.id === data.activeCanvasId))
      ? data.activeCanvasId : canvases[0].id;
    periods = Array.isArray(data.periods) && data.periods.length ? data.periods.map(String) : ['Period 1'];
    currentPeriod = (typeof data.currentPeriod === 'number') ? Math.max(0, Math.min(periods.length - 1, data.currentPeriod)) : 0;
    reconcilePeriodValuesInCanvasList(canvases);
    loadCanvasState(canvases.find(c => c.id === activeCanvasId));
    syncAutoConnections();
    clearSelection();
    renderCanvasTabs();
    evaluateAll();
  }

  function loadSystemFromFile(file, mode){
    const reader = new FileReader();
    reader.onload = () => {
      openFmFileText(reader.result, ['system'], (data) => applySystemData(data, mode));
    };
    reader.onerror = () => showMessage('Could not read that file.');
    reader.readAsText(file);
  }

  // Single canvas as a reusable module; loading adds it into the current canvas.
  function saveModuleToFile(){
    const active = canvases.find(c => c.id === activeCanvasId);
    const payload = {
      version: 1, kind: 'module',
      name: active ? active.name : 'Canvas',
      selfCanvasId: activeCanvasId,
      nextId, nodes, edges
    };
    const safeName = (active ? active.name : 'canvas').replace(/[^a-z0-9\-_]+/gi, '_');
    downloadJSON(payload, `fmIDE-module-${safeName}-${timestamp()}.json`);
  }

  function applyModuleData(data){
    if(!data || !Array.isArray(data.nodes) || !Array.isArray(data.edges)){
      showMessage('That does not look like an fmIDE module (expected "nodes" and "edges" arrays). Use a System instead.');
      return;
    }
    pushHistory();
    applyModuleDataDirect(data);
  }

  // Core of inserting a module's nodes/edges into whatever canvas is currently active
  // (remapping ids and self-referencing alias/blockInstance nodes) — used both when adding
  // to the current canvas and when adding to a freshly created one. No history/validation.
  function applyModuleDataDirect(data){
    const idMap = {};
    const newNodes = data.nodes.map(n => {
      const newId = uid('n');
      idMap[n.id] = newId;
      return Object.assign({}, n, { id: newId });
    });
    newNodes.forEach(n => {
      if(n.type === 'alias' && n.sourceCanvasId === data.selfCanvasId && idMap[n.sourceNodeId] !== undefined){
        n.sourceNodeId = idMap[n.sourceNodeId];
        n.sourceCanvasId = activeCanvasId;
      }
      if(n.type === 'blockInstance' && n.blockDefCanvasId === data.selfCanvasId){
        n.blockDefCanvasId = activeCanvasId;
      }
    });
    const newEdges = data.edges
      .filter(e => !e.auto && idMap[e.from] !== undefined && idMap[e.to] !== undefined)
      .map(e => Object.assign({}, e, { id: uid('e'), from: idMap[e.from], to: idMap[e.to] }));

    newNodes.forEach(n => { if(Array.isArray(n.periodValues)) n.periodValues = padPeriodValuesArray(n.periodValues, periods.length); });
    nodes = nodes.concat(newNodes);
    edges = edges.concat(newEdges);
    syncAutoConnections();
    clearComputed();
    selectNodesOnly(newNodes.map(n => n.id));
    render();
    evaluateAll();
  }

  // Creates a brand-new canvas and inserts the module template's contents into it,
  // rather than appending onto whatever canvas is currently active.
  function applyModuleDataToNewCanvas(data){
    if(!data || !Array.isArray(data.nodes) || !Array.isArray(data.edges)){
      showMessage('That does not look like an fmIDE module (expected "nodes" and "edges" arrays). Use a System instead.');
      return;
    }
    pushHistory();
    const name = (typeof data.name === 'string' && data.name.trim()) ? data.name.trim() : ('Canvas ' + canvases.length);
    const c = {
      id: 'c' + (nextCanvasId++),
      name,
      nodes: [], edges: [], computedValues: {}, computeErrors: {}, portValues: {}, portErrors: {}
    };
    canvases.push(c);
    activeCanvasId = c.id;
    loadCanvasState(c);
    clearSelection();
    applyModuleDataDirect(data);
    renderCanvasTabs();
  }

  function loadModuleFromFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      openFmFileText(reader.result, ['module'], (data) => applyModuleData(data));
    };
    reader.onerror = () => showMessage('Could not read that file.');
    reader.readAsText(file);
  }

  fileInputWorkspace.addEventListener('change', () => {
    const file = fileInputWorkspace.files && fileInputWorkspace.files[0];
    fileInputWorkspace.value = '';
    if(file) importWorkspaceFromFile(file);
  });
  let pendingSystemLoadMode = 'replace';
  // File pickers can only be opened by a real user gesture, so Load/Add System, Load
  // Module and Import Workspace stay interactive (they are not available to macros).
  function promptLoadSystem(mode){ pendingSystemLoadMode = mode; fileInputSystem.click(); }
  fileInputSystem.addEventListener('change', () => {
    const file = fileInputSystem.files && fileInputSystem.files[0];
    if(file) loadSystemFromFile(file, pendingSystemLoadMode);
    fileInputSystem.value = '';
  });

  fileInputModule.addEventListener('change', () => {
    const file = fileInputModule.files && fileInputModule.files[0];
    if(file) loadModuleFromFile(file);
    fileInputModule.value = '';
  });


  // ---------- align / distribute ----------
  function selectedNodesList(){ return nodes.filter(n => selectedNodeIds.has(n.id)); }

  function boundingBoxOf(list){
    return {
      minX: Math.min(...list.map(n => n.x)),
      maxX: Math.max(...list.map(n => n.x + n.w)),
      minY: Math.min(...list.map(n => n.y)),
      maxY: Math.max(...list.map(n => n.y + n.h)),
    };
  }

  function alignSelected(mode, list){
    list = list || selectedNodesList();
    if(list.length < 2) return;
    pushHistory();
    const bbox = boundingBoxOf(list);
    list.forEach(n => {
      switch(mode){
        case 'left': n.x = bbox.minX; break;
        case 'right': n.x = bbox.maxX - n.w; break;
        case 'centerH': n.x = (bbox.minX + bbox.maxX)/2 - n.w/2; break;
        case 'top': n.y = bbox.minY; break;
        case 'bottom': n.y = bbox.maxY - n.h; break;
        case 'centerV': n.y = (bbox.minY + bbox.maxY)/2 - n.h/2; break;
      }
    });
    clearComputed();
    render();
  }

  function distributeSelected(axis, list){
    list = list || selectedNodesList();
    if(list.length < 3) return;
    pushHistory();
    if(axis === 'h'){
      const sorted = list.slice().sort((a,b) => a.x - b.x);
      const first = sorted[0], last = sorted[sorted.length-1];
      const span = (last.x + last.w) - first.x;
      const totalW = sorted.reduce((s,n) => s + n.w, 0);
      const gap = (span - totalW) / (sorted.length - 1);
      let cursor = first.x + first.w + gap;
      for(let i=1;i<sorted.length-1;i++){
        sorted[i].x = cursor;
        cursor = sorted[i].x + sorted[i].w + gap;
      }
    } else {
      const sorted = list.slice().sort((a,b) => a.y - b.y);
      const first = sorted[0], last = sorted[sorted.length-1];
      const span = (last.y + last.h) - first.y;
      const totalH = sorted.reduce((s,n) => s + n.h, 0);
      const gap = (span - totalH) / (sorted.length - 1);
      let cursor = first.y + first.h + gap;
      for(let i=1;i<sorted.length-1;i++){
        sorted[i].y = cursor;
        cursor = sorted[i].y + sorted[i].h + gap;
      }
    }
    clearComputed();
    render();
  }

  // ---------- marquee (range) selection ----------
  function rectsIntersect(a,b){ return !(b.x > a.x+a.w || b.x+b.w < a.x || b.y > a.y+a.h || b.y+b.h < a.y); }

  function startMarquee(downEvent){
    const additive = downEvent.shiftKey || downEvent.ctrlKey || downEvent.metaKey;
    if(!additive) clearSelection(); else render();
    const canvasRect = canvas.getBoundingClientRect();
    const startX = downEvent.clientX - canvasRect.left, startY = downEvent.clientY - canvasRect.top;
    const box = document.createElement('div');
    box.className = 'marquee';
    canvas.appendChild(box);
    document.body.classList.add('dragging');
    let last = {x:startX,y:startY,w:0,h:0};

    function onMove(ev){
      const curX = ev.clientX - canvasRect.left, curY = ev.clientY - canvasRect.top;
      const x = Math.min(startX,curX), y = Math.min(startY,curY);
      const w = Math.abs(curX-startX), h = Math.abs(curY-startY);
      last = {x,y,w,h};
      box.style.left = x+'px'; box.style.top = y+'px'; box.style.width = w+'px'; box.style.height = h+'px';
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('dragging');
      box.remove();
      if(last.w > 3 || last.h > 3){
        nodes.filter(n => rectsIntersect(last, {x:n.x,y:n.y,w:n.w,h:n.h})).forEach(n => selectedNodeIds.add(n.id));
        render();
      }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  viewport.addEventListener('mousedown', (e) => {
    if(e.button === 2) return; // right button is reserved for arrow-drawing, started from a node
    if(e.target === viewport || e.target === canvas || e.target === svg){
      startMarquee(e);
    }
  });
  viewport.addEventListener('contextmenu', (e) => { e.preventDefault(); });

  // ---------- computation ----------
  function nodesOf(canvasId){ const c = canvases.find(c => c.id === canvasId); return c ? c.nodes : []; }
  function edgesOf(canvasId){ const c = canvases.find(c => c.id === canvasId); return c ? c.edges : []; }
  function nodeIn(canvasId, nodeId){ return nodesOf(canvasId).find(n => n.id === nodeId); }

  function sortedIncoming(nodeId){
    return edges.filter(e => e.to === nodeId).slice().sort((a,b) => {
      const na = getNode(a.from), nb = getNode(b.from);
      if(!na || !nb) return 0;
      return (na.x - nb.x) || (na.y - nb.y);
    });
  }

  function sortedIncomingIn(canvasId, nodeId){
    return edgesOf(canvasId).filter(e => e.to === nodeId).slice().sort((a,b) => {
      const na = nodeIn(canvasId, a.from), nb = nodeIn(canvasId, b.from);
      if(!na || !nb) return 0;
      return (na.x - nb.x) || (na.y - nb.y);
    });
  }

  function resolveEdgeValue(canvasId, edge, period, scope, visiting, memo, errors){
    const srcNode = nodeIn(canvasId, edge.from);
    if(!srcNode) return null;
    if(srcNode.type === 'blockInstance'){
      return computeBlockInstanceOutput(canvasId, srcNode, edge.fromPort || 0, period, scope, visiting, memo, errors);
    }
    return computeValue(canvasId, edge.from, period, scope, visiting, memo, errors);
  }

  function computeValue(canvasId, nodeId, period, scope, visiting, memo, errors){
    const key = period + '|' + scope.prefix + nodeId;
    if(memo.hasOwnProperty(key)) return memo[key];
    if(visiting.has(key)){ errors[key] = 'cycle'; memo[key] = null; return null; }
    const n = nodeIn(canvasId, nodeId);
    if(!n) return null;
    visiting.add(key);
    let result = null;

    if(n.type === 'alias'){
      if(!n.sourceCanvasId || !n.sourceNodeId){
        errors[key] = 'alias-unset';
      } else {
        const srcCanvasExists = canvases.some(c => c.id === n.sourceCanvasId);
        if(!srcCanvasExists){
          errors[key] = 'alias-missing-canvas';
        } else {
          const srcNode = nodeIn(n.sourceCanvasId, n.sourceNodeId);
          if(!srcNode){
            errors[key] = 'alias-missing-node';
          } else {
            // An alias that points back into the SAME canvas it lives in is just a local
            // routing jump (e.g. re-exposing an internal subtotal as a block output) — it
            // must stay inside the current evaluation scope so it still sees the current
            // block instance's bound inputs. An alias into a genuinely different canvas
            // has no such scope to inherit, so it evaluates that canvas fresh, as top-level.
            const aliasScope = (n.sourceCanvasId === canvasId) ? scope : { prefix:'', bindings:{} };
            result = computeValue(n.sourceCanvasId, srcNode.id, period, aliasScope, visiting, memo, errors);
            if(result === null && !errors[key]) errors[key] = 'missing-input';
          }
        }
      }
    } else if(n.type === 'blockInstance'){
      // has no single scalar value; callers should resolve a specific output via resolveEdgeValue instead
      errors[key] = 'no-input';
    } else if(n.type === 'value'){
      if(scope.bindings.hasOwnProperty(nodeId)){
        // A block input port's binding is the OUTER edge feeding it, resolved fresh at
        // whatever period is actually being asked for here — not the value at the period
        // the block instance's output was originally requested at. This matters whenever
        // the block definition looks at another period internally (a corkscrew reaching
        // back via a period-shift node): each historical period along that chain must see
        // its own period's input values, not the value frozen from the outermost call.
        //
        // A binding is {edge, fixedPeriod, literal}: normally fixedPeriod is null and the
        // edge resolves at the current `period` (broadcast — today's only behavior, still
        // the default). A Vertical Block instance (see computeVerticalBlockInstanceOutput)
        // can instead pin an "indexed" input's edge to a fixed period (that instance's own
        // vertical index) regardless of which period is being asked for, or, for the
        // block's Vertical Index rectangle, skip the edge entirely and hand back a literal.
        const binding = scope.bindings[nodeId];
        if(binding && typeof binding.literal === 'number'){
          result = binding.literal;
        } else {
          const inEdge = binding ? binding.edge : null;
          const bindPeriod = (binding && typeof binding.fixedPeriod === 'number') ? binding.fixedPeriod : period;
          const bound = inEdge ? resolveEdgeValue(scope.outerCanvasId, inEdge, bindPeriod, scope.outerScope, visiting, memo, errors) : null;
          if(bound === null || bound === undefined || (typeof bound === 'number' && Number.isNaN(bound))){
            const literal = effectiveLiteral(n, period);
            result = (literal !== null) ? literal : 0;
          } else result = bound;
        }
      } else {
        const incoming = edgesOf(canvasId).filter(e => e.to === nodeId);
        if(incoming.length === 0){
          // True input (nothing wired in): driven purely by its own number, defaulting to zero.
          const literal = effectiveLiteral(n, period);
          result = (literal !== null) ? literal : 0;
        } else if(incoming.length === 1){
          // Not an input — always follow the wired source when it can produce a value.
          // Its own typed number, if any, is only a fallback for periods the source can't
          // reach (e.g. a corkscrew's first period, before a period-shift has anything to read).
          const edgeVal = resolveEdgeValue(canvasId, incoming[0], period, scope, visiting, memo, errors);
          if(edgeVal !== null && edgeVal !== undefined && !Number.isNaN(edgeVal)){
            result = edgeVal;
          } else {
            const literal = effectiveLiteral(n, period);
            if(literal !== null){
              result = literal;
            } else {
              // A period-shift wired straight into this rectangle couldn't reach a prior
              // period (e.g. a corkscrew's period-0 opening balance) and the rectangle has
              // no typed number/curve of its own — default to zero instead of erroring,
              // the same "default to zero" rule true-input rectangles already get. Other
              // failure reasons (broken links, cycles, math errors) still surface as "?".
              const srcNode = nodeIn(canvasId, incoming[0].from);
              const srcKey = period + '|' + scope.prefix + incoming[0].from;
              if(srcNode && srcNode.type === 'periodShift' && errors[srcKey] === 'period-out-of-range'){
                result = 0;
              } else if(!errors[key]){
                errors[key] = 'missing-input';
              }
            }
          }
        } else {
          errors[key] = 'ambiguous';
        }
      }
    } else if(n.type === 'periodShift'){
      const incoming = edgesOf(canvasId).filter(e => e.to === nodeId);
      if(incoming.length === 0){
        errors[key] = 'no-input';
      } else if(incoming.length > 1){
        errors[key] = 'ambiguous';
      } else {
        const offset = (typeof n.shift === 'number') ? n.shift : -1;
        const targetPeriod = period + offset;
        if(targetPeriod < 0 || targetPeriod >= periods.length){
          errors[key] = 'period-out-of-range';
        } else {
          result = resolveEdgeValue(canvasId, incoming[0], targetPeriod, scope, visiting, memo, errors);
          if(result === null && !errors[key]) errors[key] = 'missing-input';
        }
      }
    } else {
      const incomingEdges = sortedIncomingIn(canvasId, nodeId).filter(e => nodeIn(canvasId, e.from));

      if(n.text === 'iferror'){
        if(incomingEdges.length === 0){
          errors[key] = 'no-input';
        } else {
          const primary = resolveEdgeValue(canvasId, incomingEdges[0], period, scope, visiting, memo, errors);
          const primaryBad = (primary === null || primary === undefined || Number.isNaN(primary));
          if(!primaryBad){
            result = primary;
          } else if(incomingEdges.length >= 2){
            const fallback = resolveEdgeValue(canvasId, incomingEdges[1], period, scope, visiting, memo, errors);
            if(fallback === null || fallback === undefined || Number.isNaN(fallback)){
              errors[key] = 'missing-input';
            } else {
              result = fallback;
            }
          } else {
            errors[key] = 'missing-input';
          }
        }
      } else if(incomingEdges.length === 0){
        errors[key] = 'no-input';
      } else {
        const values = incomingEdges.map(e => resolveEdgeValue(canvasId, e, period, scope, visiting, memo, errors));
        if(values.some(v => v === null || v === undefined || Number.isNaN(v))){
          errors[key] = 'missing-input';
        } else if(n.text === 'abs'){
          if(values.length !== 1){ errors[key] = 'unary-only'; }
          else result = Math.abs(values[0]);
        } else if(n.text === 'min'){
          result = Math.min(...values);
        } else if(n.text === 'max'){
          result = Math.max(...values);
        } else if(n.text === 'ave'){
          result = values.reduce((a,b) => a+b, 0) / values.length;
        } else {
          result = values.reduce((acc, v, idx) => {
            if(idx === 0) return v;
            switch(n.text){
              case '+': return acc + v;
              case '−': return acc - v;
              case '×': return acc * v;
              case '÷': return v === 0 ? NaN : acc / v;
              case '^': return Math.pow(acc, v);
              case '%': return v === 0 ? NaN : acc % v;
              case '≤': return (acc <= v) ? 1 : 0;
              case '≥': return (acc >= v) ? 1 : 0;
              case '<': return (acc < v) ? 1 : 0;
              case '>': return (acc > v) ? 1 : 0;
              default: return acc;
            }
          });
          if(Number.isNaN(result)){ errors[key] = 'math-error'; result = null; }
        }
      }
    }

    visiting.delete(key);
    memo[key] = result;
    return result;
  }

  function computeBlockInstanceOutput(outerCanvasId, instanceNode, outputIndex, period, outerScope, visiting, memo, errors){
    const key = period + '|' + outerScope.prefix + instanceNode.id + '::out' + outputIndex;
    if(memo.hasOwnProperty(key)) return memo[key];

    const def = canvases.find(c => c.id === instanceNode.blockDefCanvasId);
    if(!def){ errors[key] = 'block-missing-def'; memo[key] = null; return null; }

    if(instanceNode.vertical){
      return computeVerticalBlockInstanceOutput(outerCanvasId, instanceNode, outputIndex, period, outerScope, visiting, memo, errors, def, key);
    }

    const blockCycleKey = period + '|#block#' + def.id;
    if(visiting.has(blockCycleKey)){ errors[key] = 'block-cycle'; memo[key] = null; return null; }

    const { outputs } = blockPortsOf(def);
    const outNode = outputs[outputIndex];
    if(!outNode){ errors[key] = 'block-missing-output'; memo[key] = null; return null; }

    const bindings = singleInstanceBindings(def, outerCanvasId, instanceNode);

    const innerScope = { prefix: outerScope.prefix + instanceNode.id + '::', bindings, outerCanvasId, outerScope };
    visiting.add(blockCycleKey);
    const result = computeValue(def.id, outNode.id, period, innerScope, visiting, memo, errors);
    visiting.delete(blockCycleKey);

    memo[key] = result;
    if(result === null && !errors[key]){
      errors[key] = errors[period + '|' + innerScope.prefix + outNode.id] || 'missing-input';
    }
    return result;
  }

  // Bind each declared Input port to the outer EDGE feeding it (not a precomputed value at
  // this call's period) — see the matching comment in computeValue's 'value' branch for why:
  // the block definition may need each bound input re-evaluated at other periods too. This is
  // the ordinary "broadcast" binding shared by a ordinary (non-vertical) instance and by every
  // vertical instance's non-indexed inputs.
  function singleInstanceBindings(def, outerCanvasId, instanceNode){
    const { inputs } = blockPortsOf(def);
    const bindings = {};
    inputs.forEach((inp, i) => {
      const inEdge = edgesOf(outerCanvasId).find(e => e.to === instanceNode.id && e.toPort === i);
      bindings[inp.id] = { edge: inEdge || null, fixedPeriod: null };
    });
    return bindings;
  }

  // A Vertical Block instance runs the SAME block definition once per period (the vertical
  // "instance index" i = 0..periods.length-1, exposed 1-based inside the definition via its
  // Vertical Index rectangle, if any), then folds the N independent results together with the
  // output rectangle's chosen reducer. An input port's edge is "indexed" (edge.verticalIndexed)
  // when it should read its outer source at that FIXED instance period i — e.g. a per-period
  // Capex row becoming "this vintage's own capex" — instead of the period actually being asked
  // for; every other input keeps today's broadcast behavior (same value resolved fresh at
  // whichever period the definition's internal formulas are looking at).
  function computeVerticalBlockInstanceOutput(outerCanvasId, instanceNode, outputIndex, period, outerScope, visiting, memo, errors, def, key){
    const { inputs, outputs, indexNode } = blockPortsOf(def);
    const outNode = outputs[outputIndex];
    if(!outNode){ errors[key] = 'block-missing-output'; memo[key] = null; return null; }

    const N = periods.length;
    const results = [];
    for(let i = 0; i < N; i++){
      const blockCycleKey = period + '|#block#' + def.id + '#v' + instanceNode.id + '#' + i;
      if(visiting.has(blockCycleKey)){ errors[key] = 'block-cycle'; results.push(null); continue; }

      const bindings = {};
      inputs.forEach((inp, portIdx) => {
        const inEdge = edgesOf(outerCanvasId).find(e => e.to === instanceNode.id && e.toPort === portIdx);
        const indexed = !!(inEdge && inEdge.verticalIndexed);
        bindings[inp.id] = { edge: inEdge || null, fixedPeriod: indexed ? i : null };
      });
      if(indexNode) bindings[indexNode.id] = { edge: null, fixedPeriod: null, literal: i + 1 };

      const innerScope = { prefix: outerScope.prefix + instanceNode.id + '::v' + i + '::', bindings, outerCanvasId, outerScope };
      visiting.add(blockCycleKey);
      const r = computeValue(def.id, outNode.id, period, innerScope, visiting, memo, errors);
      visiting.delete(blockCycleKey);
      results.push(r);
    }

    let result = null;
    if(results.length === 0){
      errors[key] = 'no-input';
    } else if(results.some(v => v === null || v === undefined || Number.isNaN(v))){
      errors[key] = 'missing-input';
    } else {
      const mode = outNode.verticalReducer || 'sum';
      if(mode === 'max') result = Math.max(...results);
      else if(mode === 'min') result = Math.min(...results);
      else if(mode === 'ave') result = results.reduce((a,b) => a+b, 0) / results.length;
      else if(mode === 'product') result = results.reduce((a,b) => a*b, 1);
      else result = results.reduce((a,b) => a+b, 0); // 'sum' (default)
    }

    memo[key] = result;
    // Stashed alongside the reduced result so evaluateAll can surface the per-instance
    // breakdown (see c.periodPortInstances) without recomputing it — used only by the
    // "view instances" table on a vertical block instance, never by the graph itself.
    memo[key + '::instances'] = results.slice();
    return result;
  }

  // Evaluates every period, for every canvas, and keeps a full per-period
  // snapshot on each canvas (c.periodComputedValues[p], etc.) so switching the
  // viewed period is just a re-slice, not a recompute.
  // Inside a transaction (a macro run, or one API action) evaluation is deferred and done
  // once when the transaction finishes; evaluateAllNow() forces it immediately.
  function evaluateAll(){
    if(tx.depth > 0){ tx.needEval = true; return; }
    evaluateAllNow();
  }

  function evaluateAllNow(){
    syncActiveIntoRegistry();
    const TOP = () => ({ prefix:'', bindings:{} });

    canvases.forEach(c => {
      c.periodComputedValues = [];
      c.periodComputeErrors = [];
      c.periodPortValues = [];
      c.periodPortErrors = [];
      c.periodPortInstances = [];
    });

    for(let p = 0; p < periods.length; p++){
      const memo = {}, errors = {};

      canvases.forEach(c => {
        c.nodes.forEach(n => {
          if(n.type === 'blockInstance'){
            const def = canvases.find(cc => cc.id === n.blockDefCanvasId);
            const { outputs } = blockPortsOf(def);
            outputs.forEach((_, i) => computeBlockInstanceOutput(c.id, n, i, p, TOP(), new Set(), memo, errors));
          } else {
            computeValue(c.id, n.id, p, TOP(), new Set(), memo, errors);
          }
        });
      });

      canvases.forEach(c => {
        const cv = {}, ce = {}, pv = {}, pe = {}, pin = {};
        c.nodes.forEach(n => {
          if(n.type === 'blockInstance'){
            const def = canvases.find(cc => cc.id === n.blockDefCanvasId);
            const { outputs } = blockPortsOf(def);
            const vals = [], errs = [];
            let insts = null;
            outputs.forEach((_, i) => {
              const k = p + '|' + n.id + '::out' + i;
              vals.push(memo.hasOwnProperty(k) ? memo[k] : null);
              errs.push(errors[k] || null);
              if(n.vertical){
                if(!insts) insts = [];
                insts.push(memo.hasOwnProperty(k + '::instances') ? memo[k + '::instances'] : []);
              }
            });
            pv[n.id] = vals; pe[n.id] = errs;
            if(insts) pin[n.id] = insts;
          } else {
            const k = p + '|' + n.id;
            if(memo.hasOwnProperty(k) && memo[k] !== null) cv[n.id] = memo[k];
            if(errors[k]) ce[n.id] = errors[k];
          }
        });
        c.periodComputedValues[p] = cv; c.periodComputeErrors[p] = ce;
        c.periodPortValues[p] = pv; c.periodPortErrors[p] = pe;
        c.periodPortInstances[p] = pin;
      });
    }

    canvases.forEach(c => {
      c.computedValues = c.periodComputedValues[currentPeriod] || {};
      c.computeErrors = c.periodComputeErrors[currentPeriod] || {};
      c.portValues = c.periodPortValues[currentPeriod] || {};
      c.portErrors = c.periodPortErrors[currentPeriod] || {};
    });
    loadCanvasState(canvases.find(c => c.id === activeCanvasId));
    renderPeriodControls();
    render();
  }

  // Changes which period's already-computed values are shown, without recomputing.
  function setCurrentPeriod(idx){
    currentPeriod = Math.max(0, Math.min(periods.length - 1, idx));
    canvases.forEach(c => {
      c.computedValues = (c.periodComputedValues && c.periodComputedValues[currentPeriod]) || {};
      c.computeErrors = (c.periodComputeErrors && c.periodComputeErrors[currentPeriod]) || {};
      c.portValues = (c.periodPortValues && c.periodPortValues[currentPeriod]) || {};
      c.portErrors = (c.periodPortErrors && c.periodPortErrors[currentPeriod]) || {};
    });
    loadCanvasState(canvases.find(c => c.id === activeCanvasId));
    renderPeriodControls();
    render();
  }

  // ---------- rendering ----------
  function render(){
    if(tx.depth > 0) return; // batched: rendered once when the transaction finishes
    const existing = new Map();
    canvas.querySelectorAll('.node').forEach(el => existing.set(el.dataset.id, el));
    const uomVisiting = new Set();
    const uomMemo = {};

    nodes.forEach(n => {
      let el = existing.get(n.id);
      const isOperator = n.type === 'operator';
      const isAlias = n.type === 'alias';
      const isBlockInstance = n.type === 'blockInstance';
      const isPeriodShift = n.type === 'periodShift';
      if(!el){
        el = document.createElement('div');
        el.dataset.id = n.id;
        canvas.appendChild(el);
        attachNodeEvents(el);
        el._built = null;
      } else {
        existing.delete(n.id);
      }
      el.className = 'node' + (isOperator ? ' operator' : '') + (isAlias ? ' alias' : '') + (isBlockInstance ? ' blockInstance' : '') + (isBlockInstance && n.vertical ? ' vertical' : '') + (isPeriodShift ? ' periodshift' : '') + (isOperator && WORD_OPS.includes(n.text) ? ' wordop' : '');

      if(isBlockInstance){
        renderBlockInstanceBody(el, n);
      } else if(el._built !== n.type){
        if(isOperator){
          el.innerHTML = '<div class="port n" data-side="n"></div><div class="port s" data-side="s"></div><div class="port e" data-side="e"></div><div class="port w" data-side="w"></div><button type="button" class="tag-btn socket-btn" title="Set socket">⚡</button><div class="socket-chip"></div><div class="opsym"></div><div class="op-result"></div>';
        } else if(isPeriodShift){
          el.innerHTML = '<div class="port n" data-side="n"></div><div class="port s" data-side="s"></div><div class="port e" data-side="e"></div><div class="port w" data-side="w"></div><div class="ps-label"></div><div class="op-result"></div>';
        } else if(isAlias){
          el.innerHTML = '<div class="port n" data-side="n"></div><div class="port s" data-side="s"></div><div class="port e" data-side="e"></div><div class="port w" data-side="w"></div><button type="button" class="tag-btn plug-btn" title="Set plug">🔌</button><div class="plug-chip"></div><button type="button" class="tag-btn relink-btn" title="Change linked rectangle">🔗</button><div class="label"><div class="line-name"></div><div class="line-value"></div><div class="line-uom"></div></div><div class="resize-handle"></div>';
        } else {
          el.innerHTML = '<div class="port n" data-side="n"></div><div class="port s" data-side="s"></div><div class="port e" data-side="e"></div><div class="port w" data-side="w"></div><button type="button" class="tag-btn plug-btn" title="Set plug">🔌</button><div class="plug-chip"></div><button type="button" class="tag-btn io-btn" title="Mark as block input/output">⇄</button><div class="io-role-chip"></div><button type="button" class="tag-btn props-btn" title="Format rectangle (number/border/font/fill)">🎨</button><button type="button" class="tag-btn period-btn" title="Choose which periods use this rectangle\'s own number">🕒</button><button type="button" class="tag-btn curve-btn" title="Draw this rectangle\'s value across periods">📈</button><div class="label"><div class="line-name"></div><div class="line-value"></div><div class="line-uom"></div></div><div class="resize-handle"></div>';
        }
        el._built = n.type;
      }

      el.style.left = n.x + 'px';
      el.style.top = n.y + 'px';
      el.style.width = n.w + 'px';
      el.style.height = n.h + 'px';
      el.classList.toggle('selected', selectedNodeIds.has(n.id));

      if(isBlockInstance){
        // content fully handled by renderBlockInstanceBody() above
      } else if(isOperator){
        const sym = el.querySelector('.opsym');
        if(sym) sym.textContent = n.text;
        const chip = el.querySelector('.socket-chip');
        if(chip){
          if(n.socket){ chip.textContent = '⚡ ' + n.socket; chip.style.display = 'block'; }
          else chip.style.display = 'none';
        }
        const res = el.querySelector('.op-result');
        if(res){
          res.classList.remove('show','err');
          res.title = '';
          if(computedValues[n.id] !== undefined && computedValues[n.id] !== null){
            res.textContent = '= ' + formatNum(computedValues[n.id]);
            res.classList.add('show');
          } else if(computeErrors[n.id]){
            res.textContent = '?';
            res.classList.add('show','err');
            res.title = errorTitle(computeErrors[n.id]);
          } else {
            res.textContent = '';
          }
        }
      } else if(isPeriodShift){
        const lab = el.querySelector('.ps-label');
        if(lab) lab.textContent = shiftLabel(typeof n.shift === 'number' ? n.shift : -1);
        const res = el.querySelector('.op-result');
        if(res){
          res.classList.remove('show','err');
          res.title = '';
          if(computedValues[n.id] !== undefined && computedValues[n.id] !== null){
            res.textContent = '= ' + formatNum(computedValues[n.id]);
            res.classList.add('show');
          } else if(computeErrors[n.id]){
            res.textContent = '?';
            res.classList.add('show','err');
            res.title = errorTitle(computeErrors[n.id]);
          } else {
            res.textContent = '';
          }
        }
      } else if(isAlias){
        const chip = el.querySelector('.plug-chip');
        if(chip){
          if(n.plug){ chip.textContent = '🔌 ' + n.plug; chip.style.display = 'block'; }
          else chip.style.display = 'none';
        }
        const lbl = el.querySelector('.label');
        if(lbl){
          const nameEl = lbl.querySelector('.line-name');
          const valEl = lbl.querySelector('.line-value');
          const srcCanvas = canvases.find(c => c.id === n.sourceCanvasId);
          const srcNode = srcCanvas
            ? (srcCanvas.id === activeCanvasId ? nodes : srcCanvas.nodes).find(x => x.id === n.sourceNodeId)
            : null;
          let label;
          if(!n.sourceCanvasId || !n.sourceNodeId) label = '🔗 (not linked)';
          else if(!srcCanvas) label = '🔗 (canvas missing)';
          else if(!srcNode) label = '🔗 (rectangle missing)';
          else {
            const srcName = parseNode(srcNode).name || '(unnamed)';
            label = srcCanvas.id === activeCanvasId ? ('🔗 ' + srcName) : ('🔗 ' + srcCanvas.name + ' ▸ ' + srcName);
          }
          if(nameEl) nameEl.textContent = label;
          const uomEl = lbl.querySelector('.line-uom');
          if(uomEl){
            let uomStr = '', isAuto = false;
            if(srcNode && srcCanvas){
              const auto = computeNodeUOM(srcCanvas.id, srcNode.id, uomVisiting, uomMemo);
              if(auto){ uomStr = formatUOM(auto); isAuto = true; }
            }
            uomEl.textContent = uomStr;
            uomEl.classList.toggle('auto', isAuto);
          }
          if(valEl){
            valEl.classList.remove('literal','computed','error');
            valEl.title = '';
            if(computedValues[n.id] !== undefined && computedValues[n.id] !== null){
              valEl.textContent = '= ' + formatNum(computedValues[n.id]);
              valEl.classList.add('computed');
            } else if(computeErrors[n.id]){
              valEl.textContent = '?';
              valEl.classList.add('error');
              valEl.title = errorTitle(computeErrors[n.id]);
            } else {
              valEl.textContent = '';
            }
          }
        }
      } else {
        const chip = el.querySelector('.plug-chip');
        if(chip){
          if(n.plug){ chip.textContent = '🔌 ' + n.plug; chip.style.display = 'block'; }
          else chip.style.display = 'none';
        }
        const roleChip = el.querySelector('.io-role-chip');
        if(roleChip){
          roleChip.classList.remove('input','output','index');
          if(n.blockRole === 'input'){ roleChip.textContent = '→ IN'; roleChip.classList.add('input'); }
          else if(n.blockRole === 'output'){ roleChip.textContent = 'OUT →'; roleChip.classList.add('output'); }
          else if(n.blockRole === 'index'){ roleChip.textContent = '# IDX'; roleChip.classList.add('index'); }
          else { roleChip.textContent = ''; }
        }
        let reducerChip = el.querySelector('.reducer-chip');
        if(n.blockRole === 'output'){
          if(!reducerChip){
            reducerChip = document.createElement('div');
            reducerChip.className = 'reducer-chip';
            reducerChip.title = "Used only when a Block instance of this canvas is marked Vertical: how this output's per-instance values are combined into one.";
            el.appendChild(reducerChip);
          }
          reducerChip.textContent = 'Σ ' + (n.verticalReducer || 'sum');
          reducerChip.style.display = 'block';
        } else if(reducerChip){
          reducerChip.style.display = 'none';
        }
        const hasIncoming = edges.some(e => e.to === n.id);
        const curveBtn = el.querySelector('.curve-btn');
        if(curveBtn){
          curveBtn.style.display = hasIncoming ? 'none' : '';
          curveBtn.classList.toggle('active', Array.isArray(n.periodValues));
        }
        const lbl = el.querySelector('.label');
        if(lbl && !el.querySelector('textarea')){
          const nameEl = lbl.querySelector('.line-name');
          const valEl = lbl.querySelector('.line-value');
          const uomEl = lbl.querySelector('.line-uom');
          const parsed = parseNode(n);
          const {name} = parsed;
          const literal = effectiveLiteral(n, currentPeriod);
          if(nameEl){ nameEl.textContent = name; nameEl.style.display = name ? '' : 'none'; }
          if(uomEl){
            let uomStr = '', isAuto = false;
            if(parsed.uom){
              uomStr = parsed.uom;
            } else {
              const auto = computeNodeUOM(activeCanvasId, n.id, uomVisiting, uomMemo);
              if(auto){ uomStr = formatUOM(auto); isAuto = true; }
            }
            uomEl.textContent = uomStr;
            uomEl.classList.toggle('auto', isAuto);
          }
          if(valEl){
            valEl.classList.remove('literal','computed','error');
            valEl.title = '';
            if(!hasIncoming){
              // True input: always has a value now — its own number, or zero by default.
              const shown = (literal !== null) ? literal : 0;
              valEl.textContent = (Array.isArray(n.periodValues) ? '📈 ' : '') + formatNumForNode(shown, n);
              valEl.classList.add('literal');
            } else if(computedValues[n.id] !== undefined && computedValues[n.id] !== null){
              valEl.textContent = '= ' + formatNumForNode(computedValues[n.id], n);
              valEl.classList.add('computed');
            } else if(computeErrors[n.id]){
              valEl.textContent = '?';
              valEl.classList.add('error');
              valEl.title = errorTitle(computeErrors[n.id]);
            } else {
              valEl.textContent = '';
            }
          }
        }
        applyNodeStyle(el, n);
      }
    });
    existing.forEach(el => el.remove());

    renderEdges();
    refreshCommandStates();
  }
