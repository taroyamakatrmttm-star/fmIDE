  // another canvas (ordered by canvas, then left to right), placed left of the socket, stacked
  // downwards. fmIDE draws exactly these; compileModel follows them.
  function plugLinks(list){
    const sources = [];
    list.forEach((c, idx) => (c.nodes || []).forEach(n => {
      if(!n || n.type !== 'value') return;
      const keys = new Set(plugsOf(n).map(p => p.toLowerCase()));
      if(keys.size) sources.push({ canvasId: c.id, canvasIndex: idx, node: n, keys });
    }));
    return list.map(c => {
      const links = [];
      if(!sources.length) return links;
      const wired = new Set((c.edges || []).filter(Boolean).map(e => e.from + '\u0000' + e.to));
      (c.nodes || []).forEach(op => {
        if(!op || op.type !== 'operator' || typeof op.socket !== 'string' || op.socket.trim() === '') return;
        const key = op.socket.trim().toLowerCase();
        const matches = sources.filter(p => p.keys.has(key));
        matches.filter(p => p.canvasId === c.id).forEach(p => {
          const k = p.node.id + '\u0000' + op.id;
          if(wired.has(k)) return;
          wired.add(k);
          links.push({ from: p.node.id, to: op.id });
        });
        matches.filter(p => p.canvasId !== c.id)
          .sort((a, b) => (a.canvasIndex - b.canvasIndex) || (a.node.x - b.node.x) || (a.node.y - b.node.y))
          .forEach((p, i) => links.push({ to: op.id, alias: {
            sourceCanvasId: p.canvasId, sourceNodeId: p.node.id, x: Math.max(0, op.x - 200 + i * 2), y: op.y + i * 74 } }));
      });
      return links;
    });
  }

  // A canvas as the calculation sees it: the automatic links saved in the file (aliases and
  // arrows marked `auto`) are set aside and replaced by the ones the plugs make now
  // (plugLinks). A saved link that still matches keeps its id and its place in the lists
  // (fmIDE shows values on the aliases it draws); new ones are added at the end. An alias
  // always sits where plugLinks places it, as fmIDE redraws it — its place sets the order its
  // operator reads it in. Returns new lists; the file's own objects are never changed.
  function withPlugLinks(c, links){
    const autoAliases = new Set(c.nodes.filter(n => n.type === 'alias' && n.auto));
    const autoAliasById = new Map();
    autoAliases.forEach(n => { if(!autoAliasById.has(n.id)) autoAliasById.set(n.id, n); });
    const savedAuto = (e) => e.auto || autoAliasById.has(e.from) || autoAliasById.has(e.to);
    if(!links.length && !autoAliases.size && !c.edges.some(savedAuto)) return c;
    const savedEdges = c.edges.filter(savedAuto);
    const keepNodes = new Set(), keepEdges = new Set(), addNodes = [], addEdges = [], moved = new Map();
    const nodeIds = new Set(c.nodes.map(n => n.id)), edgeIds = new Set(c.edges.map(e => e.id));
    const freshId = (used, base) => { let id = base, k = 2; while(used.has(id)) id = base + '~' + (k++); used.add(id); return id; };
    links.forEach(l => {
      if(l.alias){
        const saved = savedEdges.find(e => {
          if(keepEdges.has(e) || e.to !== l.to) return false;
          const a = autoAliasById.get(e.from);
          return !!a && !keepNodes.has(a) && a.sourceCanvasId === l.alias.sourceCanvasId && a.sourceNodeId === l.alias.sourceNodeId;
        });
        if(saved){
          const a = autoAliasById.get(saved.from);
          keepEdges.add(saved); keepNodes.add(a);
          if(a.x !== l.alias.x || a.y !== l.alias.y) moved.set(a, Object.assign({}, a, { x: l.alias.x, y: l.alias.y }));
          return;
        }
        const id = freshId(nodeIds, 'plug:' + l.alias.sourceCanvasId + ':' + l.alias.sourceNodeId + '>' + l.to);
        addNodes.push({ id, type: 'alias', auto: true, x: l.alias.x, y: l.alias.y, w: 170, h: 64,
          sourceCanvasId: l.alias.sourceCanvasId, sourceNodeId: l.alias.sourceNodeId, plugs: [] });
        addEdges.push({ id: freshId(edgeIds, 'plug:' + id), from: id, to: l.to, auto: true });
      } else {
        const saved = savedEdges.find(e => !keepEdges.has(e) && e.auto && e.from === l.from && e.to === l.to && !autoAliasById.has(e.from));
        if(saved){ keepEdges.add(saved); return; }
        addEdges.push({ id: freshId(edgeIds, 'plug:' + l.from + '>' + l.to), from: l.from, to: l.to, auto: true });
      }
    });
    return {
      id: c.id, name: c.name,
      nodes: c.nodes.filter(n => !autoAliases.has(n) || keepNodes.has(n)).map(n => moved.get(n) || n).concat(addNodes),
      edges: c.edges.filter(e => !savedAuto(e) || keepEdges.has(e)).concat(addEdges),
    };
  }

  // `c` is { id, name, nodes, edges } as the calculation sees it (withPlugLinks); `functions`
  // is the model's compiled function definitions (compileFunctions).
  function compileCanvas(c, functions){
    const nodes = c.nodes, edges = c.edges;
    // The canvas as the calculation sees it, for rules that read a whole canvas (the input
    // rule, reaching outside the timeline) and for ExcelExporter's layout.
    const raw = { id: c.id, name: c.name, nodes, edges };
    const rawById = new Map();
    nodes.forEach(n => { if(!rawById.has(n.id)) rawById.set(n.id, n); });
    const incoming = new Map();
    const outgoing = new Map();
    const portEdges = new Map(); // block instance id → (input port → the first arrow into it)
    edges.forEach(e => {
      if(!incoming.has(e.to)) incoming.set(e.to, []);
      incoming.get(e.to).push(e);
      if(!outgoing.has(e.from)) outgoing.set(e.from, []);
      outgoing.get(e.from).push(e);
      if(!portEdges.has(e.to)) portEdges.set(e.to, new Map());
      const ports = portEdges.get(e.to);
      if(!ports.has(e.toPort)) ports.set(e.toPort, e);
    });
    const copyList = (v) => Array.isArray(v) ? v.slice() : undefined;

    const compileNode = (n) => {
      const inc = incoming.get(n.id) || [];
      // `node` is the node as saved (ExcelExporter reads its text, style and roles from it).
      const out = { id: n.id, type: n.type, x: n.x, y: n.y, incoming: inc, outgoing: outgoing.get(n.id) || [], node: n };
      if(n.type === 'value'){
        const parsed = parseRectText(n.text);
        out.typed = parsed.literal;
        out.unitText = parsed.uom;
        // What effectiveLiteral reads, copied so the IR stays as it was compiled.
        out.literal = { text: n.text, periodValues: copyList(n.periodValues), literalPeriods: copyList(n.literalPeriods) };
        out.literalPeriods = out.literal.literalPeriods;
        out.isInput = isInputRectangle(raw, n);
        out.blockRole = n.blockRole;
        out.verticalReducer = n.verticalReducer;
        out.plugs = plugsOf(n);
      } else if(n.type === 'alias'){
        out.sourceCanvasId = n.sourceCanvasId;
        out.sourceNodeId = n.sourceNodeId;
      } else if(n.type === 'periodShift'){
        out.offset = (typeof n.shift === 'number') ? n.shift : -1;
      } else if(n.type === 'blockInstance'){
        out.blockDefCanvasId = n.blockDefCanvasId;
        out.vertical = !!n.vertical;
      } else if(n.type === 'function'){
        // A call to one version of a function: `call` is its compiled definition, or null when
        // the file doesn't carry it. Its inputs are the arrows into its ports (portEdges).
        out.fn = cleanFunctionRef(n.fn);
        out.call = out.fn ? functions.resolve(out.fn) : null;
      } else {
        // An operator — or any other type, which calculates the same way.
        out.symbol = n.text;
        out.op = operatorForSymbol(n.text);
        out.socket = typeof n.socket === 'string' ? n.socket : '';
        // Inputs whose source exists, left to right.
        out.inputs = inc.slice().sort((a, b) => {
          const na = rawById.get(a.from), nb = rawById.get(b.from);
          if(!na || !nb) return 0;
          return irByPosition(na, nb);
        }).filter(e => rawById.has(e.from));
        // The same, in the order units read them (sources checked first, then sorted).
        out.unitInputs = inc.filter(e => rawById.has(e.from)).sort((a, b) => irByPosition(rawById.get(a.from), rawById.get(b.from)));
      }
      return out;
    };

    const list = nodes.map(compileNode);
    const byId = new Map();
    list.forEach(n => { if(!byId.has(n.id)) byId.set(n.id, n); });
    // A block's ports: its Input and Output rectangles, left to right, and its Vertical Index.
    const byRole = (role) => list.filter(n => n.type === 'value' && n.blockRole === role).sort(irByPosition);
    const indexNode = list.find(n => n.type === 'value' && n.blockRole === 'index') || null;
    return { id: c.id, name: c.name, raw, list, byId, portEdges,
      ports: { inputs: byRole('input'), outputs: byRole('output'), indexNode } };
  }

  // Reads { periods, canvases, functions } and nothing else. Plug-to-socket links are worked
  // out here, from the plug and socket names (plugLinks); the automatic links saved in the file
  // are only reused where they still match. `functions` are the function definitions the
  // model carries (functions.js); a model without any reads none.
  const IR_NO_FUNCTIONS = { resolve: () => null, list: [] };
  function compileModel(system){
    const periods = system && Array.isArray(system.periods) ? system.periods : [];
    const source = system && Array.isArray(system.canvases) ? system.canvases : [];
    const saved = source.map(c => {
      c = (c && typeof c === 'object') ? c : {};
      return { id: c.id, name: c.name,
        nodes: Array.isArray(c.nodes) ? c.nodes.filter(n => n && typeof n === 'object') : [],
        edges: Array.isArray(c.edges) ? c.edges.filter(e => e && typeof e === 'object') : [] };
    });
    const links = plugLinks(saved.map(c => {
      const autoAliasIds = new Set(c.nodes.filter(n => n.type === 'alias' && n.auto).map(n => n.id));
      return { id: c.id,
        nodes: c.nodes.filter(n => !(n.type === 'alias' && n.auto)),
        edges: c.edges.filter(e => !e.auto && !autoAliasIds.has(e.from) && !autoAliasIds.has(e.to)) };
    }));
    const functions = system && Array.isArray(system.functions) && system.functions.length ? compileFunctions(system.functions) : IR_NO_FUNCTIONS;
    const order = saved.map((c, i) => compileCanvas(withPlugLinks(c, links[i]), functions));
    const canvases = new Map();
    order.forEach(c => { if(!canvases.has(c.id)) canvases.set(c.id, c); });
    return { periodCount: periods.length, order, canvases, units: new Map(), functions };
  }

  function irNodeIn(ir, canvasId, nodeId){
    const c = ir.canvases.get(canvasId);
    return c ? c.byId.get(nodeId) : undefined;
  }
  // The ports of a block definition canvas (none when it is missing).
  function irBlockPorts(ir, defCanvasId){
    const def = ir.canvases.get(defCanvasId);
    return def ? def.ports : { inputs: [], outputs: [], indexNode: null };
  }

  // ---- units ----
  // A rectangle's unit: its own typed 3rd line if set, else worked out from its input(s)
  // through the operator catalogue's unit rules (aliases and period shifts pass their
  // source's unit straight through). null when there is none (e.g. ^, %, comparisons, or +/−
  // of different units). Remembered in the IR.
  //
  // Blocks: what an arrow reads from a block instance has the unit of the block's Output
  // rectangle in that instance, where each Input port has the unit of whatever feeds that
  // instance's port (a port nothing feeds keeps its own). `path` says which instance a
  // rectangle inside a block is seen in: the block-instance hops from the top level down,
  // [{ canvasId, nodeId }] (the canvas the instance sits on, and the instance); [] or none is
  // the rectangle on its own canvas. A block that contains itself gives no unit.
  function unitOf(ir, canvasId, nodeId, path){ return irUnit(ir, canvasId, nodeId, path || [], new Set()); }

  function irScopeKey(path){
    let k = '';
    for(let i = 0; i < path.length; i++) k += path[i].canvasId + ':' + path[i].nodeId + '>';
    return k;
  }

  // The arrow feeding input port `portIndex` of block instance `instanceId` on canvas
  // `hostCanvasId`, or null.
  function irPortEdge(ir, hostCanvasId, instanceId, portIndex){
    const c = ir.canvases.get(hostCanvasId);
    const ports = c && c.portEdges.get(instanceId);
    return (ports && ports.get(portIndex)) || null;
  }

  // True if block Input port `node` (of definition `defCanvasId`), seen in the instance that
  // `path` ends in, is fed by nothing there: no arrow into the instance's port, or one from
  // something fed by nothing (feedsNothing — e.g. an operator whose socket nothing plugs into).
  // Such a port is an input of the instance: its own typed number, or 0.
  function irPortUnfed(ir, path, defCanvasId, node){
    if(!path.length) return false;
    const hop = path[path.length - 1];
    const def = ir.canvases.get(defCanvasId);
    const edge = def ? irPortEdge(ir, hop.canvasId, hop.nodeId, def.ports.inputs.indexOf(node)) : null;
    if(!edge) return true;
    const host = ir.canvases.get(hop.canvasId);
    return feedsNothing(host.raw, edge.from, new Set());
  }

  function irUnit(ir, canvasId, nodeId, path, visiting){
    const key = irScopeKey(path) + canvasId + '|' + nodeId;
    if(ir.units.has(key)) return ir.units.get(key);
    if(visiting.has(key)) return null;
    const n = irNodeIn(ir, canvasId, nodeId);
    if(!n){ ir.units.set(key, null); return null; }
    visiting.add(key);
    const fromEdge = (edge) => irEdgeUnit(ir, canvasId, edge, path, visiting);
    let result = null;
    if(n.type === 'value'){
      if(n.blockRole === 'input' && path.length && !irPortUnfed(ir, path, canvasId, n)){
        // A fed Input port passes on the unit of what feeds this instance's port.
        const hop = path[path.length - 1];
        const def = ir.canvases.get(canvasId);
        const edge = irPortEdge(ir, hop.canvasId, hop.nodeId, def.ports.inputs.indexOf(n));
        result = irEdgeUnit(ir, hop.canvasId, edge, path.slice(0, -1), visiting);
      } else if(n.unitText) result = parseUOM(n.unitText);
      else if(n.incoming.length === 1) result = fromEdge(n.incoming[0]);
    } else if(n.type === 'alias'){
      // An alias into its own canvas stays in the same instance; into another canvas, it reads
      // that canvas's rectangle on its own.
      if(n.sourceCanvasId && n.sourceNodeId) result = irUnit(ir, n.sourceCanvasId, n.sourceNodeId, n.sourceCanvasId === canvasId ? path : [], visiting);
    } else if(n.type === 'periodShift'){
      if(n.incoming.length === 1) result = fromEdge(n.incoming[0]);
    } else if(n.type === 'function'){
      // Worked out from the function's formula, with the units of what feeds its inputs.
      if(n.call && !n.call.status) result = functionUnit(n.call, (i) => irEdgeUnit(ir, canvasId, irPortEdge(ir, canvasId, n.id, i), path, visiting));
    } else if(n.type === 'operator'){
      const units = n.unitInputs.map(fromEdge);
      const rule = n.op ? n.op.unit : null;
      if(units.length > 0 && !units.some(u => u === null)){
        if(rule === 'multiply') result = units.reduce((acc, u, i) => i === 0 ? u : uomMultiply(acc, u));
        else if(rule === 'divide') result = units.reduce((acc, u, i) => i === 0 ? u : uomDivide(acc, u));
        else if(rule === 'same') result = units.every(u => uomDimsEqual(u, units[0])) ? units[0] : null;
      }
    }
    visiting.delete(key);
    ir.units.set(key, result);
    return result;
  }

  // The unit of what `edge` (on canvas `canvasId`, seen in instance `path`) reads.
  function irEdgeUnit(ir, canvasId, edge, path, visiting){
    const src = edge && irNodeIn(ir, canvasId, edge.from);
    if(!src) return null;
    if(src.type !== 'blockInstance') return irUnit(ir, canvasId, edge.from, path, visiting);
    const def = ir.canvases.get(src.blockDefCanvasId);
    const out = def && def.ports.outputs[edge.fromPort || 0];
    if(!out) return null;
    // A block inside itself (directly or not) has no unit.
    for(let i = 0; i < path.length; i++){
      const inst = irNodeIn(ir, path[i].canvasId, path[i].nodeId);
      if(inst && inst.blockDefCanvasId === def.id) return null;
    }
    return irUnit(ir, def.id, out.id, path.concat([{ canvasId, nodeId: src.id }]), visiting);
  }

  // ---- values ----
  // Calculates every period. Returns one entry per canvas, in the system's order:
  // { values[p], errors[p], portValues[p], portErrors[p], portInstances[p] }, where values and
  // errors map a node id to its number or error code; portValues / portErrors map a block
  // instance id to a list per output; portInstances maps a vertical block instance id to each
  // output's list of per-instance results.
  //
  // Error codes: cycle, alias-unset, alias-missing-canvas, alias-missing-node, no-input,
  // ambiguous, missing-input, period-out-of-range, math-error, unary-only, needs-two,
  // block-missing-def, block-missing-output, block-cycle; for function nodes also
  // function-missing, function-unreadable, function-cycle, function-too-deep,
  // function-arguments (compileFunctions) and function-input-unwired.
  //
  // `options` (both off unless asked for; fmIDE asks for neither):
  // - trace: each entry also carries origins[p], mapping a node id with an error to where
  //   its failure starts: { canvasId, nodeId, path, code } (see irOrigin).
  // - instances: the result also carries `instances[p]`, every rectangle inside every block
  //   instance: [{ path, canvasId, nodeId, value, error, origin? }], where `path` is the
  //   block-instance hops from the top level down ([{ canvasId, nodeId, vintage? }]; `vintage`,
  //   from 1, is one run of a vertical instance). A vertical instance's combined output is
  //   listed once more with its hop's vintage left out and `combined: true`.
  //
  // Each period starts with a fresh memory of results. A value is remembered per period,
  // canvas, block-instance scope and node: `scope` is { prefix, bindings, outerCanvasId,
  // outerScope, hops } inside a block instance, where `bindings` maps each Input port to the
  // outer arrow feeding it.
  function evaluateModel(ir, options){
    const periodCount = ir.periodCount;
    const trace = !!(options && (options.trace || options.instances));
    const wantInstances = !!(options && options.instances);
    const TOP_HOPS = [];
    const TOP = () => ({ prefix: '', bindings: {}, hops: TOP_HOPS });
    const rawCanvasOf = (id) => { const c = ir.canvases.get(id); return c ? c.raw : undefined; };
    const bad = (v) => v === null || v === undefined || Number.isNaN(v);
    const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
    const valueKey = (period, canvasId, scope, nodeId) => period + '|' + canvasId + '|' + scope.prefix + nodeId;
    let memo = {}, errors = {};
    // Tracing only: where each failure starts (a key, or '!missing-source' for an arrow from a
    // node that doesn't exist), what each key is, and every block-instance scope met.
    let origins = {}, keyInfo = {}, scopesSeen = new Map();

    // The memory key of what `edge` reads (null when its source doesn't exist).
    function edgeKey(canvasId, edge, period, scope){
      const src = irNodeIn(ir, canvasId, edge.from);
      if(!src) return null;
      if(src.type === 'blockInstance') return valueKey(period, canvasId, scope, src.id + '::out' + (edge.fromPort || 0));
      return valueKey(period, canvasId, scope, edge.from);
    }
    // Tracing: `key` failed because what `edge` reads failed.
    function failedFrom(key, canvasId, edge, period, scope){
      const k = edgeKey(canvasId, edge, period, scope);
      origins[key] = k === null ? '!missing-source' : (origins[k] || k);
    }
    function note(key, canvasId, scope, nodeId){ keyInfo[key] = { canvasId, nodeId, hops: scope.hops }; }

    function resolveEdge(canvasId, edge, period, scope, visiting){
      const src = irNodeIn(ir, canvasId, edge.from);
      if(!src) return null;
      if(src.type === 'blockInstance') return blockOutput(canvasId, src, edge.fromPort || 0, period, scope, visiting);
      return value(canvasId, edge.from, period, scope, visiting);
    }
    const literalOrZero = (n, period) => { const l = effectiveLiteral(n.literal, period); return l !== null ? l : 0; };

    function value(canvasId, nodeId, period, scope, visiting){
      const key = valueKey(period, canvasId, scope, nodeId);
      if(has(memo, key)) return memo[key];
      if(visiting.has(key)){ errors[key] = 'cycle'; memo[key] = null; return null; }
      const n = irNodeIn(ir, canvasId, nodeId);
      if(!n) return null;
      visiting.add(key);
      if(trace) note(key, canvasId, scope, nodeId);
      let result = null;

      if(n.type === 'alias'){
        if(!n.sourceCanvasId || !n.sourceNodeId){
          errors[key] = 'alias-unset';
        } else if(!ir.canvases.has(n.sourceCanvasId)){
          errors[key] = 'alias-missing-canvas';
        } else {
          const src = irNodeIn(ir, n.sourceCanvasId, n.sourceNodeId);
          if(!src){
            errors[key] = 'alias-missing-node';
          } else {
            // An alias into its own canvas is a local routing jump (e.g. re-exposing an
            // internal subtotal as a block output): it stays in the current block-instance
            // scope. An alias into another canvas evaluates that canvas at the top level.
            const aliasScope = (n.sourceCanvasId === canvasId) ? scope : TOP();
            result = value(n.sourceCanvasId, src.id, period, aliasScope, visiting);
            if(result === null && !errors[key]){
              errors[key] = 'missing-input';
              if(trace){ const k = valueKey(period, n.sourceCanvasId, aliasScope, src.id); origins[key] = origins[k] || k; }
            }
          }
        }
      } else if(n.type === 'blockInstance'){
        // No single value: an arrow from it reads one output (resolveEdge).
        errors[key] = 'no-input';
      } else if(n.type === 'value'){
        if(has(scope.bindings, nodeId)){
          // A block Input port: the outer arrow feeding it, read at the period asked for here
          // (the definition may look at other periods through a period shift), unless a
          // vertical instance pins it to its own period (fixedPeriod) or hands the Vertical
          // Index rectangle a number (literal).
          const binding = scope.bindings[nodeId];
          if(binding && typeof binding.literal === 'number'){
            result = binding.literal;
          } else {
            const inEdge = binding ? binding.edge : null;
            const bindPeriod = (binding && typeof binding.fixedPeriod === 'number') ? binding.fixedPeriod : period;
            const bound = inEdge ? resolveEdge(scope.outerCanvasId, inEdge, bindPeriod, scope.outerScope, visiting) : null;
            if(!bad(bound)){
              result = bound;
            } else if(!inEdge || feedsNothing(rawCanvasOf(scope.outerCanvasId), inEdge.from, new Set())
              || reachesOutsideTimeline(rawCanvasOf, scope.outerCanvasId, inEdge.from, bindPeriod, periodCount)){
              // Nothing feeds the port (it is an input of the instance), or what feeds it needs
              // a period outside the timeline: the port's own typed number, or 0 — as for any
              // wired rectangle. Any other failure shows as an error.
              result = literalOrZero(n, period);
            } else if(!errors[key]){
              errors[key] = 'missing-input';
              if(trace) failedFrom(key, scope.outerCanvasId, inEdge, bindPeriod, scope.outerScope);
            }
          }
        } else {
          const incoming = n.incoming;
          if(incoming.length === 0 || n.isInput){
            // An input (nothing wired in, or only an operator that nothing feeds — the shared
            // input rule): its own number, or 0.
            result = literalOrZero(n, period);
          } else if(incoming.length === 1 && Array.isArray(n.literalPeriods) && n.literalPeriods.includes(period) && n.typed !== null){
            // A period ticked under "Which periods use this rectangle's own number?" uses it,
            // wired or not.
            result = n.typed;
          } else if(incoming.length === 1){
            // Follow the wired source. Where it needs a period outside the timeline (e.g. a
            // corkscrew's opening balance in period 1), the typed number applies, or 0 — the
            // rule ExcelExporter follows too. Any other failure shows as an error.
            const edgeVal = resolveEdge(canvasId, incoming[0], period, scope, visiting);
            if(!bad(edgeVal)){
              result = edgeVal;
            } else if(reachesOutsideTimeline(rawCanvasOf, canvasId, incoming[0].from, period, periodCount)){
              result = literalOrZero(n, period);
            } else if(!errors[key]){
              errors[key] = 'missing-input';
              if(trace) failedFrom(key, canvasId, incoming[0], period, scope);
            }
          } else {
            errors[key] = 'ambiguous';
          }
        }
      } else if(n.type === 'periodShift'){
        const incoming = n.incoming;
        if(incoming.length === 0){
          errors[key] = 'no-input';
        } else if(incoming.length > 1){
          errors[key] = 'ambiguous';
        } else {
          const targetPeriod = period + n.offset;
          if(targetPeriod < 0 || targetPeriod >= periodCount){
            errors[key] = 'period-out-of-range';
          } else {
            result = resolveEdge(canvasId, incoming[0], targetPeriod, scope, visiting);
            if(result === null && !errors[key]){
              errors[key] = 'missing-input';
              if(trace) failedFrom(key, canvasId, incoming[0], targetPeriod, scope);
            }
          }
        }
      } else if(n.type === 'function'){
        // A call: the function's formula, reading only the inputs it needs. Each input is the
        // arrow into its port; one with no arrow is an error where the formula reads it.
        if(!n.call){
          errors[key] = 'function-missing';
        } else if(n.call.status){
          errors[key] = n.call.status;
        } else {
          const r = runFunction(n.call, (i) => {
            const edge = irPortEdge(ir, canvasId, n.id, i);
            if(!edge) return { error: 'function-input-unwired' };
            const v = resolveEdge(canvasId, edge, period, scope, visiting);
            return bad(v) ? { error: 'missing-input', edge } : { value: v };
          });
          if(r.error){
            errors[key] = r.error;
            if(trace && r.edge) failedFrom(key, canvasId, r.edge, period, scope);
          } else result = r.value;
        }
      } else {
        const inputs = n.inputs;
        if(n.op && n.op.fallback){
          // iferror(first, second): the first input, or when it fails the second; with no
          // second input, or nothing wired in at all, 0 (Excel: IFERROR(x,0) / 0).
          if(inputs.length === 0){
            result = 0;
          } else {
            const primary = resolveEdge(canvasId, inputs[0], period, scope, visiting);
            if(!bad(primary)){
              result = primary;
            } else if(inputs.length >= 2){
              const fallback = resolveEdge(canvasId, inputs[1], period, scope, visiting);
              if(bad(fallback)){
                errors[key] = 'missing-input';
                if(trace) failedFrom(key, canvasId, inputs[1], period, scope);
              } else result = fallback;
            } else {
              result = 0;
            }
          }
        } else if(inputs.length === 0){
          errors[key] = 'no-input';
        } else {
          const values = inputs.map(e => resolveEdge(canvasId, e, period, scope, visiting));
          const failed = values.findIndex(bad);
          if(failed >= 0){
            errors[key] = 'missing-input';
            if(trace) failedFrom(key, canvasId, inputs[failed], period, scope);
          } else {
            const r = applyOperator(n.op, values);
            if(r.error) errors[key] = r.error;
            else result = r.value;
          }
        }
      }

      visiting.delete(key);
      memo[key] = result;
      return result;
    }

    // Each Input port is bound to the outer arrow feeding it (read fresh at whatever period
    // the definition asks for).
    function portEdge(outerCanvasId, instanceId, port){ return irPortEdge(ir, outerCanvasId, instanceId, port); }

    function blockOutput(outerCanvasId, inst, outputIndex, period, outerScope, visiting){
      const key = valueKey(period, outerCanvasId, outerScope, inst.id + '::out' + outputIndex);
      if(has(memo, key)) return memo[key];
      if(trace) note(key, outerCanvasId, outerScope, inst.id);
      const def = ir.canvases.get(inst.blockDefCanvasId);
      if(!def){ errors[key] = 'block-missing-def'; memo[key] = null; return null; }
      if(inst.vertical) return verticalBlockOutput(outerCanvasId, inst, outputIndex, period, outerScope, visiting, def, key);

      const blockCycleKey = period + '|#block#' + def.id;
      if(visiting.has(blockCycleKey)){ errors[key] = 'block-cycle'; memo[key] = null; return null; }
      const outNode = def.ports.outputs[outputIndex];
      if(!outNode){ errors[key] = 'block-missing-output'; memo[key] = null; return null; }

      const bindings = {};
      def.ports.inputs.forEach((inp, i) => { bindings[inp.id] = { edge: portEdge(outerCanvasId, inst.id, i), fixedPeriod: null }; });
      const innerScope = { prefix: outerScope.prefix + outerCanvasId + '/' + inst.id + '::', bindings, outerCanvasId, outerScope,
        hops: trace ? outerScope.hops.concat([{ canvasId: outerCanvasId, nodeId: inst.id }]) : null };
      if(wantInstances && !scopesSeen.has(innerScope.prefix)) scopesSeen.set(innerScope.prefix, { scope: innerScope, def });
      visiting.add(blockCycleKey);
      const result = value(def.id, outNode.id, period, innerScope, visiting);
      visiting.delete(blockCycleKey);

      memo[key] = result;
      if(result === null && !errors[key]){
        const innerKey = valueKey(period, def.id, innerScope, outNode.id);
        errors[key] = errors[innerKey] || 'missing-input';
        if(trace) origins[key] = origins[innerKey] || innerKey;
      }
      return result;
    }

    // A vertical block instance runs the definition once per period i (its Vertical Index
    // rectangle, if any, reads i + 1), then combines the results with the output's reducer.
    // An input arrow marked verticalIndexed reads its source at period i; the others are read
    // at whatever period the definition asks for.
    function verticalBlockOutput(outerCanvasId, inst, outputIndex, period, outerScope, visiting, def, key){
      const { inputs, outputs, indexNode } = def.ports;
      const outNode = outputs[outputIndex];
      if(!outNode){ errors[key] = 'block-missing-output'; memo[key] = null; return null; }

      const results = [], innerKeys = [];
      for(let i = 0; i < periodCount; i++){
        const blockCycleKey = period + '|#block#' + def.id + '#v' + inst.id + '#' + i;
        if(visiting.has(blockCycleKey)){ errors[key] = 'block-cycle'; results.push(null); innerKeys.push(null); continue; }
        const bindings = {};
        inputs.forEach((inp, portIdx) => {
          const inEdge = portEdge(outerCanvasId, inst.id, portIdx);
          bindings[inp.id] = { edge: inEdge, fixedPeriod: (inEdge && inEdge.verticalIndexed) ? i : null };
        });
        if(indexNode) bindings[indexNode.id] = { edge: null, fixedPeriod: null, literal: i + 1 };
        const innerScope = { prefix: outerScope.prefix + outerCanvasId + '/' + inst.id + '::v' + i + '::', bindings, outerCanvasId, outerScope,
          hops: trace ? outerScope.hops.concat([{ canvasId: outerCanvasId, nodeId: inst.id, vintage: i + 1 }]) : null };
        if(wantInstances && !scopesSeen.has(innerScope.prefix)) scopesSeen.set(innerScope.prefix, { scope: innerScope, def });
        visiting.add(blockCycleKey);
        results.push(value(def.id, outNode.id, period, innerScope, visiting));
        innerKeys.push(valueKey(period, def.id, innerScope, outNode.id));
        visiting.delete(blockCycleKey);
      }

      let result = null;
      if(results.length === 0){
        errors[key] = 'no-input';
      } else if(results.some(bad)){
        errors[key] = 'missing-input';
        if(trace){
          const k = innerKeys[results.findIndex(bad)];
          origins[key] = k === null ? key : (origins[k] || k);
        }
      } else {
        const mode = outNode.verticalReducer || 'sum';
        if(mode === 'max') result = Math.max(...results);
        else if(mode === 'min') result = Math.min(...results);
        else if(mode === 'ave') result = results.reduce((a, b) => a + b, 0) / results.length;
        else if(mode === 'product') result = results.reduce((a, b) => a * b, 1);
        else result = results.reduce((a, b) => a + b, 0); // 'sum' (default)
      }
      memo[key] = result;
      memo[key + '::instances'] = results.slice(); // the per-instance breakdown, for display only
      return result;
    }

    // Tracing: where the failure at `key` starts — { canvasId, nodeId, path, code }. A failure
    // whose trail comes back to itself is a loop ('cycle'); an arrow from a node that doesn't
    // exist is 'missing-source'.
    function irOrigin(key){
      const o = origins[key] || key;
      if(o === '!missing-source') return { canvasId: null, nodeId: null, path: [], code: 'missing-source' };
      const info = keyInfo[o] || {};
      let code = errors[o] || 'missing-input';
      if(code === 'missing-input') code = 'cycle';
      return { canvasId: info.canvasId, nodeId: info.nodeId, path: info.hops || [], code };
    }

    const out = ir.order.map(() => ({ values: [], errors: [], portValues: [], portErrors: [], portInstances: [], origins: trace ? [] : undefined }));
    const instances = wantInstances ? [] : undefined;
    for(let p = 0; p < periodCount; p++){
      memo = {}; errors = {};
      if(trace){ origins = {}; keyInfo = {}; scopesSeen = new Map(); }
      ir.order.forEach(c => c.list.forEach(n => {
        if(n.type === 'blockInstance'){
          irBlockPorts(ir, n.blockDefCanvasId).outputs.forEach((_, i) => blockOutput(c.id, n, i, p, TOP(), new Set()));
        } else {
          value(c.id, n.id, p, TOP(), new Set());
        }
      }));
      if(wantInstances){
        // Every rectangle of every instance met so far (nested instances are met on the way).
        const list = [];
        for(const { scope, def } of scopesSeen.values()){
          def.list.forEach(n => {
            if(n.type === 'blockInstance'){
              irBlockPorts(ir, n.blockDefCanvasId).outputs.forEach((_, i) => {
                const k = valueKey(p, def.id, scope, n.id + '::out' + i);
                blockOutput(def.id, n, i, p, scope, new Set());
                if(n.vertical){
                  const outNode = irBlockPorts(ir, n.blockDefCanvasId).outputs[i];
                  list.push({ path: scope.hops.concat([{ canvasId: def.id, nodeId: n.id }]), canvasId: n.blockDefCanvasId, nodeId: outNode.id,
                    combined: true, value: memo[k], error: errors[k] || null, origin: errors[k] ? irOrigin(k) : null });
                }
              });
              return;
            }
            if(n.type !== 'value') return;
            const k = valueKey(p, def.id, scope, n.id);
            value(def.id, n.id, p, scope, new Set());
            list.push({ path: scope.hops, canvasId: def.id, nodeId: n.id, value: has(memo, k) ? memo[k] : null,
              error: errors[k] || null, origin: errors[k] ? irOrigin(k) : null });
          });
        }
        // Vertical instances on the top level: their combined outputs.
        ir.order.forEach(c => c.list.forEach(n => {
          if(n.type !== 'blockInstance' || !n.vertical) return;
          irBlockPorts(ir, n.blockDefCanvasId).outputs.forEach((outNode, i) => {
            const k = valueKey(p, c.id, TOP(), n.id + '::out' + i);
            list.push({ path: [{ canvasId: c.id, nodeId: n.id }], canvasId: n.blockDefCanvasId, nodeId: outNode.id,
              combined: true, value: memo[k], error: errors[k] || null, origin: errors[k] ? irOrigin(k) : null });
          });
        }));
        instances[p] = list;
      }
      ir.order.forEach((c, ci) => {
        const cv = {}, ce = {}, pv = {}, pe = {}, pin = {}, po = {};
        c.list.forEach(n => {
          if(n.type === 'blockInstance'){
            const vals = [], errs = [];
            let insts = null;
            irBlockPorts(ir, n.blockDefCanvasId).outputs.forEach((_, i) => {
              const k = valueKey(p, c.id, TOP(), n.id + '::out' + i);
              vals.push(has(memo, k) ? memo[k] : null);
              errs.push(errors[k] || null);
              if(n.vertical){
                if(!insts) insts = [];
                insts.push(has(memo, k + '::instances') ? memo[k + '::instances'] : []);
              }
            });
            pv[n.id] = vals; pe[n.id] = errs;
            if(insts) pin[n.id] = insts;
          } else {
            const k = valueKey(p, c.id, TOP(), n.id);
            if(has(memo, k) && memo[k] !== null) cv[n.id] = memo[k];
            if(errors[k]){
              ce[n.id] = errors[k];
              if(trace) po[n.id] = irOrigin(k);
            }
          }
        });
        const r = out[ci];
        r.values[p] = cv; r.errors[p] = ce; r.portValues[p] = pv; r.portErrors[p] = pe; r.portInstances[p] = pin;
        if(trace) r.origins[p] = po;
      });
    }
    if(wantInstances) out.instances = instances;
    return out;
  }

  // The active canvas's incoming arrows of a node, its sources left to right (used to draw them).
  function sortedIncoming(nodeId){
    return edges.filter(e => e.to === nodeId).slice().sort((a,b) => {
      const na = getNode(a.from), nb = getNode(b.from);
      if(!na || !nb) return 0;
      return (na.x - nb.x) || (na.y - nb.y);
    });
  }

  // The IR of the model as it is now, compiled when first needed after a change (units on
  // the canvas read it); invalidateIR() is called wherever the model may change.
  let modelIR = null;
  function invalidateIR(){ modelIR = null; }
  // The function definitions the open model carries (11b-functions.js).
  let modelFunctions = [];
  function currentIR(){
    if(!modelIR){
      syncActiveIntoRegistry();
      modelIR = compileModel({ periods, canvases, functions: modelFunctions });
    }
    return modelIR;
  }
  // A node's unit of measure ({scale, dims}) from the IR, or null.
  function nodeUOM(canvasId, nodeId){ return unitOf(currentIR(), canvasId, nodeId); }

  // Evaluates every period, for every canvas, and keeps a full per-period
  // snapshot on each canvas (c.periodComputedValues[p], etc.) so switching the
  // viewed period is just a re-slice, not a recompute.
  // Inside a transaction (a macro run, or one API action) evaluation is deferred and done
  // once when the transaction finishes; evaluateAllNow() forces it immediately.
  function evaluateAll(){
    if(tx.depth > 0){ tx.needEval = true; return; }
    evaluateAllNow();
  }

  function evaluateAllNow(){
    syncActiveIntoRegistry();
    const ir = compileModel({ periods, canvases, functions: modelFunctions });
    const results = evaluateModel(ir);
    canvases.forEach((c, i) => {
      const r = results[i];
      c.periodComputedValues = r.values;
      c.periodComputeErrors = r.errors;
      c.periodPortValues = r.portValues;
      c.periodPortErrors = r.portErrors;
      c.periodPortInstances = r.portInstances;
    });

    canvases.forEach(c => {
      c.computedValues = c.periodComputedValues[currentPeriod] || {};
      c.computeErrors = c.periodComputeErrors[currentPeriod] || {};
      c.portValues = c.periodPortValues[currentPeriod] || {};
      c.portErrors = c.periodPortErrors[currentPeriod] || {};
    });
    loadCanvasState(canvases.find(c => c.id === activeCanvasId));
    modelIR = ir;
    renderPeriodControls();
    render();
  }

  // Changes which period's already-computed values are shown, without recomputing.
  function setCurrentPeriod(idx){
    currentPeriod = Math.max(0, Math.min(periods.length - 1, idx));
    canvases.forEach(c => {
      c.computedValues = (c.periodComputedValues && c.periodComputedValues[currentPeriod]) || {};
      c.computeErrors = (c.periodComputeErrors && c.periodComputeErrors[currentPeriod]) || {};
      c.portValues = (c.periodPortValues && c.periodPortValues[currentPeriod]) || {};
      c.portErrors = (c.periodPortErrors && c.periodPortErrors[currentPeriod]) || {};
    });
    loadCanvasState(canvases.find(c => c.id === activeCanvasId));
    renderPeriodControls();
    render();
  }

  // ---------- rendering ----------
  function render(){
    if(tx.depth > 0) return; // batched: rendered once when the transaction finishes
    const existing = new Map();
    canvas.querySelectorAll('.node').forEach(el => existing.set(el.dataset.id, el));
    let plugMap = null; // plug name → rectangles carrying it (built once, when a socket needs it)

    nodes.forEach(n => {
      let el = existing.get(n.id);
      const isOperator = n.type === 'operator';
      const isAlias = n.type === 'alias';
      const isBlockInstance = n.type === 'blockInstance';
      const isPeriodShift = n.type === 'periodShift';
      if(!el){
        el = document.createElement('div');
        el.dataset.id = n.id;
        canvas.appendChild(el);
        attachNodeEvents(el);
        el._built = null;
      } else {
        existing.delete(n.id);
      }
      el.className = 'node' + (isOperator ? ' operator' : '') + (isAlias ? ' alias' : '') + (isBlockInstance ? ' blockInstance' : '') + (isBlockInstance && n.vertical ? ' vertical' : '') + (isPeriodShift ? ' periodshift' : '') + (isOperator && WORD_OPS.includes(n.text) ? ' wordop' : '');

      if(isBlockInstance){
        renderBlockInstanceBody(el, n);
      } else if(el._built !== n.type){
        if(isOperator){
          el.innerHTML = '<div class="port n" data-side="n"></div><div class="port s" data-side="s"></div><div class="port e" data-side="e"></div><div class="port w" data-side="w"></div><button type="button" class="tag-btn socket-btn" title="Set socket">⚡</button><div class="socket-chip"></div><div class="opsym"></div><div class="op-result"></div>';
        } else if(isPeriodShift){
          el.innerHTML = '<div class="port n" data-side="n"></div><div class="port s" data-side="s"></div><div class="port e" data-side="e"></div><div class="port w" data-side="w"></div><div class="ps-label"></div><div class="op-result"></div>';
        } else if(isAlias){
          el.innerHTML = '<div class="port n" data-side="n"></div><div class="port s" data-side="s"></div><div class="port e" data-side="e"></div><div class="port w" data-side="w"></div><button type="button" class="tag-btn plug-btn" title="Set plug">🔌</button><div class="plug-chip"></div><button type="button" class="tag-btn relink-btn" title="Change linked rectangle">🔗</button><div class="label"><div class="line-name"></div><div class="line-value"></div><div class="line-uom"></div></div><div class="resize-handle"></div>';
        } else {
          el.innerHTML = '<div class="port n" data-side="n"></div><div class="port s" data-side="s"></div><div class="port e" data-side="e"></div><div class="port w" data-side="w"></div><button type="button" class="tag-btn plug-btn" title="Set plug">🔌</button><div class="plug-chip"></div><button type="button" class="tag-btn io-btn" title="Mark as block input/output">⇄</button><div class="io-role-chip"></div><button type="button" class="tag-btn props-btn" title="Format rectangle (number/border/font/fill)">🎨</button><button type="button" class="tag-btn period-btn" title="Choose which periods use this rectangle\'s own number">🕒</button><button type="button" class="tag-btn curve-btn" title="Draw this rectangle\'s value across periods">📈</button><div class="label"><div class="line-name"></div><div class="line-value"></div><div class="line-uom"></div></div><div class="resize-handle"></div>';
        }
        el._built = n.type;
      }

      el.style.left = n.x + 'px';
      el.style.top = n.y + 'px';
      el.style.width = n.w + 'px';
      el.style.height = n.h + 'px';
      el.classList.toggle('selected', selectedNodeIds.has(n.id));

      if(isBlockInstance){
        // content fully handled by renderBlockInstanceBody() above
      } else if(isOperator){
        const sym = el.querySelector('.opsym');
        if(sym) sym.textContent = n.text;
        const chip = el.querySelector('.socket-chip');
        if(chip){
          // More than one plug feeding the socket: their values are added — say so.
          const from = n.socket ? (plugMap || (plugMap = plugSourcesIn(liveCanvasList()))).get(n.socket.trim().toLowerCase()) || [] : [];
          chip.classList.toggle('multi', from.length > 1);
          chip.title = from.length > 1 ? `Fed by ${from.length} plugs, added together: ${from.join(', ')}. If one was added by mistake, remove its plug.` : '';
          if(n.socket){ chip.textContent = '⚡ ' + n.socket + (from.length > 1 ? ' ×' + from.length : ''); chip.style.display = 'block'; }
          else chip.style.display = 'none';
        }
        const res = el.querySelector('.op-result');
        if(res){
          res.classList.remove('show','err');
          res.title = '';
          if(computedValues[n.id] !== undefined && computedValues[n.id] !== null){
            res.textContent = '= ' + formatNum(computedValues[n.id]);
            res.classList.add('show');
          } else if(computeErrors[n.id]){
            res.textContent = '?';
            res.classList.add('show','err');
            res.title = errorTitle(computeErrors[n.id]);
          } else {
            res.textContent = '';
          }
        }
      } else if(isPeriodShift){
        const lab = el.querySelector('.ps-label');
        if(lab) lab.textContent = shiftLabel(typeof n.shift === 'number' ? n.shift : -1);
        const res = el.querySelector('.op-result');
        if(res){
          res.classList.remove('show','err');
          res.title = '';
          if(computedValues[n.id] !== undefined && computedValues[n.id] !== null){
            res.textContent = '= ' + formatNum(computedValues[n.id]);
            res.classList.add('show');
          } else if(computeErrors[n.id]){
            res.textContent = '?';
            res.classList.add('show','err');
            res.title = errorTitle(computeErrors[n.id]);
          } else {
            res.textContent = '';
          }
        }
      } else if(isAlias){
        const chip = el.querySelector('.plug-chip');
        if(chip){
          const plugs = plugsOf(n);
          if(plugs.length){ chip.textContent = '🔌 ' + plugs.join(' · '); chip.style.display = 'block'; }
          else chip.style.display = 'none';
        }
        const lbl = el.querySelector('.label');
        if(lbl){
          const nameEl = lbl.querySelector('.line-name');
          const valEl = lbl.querySelector('.line-value');
          const srcCanvas = canvases.find(c => c.id === n.sourceCanvasId);
          const srcNode = srcCanvas
            ? (srcCanvas.id === activeCanvasId ? nodes : srcCanvas.nodes).find(x => x.id === n.sourceNodeId)
            : null;
          let label;
          if(!n.sourceCanvasId || !n.sourceNodeId) label = '🔗 (not linked)';
          else if(!srcCanvas) label = '🔗 (canvas missing)';
          else if(!srcNode) label = '🔗 (rectangle missing)';
          else {
            const srcName = parseNode(srcNode).name || '(unnamed)';
            label = srcCanvas.id === activeCanvasId ? ('🔗 ' + srcName) : ('🔗 ' + srcCanvas.name + ' ▸ ' + srcName);
          }
          if(nameEl) nameEl.textContent = label;
          const uomEl = lbl.querySelector('.line-uom');
          if(uomEl){
            let uomStr = '', isAuto = false;
            if(srcNode && srcCanvas){
              const auto = nodeUOM(srcCanvas.id, srcNode.id);
              if(auto){ uomStr = formatUOM(auto); isAuto = true; }
            }
            uomEl.textContent = uomStr;
            uomEl.classList.toggle('auto', isAuto);
          }
          if(valEl){
            valEl.classList.remove('literal','computed','error');
            valEl.title = '';
            if(computedValues[n.id] !== undefined && computedValues[n.id] !== null){
              valEl.textContent = '= ' + formatNum(computedValues[n.id]);
              valEl.classList.add('computed');
            } else if(computeErrors[n.id]){
              valEl.textContent = '?';
              valEl.classList.add('error');
              valEl.title = errorTitle(computeErrors[n.id]);
            } else {
              valEl.textContent = '';
            }
          }
        }
      } else {
        const chip = el.querySelector('.plug-chip');
        if(chip){
          const plugs = plugsOf(n);
          if(plugs.length){ chip.textContent = '🔌 ' + plugs.join(' · '); chip.style.display = 'block'; }
          else chip.style.display = 'none';
        }
        const roleChip = el.querySelector('.io-role-chip');
        if(roleChip){
          roleChip.classList.remove('input','output','index');
          if(n.blockRole === 'input'){ roleChip.textContent = '→ IN'; roleChip.classList.add('input'); }
          else if(n.blockRole === 'output'){ roleChip.textContent = 'OUT →'; roleChip.classList.add('output'); }
          else if(n.blockRole === 'index'){ roleChip.textContent = '# IDX'; roleChip.classList.add('index'); }
          else { roleChip.textContent = ''; }
        }
        let reducerChip = el.querySelector('.reducer-chip');
        if(n.blockRole === 'output'){
          if(!reducerChip){
            reducerChip = document.createElement('div');
            reducerChip.className = 'reducer-chip';
            reducerChip.title = "Used only when a Block instance of this canvas is marked Vertical: how this output's per-instance values are combined into one.";
            el.appendChild(reducerChip);
          }
          reducerChip.textContent = 'Σ ' + (n.verticalReducer || 'sum');
          reducerChip.style.display = 'block';
        } else if(reducerChip){
          reducerChip.style.display = 'none';
        }
        const hasIncoming = edges.some(e => e.to === n.id);
        const curveBtn = el.querySelector('.curve-btn');
        if(curveBtn){
          curveBtn.style.display = hasIncoming ? 'none' : '';
          curveBtn.classList.toggle('active', Array.isArray(n.periodValues));
        }
        const lbl = el.querySelector('.label');
        if(lbl && !el.querySelector('textarea')){
          const nameEl = lbl.querySelector('.line-name');
          const valEl = lbl.querySelector('.line-value');
          const uomEl = lbl.querySelector('.line-uom');
          const parsed = parseNode(n);
          const {name} = parsed;
          const literal = effectiveLiteral(n, currentPeriod);
          if(nameEl){ nameEl.textContent = name; nameEl.style.display = name ? '' : 'none'; }
          if(uomEl){
            let uomStr = '', isAuto = false;
            if(parsed.uom){
              uomStr = parsed.uom;
            } else {
              const auto = nodeUOM(activeCanvasId, n.id);
              if(auto){ uomStr = formatUOM(auto); isAuto = true; }
            }
            uomEl.textContent = uomStr;
            uomEl.classList.toggle('auto', isAuto);
          }
          if(valEl){
            valEl.classList.remove('literal','computed','error');
            valEl.title = '';
            if(!hasIncoming){
              // True input: always has a value now — its own number, or zero by default.
              const shown = (literal !== null) ? literal : 0;
              valEl.textContent = (Array.isArray(n.periodValues) ? '📈 ' : '') + formatNumForNode(shown, n);
              valEl.classList.add('literal');
            } else if(computedValues[n.id] !== undefined && computedValues[n.id] !== null){
              valEl.textContent = '= ' + formatNumForNode(computedValues[n.id], n);
              valEl.classList.add('computed');
            } else if(computeErrors[n.id]){
              valEl.textContent = '?';
              valEl.classList.add('error');
              valEl.title = errorTitle(computeErrors[n.id]);
            } else {
              valEl.textContent = '';
            }
          }
        }
        applyNodeStyle(el, n);
      }
    });
    existing.forEach(el => el.remove());

    renderEdges();
    refreshCommandStates();
  }

  function blockPortsOf(defCanvas){
    if(!defCanvas) return { inputs: [], outputs: [], indexNode: null };
    const pool = defCanvas.id === activeCanvasId ? nodes : defCanvas.nodes;
    const inputs = pool.filter(x => x.type === 'value' && x.blockRole === 'input').sort((a,b) => a.x - b.x || a.y - b.y);
    const outputs = pool.filter(x => x.type === 'value' && x.blockRole === 'output').sort((a,b) => a.x - b.x || a.y - b.y);
    // At most one: a rectangle marked as the block's Vertical Index — only meaningful when
    // an instance of this block is used vertically (see computeVerticalBlockInstanceOutput),
    // where it resolves to the current instance's 1-based index instead of being wired in.
    const indexNode = pool.find(x => x.type === 'value' && x.blockRole === 'index') || null;
    return { inputs, outputs, indexNode };
  }

  function renderBlockInstanceBody(el, n){
    const def = canvases.find(c => c.id === n.blockDefCanvasId);
    const { inputs, outputs } = blockPortsOf(def);
    const rows = Math.max(inputs.length, outputs.length, 1);
    const rowH = 20;
    const headerH = 26;
    n.h = headerH + rows * rowH + 8;
    if(!n.w || n.w < 150) n.w = 190;

    el.innerHTML = '';
    const header = document.createElement('div');
    header.className = 'block-header';
    header.textContent = (def ? def.name : '(missing block)') + (n.vertical ? ' ×' + periods.length : '');
    if(n.vertical) header.title = 'Vertical: runs ' + periods.length + ' instances (one per period), reduced into each output.';
    el.appendChild(header);

    const relinkBtn = document.createElement('button');
    relinkBtn.type = 'button';
    relinkBtn.className = 'tag-btn block-relink';
    relinkBtn.title = 'Change block';
    relinkBtn.textContent = '⋯';
    el.appendChild(relinkBtn);

    if(n.vertical){
      const rowsBtn = document.createElement('button');
      rowsBtn.type = 'button';
      rowsBtn.className = 'tag-btn vrows-btn';
      rowsBtn.title = 'View each instance’s own row, not just the combined total';
      rowsBtn.textContent = '▤';
      el.appendChild(rowsBtn);
    }

    const portValsForInstance = portValues[n.id] || [];
    const portErrsForInstance = portErrors[n.id] || [];

    inputs.forEach((inp, i) => {
      const row = document.createElement('div');
      row.className = 'io-row io-row-in';
      row.style.top = (headerH + i * rowH) + 'px';
      const dot = document.createElement('div');
      dot.className = 'io-port';
      dot.dataset.portIndex = i;
      dot.dataset.portDir = 'in';
      const label = document.createElement('span');
      label.className = 'io-label';
      label.textContent = parseNode(inp).name || ('in' + i);
      row.appendChild(dot);
      row.appendChild(label);
      if(n.vertical){
        const inEdge = edges.find(e => e.to === n.id && e.toPort === i);
        const toggle = document.createElement('span');
        toggle.className = 'vindex-toggle' + (inEdge && inEdge.verticalIndexed ? ' on' : '');
        toggle.dataset.portIndex = i;
        toggle.title = inEdge
          ? "Click to switch between 'broadcast' (every instance sees the same value) and 'indexed' (instance i reads this source's value at period i — e.g. a per-period Capex row becoming that vintage's own Capex)."
          : 'Wire an edge into this port first to choose broadcast vs. indexed.';
        toggle.textContent = (inEdge && inEdge.verticalIndexed) ? 'indexed' : 'broadcast';
        row.appendChild(toggle);
      }
      el.appendChild(row);
    });

    outputs.forEach((out, i) => {
      const row = document.createElement('div');
      row.className = 'io-row io-row-out';
      row.style.top = (headerH + i * rowH) + 'px';
      const label = document.createElement('span');
      label.className = 'io-label';
      label.textContent = parseNode(out).name || ('out' + i);
      const valSpan = document.createElement('span');
      valSpan.className = 'io-value';
      const pv = portValsForInstance[i];
      const pe = portErrsForInstance[i];
      if(pv !== undefined && pv !== null){ valSpan.textContent = '=' + formatNum(pv); valSpan.classList.add('computed'); }
      else if(pe){ valSpan.textContent = '?'; valSpan.classList.add('error'); valSpan.title = errorTitle(pe); }
      const dot = document.createElement('div');
      dot.className = 'io-port';
      dot.dataset.portIndex = i;
      dot.dataset.portDir = 'out';
      row.appendChild(label);
      row.appendChild(valSpan);
      row.appendChild(dot);
      el.appendChild(row);
    });
  }

  function rectOf(n){ return {x:n.x, y:n.y, w:n.w, h:n.h, cx:n.x+n.w/2, cy:n.y+n.h/2}; }

  function borderPoint(rect, tx, ty){
    const dx = tx - rect.cx, dy = ty - rect.cy;
    if(dx === 0 && dy === 0) return {x:rect.cx, y:rect.cy};
    const hw = rect.w/2, hh = rect.h/2;
    const scaleX = hw / Math.abs(dx || 1e-6);
    const scaleY = hh / Math.abs(dy || 1e-6);
    const scale = Math.min(scaleX, scaleY);
    return { x: rect.cx + dx*scale, y: rect.cy + dy*scale };
  }

  function edgePath(fromRect, toRect){
    const p1 = borderPoint(fromRect, toRect.cx, toRect.cy);
    const p2 = borderPoint(toRect, fromRect.cx, fromRect.cy);
    return {p1, p2, d:`M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`};
  }

  function getPortCanvasPos(nodeId, portIndex, dir){
    const sel = `.node[data-id="${nodeId}"] .io-port[data-port-index="${portIndex}"][data-port-dir="${dir}"]`;
    const portEl = canvas.querySelector(sel);
    if(!portEl) return null;
    const portRect = portEl.getBoundingClientRect();
    const canvasRect = canvas.getBoundingClientRect();
    return { x: portRect.left + portRect.width/2 - canvasRect.left, y: portRect.top + portRect.height/2 - canvasRect.top };
  }

  function renderEdges(){
    let defs = svg.querySelector('defs');
    if(!defs){
      defs = document.createElementNS(SVGNS,'defs');
      defs.innerHTML =
        '<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#64748b"/></marker>' +
        '<marker id="arrow-sel" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#ef4444"/></marker>' +
        '<marker id="arrow-auto" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8b5cf6"/></marker>';
      svg.appendChild(defs);
    }
    svg.querySelectorAll('g.edge').forEach(g => g.remove());

    edges.forEach(e => {
      const a = getNode(e.from), b = getNode(e.to);
      if(!a || !b) return;
      let {p1, p2, d} = edgePath(rectOf(a), rectOf(b));
      if(e.fromPort != null){
        const pp = getPortCanvasPos(e.from, e.fromPort, 'out');
        if(pp) p1 = pp;
      }
      if(e.toPort != null){
        const pp = getPortCanvasPos(e.to, e.toPort, 'in');
        if(pp) p2 = pp;
      }
      if(e.fromPort != null || e.toPort != null) d = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
      const isSel = selectedEdgeId === e.id;
      const isAuto = !!e.auto;
      const g = document.createElementNS(SVGNS,'g');
      g.setAttribute('class','edge' + (isSel ? ' selected':'') + (isAuto ? ' auto':''));
      g.dataset.id = e.id;
      const marker = isAuto ? 'arrow-auto' : (isSel ? 'arrow-sel' : 'arrow');
      // DOM calls, not a markup string: d is built from node coordinates, which come
      // from files (possibly shared ones) and must never be parsed as markup.
      const hitPath = document.createElementNS(SVGNS, 'path');
      hitPath.setAttribute('class', 'hit'); hitPath.setAttribute('d', d);
      const linePath = document.createElementNS(SVGNS, 'path');
      linePath.setAttribute('class', 'line'); linePath.setAttribute('d', d); linePath.setAttribute('marker-end', `url(#${marker})`);
      g.appendChild(hitPath); g.appendChild(linePath);
      if(isAuto) g.setAttribute('title', 'Auto-connected via plug/socket match');

      if(b.type === 'operator'){
        const siblings = sortedIncoming(b.id);
        if(siblings.length > 1){
          const idx = siblings.findIndex(s => s.id === e.id) + 1;
          const bx = p1.x + (p2.x - p1.x) * 0.78;
          const by = p1.y + (p2.y - p1.y) * 0.78;
          const badge = document.createElementNS(SVGNS,'g');
          badge.setAttribute('class','order-badge');
          const circ = document.createElementNS(SVGNS, 'circle');
          [['cx', bx], ['cy', by], ['r', 8], ['stroke', isSel ? '#ef4444' : (isAuto ? '#8b5cf6' : '#94a3b8')], ['stroke-width', 1.5]].forEach(([k, v]) => circ.setAttribute(k, v));
          const txt = document.createElementNS(SVGNS, 'text');
          [['x', bx], ['y', by + 3.5], ['text-anchor', 'middle'], ['font-size', 10], ['fill', '#334155']].forEach(([k, v]) => txt.setAttribute(k, v));
          txt.textContent = String(idx);
          badge.appendChild(circ); badge.appendChild(txt);
          g.appendChild(badge);
        }
      }

      if(!isAuto){
        g.addEventListener('mousedown', (ev) => { ev.stopPropagation(); selectEdgeOnly(e.id); });
      }
      svg.appendChild(g);
    });
  }

  // ---------- node interaction ----------
  function attachNodeEvents(el){
    el.addEventListener('contextmenu', (ev) => { ev.preventDefault(); });
    el.addEventListener('mousedown', (ev) => {
      const id = el.dataset.id;
      if(ev.target.classList.contains('tag-btn')){ ev.stopPropagation(); ev.preventDefault(); return; }
      if(ev.target.classList.contains('io-port')){
        ev.stopPropagation(); ev.preventDefault();
        if(ev.target.dataset.portDir === 'out'){
          startConnection(id, ev, parseInt(ev.target.dataset.portIndex, 10));
        }
        return;
      }
      if(ev.target.classList.contains('port')){ startConnection(id, ev); return; }
      if(ev.target.classList.contains('resize-handle')){ startResize(id, ev); return; }
      if(ev.target.tagName === 'TEXTAREA') return;

      // Right mouse button, anywhere on the node body: draw an arrow, same as
      // dragging from one of the N/S/E/W port dots but without needing to hit
      // the small port hitbox. Works from any node type onto any node type.
      if(ev.button === 2){
        ev.stopPropagation();
        ev.preventDefault();
        startConnection(id, ev);
        return;
      }

      // Alt+drag: spin off an alias of the dragged rectangle(s) instead of moving
      // them. Only plain value rectangles can be aliased (matches the Alias
      // picker's own rule), so alt+dragging anything else — an operator, an
      // existing alias, a block instance, a period-shift node, or a selection
      // that mixes those in — is a no-op: nothing moves, nothing is created.
      // Shift+alt+drag restricts the alias drag to one axis, same convention
      // as plain shift-drag restricting a normal move.
      if(ev.altKey){
        ev.stopPropagation();
        startAliasDragInit(id, ev);
        return;
      }

      if(ev.shiftKey || ev.ctrlKey || ev.metaKey){
        ev.stopPropagation();
        startModifiedInteraction(id, ev);
        return;
      }
      if(!selectedNodeIds.has(id) || selectedEdgeId){
        selectNodesOnly([id]);
      }
      startDrag(id, ev);
    });
    el.addEventListener('click', (ev) => {
      const n = getNode(el.dataset.id);
      if(!n) return;
      if(ev.target.classList.contains('plug-btn')){ showTagEditor(n, 'plug'); }
      if(ev.target.classList.contains('socket-btn')){ showTagEditor(n, 'socket'); }
      if(ev.target.classList.contains('relink-btn')){
        if(n.auto) showMessage("This alias was auto-created by a Plug/Socket match on another canvas. It regenerates automatically — to change it, edit the Plug or Socket name instead.");
        else showAliasPicker(n);
      }
      if(ev.target.classList.contains('io-btn')){ showRolePicker(n); }
      if(ev.target.classList.contains('block-relink')){ showBlockPicker(n); }
      if(ev.target.classList.contains('vrows-btn')){ showVerticalInstancesViewer(n); }
      if(ev.target.classList.contains('props-btn')){ showPropertiesEditor(n); }
      if(ev.target.classList.contains('period-btn')){ showLiteralPeriodsPicker(n); }
      if(ev.target.classList.contains('curve-btn')){ showPeriodValuesEditor(n); }
      if(ev.target.classList.contains('reducer-chip')){
        const order = REDUCERS;
        const cur = order.includes(n.verticalReducer) ? n.verticalReducer : 'sum';
        guarded(() => fm.setReducer(n.id, order[(order.indexOf(cur) + 1) % order.length]));
      }
      if(ev.target.classList.contains('vindex-toggle')){
        const portIdx = parseInt(ev.target.dataset.portIndex, 10);
        const inEdge = edges.find(e => e.to === n.id && e.toPort === portIdx);
        if(inEdge) guarded(() => fm.setPortMode(n.id, String(portIdx + 1), !inEdge.verticalIndexed));
      }
    });
    el.addEventListener('dblclick', (ev) => {
      if(ev.target.tagName === 'TEXTAREA') return;
      const n = getNode(el.dataset.id);
      if(!n) return;
      if(n.type === 'operator') showOpPicker(n.id);
      else if(n.type === 'periodShift') showShiftPicker(n);
      else if(n.type === 'alias'){
        if(n.auto) showMessage("This alias was auto-created by a Plug/Socket match on another canvas. It regenerates automatically — to change it, edit the Plug or Socket name instead.");
        else showAliasPicker(n);
      }
      else if(n.type === 'blockInstance') showBlockPicker(n);
      else startEdit(n.id);
    });
  }

  function computeSnap(movingNode, x, y, excludeIds){
    const w = movingNode.w, h = movingNode.h;
    const others = nodes.filter(n => !excludeIds.includes(n.id));
    let bestX = x, bestXDist = SNAP_THRESHOLD, guideX = null;
    let bestY = y, bestYDist = SNAP_THRESHOLD, guideY = null;
    const me = { left:x, right:x+w, centerX:x+w/2 };
    const meY = { top:y, bottom:y+h, centerY:y+h/2 };

    others.forEach(o => {
      const oe = { left:o.x, right:o.x+o.w, centerX:o.x+o.w/2 };
      const oeY = { top:o.y, bottom:o.y+o.h, centerY:o.y+o.h/2 };
      ['left','right','centerX'].forEach(k => {
        const dist = Math.abs(me[k]-oe[k]);
        if(dist < bestXDist){
          bestXDist = dist;
          bestX = k==='left' ? oe[k] : (k==='right' ? oe[k]-w : oe[k]-w/2);
          guideX = oe[k];
        }
      });
      ['top','bottom','centerY'].forEach(k => {
        const dist = Math.abs(meY[k]-oeY[k]);
        if(dist < bestYDist){
          bestYDist = dist;
          bestY = k==='top' ? oeY[k] : (k==='bottom' ? oeY[k]-h : oeY[k]-h/2);
          guideY = oeY[k];
        }
      });
    });
    return { x: Math.max(0,bestX), y: Math.max(0,bestY), guideX, guideY };
  }

  function updateGuides(gx, gy){
    if(gx !== null){ guideV.style.left = gx+'px'; guideV.classList.add('show'); } else guideV.classList.remove('show');
    if(gy !== null){ guideH.style.top = gy+'px'; guideH.classList.add('show'); } else guideH.classList.remove('show');
  }
  function hideGuides(){ guideV.classList.remove('show'); guideH.classList.remove('show'); }

  function startModifiedInteraction(id, downEvent){
    const startX = downEvent.clientX, startY = downEvent.clientY;
    let committed = false;

    function onMove(ev){
      if(committed) return;
      const dist = Math.hypot(ev.clientX - startX, ev.clientY - startY);
      if(dist > 3){
        committed = true;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if(!selectedNodeIds.has(id) || selectedEdgeId){
          selectNodesOnly([id]);
        }
        startDrag(id, downEvent);
      }
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if(!committed) toggleNodeSelection(id);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  function startDrag(id, downEvent){
    downEvent.preventDefault();
    let workingIds = selectedNodeIds.size ? Array.from(selectedNodeIds) : [id];
    let workingStartPositions = {};
    workingIds.forEach(nid => { const nd = getNode(nid); if(nd) workingStartPositions[nid] = {x:nd.x, y:nd.y}; });
    let workingPrimaryId = id;
    let workingPrimaryStart = workingStartPositions[id] || (() => { const p = getNode(id); return {x:p.x, y:p.y}; })();
    const startX = downEvent.clientX, startY = downEvent.clientY;
    document.body.classList.add('dragging');
    let historyPushed = false;
    let duplicated = false;
    const originalIds = workingIds.slice();
    // references are taken before anything changes (a duplicate would make names ambiguous)
    const originalRefs = recorder.active ? recorder.refsOf(originalIds.map(getNode).filter(Boolean)) : null;

    function onMove(ev){
      if(!historyPushed){ pushHistory(); historyPushed = true; }

      if(!duplicated && (ev.ctrlKey || ev.metaKey)){
        duplicated = true;
        const idMap = {};
        const clones = workingIds.map(nid => {
          const orig = getNode(nid);
          const newId = uid('n');
          idMap[nid] = newId;
          return Object.assign({}, orig, { id: newId });
        });
        const clonedEdges = edges
          .filter(e => !e.auto && idMap[e.from] !== undefined && idMap[e.to] !== undefined)
          .map(e => Object.assign({}, e, { id: uid('e'), from: idMap[e.from], to: idMap[e.to] }));
        nodes = nodes.concat(clones);
        edges = edges.concat(clonedEdges);

        const newStart = {};
        workingIds.forEach(oldId => { newStart[idMap[oldId]] = { x: workingStartPositions[oldId].x, y: workingStartPositions[oldId].y }; });
        workingIds = workingIds.map(oldId => idMap[oldId]);
        workingStartPositions = newStart;
        workingPrimaryId = idMap[workingPrimaryId];
        workingPrimaryStart = newStart[workingPrimaryId];
        selectedNodeIds = new Set(workingIds);
      }

      let dx = ev.clientX - startX, dy = ev.clientY - startY;
      if(ev.shiftKey){
        if(Math.abs(dx) >= Math.abs(dy)) dy = 0; else dx = 0;
      }
      const tentX = Math.max(0, workingPrimaryStart.x + dx);
      const tentY = Math.max(0, workingPrimaryStart.y + dy);
      const workingPrimaryNode = getNode(workingPrimaryId);
      const snap = computeSnap(workingPrimaryNode, tentX, tentY, workingIds);
      const appliedDX = snap.x - workingPrimaryStart.x;
      const appliedDY = snap.y - workingPrimaryStart.y;
      workingIds.forEach(nid => {
        const nd = getNode(nid), sp = workingStartPositions[nid];
        if(!nd || !sp) return;
        nd.x = Math.max(0, sp.x + appliedDX);
        nd.y = Math.max(0, sp.y + appliedDY);
      });
      updateGuides(snap.guideX, snap.guideY);
      render();
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('dragging');
      hideGuides();
      if(duplicated){ syncAutoConnections(); clearComputed(); render(); }
      if(historyPushed && recorder.active){
        const pn = getNode(workingPrimaryId);
        const dx = pn ? pn.x - workingPrimaryStart.x : 0, dy = pn ? pn.y - workingPrimaryStart.y : 0;
        if(duplicated && originalRefs) recorder.push('duplicate', { nodes: originalRefs, dx, dy }, workingIds.slice());
        else if(dx || dy) recorder.add('move', { nodes: workingIds.map(getNode).filter(Boolean), dx, dy });
      }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  // Alt+drag: gatekeeper. Resolves which nodes would be dragged (mirrors the
  // "click an unselected node -> select just it" rule startDrag itself uses),
  // and refuses to do anything at all — no selection change, no drag, no
  // alias — unless every one of them is a plain value rectangle.
  function startAliasDragInit(id, downEvent){
    const prospectiveIds = (selectedNodeIds.has(id) && !selectedEdgeId) ? Array.from(selectedNodeIds) : [id];
    const allRects = prospectiveIds.length > 0 && prospectiveIds.every(nid => { const nd = getNode(nid); return nd && nd.type === 'value'; });
    if(!allRects){ downEvent.preventDefault(); return; }
    if(!selectedNodeIds.has(id) || selectedEdgeId){
      selectNodesOnly([id]);
    }
    startAliasDrag(prospectiveIds, downEvent);
  }

  // Creates one alias per source rectangle (sourceCanvasId is always the active
  // canvas, since we're dragging nodes that live on it) the first time the mouse
  // actually moves, then drags those new alias nodes — snap-to-align and all —
  // exactly like a normal node drag, leaving the source rectangles untouched.
  // A plain alt+click with no movement creates nothing.
  function startAliasDrag(sourceIds, downEvent){
    downEvent.preventDefault();
    const sourceNodes = sourceIds.map(getNode).filter(Boolean);
    if(sourceNodes.length === 0) return;
    const startX = downEvent.clientX, startY = downEvent.clientY;
    let created = false;
    let historyPushed = false;
    let aliasIds = [];
    let aliasStartPositions = {};
    let primaryId = null;

    function createAliases(){
      if(!historyPushed){ pushHistory(); historyPushed = true; }
      const newNodes = sourceNodes.map(sn => ({
        id: uid('n'), type:'alias', x: sn.x, y: sn.y, w: sn.w, h: sn.h,
        sourceCanvasId: activeCanvasId, sourceNodeId: sn.id, plugs:[]
      }));
      nodes = nodes.concat(newNodes);
      aliasIds = newNodes.map(n => n.id);
      newNodes.forEach(n => { aliasStartPositions[n.id] = { x:n.x, y:n.y }; });
      primaryId = aliasIds[0];
      selectNodesOnly(aliasIds);
      created = true;
    }

    function onMove(ev){
      if(!created) createAliases();
      let dx = ev.clientX - startX, dy = ev.clientY - startY;
      if(ev.shiftKey){
        if(Math.abs(dx) >= Math.abs(dy)) dy = 0; else dx = 0;
      }
      const primaryStart = aliasStartPositions[primaryId];
      const primaryNode = getNode(primaryId);
      const tentX = Math.max(0, primaryStart.x + dx);
      const tentY = Math.max(0, primaryStart.y + dy);
      const snap = computeSnap(primaryNode, tentX, tentY, aliasIds);
      const appliedDX = snap.x - primaryStart.x;
      const appliedDY = snap.y - primaryStart.y;
      aliasIds.forEach(nid => {
        const nd = getNode(nid), sp = aliasStartPositions[nid];
        if(!nd || !sp) return;
        nd.x = Math.max(0, sp.x + appliedDX);
        nd.y = Math.max(0, sp.y + appliedDY);
      });
      updateGuides(snap.guideX, snap.guideY);
      render();
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('dragging');
      hideGuides();
      if(created){
        clearComputed(); render(); evaluateAll();
        if(recorder.active){
          const pn = getNode(primaryId), ps = aliasStartPositions[primaryId];
          recorder.add('aliasOf', { nodes: sourceNodes.filter(n => nodes.includes(n)), dx: pn.x - ps.x, dy: pn.y - ps.y }, aliasIds.slice());
        }
      }
    }
    document.body.classList.add('dragging');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  function startResize(id, downEvent){
    downEvent.preventDefault();
    downEvent.stopPropagation();
    selectNodesOnly([id]);
    const n = getNode(id);
    const startX = downEvent.clientX, startY = downEvent.clientY;
    const origW = n.w, origH = n.h;
    document.body.classList.add('dragging');
    let historyPushed = false;

    function onMove(ev){
      if(!historyPushed){ pushHistory(); historyPushed = true; }
      n.w = Math.max(80, origW + (ev.clientX - startX));
      n.h = Math.max(44, origH + (ev.clientY - startY));
      render();
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('dragging');
      if(historyPushed && recorder.active) recorder.add('resize', { node: n, w: n.w, h: n.h });

  function startEdit(id, selectAll){
    const n = getNode(id);
    const el = canvas.querySelector(`.node[data-id="${id}"]`);
    if(!el) return;
    const lbl = el.querySelector('.label');
    if(!lbl) return;
    const ta = document.createElement('textarea');
    ta.value = n.text;
    ta.title = 'Line 1: name · Line 2: value · Line 3: unit of measure, e.g. "kt" or "$/t" (optional). Shift+Enter for a new line.';
    lbl.replaceWith(ta);
    ta.focus();
    if(selectAll) ta.select();

    function commit(){
      const newText = ta.value.trim() || 'Untitled';
      const newLbl = document.createElement('div');
      newLbl.className = 'label';
      newLbl.innerHTML = '<div class="line-name"></div><div class="line-value"></div><div class="line-uom"></div>';
      if(ta.parentNode) ta.replaceWith(newLbl);
      if(newText !== n.text && nodes.includes(n)) guarded(() => fm.setText(n.id, newText));
      clearComputed();
      render();
    }
    ta.addEventListener('blur', commit);
    ta.addEventListener('keydown', (ev) => {
      if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); ta.blur(); }
      if(ev.key === 'Escape'){ ta.value = n.text; ta.blur(); }
    });
  }
