    nameIn.addEventListener('input', () => { m.name = nameIn.value; mbChanged(); });
    nameIn.addEventListener('change', () => { if(!m.name.trim()) m.name = 'Untitled macro'; nameIn.value = m.name; syncMacroCommands(); renderMBList(); });
    const descIn = el('input'); descIn.type = 'text'; descIn.value = m.description || ''; descIn.placeholder = 'Description (optional)'; descIn.style.flex = '1'; descIn.style.minWidth = '160px';
    descIn.addEventListener('input', () => { m.description = descIn.value; mbChanged(); });
    const relLab = el('label'); const relCb = el('input'); relCb.type = 'checkbox'; relCb.checked = !!m.relative;
    relLab.appendChild(relCb); relLab.appendChild(document.createTextNode('Relative positions'));
    relLab.title = 'When ticked, x/y arguments are offsets from the top-left of the selection when the macro runs (or from the centre of the view if nothing is selected), so the same macro can build its shapes anywhere.';
    relCb.addEventListener('change', () => { m.relative = relCb.checked; mbChanged(); });
    const pinLab = el('label'); const pinCb = el('input'); pinCb.type = 'checkbox'; pinCb.checked = !!m.pinned;
    pinLab.appendChild(pinCb); pinLab.appendChild(document.createTextNode('Show on Ribbon'));
    pinLab.title = 'Adds a button for this macro to Macros › My Macros on the Ribbon';
    pinCb.addEventListener('change', () => { m.pinned = pinCb.checked; syncMacroCommands(); renderMBList(); mbChanged(); });
    const sc = shortcutBindings['macro:' + m.id];
    const scLab = el('span', '', sc ? `Shortcut: ${prettyCombo(sc)}` : 'No shortcut');
    scLab.style.cssText = 'font-size:11px; color:#6b7280;';

    main.appendChild(meta);

    const tools = el('div', 'macro-tools');
    const tb = (label, title, fn) => { const b = el('button', 'mbtn', label); b.title = title; b.addEventListener('click', fn); tools.appendChild(b); return b; };
    tb('+ Action', 'Add a step that runs one fmIDE action', () => mbInsert({ kind:'action', action:'createRect', args:{} }));
    tb('+ Group', 'Add a group to organise steps', () => mbInsert({ kind:'group', label:'Group', children:[] }));
    tb('+ Repeat', 'Repeat the steps inside N times ($i = 1…N)', () => mbInsert({ kind:'repeat', count:'3', var:'i', children:[] }));
    tb('+ For each', 'Run the steps inside once per node ($item = its id)', () => mbInsert({ kind:'forEach', nodes:'@sel', var:'item', children:[] }));
    tb('+ Set var', 'Set a variable, e.g. $x = 100 + $i*80', () => mbInsert({ kind:'set', var:'x', value:'0' }));
    tb('+ Comment', 'A note; does nothing', () => mbInsert({ kind:'comment', text:'' }));
    const sep = el('span', ''); sep.style.cssText = 'width:1px; background:#e5e7eb; margin:0 4px;'; tools.appendChild(sep);
    tb('↑', 'Move up (Alt+↑)', () => mbMove(-1));
    tb('↓', 'Move down (Alt+↓)', () => mbMove(1));
    tb('→', 'Indent into the group/loop above (Alt+→)', () => mbIndent());
    tb('←', 'Move out of the group/loop (Alt+←)', () => mbOutdent());
    tb('⧉', `Duplicate (${prettyCombo('Mod+D')})`, () => mbDuplicate());
    tb('⊘', 'Enable / disable', () => mbToggleDisabled());

    main.appendChild(tools);

    const split = el('div', 'macro-split');

    tree.addEventListener('keydown', mbTreeKey);

    split.appendChild(tree); split.appendChild(props);
    main.appendChild(split);
    mb.els.tree = tree; mb.els.props = props;
    renderMBTree();
    renderMBProps();
  }

  function renderMBTree(){
    const tree = mb.els.tree;
    const m = mbMacro();
    if(!tree || !m) return;
    const scroll = tree.scrollTop;
    tree.innerHTML = '';
    if(m.steps.length === 0){
      tree.appendChild(el('div', 'macro-empty', 'This macro has no steps yet.\n\nUse “+ Action” to add steps (e.g. createRect, connect, setValue), or “⏺ Record into this macro” and just use the canvas — every action becomes a step.'));
      tree.firstChild.style.whiteSpace = 'pre-wrap';
      return;
    }
    const icons = { action:'▸', group:'▣', repeat:'↻', forEach:'∀', set:'𝑥', comment:'#' };
    function rows(steps, depth){
      steps.forEach(st => {
        const r = el('div', 'mrow' + (st.id === mb.selStepId ? ' sel' : '') + (st.disabled ? ' disabled' : '') + (st.id === mb.errorStepId ? ' err' : ''));
        r.style.paddingLeft = (8 + depth * 18) + 'px';
        r.dataset.id = st.id;
        r.draggable = true;
        const isC = CONTAINER_KINDS.has(st.kind);
        const tw = el('span', 'mtw', isC ? (mb.collapsed.has(st.id) ? '▸' : '▾') : '');
        if(isC) tw.addEventListener('click', ev => { ev.stopPropagation(); if(mb.collapsed.has(st.id)) mb.collapsed.delete(st.id); else mb.collapsed.add(st.id); renderMBTree(); });
        r.appendChild(tw);
        const def = st.kind === 'action' ? ACTIONS[st.action] : null;
        r.appendChild(el('span', 'mki', st.kind === 'action' ? (def && def.icon || '▸') : icons[st.kind]));
        r.appendChild(stepSummaryDom(st));
        r.addEventListener('click', () => { mb.selStepId = st.id; renderMBTree(); renderMBProps(); tree.focus(); });
        r.addEventListener('dragstart', ev => { mb.dragId = st.id; ev.dataTransfer.effectAllowed = 'move'; try{ ev.dataTransfer.setData('text/plain', st.id); }catch(err){} });
        r.addEventListener('dragover', ev => {
          if(!mb.dragId || mb.dragId === st.id) return;
          ev.preventDefault();
          const rect = r.getBoundingClientRect();
          const t = (ev.clientY - rect.top) / rect.height;
          const zone = isC && t > 0.3 && t < 0.7 ? 'inside' : (t < 0.5 ? 'before' : 'after');
          r.classList.remove('drop-before', 'drop-after', 'drop-inside');
          r.classList.add('drop-' + zone);
          r.dataset.zone = zone;
        });
        r.addEventListener('dragleave', () => r.classList.remove('drop-before', 'drop-after', 'drop-inside'));
        r.addEventListener('drop', ev => {
          ev.preventDefault();
          r.classList.remove('drop-before', 'drop-after', 'drop-inside');
          mbDropOn(st.id, r.dataset.zone || 'after');
        });
        r.addEventListener('dragend', () => { mb.dragId = null; });
        tree.appendChild(r);
        if(isC && !mb.collapsed.has(st.id)) rows(st.children || [], depth + 1);
      });
    }
    rows(m.steps, 0);
    tree.scrollTop = scroll;
  }

  function stepSummaryDom(st){
    const span = el('span', 'msum');
    if(st.kind === 'action'){
      span.appendChild(el('span', 'act', st.action));
      Object.keys(st.args || {}).forEach(k => { span.appendChild(document.createTextNode(' ')); span.appendChild(el('span', 'arg', k + '=' + fmtArg(st.args[k]))); });
      if(st.assign){ span.appendChild(document.createTextNode('  ')); span.appendChild(el('span', 'asg', '→ $' + st.assign)); }
    } else {
      span.appendChild(document.createTextNode(stepSummaryText(st)));
    }
    if(st.comment){ span.appendChild(document.createTextNode('  ')); span.appendChild(el('span', 'cmt', '# ' + st.comment)); }
    return span;
  }

  function mbVarNames(){
    const m = mbMacro();
    const names = new Set();
    if(m) walkSteps(m.steps, st => {
      if(st.assign) names.add(st.assign);
      if(st.kind === 'set' && st.var) names.add(st.var);
      if(st.kind === 'repeat') names.add(st.var || 'i');
      if(st.kind === 'forEach'){ names.add(st.var || 'item'); names.add((st.var || 'item') + 'Index'); }
    });
    return Array.from(names);
  }

  function refreshMBRow(st){
    const tree = mb.els.tree;
    if(!tree) return;
    const row = tree.querySelector(`.mrow[data-id="${st.id}"]`);
    if(row){ const old = row.querySelector('.msum'); if(old) old.replaceWith(stepSummaryDom(st)); row.classList.toggle('disabled', !!st.disabled); }
  }

  function renderMBProps(){
    const props = mb.els.props;
    const m = mbMacro();
    if(!props || !m) return;
    props.innerHTML = '';
    const f = mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f){
      props.appendChild(el('h5', '', 'Step properties'));
      props.appendChild(el('p', 'pdesc', 'Select a step to edit it. Drag steps to reorder or drop them into groups and loops.'));
      props.appendChild(refHelp());
      return;
    }
    const st = f.step;
    const changed = () => { refreshMBRow(st); mbChanged(); mb.errorStepId = null; };
    const row = (label, input) => { const r = el('div', 'pform-row'); r.appendChild(el('label', '', label)); r.appendChild(input); props.appendChild(r); return input; };
    const textIn = (val, ph) => { const i = el('input'); i.type = 'text'; i.value = val == null ? '' : String(val); if(ph) i.placeholder = ph; i.addEventListener('keydown', ev => ev.stopPropagation()); return i; };

    if(st.kind === 'action'){
      props.appendChild(el('h5', '', 'Action step'));
      const sel = el('select');
      const cats = {};
      ACTION_LIST.filter(d => d.name !== 'getValue' || true).forEach(d => { (cats[d.category] = cats[d.category] || []).push(d); });
      Object.keys(cats).sort((a, b) => (ACTION_CATEGORY_ORDER.indexOf(a) + 100) % 100 - (ACTION_CATEGORY_ORDER.indexOf(b) + 100) % 100).forEach(cat => {
        const og = el('optgroup'); og.label = cat;
        cats[cat].forEach(d => { const o = el('option', '', `${d.label}  (${d.name})`); o.value = d.name; og.appendChild(o); });
        sel.appendChild(og);
      });
      sel.value = st.action;
      row('Action', sel);
      sel.addEventListener('change', () => {
        const d2 = ACTIONS[sel.value];
        const keep = {};
        d2.params.forEach(p => { if(st.args && p.name in st.args) keep[p.name] = st.args[p.name]; });
        st.action = sel.value; st.args = keep;
        if(!d2.returns) delete st.assign;
        changed(); renderMBProps();
      });
      const def = ACTIONS[st.action];
      if(!def){ props.appendChild(el('p', 'pdesc', `Unknown action "${st.action}".`)); return; }
      if(def.desc) props.appendChild(el('p', 'pdesc', def.desc));
      const pf = buildParamForm(def.params, st.args || {}, {
        vars: mbVarNames(),
        onChange: (name, raw) => {
          st.args = st.args || {};
          if(raw === '' || (Array.isArray(raw) && !raw.length)) delete st.args[name]; else st.args[name] = raw;
          changed();
        }
      });
      props.appendChild(pf.el);
      if(def.returns && def.returns !== 'edge'){
        const asg = row('Save result as $', textIn(st.assign, def.returns === 'nodes' ? 'e.g. copies' : 'e.g. rev'));
        asg.addEventListener('input', () => { const v = asg.value.trim().replace(/^\$/, ''); if(v && /^[A-Za-z_]\w*$/.test(v)) st.assign = v; else delete st.assign; changed(); });
      }
    } else if(st.kind === 'group'){
      props.appendChild(el('h5', '', 'Group'));
      const i = row('Label', textIn(st.label));
      i.addEventListener('input', () => { st.label = i.value; changed(); });
    } else if(st.kind === 'repeat'){
      props.appendChild(el('h5', '', 'Repeat'));
      props.appendChild(el('p', 'pdesc', 'Runs the steps inside N times. The loop variable counts 1, 2, … N — use it in arguments, e.g. y = 100 + $i*90, or name = Line ${i}.'));
      const c = row('Times', textIn(st.count, 'e.g. 5 or $periods'));
      c.addEventListener('input', () => { st.count = c.value; changed(); });
      const v = row('Variable', textIn(st.var, 'i'));
      v.addEventListener('input', () => { st.var = v.value.trim().replace(/^\$/, '') || 'i'; changed(); });
    } else if(st.kind === 'forEach'){
      props.appendChild(el('h5', '', 'For each node'));
      props.appendChild(el('p', 'pdesc', 'Runs the steps inside once per node. The variable holds that node (use it as $item in node fields); $itemIndex counts 1, 2, …'));
      const n = row('Nodes', textIn(st.nodes, '@sel'));
      n.addEventListener('input', () => { st.nodes = n.value; changed(); });
      const v = row('Variable', textIn(st.var, 'item'));
      v.addEventListener('input', () => { st.var = v.value.trim().replace(/^\$/, '') || 'item'; changed(); });
    } else if(st.kind === 'set'){
      props.appendChild(el('h5', '', 'Set variable'));
      props.appendChild(el('p', 'pdesc', 'A number expression (100 + $i*80), another variable ($r1), or text (${name} inserts a variable).'));
      const v = row('Variable', textIn(st.var, 'x'));
      v.addEventListener('input', () => { st.var = v.value.trim().replace(/^\$/, '') || 'x'; changed(); });
      const val = row('Value', textIn(st.value));
      val.addEventListener('input', () => { st.value = val.value; changed(); });
    } else if(st.kind === 'comment'){
      props.appendChild(el('h5', '', 'Comment'));
      const t = el('textarea'); t.value = st.text || ''; t.addEventListener('keydown', ev => ev.stopPropagation());
      row('Text', t);
      t.addEventListener('input', () => { st.text = t.value; changed(); });
    }
    if(st.kind !== 'comment'){
      const note = row('Note', textIn(st.comment, 'optional comment'));
      note.addEventListener('input', () => { st.comment = note.value; if(!st.comment) delete st.comment; changed(); });
    }
    const enLab = el('label', '');
    enLab.style.cssText = 'display:flex; align-items:center; gap:6px; font-size:12px; color:#374151; margin:6px 0;';
    const enCb = el('input'); enCb.type = 'checkbox'; enCb.checked = !st.disabled;
    enLab.appendChild(enCb); enLab.appendChild(document.createTextNode('Step enabled'));
    enCb.addEventListener('change', () => { if(enCb.checked) delete st.disabled; else st.disabled = true; changed(); });
    props.appendChild(enLab);
    props.appendChild(refHelp());
  }

  function refHelp(){
    const h = el('div', 'macro-ref-help');
    const add = (code, text) => { const line = el('div'); line.appendChild(el('code', '', code)); line.appendChild(document.createTextNode(' ' + text)); h.appendChild(line); };
    h.appendChild(el('div', '', 'Referring to nodes:'));
    add('Revenue', 'a rectangle by name (aliases/blocks by the name they show)');
    add('@sel  @sel[0]', 'the selection when the macro started');
    add('@cur  @all', 'the live selection · every node on the canvas');
    add('$r1  $r1[0]', 'a node saved by an earlier step');
    add('#n12', 'a node by id');

    h.appendChild(el('div', '', 'Numbers accept expressions: 100 + $i*80, $periods, round($x/2).'));
    return h;
  }

  // ----- tree editing operations -----
  function mbInsert(step){
    const m = mbMacro(); if(!m) return;
    step.id = newStepId();
    const f = mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f) m.steps.push(step);
    else if(CONTAINER_KINDS.has(f.step.kind) && !mb.collapsed.has(f.step.id)){ f.step.children = f.step.children || []; f.step.children.push(step); }
    else f.arr.splice(f.index + 1, 0, step);
    mb.selStepId = step.id;
    renderMBTree(); renderMBProps(); renderMBList(); mbChanged();
  }
  function mbMove(dir){
    const m = mbMacro(); const f = m && mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f) return;
    const j = f.index + dir;
    if(j < 0 || j >= f.arr.length) return;
    f.arr.splice(f.index, 1); f.arr.splice(j, 0, f.step);
    renderMBTree(); mbChanged();
  }
  function mbIndent(){
    const m = mbMacro(); const f = m && mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f || f.index === 0) return;
    const prev = f.arr[f.index - 1];
    if(!CONTAINER_KINDS.has(prev.kind)) return;
    f.arr.splice(f.index, 1);
    prev.children = prev.children || [];
    prev.children.push(f.step);
    mb.collapsed.delete(prev.id);
    renderMBTree(); mbChanged();
  }
  function mbOutdent(){
    const m = mbMacro(); const f = m && mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f || !f.parent) return;
    const pf = findStep(m.steps, f.parent.id);
    f.arr.splice(f.index, 1);
    pf.arr.splice(pf.index + 1, 0, f.step);
    renderMBTree(); mbChanged();
  }
  function mbDuplicate(){
    const m = mbMacro(); const f = m && mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f) return;
    const copy = normalizeSteps([cloneData(f.step)])[0];
    delete copy.assign;
    f.arr.splice(f.index + 1, 0, copy);
    mb.selStepId = copy.id;
    renderMBTree(); renderMBProps(); renderMBList(); mbChanged();
  }
  function mbToggleDisabled(){
    const m = mbMacro(); const f = m && mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f) return;
    if(f.step.disabled) delete f.step.disabled; else f.step.disabled = true;
    renderMBTree(); renderMBProps(); mbChanged();
  }
  function mbDelete(){
    const m = mbMacro(); const f = m && mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f) return;
    f.arr.splice(f.index, 1);
    const next = f.arr[f.index] || f.arr[f.index - 1] || f.parent;
    mb.selStepId = next ? next.id : null;
    renderMBTree(); renderMBProps(); renderMBList(); mbChanged();
  }
  function mbDropOn(targetId, zone){
    const m = mbMacro(); if(!m || !mb.dragId) return;
    const src = findStep(m.steps, mb.dragId);
    const dst = findStep(m.steps, targetId);
    mb.dragId = null;
    if(!src || !dst) return;
    let inside = false;
    walkSteps([src.step], st => { if(st.id === targetId) inside = true; });
    if(inside) return; // can't drop a step into itself
    src.arr.splice(src.index, 1);
    const d2 = findStep(m.steps, targetId);
    if(zone === 'inside'){ d2.step.children = d2.step.children || []; d2.step.children.push(src.step); mb.collapsed.delete(d2.step.id); }
    else d2.arr.splice(d2.index + (zone === 'after' ? 1 : 0), 0, src.step);
    mb.selStepId = src.step.id;
    renderMBTree(); renderMBProps(); mbChanged();
  }
  function mbTreeKey(ev){
    const m = mbMacro(); if(!m) return;
    const flat = [];
    walkSteps(m.steps, (st, arr, i, parent) => {
      let hidden = false, p = parent;
      while(p){ if(mb.collapsed.has(p.id)) hidden = true; const pf = findStep(m.steps, p.id); p = pf ? pf.parent : null; }
      if(!hidden) flat.push(st);
    });
    const k = flat.findIndex(s => s.id === mb.selStepId);
    if(ev.altKey && ev.key === 'ArrowUp'){ ev.preventDefault(); mbMove(-1); return; }
    if(ev.altKey && ev.key === 'ArrowDown'){ ev.preventDefault(); mbMove(1); return; }
    if(ev.altKey && ev.key === 'ArrowRight'){ ev.preventDefault(); mbIndent(); return; }
    if(ev.altKey && ev.key === 'ArrowLeft'){ ev.preventDefault(); mbOutdent(); return; }
    if(ev.key === 'ArrowDown'){ ev.preventDefault(); if(flat[k + 1]){ mb.selStepId = flat[k + 1].id; renderMBTree(); renderMBProps(); } return; }
    if(ev.key === 'ArrowUp'){ ev.preventDefault(); if(k > 0){ mb.selStepId = flat[k - 1].id; renderMBTree(); renderMBProps(); } return; }
    if(ev.key === 'Delete' || ev.key === 'Backspace'){ ev.preventDefault(); ev.stopPropagation(); mbDelete(); return; }
    if(normalizeCombo(ev) === 'Mod+D'){ ev.preventDefault(); mbDuplicate(); return; }
    ev.stopPropagation();
  }

  function renderMBFoot(){
    const foot = mb.els.foot;
    foot.innerHTML = '';
    const status = el('span', 'status', '');
    mb.els.status = status;
    foot.appendChild(status);

    const recBtn = el('button', 'mbtn rec', '⏺ Record into this macro');
    recBtn.disabled = !m;

    recBtn.addEventListener('click', () => showRecordDialog({ macroId: m.id }));

      if(!mb.selStepId){ mbSetStatus('Select a step first.', 'err'); return; }

    });

  // ---------- "Record Macro" dialog ----------
  function showRecordDialog(opts){
    if(recorder.active) return;
    const target = opts.macroId ? MACROS.find(m => m.id === opts.macroId) : null;
    const overlay = el('div', 'modal-overlay');

    box.style.maxWidth = '480px';

    box.appendChild(el('p', '', target ? `Record more steps into "${target.name}"` : 'Record a new macro'));
    const desc = el('p', 'template-desc', 'Everything you do on the canvas — adding, connecting, typing, moving, formatting, switching canvases — becomes a step. Undo removes the last recorded step. Click the red Recording pill on the Ribbon to finish.');
    box.appendChild(desc);
    let nameIn = null;
    if(!target){
      const r = el('div', 'pform-row'); r.appendChild(el('label', '', 'Macro name'));
      nameIn = el('input'); nameIn.type = 'text'; nameIn.value = 'Macro ' + (MACROS.length + 1);
      nameIn.addEventListener('keydown', ev => { ev.stopPropagation(); if(ev.key === 'Enter') start(); });
      r.appendChild(nameIn); box.appendChild(r);
    }
    const nSel = selectedNodeIds.size;
    const cbRow = (text, checked, disabled, title) => {
      const l = el('label'); l.style.cssText = 'display:flex; gap:8px; align-items:flex-start; font-size:13px; margin:8px 0; color:#1e2937;';
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = checked; cb.disabled = disabled;
      l.appendChild(cb); l.appendChild(document.createTextNode(text));
      if(title) l.title = title;
      box.appendChild(l);
      return cb;
    };
    const selCb = cbRow(nSel ? `Refer to the ${nSel} selected node${nSel === 1 ? '' : 's'} as @sel (so the macro works on whatever is selected when it runs)` : 'Refer to selected nodes as @sel (nothing is selected now)', nSel > 0, nSel === 0);
    const relCb = cbRow(target ? `Relative positions: ${target.relative ? 'on' : 'off'} (set in the Macro Builder)` : 'Record positions relative to the selection (or the view centre), so the macro can build anywhere',
      target ? !!target.relative : false, !!target);
    const actions = el('div', 'modal-actions');
    const cancel = el('button', '', 'Cancel');
    cancel.addEventListener('click', close);
    const go = el('button', 'primary', '⏺ Start recording');
    go.addEventListener('click', start);
    actions.appendChild(cancel); actions.appendChild(go);
    box.appendChild(actions);
    if(nameIn){ nameIn.focus(); nameIn.select(); } else go.focus();
    function start(){
      close();
      if(mb.overlay) closeMacroBuilder();
      startRecording({ macroId: target ? target.id : null, name: nameIn ? (nameIn.value.trim() || undefined) : undefined, selRefs: selCb.checked, relative: relCb.checked });
    }
  }

  // =====================================================================================
  // ---------- Documents: New · Open · Save · Save As · Open Recent ----------
  // =====================================================================================
  // A document is a .fmide file holding the whole workspace — exactly the fmIDE-workspace
  // JSON that Export Workspace writes, so there is no new file format. Where the browser
  // has the File System Access API (Chrome, Edge) Open and Save As get a file handle and
  // Save writes straight back to the file; elsewhere Open uses a file input and Save
  // downloads name.fmide. Browser storage (05, src/shared/store.js) is the safety net:
  // the autosave also keeps which document is open and whether it has unsaved changes,
  // and Recent keeps a copy of each document as it was last opened or saved.
  // Opening a document never overwrites the person's own setup: the model and its format
  // presets/roles come from the file; its templates and macros are added when not already
  // present; its shortcuts and ribbon/KeyTips settings are ignored.
  const DOC_EXT = '.fmide';
  const DOC_PICKER_TYPES = [{ description: 'fmIDE document', accept: { 'application/json': [DOC_EXT, '.json'] } }];
  const DOC_SAVE_TYPES = [{ description: 'fmIDE document', accept: { 'application/json': [DOC_EXT] } }];
  const SESSION_KEY = 'fmIDE-session';               // { name, fileName, recentId, dirty } (JSON)
  const SESSION_HANDLE_KEY = 'fmIDE-session-handle'; // the open document's file handle
  const RECENT_KEY = 'fmIDE-recent';                 // [{ id, name, fileName, lastOpened, copySavedAt }] (JSON)
  const RECENT_MAX = 10;
  const recentCopyKey = (id) => 'fmIDE-recent:' + id;
  const recentHandleKey = (id) => 'fmIDE-recent-handle:' + id;
  const fileInputDocument = document.getElementById('fileInputDocument');

  // name: shown in the title (null = "Untitled"); fileName: the .fmide file it lives in,
  // if any (Save downloads it again where there is no handle); handle: the file handle.
  // serial changes whenever another document is opened or a new one started.
  const currentDoc = { name: null, fileName: null, handle: null, recentId: null, dirty: false, serial: 0 };
  const recentHandles = new Map(); // handles from this session, for when the browser can't store them
  let docChangeCount = 0;          // bumped on every change: a save only marks clean what it wrote
  let dirtySaveTimer = null;

  function docDisplayName(){ return currentDoc.name || 'Untitled'; }
  function updateDocTitle(){ document.title = docDisplayName() + (currentDoc.dirty ? ' •' : '') + ' — fmIDE'; }

  // Called for every change that goes into undo history (and undo/redo themselves). The
  // autosave follows about 2 s after the last change, besides the 8-second timer.
  function markDocDirty(){
    docChangeCount++;
    if(!currentDoc.dirty){ currentDoc.dirty = true; updateDocTitle(); }
    clearTimeout(dirtySaveTimer);
    dirtySaveTimer = setTimeout(saveWorkspace, 2000);
  }
  function markDocClean(){ currentDoc.dirty = false; updateDocTitle(); }
  function clearUndoHistory(){ history = []; future = []; updateHistoryButtons(); }

  function docNameFromFile(fileName){
    const base = String(fileName || '').split(/[\\/]/).pop().replace(/\.(fmide|json)$/i, '').trim();
    return base.slice(0, 200) || 'Untitled';
  }
  function safeFileBase(name){
    return String(name || '').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').trim().slice(0, 120) || 'Untitled';
  }
  function withDocExt(name){ const base = safeFileBase(String(name || '').replace(/\.fmide$/i, '')); return base + DOC_EXT; }
  function isFileHandle(h){ return !!h && typeof h === 'object' && typeof h.getFile === 'function'; }
  function formatWhen(iso){
    const d = new Date(iso);
    return isNaN(d.getTime()) ? 'an earlier date' : d.toLocaleString();
  }

  // ---------- the session, as saved with the autosave ----------
  function documentSessionText(){
    return JSON.stringify({ name: currentDoc.name, fileName: currentDoc.fileName, recentId: currentDoc.recentId, dirty: currentDoc.dirty });
  }
  // A handle the browser can't keep is dropped rather than left pointing at the previous
  // document's file: after a reload, Save then asks where to save.
  function rememberSessionHandle(){
    const drop = () => workspaceStore.remove(SESSION_HANDLE_KEY).catch(() => {});
    if(currentDoc.handle) workspaceStore.put(SESSION_HANDLE_KEY, currentDoc.handle).catch(drop);
    else drop();
  }
  // Restores which document was open (only when the autosaved workspace itself came back).
  function loadDocumentSession(restored){
    if(!restored) return Promise.resolve();
    return workspaceStore.get(SESSION_KEY).then(text => {
      let s = null;
      try{ s = typeof text === 'string' ? JSON.parse(text) : null; }catch(err){ s = null; }
      if(!s || typeof s !== 'object') return;
      currentDoc.name = (typeof s.name === 'string' && s.name) ? s.name.slice(0, 200) : null;
      currentDoc.fileName = (typeof s.fileName === 'string' && s.fileName) ? s.fileName.slice(0, 255) : null;
      currentDoc.recentId = typeof s.recentId === 'string' ? s.recentId : null;
      currentDoc.dirty = s.dirty === true;
      // Only the handle of this very file (never write one document into another's file).
      return workspaceStore.get(SESSION_HANDLE_KEY).then(h => {
        if(isFileHandle(h) && currentDoc.fileName && h.name === currentDoc.fileName) currentDoc.handle = h;
      });
    }).catch(() => {});
  }

  // After a restart with unsaved changes: say so, and offer to save them.
  function showRecoveryNotice(){
    if(!currentDoc.dirty || document.getElementById('recoveryBanner')) return;
    const bar = document.createElement('div');
    bar.id = 'recoveryBanner';
    bar.setAttribute('role', 'status');
    bar.style.cssText = 'position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:1999; max-width:640px; ' +
      'display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px; background:#1e3a8a; color:#fff; ' +
      'font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.35);';
    const msg = document.createElement('span');
    msg.textContent = 'Recovered unsaved changes to “' + docDisplayName() + '”.';
    const save = document.createElement('button');
    save.textContent = 'Save';
    save.style.cssText = 'flex:none; padding:6px 10px; border-radius:6px; border:none; background:#fff; color:#1e3a8a; font-weight:700; cursor:pointer;';
    save.addEventListener('click', () => { saveDocument().then(ok => { if(ok) bar.remove(); }); });
    const dis = document.createElement('button');
    dis.textContent = 'Dismiss';
    dis.style.cssText = 'flex:none; padding:6px 10px; border-radius:6px; border:1px solid rgba(255,255,255,.5); background:transparent; color:#fff; cursor:pointer;';
    dis.addEventListener('click', () => bar.remove());
    bar.append(msg, save, dis);
    document.body.appendChild(bar);
  }
  function hideRecoveryNotice(){ const b = document.getElementById('recoveryBanner'); if(b) b.remove(); }

  // Closing the tab with unsaved changes: the browser's own "Leave site?" question.
  window.addEventListener('beforeunload', (ev) => {
    if(!currentDoc.dirty) return;
    ev.preventDefault();
    ev.returnValue = '';
  });

  // ---------- in-app dialogs ----------
  // Save / Don't save / Cancel. Escape and a click outside mean Cancel.
  function confirmDiscardChanges(proceed){
    if(!currentDoc.dirty){ proceed(); return; }
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    box.id = 'saveChangesDialog';
    const p = document.createElement('p');
    p.textContent = 'Do you want to save the changes to “' + docDisplayName() + '”?';
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const cancelBtn = document.createElement('button'); cancelBtn.textContent = 'Cancel';
    const dontBtn = document.createElement('button'); dontBtn.textContent = "Don't save";
    const saveBtn = document.createElement('button'); saveBtn.className = 'primary'; saveBtn.textContent = 'Save';
    actions.append(cancelBtn, dontBtn, saveBtn);
    box.append(p, actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(ev){ if(ev.key === 'Escape') close(); }
    cancelBtn.addEventListener('click', close);
    overlay.addEventListener('mousedown', (ev) => { if(ev.target === overlay) close(); });
    dontBtn.addEventListener('click', () => { close(); proceed(); });
    saveBtn.addEventListener('click', () => { close(); saveDocument().then(saved => { if(saved) proceed(); }); });
    document.addEventListener('keydown', onKey);
    saveBtn.focus();
  }

  // Where the browser can't show a save dialog: ask for a name, then download. Resolves
  // with the file name, or null when cancelled.
  function askDocumentFileName(suggested){
    return new Promise(resolve => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      const box = document.createElement('div');
      box.className = 'modal-box';
      box.id = 'saveAsDialog';
      const p = document.createElement('p');
      p.textContent = 'Save as (the file is downloaded):';
      const input = document.createElement('input');
      input.type = 'text';
      input.id = 'saveAsName';
      input.value = suggested.replace(/\.fmide$/i, '');
      input.style.cssText = 'width:100%; box-sizing:border-box; margin-bottom:14px; padding:6px 8px;';
      const actions = document.createElement('div');
      actions.className = 'modal-actions';
      const cancelBtn = document.createElement('button'); cancelBtn.textContent = 'Cancel';
      const saveBtn = document.createElement('button'); saveBtn.className = 'primary'; saveBtn.textContent = 'Save';
      actions.append(cancelBtn, saveBtn);
      box.append(p, input, actions);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      function done(value){ overlay.remove(); resolve(value); }
      cancelBtn.addEventListener('click', () => done(null));
      overlay.addEventListener('mousedown', (ev) => { if(ev.target === overlay) done(null); });
      saveBtn.addEventListener('click', () => done(withDocExt(input.value)));
      input.addEventListener('keydown', (ev) => {
        if(ev.key === 'Enter'){ ev.preventDefault(); done(withDocExt(input.value)); }
        if(ev.key === 'Escape'){ ev.preventDefault(); done(null); }
      });
      input.focus();
      input.select();
    });
  }

  // ---------- New ----------
  // An empty model: one empty "Canvas 1" and one period. The format presets and roles are
  // kept (a house style), as are templates, macros, shortcuts and the ribbon.
  function newDocument(){
    confirmDiscardChanges(() => {
      applySystemDataDirect({ canvases: [{ id: 'c' + nextCanvasId, name: 'Canvas 1', nodes: [], edges: [] }], periods: ['Period 1'], currentPeriod: 0 });
      render();
      Object.assign(currentDoc, { name: null, fileName: null, handle: null, recentId: null, serial: currentDoc.serial + 1 });
      clearUndoHistory();
      hideRecoveryNotice();
      markDocClean();
      rememberSessionHandle();
      saveWorkspace();
    });
  }

  // ---------- Open ----------
  function openDocument(){ confirmDiscardChanges(pickDocumentToOpen); }

  function pickDocumentToOpen(){
    if(typeof window.showOpenFilePicker !== 'function'){ fileInputDocument.click(); return; }
    let picking;
    try{ picking = window.showOpenFilePicker({ types: DOC_PICKER_TYPES, multiple: false }); }
    catch(err){ fileInputDocument.click(); return; }
    Promise.resolve(picking).then(async (handles) => {
      const handle = handles && handles[0];
      if(!handle) return;
      const file = await handle.getFile();
      openDocumentText(await file.text(), file.name || handle.name, handle);
    }).catch(err => {
      if(err && err.name === 'AbortError') return; // the person closed the dialog
      if(err && err.name === 'SecurityError'){ fileInputDocument.click(); return; }
      showMessage('Could not open that file.');
    });
  }

  fileInputDocument.addEventListener('change', () => {
    const file = fileInputDocument.files && fileInputDocument.files[0];
    fileInputDocument.value = ''; // the same file can be picked again
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => openDocumentText(String(reader.result), file.name, null);
    reader.onerror = () => showMessage('Could not read that file.');
    reader.readAsText(file);
  });

  // Opens a .fmide (a workspace) or a workspace/system .json. Only a .fmide keeps its file
  // handle: Save on a .json document asks where to save a .fmide instead of overwriting it.
  // opts: { recentId, notice }
  function openDocumentText(text, fileName, handle, opts){
    opts = opts || {};
    openFmFileText(text, ['fmIDE-workspace', 'system'], (data, r) => {
      const system = r.kind === 'system' ? data : data.system;
      if(!system || !Array.isArray(system.canvases) || system.canvases.length === 0){
        showMessage("That file doesn't contain a model (expected a non-empty \"canvases\" list).");
        return;
      }
      const isDocFile = /\.fmide$/i.test(String(fileName || ''));
      applyDocumentData(data, r.kind);
      Object.assign(currentDoc, {
        name: docNameFromFile(fileName),
        fileName: isDocFile ? String(fileName).split(/[\\/]/).pop() : null,
        handle: isDocFile && isFileHandle(handle) ? handle : null,
        recentId: opts.recentId || null,
        serial: currentDoc.serial + 1
      });
      clearUndoHistory();
      hideRecoveryNotice();
      markDocClean();
      rememberSessionHandle();
      saveWorkspace();
      addToRecent(text, isFileHandle(handle) ? handle : null, String(fileName || ''));
      if(opts.notice) toast(opts.notice, 6000);
    });
  }

  function applyDocumentData(data, kind){
    const system = kind === 'system' ? data : data.system;
    applySystemDataDirect(system);
    const presets = (kind === 'fmIDE-workspace' && Array.isArray(data.formatPresets) && data.formatPresets.length)
      ? data.formatPresets : system.formatPresets;
    if(Array.isArray(presets)) mergeFormatPresets(presets);
    ensureDefaultFormatPresets();
    if(kind === 'fmIDE-workspace'){
      addMissingTemplates(data.templates);
      addMissingMacros(data.macros);
      syncMacroCommands();
    }
    renderCanvasTabs();
    render();
  }

  // Templates and macros from a document join the person's library, unless the same one
  // (same name and content) is already there. Nothing of theirs is replaced or removed.
  function addMissingTemplates(list){
    (Array.isArray(list) ? list : []).forEach(t => {
      if(!t || typeof t.name !== 'string' || !t.name.trim() || !t.data || (t.kind !== 'module' && t.kind !== 'system')) return;
      const name = t.name.trim();
      const content = JSON.stringify(t.data);
      if(TEMPLATES.some(x => x.name === name && x.kind === t.kind && JSON.stringify(x.data) === content)) return;
      TEMPLATES.push({
        id: 'usr' + (nextTemplateId++), name,
        description: typeof t.description === 'string' ? t.description : '',
        group: (typeof t.group === 'string' && t.group.trim()) ? t.group.trim() : 'My Templates',
        kind: t.kind, builtin: false, data: t.data
      });
    });
  }
  // Steps get fresh ids whenever a macro is imported, so compare them without ids. A macro
  // whose name was taken is imported as "<name> (imported)" — that copy counts as present.
  function macroStepsFingerprint(steps){
    return JSON.stringify(steps, (k, v) => (k === 'id' ? undefined : v));
  }
  function addMissingMacros(list){
    const fresh = (Array.isArray(list) ? list : []).filter(src => {
      if(!src || typeof src !== 'object' || !Array.isArray(src.steps)) return false;
      const name = String(src.name || 'Imported macro');
      const steps = macroStepsFingerprint(normalizeSteps(cloneData(src.steps)));
      return !MACROS.some(m => (m.name === name || m.name === name + ' (imported)') && macroStepsFingerprint(m.steps) === steps);
    });
    if(fresh.length) importMacros(fresh, 'add');
  }

  // ---------- Save / Save As ----------
  function documentText(){ return JSON.stringify(buildWorkspacePayload(), null, 2); }
  function canPickSaveFile(){ return typeof window.showSaveFilePicker === 'function'; }

  // Resolves true once the document is saved, false if it wasn't (cancelled or failed).
  function saveDocument(){
    const text = documentText();
    const changesSaved = docChangeCount;
    if(currentDoc.handle){
      return writeToHandle(currentDoc.handle, text).then(ok => {
        if(ok){ afterSaved(text, currentDoc.handle, currentDoc.handle.name || currentDoc.fileName, changesSaved); return true; }
        toast('Could not write to “' + docDisplayName() + '” — choose where to save it.', 4000);
        return saveDocumentAs(text, changesSaved);
      });
    }
    if(currentDoc.fileName && !canPickSaveFile()){
      downloadDocument(text, currentDoc.fileName);
      afterSaved(text, null, currentDoc.fileName, changesSaved);
      return Promise.resolve(true);
    }
    return saveDocumentAs(text, changesSaved);
  }

  function saveDocumentAs(text, changesSaved){
    if(typeof text !== 'string') text = documentText();
    if(typeof changesSaved !== 'number') changesSaved = docChangeCount;
    const suggested = withDocExt(docDisplayName());
    const viaDownload = () => askDocumentFileName(suggested).then(fileName => {
      if(!fileName) return false;
      downloadDocument(text, fileName);
      afterSaved(text, null, fileName, changesSaved, true);
      return true;
    });
    if(!canPickSaveFile()) return viaDownload();
    let picking;
    try{ picking = window.showSaveFilePicker({ suggestedName: suggested, types: DOC_SAVE_TYPES }); }
    catch(err){ return viaDownload(); }
    return Promise.resolve(picking).then(handle => writeToHandle(handle, text).then(ok => {
      if(!ok){ showMessage('Could not save to that file.'); return false; }
      afterSaved(text, handle, handle.name || suggested, changesSaved, true);
      return true;
    }), err => {
      if(err && err.name === 'AbortError') return false;
      return viaDownload();
    });
  }

  function writeToHandle(handle, text){
    return (async () => {
      if(typeof handle.queryPermission === 'function'){
        let perm = await handle.queryPermission({ mode: 'readwrite' });
        if(perm !== 'granted' && typeof handle.requestPermission === 'function') perm = await handle.requestPermission({ mode: 'readwrite' });
        if(perm !== 'granted') return false;
      }
      const w = await handle.createWritable();
      await w.write(text);
      await w.close();
      return true;
    })().catch(() => false);
  }

  function downloadDocument(text, fileName){
    // octet-stream, so no browser swaps the .fmide extension for .json
    const url = URL.createObjectURL(new Blob([text], { type: 'application/octet-stream' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // asNewFile (Save As): a new file, so a new Recent entry; the old file keeps its own.
  function afterSaved(text, handle, fileName, changesSaved, asNewFile){
    if(asNewFile){ currentDoc.recentId = null; currentDoc.serial++; }
    currentDoc.handle = handle || null;
    currentDoc.fileName = String(fileName || '').split(/[\\/]/).pop() || null;
    currentDoc.name = docNameFromFile(currentDoc.fileName);
    // A change made while the file was being written is still unsaved.
    if(docChangeCount === changesSaved) markDocClean(); else updateDocTitle();
    hideRecoveryNotice();
    rememberSessionHandle();
    saveWorkspace();
    addToRecent(text, handle || null, currentDoc.fileName);
    toast('Saved “' + docDisplayName() + '”.');
  }

  // ---------- Recent ----------
  // Each entry keeps its name, when it was last opened, the file handle when the browser
  // gives one, and a copy of the document as last opened or saved (so browsers without
  // file handles can still reopen it). Updates run one at a time.
  let recentQueue = Promise.resolve();
  function readRecent(){
    return workspaceStore.get(RECENT_KEY).then(text => {
      let list = [];
      try{ list = typeof text === 'string' ? JSON.parse(text) : []; }catch(err){ list = []; }
      return (Array.isArray(list) ? list : []).filter(e => e && typeof e.id === 'string' && typeof e.name === 'string');
    }, () => []);
  }
  function forgetRecentEntry(id){
    recentHandles.delete(id);
    workspaceStore.remove(recentCopyKey(id)).catch(() => {});
    workspaceStore.remove(recentHandleKey(id)).catch(() => {});
  }
  // The document is captured when the update is queued: by the time it runs, another
  // document may be open, and that one must not take over this entry.
  function addToRecent(text, handle, fileName){
    const docAtCall = currentDoc.serial;
    const nameAtCall = currentDoc.name;
    const recentIdAtCall = currentDoc.recentId;
    recentQueue = recentQueue.then(async () => {
      const list = await readRecent();
      let entry = recentIdAtCall ? list.find(e => e.id === recentIdAtCall) : null;
      if(!entry && handle && typeof handle.isSameEntry === 'function'){
        for(const e of list){
          const h = recentHandles.get(e.id) || await workspaceStore.get(recentHandleKey(e.id)).catch(() => null);
          if(isFileHandle(h) && await Promise.resolve(h.isSameEntry(handle)).catch(() => false)){ entry = e; break; }
        }
      }
      if(!entry && !handle && fileName) entry = list.find(e => e.fileName === fileName);
      if(!entry) entry = { id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) };
      const now = new Date().toISOString();
      entry.name = nameAtCall || docNameFromFile(fileName);
      entry.fileName = fileName || null;
      entry.lastOpened = now;
      if(currentDoc.serial === docAtCall) currentDoc.recentId = entry.id;
      try{ await workspaceStore.put(recentCopyKey(entry.id), text); entry.copySavedAt = now; }
      catch(err){ /* storage full: the entry can still reopen the real file */ }
      if(handle){
        recentHandles.set(entry.id, handle);
        await workspaceStore.put(recentHandleKey(entry.id), handle).catch(() => {});
      }
      const others = list.filter(e => e.id !== entry.id);
      others.slice(RECENT_MAX - 1).forEach(e => forgetRecentEntry(e.id));
      await workspaceStore.put(RECENT_KEY, JSON.stringify([entry].concat(others.slice(0, RECENT_MAX - 1)))).catch(() => {});
      saveWorkspace(); // the session now names this entry
    }).catch(() => {});
    return recentQueue;
  }
  function clearRecent(){
    recentQueue = recentQueue.then(async () => {
      (await readRecent()).forEach(e => forgetRecentEntry(e.id));
      await workspaceStore.put(RECENT_KEY, '[]').catch(() => {});
      currentDoc.recentId = null;
      saveWorkspace();
    }).catch(() => {});
    return recentQueue;
  }

  function showOpenRecent(){
    readRecent().then(list => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      const box = document.createElement('div');
      box.className = 'modal-box';
      box.id = 'openRecentDialog';
      box.style.minWidth = '380px';
      const h = document.createElement('p');
      h.textContent = list.length ? 'Open a recent document:' : 'No recent documents.';
      const ul = document.createElement('div');
      ul.id = 'recentList';
      ul.style.cssText = 'display:flex; flex-direction:column; gap:6px; margin-bottom:16px;';
      function close(){ overlay.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(ev){ if(ev.key === 'Escape') close(); }
      list.forEach(e => {
        const item = document.createElement('button');
        item.className = 'recent-item';
        item.style.cssText = 'display:flex; justify-content:space-between; gap:16px; text-align:left; padding:8px 10px; cursor:pointer;';
        const name = document.createElement('span'); name.className = 'recent-name'; name.textContent = e.name;
        const when = document.createElement('span'); when.style.opacity = '0.65'; when.textContent = formatWhen(e.lastOpened);
        item.append(name, when);
        item.addEventListener('click', () => { close(); confirmDiscardChanges(() => reopenRecent(e)); });
        ul.appendChild(item);
      });
      const actions = document.createElement('div');
      actions.className = 'modal-actions';
      const clearBtn = document.createElement('button'); clearBtn.textContent = 'Clear Recent'; clearBtn.disabled = !list.length;
      clearBtn.addEventListener('click', () => { close(); clearRecent().then(() => toast('Recent documents cleared.')); });
      const closeBtn = document.createElement('button'); closeBtn.className = 'primary'; closeBtn.textContent = 'Close';
      closeBtn.addEventListener('click', close);
      actions.append(clearBtn, closeBtn);
      box.append(h, ul, actions);
      overlay.appendChild(box);
      overlay.addEventListener('mousedown', (ev) => { if(ev.target === overlay) close(); });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(overlay);
      (ul.querySelector('button') || closeBtn).focus();
    });
  }

  // The real file when there is a handle and the person allows access again; otherwise
  // the copy kept in this browser, saying so.
  async function reopenRecent(entry){
    const handle = recentHandles.get(entry.id) || await workspaceStore.get(recentHandleKey(entry.id)).catch(() => null);
    if(isFileHandle(handle)){
      try{
        if(typeof handle.queryPermission === 'function'){
          let perm = await handle.queryPermission({ mode: 'read' });
          if(perm !== 'granted' && typeof handle.requestPermission === 'function') perm = await handle.requestPermission({ mode: 'read' });
          if(perm !== 'granted') throw new Error('Access not allowed');
        }
        const file = await handle.getFile();
        openDocumentText(await file.text(), file.name || handle.name || entry.fileName, handle, { recentId: entry.id });
        return;
      }catch(err){ /* fall back to the copy */ }
    }
    const copy = await workspaceStore.get(recentCopyKey(entry.id)).catch(() => null);
    if(typeof copy === 'string'){
      openDocumentText(copy, entry.fileName || withDocExt(entry.name), null, {
        recentId: entry.id,
        notice: 'Opened the copy saved in this browser on ' + formatWhen(entry.copySavedAt) + '.'
      });
      return;
    }
    showMessage('“' + entry.name + '” can no longer be opened: the file is not available and no copy was kept in this browser.');
  }
  // =====================================================================================
  // ---------- Customize Ribbon & KeyTips dialog ----------
  // =====================================================================================
  function showCustomizeRibbon(){
    const cfg = ribbonState.config;
    const cfgAtOpen = JSON.stringify(cfg);
    const overlay = el('div', 'modal-overlay');
    const box = el('div', 'modal-box rbc-box');
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const close = () => {
      overlay.remove(); document.removeEventListener('keydown', onKey);
      // only a layout the user actually changed is saved; otherwise new default buttons keep appearing in updates
      if(JSON.stringify(ribbonState.config) !== cfgAtOpen) ribbonState.customized = true;
      renderRibbon(); saveWorkspaceSoon();
    };
    function onKey(ev){ if(ev.key === 'Escape' && !keytipCaptureListener && !focusIsTyping()) close(); }
    document.addEventListener('keydown', onKey);
    overlay.addEventListener('mousedown', ev => { if(ev.target === overlay) close(); });

    box.appendChild(el('p', '', '⚙ Customize Ribbon & KeyTips'));
    const layout = el('div', 'rbc-layout');
    box.appendChild(layout);

    // left: commands
    const left = el('div', 'rbc-pane');
    left.appendChild(el('h5', '', 'Commands'));
    const search = el('input', 'shortcuts-search');
    search.placeholder = 'Search commands…';
    search.style.marginBottom = '6px';
    search.addEventListener('keydown', ev => ev.stopPropagation());
    left.appendChild(search);
    const cmdList = el('div', 'rbc-list');
    left.appendChild(cmdList);
    let selCmd = null;

    // middle
    const mid = el('div', 'rbc-mid');
    const addBtn = el('button', 'mbtn primary', 'Add »');
    const remBtn = el('button', 'mbtn', '« Remove');
    mid.appendChild(addBtn); mid.appendChild(remBtn);

    // right: layout tree
    const right = el('div', 'rbc-pane');
    right.appendChild(el('h5', '', 'Ribbon layout'));
    const tree = el('div', 'rbc-list');
    right.appendChild(tree);
    const rtools = el('div', '');
    rtools.style.cssText = 'display:flex; gap:4px; flex-wrap:wrap; margin-top:6px;';
    right.appendChild(rtools);
    const propsRow = el('div', 'rbc-props');
    right.appendChild(propsRow);
    layout.appendChild(left); layout.appendChild(mid); layout.appendChild(right);

    // selection in the tree: {type:'qat'|'qatItem'|'tab'|'group'|'item', t, g, i}
    let sel = { type:'tab', t: cfg.tabs.findIndex(t => t.id === ribbonState.activeTab) };
    if(sel.t < 0) sel.t = 0;

    function renderCmds(){
      cmdList.innerHTML = '';
      const q = search.value.trim().toLowerCase();
      const byCat = {};
      COMMANDS.forEach(c => {
        if(q && !(c.label + ' ' + c.category).toLowerCase().includes(q)) return;
        (byCat[c.category] = byCat[c.category] || []).push(c);
      });
      Object.keys(byCat).sort((a, b) => CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b)).forEach(cat => {
        cmdList.appendChild(el('div', 'shortcut-cat-header', cat)).style.margin = '6px 10px 2px';
        byCat[cat].forEach(c => {
          const r = el('div', 'rbc-row' + (selCmd === c.id ? ' sel' : ''));
          r.appendChild(el('span', 'ic', c.icon || '•'));
          r.appendChild(el('span', '', c.label));
          r.addEventListener('click', () => { selCmd = c.id; renderCmds(); });
          r.addEventListener('dblclick', () => { selCmd = c.id; addSelected(); });
          cmdList.appendChild(r);
        });
      });
    }
    search.addEventListener('input', renderCmds);

    function isSel(s){ return JSON.stringify(s) === JSON.stringify(sel); }
    function renderTree(){
      tree.innerHTML = '';
      const row = (s, depth, icon, text, meta) => {
        const r = el('div', 'rbc-row' + (isSel(s) ? ' sel' : ''));
        r.style.paddingLeft = (10 + depth * 16) + 'px';
        r.appendChild(el('span', 'ic', icon));
        r.appendChild(el('span', '', text));
        if(meta) r.appendChild(el('span', 'meta', meta));
        r.addEventListener('click', () => { sel = s; renderTree(); renderProps(); });
        tree.appendChild(r);
      };
      row({ type:'qat' }, 0, '⚡', 'Quick Access Toolbar', 'numbers 1–9');
      cfg.qat.forEach((id, i) => { const c = getCommand(id); if(c) row({ type:'qatItem', i }, 1, c.icon || '•', c.label, String(i + 1)); });
      cfg.tabs.forEach((t, ti) => {
        row({ type:'tab', t: ti }, 0, '▭', t.label, t.keytip ? 'KeyTip ' + t.keytip : 'auto');
        t.groups.forEach((g, gi) => {
          row({ type:'group', t: ti, g: gi }, 1, '▣', g.label, g.id === 'myMacros' ? 'pinned macros' : '');
          (g.items || []).forEach((it, ii) => {
            const c = getCommand(it.cmd);
            if(!c) return;
            row({ type:'item', t: ti, g: gi, i: ii }, 2, c.icon || '•', it.label || c.label, (it.size === 'large' ? 'large' : 'small') + (it.keytip ? ' · ' + it.keytip : ''));
          });
        });
      });
      const s = tree.querySelector('.rbc-row.sel');
      if(s) s.scrollIntoView({ block:'nearest' });
    }

    function renderProps(){
      propsRow.innerHTML = '';
      const inp = (label, val, ph, onChange, width) => {
        const l = el('span', '', label); propsRow.appendChild(l);
        const i = el('input'); i.type = 'text'; i.value = val || ''; i.placeholder = ph || ''; i.style.width = (width || 110) + 'px';
        i.addEventListener('keydown', ev => ev.stopPropagation());
        i.addEventListener('change', () => { onChange(i.value.trim()); renderTree(); renderRibbon(); });
        propsRow.appendChild(i);
        return i;
      };
      if(sel.type === 'tab'){
        const t = cfg.tabs[sel.t];
        inp('Tab name', t.label, '', v => { if(v) t.label = v; });
        inp('KeyTip', t.keytip, 'auto', v => { t.keytip = v.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 2) || undefined; if(!t.keytip) delete t.keytip; checkTip(); }, 50);
      } else if(sel.type === 'group'){
        const g = cfg.tabs[sel.t].groups[sel.g];
        inp('Group name', g.label, '', v => { if(v) g.label = v; });
      } else if(sel.type === 'item'){
        const it = cfg.tabs[sel.t].groups[sel.g].items[sel.i];
        const c = getCommand(it.cmd);
        inp('Label', it.label, c ? (c.short || c.label) : '', v => { if(v) it.label = v; else delete it.label; });
        propsRow.appendChild(el('span', '', 'Size'));
        const s = el('select');
        [['small','Small'],['large','Large']].forEach(([v, t]) => { const o = el('option', '', t); o.value = v; s.appendChild(o); });
        s.value = it.size === 'large' ? 'large' : 'small';
        s.addEventListener('change', () => { if(s.value === 'large') it.size = 'large'; else delete it.size; renderTree(); renderRibbon(); });
        propsRow.appendChild(s);
        inp('KeyTip', it.keytip, 'auto', v => { it.keytip = v.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 2) || undefined; if(!it.keytip) delete it.keytip; checkTip(); }, 50);
      } else {
        propsRow.appendChild(el('span', '', sel.type === 'qat' || sel.type === 'qatItem'
          ? 'Quick Access buttons sit left of the tabs; their KeyTips are 1–9.' : ''));
      }
      const warn = el('span', '');
      warn.id = 'rbcWarn';
      warn.style.cssText = 'color:#b45309; font-size:11px; flex-basis:100%;';
      propsRow.appendChild(warn);
      checkTip();
    }
    function checkTip(){
      const w = document.getElementById('rbcWarn');
      if(!w) return;
      const msgs = [];
      const tabTips = cfg.tabs.map(t => t.keytip).filter(Boolean);
      const dup = tabTips.filter((k, i) => tabTips.indexOf(k) !== i);
      if(dup.length) msgs.push(`Tab KeyTip "${dup[0]}" is used twice.`);
      if(tabTips.some(k => /^[0-9]/.test(k))) msgs.push('Tab KeyTips starting with a digit clash with Quick Access numbers.');
      if(sel.t !== undefined && cfg.tabs[sel.t]){
        const tips = [];
        cfg.tabs[sel.t].groups.forEach(g => (g.items || []).forEach(it => { if(it.keytip) tips.push(it.keytip); }));
        const d2 = tips.filter((k, i) => tips.indexOf(k) !== i);
        if(d2.length) msgs.push(`KeyTip "${d2[0]}" is used twice on this tab.`);
      }
      w.textContent = msgs.join(' ');
    }

    function addSelected(){
      if(!selCmd) return;
      if(sel.type === 'qat' || sel.type === 'qatItem'){
        if(!cfg.qat.includes(selCmd)) cfg.qat.splice(sel.type === 'qatItem' ? sel.i + 1 : cfg.qat.length, 0, selCmd);
      } else {
        let t = sel.t, g = sel.g;
        if(sel.type === 'tab'){
          if(!cfg.tabs[t].groups.length) cfg.tabs[t].groups.push({ label:'New Group', items:[] });
          g = cfg.tabs[t].groups.length - 1;
        }
        const items = cfg.tabs[t].groups[g].items = cfg.tabs[t].groups[g].items || [];
        const at = sel.type === 'item' ? sel.i + 1 : items.length;
        items.splice(at, 0, { cmd: selCmd });
        sel = { type:'item', t, g, i: at };
      }
      renderTree(); renderProps(); renderRibbon();
    }
    function removeSelected(){
      if(sel.type === 'qatItem'){ cfg.qat.splice(sel.i, 1); sel = { type:'qat' }; }
      else if(sel.type === 'item'){ cfg.tabs[sel.t].groups[sel.g].items.splice(sel.i, 1); sel = { type:'group', t: sel.t, g: sel.g }; }
      else if(sel.type === 'group'){ cfg.tabs[sel.t].groups.splice(sel.g, 1); sel = { type:'tab', t: sel.t }; }
      else if(sel.type === 'tab'){
        if(cfg.tabs.length <= 1){ toast('The ribbon needs at least one tab.'); return; }
        cfg.tabs.splice(sel.t, 1); sel = { type:'tab', t: Math.max(0, sel.t - 1) };
      }
      renderTree(); renderProps(); renderRibbon();
    }
    function moveSelected(dir){
      const swap = (arr, i) => { const j = i + dir; if(j < 0 || j >= arr.length) return false; const x = arr[i]; arr[i] = arr[j]; arr[j] = x; return true; };
      if(sel.type === 'qatItem'){ if(swap(cfg.qat, sel.i)) sel.i += dir; }
      else if(sel.type === 'item'){ if(swap(cfg.tabs[sel.t].groups[sel.g].items, sel.i)) sel.i += dir; }
      else if(sel.type === 'group'){ if(swap(cfg.tabs[sel.t].groups, sel.g)) sel.g += dir; }
      else if(sel.type === 'tab'){ if(swap(cfg.tabs, sel.t)) sel.t += dir; }
      renderTree(); renderRibbon();
    }
    addBtn.addEventListener('click', addSelected);
    remBtn.addEventListener('click', removeSelected);
    const rt = (label, title, fn) => { const b = el('button', 'mbtn', label); b.title = title; b.addEventListener('click', fn); rtools.appendChild(b); };
    rt('New Tab', 'Add a tab after the selected one', () => {
      const at = (sel.t !== undefined ? sel.t : cfg.tabs.length - 1) + 1;
      cfg.tabs.splice(at, 0, { id: 'tab' + Date.now().toString(36), label:'New Tab', groups:[ { label:'New Group', items:[] } ] });
      sel = { type:'tab', t: at };
      renderTree(); renderProps(); renderRibbon();
    });
    rt('New Group', 'Add a group to the selected tab', () => {
      if(sel.t === undefined){ toast('Select a tab first.'); return; }
      const groups = cfg.tabs[sel.t].groups;
      const at = sel.g !== undefined ? sel.g + 1 : groups.length;
      groups.splice(at, 0, { label:'New Group', items:[] });
      sel = { type:'group', t: sel.t, g: at };
      renderTree(); renderProps(); renderRibbon();
    });
    rt('↑', 'Move up', () => moveSelected(-1));
    rt('↓', 'Move down', () => moveSelected(1));
    rt('Reset', 'Restore the default ribbon layout', () => {
      showConfirm('Reset the ribbon and Quick Access Toolbar to the default layout?', () => {
        ribbonState.config = cloneData(DEFAULT_RIBBON);
        ribbonState.customized = false;
        syncPinnedMacrosIntoRibbon();
        overlay.remove(); document.removeEventListener('keydown', onKey);
        renderRibbon(); showCustomizeRibbon();
      });
    });

    // KeyTips trigger
    const trig = el('div', 'rbc-trigger');
    trig.appendChild(el('strong', '', 'KeyTips trigger:'));
    const trigSel = el('select');
    const choices = [
      ['tap:Alt', isMac() ? 'Tap Option (⌥)' : 'Tap Alt'],
      ['tap:Shift', isMac() ? 'Tap Shift (⇧)' : 'Tap Shift'],
      ['tap:Control', isMac() ? 'Tap Control (⌃)' : 'Tap Ctrl'],
      ...(isMac() ? [['tap:Meta', 'Tap Command (⌘)']] : []),
      ['combo:F10', 'F10'],
      ['custom', 'Custom key…'],
    ];
    const curKey = keytipTrigger.type === 'tap' ? 'tap:' + keytipTrigger.key : 'combo:' + keytipTrigger.combo;
    if(!choices.some(c => c[0] === curKey)) choices.splice(4, 0, [curKey, triggerLabel()]);
    choices.forEach(([v, t]) => { const o = el('option', '', t); o.value = v; trigSel.appendChild(o); });
    trigSel.value = curKey;
    const trigNote = el('span', '', '');
    trigNote.style.color = '#6b7280';
    trigSel.addEventListener('change', () => {
      const v = trigSel.value;
      if(v === 'custom'){
        trigNote.textContent = 'Press the key (or key combination) to use…';
        keytipCaptureListener = (ev) => {
          ev.preventDefault(); ev.stopPropagation();
          if(ev.key === 'Escape'){ keytipCaptureListener = null; trigNote.textContent = ''; trigSel.value = curKey; return; }
          const combo = normalizeCombo(ev);
          if(!combo) return; // modifiers alone: pick them from the list instead
          if(shortcutMap[combo]){ trigNote.textContent = `${prettyCombo(combo)} is already the shortcut for "${(getCommand(shortcutMap[combo]) || {}).label}". Try another key.`; return; }
          keytipCaptureListener = null;
          keytipTrigger = { type:'combo', combo };
          trigNote.textContent = `KeyTips now open with ${prettyCombo(combo)}.`;
          const o = el('option', '', prettyCombo(combo)); o.value = 'combo:' + combo; trigSel.insertBefore(o, trigSel.lastChild);
          trigSel.value = 'combo:' + combo;
          saveWorkspaceSoon();
        };
        return;
      }
      const [type, key] = v.split(':');
      keytipTrigger = type === 'tap' ? { type:'tap', key } : { type:'combo', combo: key };
      trigNote.textContent = `KeyTips now open with ${triggerLabel()}.`;
      saveWorkspaceSoon();
    });
    trig.appendChild(trigSel);
    trig.appendChild(trigNote);
    box.appendChild(trig);
    const tip = el('div', 'template-desc', 'Tap the trigger, then type a tab letter and a command letter — e.g. H then the letter shown on a button. Holding Alt/Option and pressing a tab letter also works. Double-click the command list to add; KeyTips are auto-assigned unless you set one.');
    tip.style.margin = '8px 0 0';
    box.appendChild(tip);

    const actions = el('div', 'modal-actions');
    actions.style.marginTop = '10px';
    const done = el('button', 'primary', 'Done');
    done.addEventListener('click', close);
    actions.appendChild(done);
    box.appendChild(actions);

    renderCmds(); renderTree(); renderProps();
  }

  // ---------- persistence of UI state (saved inside the workspace) ----------
  let saveSoonTimer = null;
  function saveWorkspaceSoon(){ clearTimeout(saveSoonTimer); saveSoonTimer = setTimeout(saveWorkspace, 600); }
  function buildUiPayload(){
    return {
      ribbon: ribbonState.customized ? cloneData(ribbonState.config) : null, ribbonCustomized: !!ribbonState.customized,
      ribbonCollapsed: ribbonState.collapsed, activeTab: ribbonState.activeTab,
      keytipTrigger: Object.assign({}, keytipTrigger), comboVersion: 2, launcherRecent: launcherRecent.slice(), lastRunMacroId,
      documentGroupAdded: true // the default ribbon has it; a customised one got it once
    };
  }
  // One-time update of a ribbon customised before the Document group existed: add it at
  // the front of the File tab (or the first tab, if File was removed).
  function addDocumentGroupToRibbon(){
    const tabs = ribbonState.config.tabs;
    const tab = tabs.find(t => t && t.id === 'file') || tabs[0];
    if(!tab) return;
    if(!Array.isArray(tab.groups)) tab.groups = [];
    tab.groups.unshift(cloneData(DOCUMENT_RIBBON_GROUP));
  }
  function applyUiPayload(ui){
    if(!ui || typeof ui !== 'object') return;
    if(ui.ribbonCustomized && ui.ribbon && Array.isArray(ui.ribbon.tabs) && ui.ribbon.tabs.length){
      ribbonState.config = { qat: Array.isArray(ui.ribbon.qat) ? ui.ribbon.qat.slice() : [], tabs: cloneData(ui.ribbon.tabs) };
      ribbonState.customized = true;
      if(ui.documentGroupAdded !== true) addDocumentGroupToRibbon();
    }
    if(typeof ui.ribbonCollapsed === 'boolean') ribbonState.collapsed = ui.ribbonCollapsed;
    if(typeof ui.activeTab === 'string') ribbonState.activeTab = ui.activeTab;
    if(ui.keytipTrigger && (ui.keytipTrigger.type === 'tap' && ui.keytipTrigger.key || ui.keytipTrigger.type === 'combo' && ui.keytipTrigger.combo)){
      keytipTrigger = Object.assign({}, ui.keytipTrigger);
      if(keytipTrigger.type === 'combo') keytipTrigger.combo = canonicalCombo(keytipTrigger.combo, !(ui.comboVersion >= 2)) || 'F10';
    }
    if(Array.isArray(ui.launcherRecent)) launcherRecent = ui.launcherRecent.slice(0, LAUNCHER_RECENT_MAX);
    if(typeof ui.lastRunMacroId === 'string') lastRunMacroId = ui.lastRunMacroId;
  }

  function startRenameActiveCanvas(){
    const tab = canvasTabsEl.querySelector(`.canvas-tab[data-id="${activeCanvasId}"]`);
    const c = activeCanvas();
    if(tab && c) startRenameCanvasTab(tab, c, tab.querySelector('.name'));
  }

  renderRibbon();

  // The autosaved workspace is read asynchronously (IndexedDB), so the rest of start-up
  // waits for it; window.fm appears once fmIDE is ready.
  loadWorkspaceFromStore().then(restored => loadDocumentSession(restored).then(() => restored)).then(restoredFromWorkspace => {
    ensureDefaultFormatPresets();

    if(!restoredFromWorkspace){
      // seed: Unit Price x Volume x FX = Revenue
      (function seed(){
        const unitPrice = { id: uid('n'), type:'value', x:80,  y:60,  w:160, h:64, text:'Unit Price\n50\n$/t' };
        const volume    = { id: uid('n'), type:'value', x:80,  y:190, w:160, h:64, text:'Volume\n1200\nkt' };
        const fx        = { id: uid('n'), type:'value', x:80,  y:320, w:160, h:64, text:'FX\n1.1' };
        const mul       = { id: uid('n'), type:'operator', x:380, y:196, w:56, h:56, text:'×' };
        const revenue   = { id: uid('n'), type:'value', x:620, y:190, w:160, h:64, text:'Revenue' };
        nodes.push(unitPrice, volume, fx, mul, revenue);
        edges.push({id:uid('e'), from:unitPrice.id, to:mul.id});
        edges.push({id:uid('e'), from:volume.id,    to:mul.id});
        edges.push({id:uid('e'), from:fx.id,        to:mul.id});
        edges.push({id:uid('e'), from:mul.id,       to:revenue.id});

        // plug / socket demo: any rectangle plugged "Revenue" auto-feeds the + operator socketed "Revenue"
        const gold   = { id: uid('n'), type:'value', x:80,  y:480, w:160, h:64, text:'Gold Revenue\n500', plug:'Revenue' };
        const silver = { id: uid('n'), type:'value', x:80,  y:600, w:160, h:64, text:'Silver Revenue\n300', plug:'Revenue' };
        const copper = { id: uid('n'), type:'value', x:80,  y:720, w:160, h:64, text:'Copper Revenue\n200', plug:'Revenue' };
        const sumOp  = { id: uid('n'), type:'operator', x:380, y:596, w:56, h:56, text:'+', socket:'Revenue' };
        const total  = { id: uid('n'), type:'value', x:620, y:590, w:160, h:64, text:'Total Revenue' };
        nodes.push(gold, silver, copper, sumOp, total);
        edges.push({id:uid('e'), from:sumOp.id, to:total.id});
      })();

      render();

      canvases.push({
        id: 'c' + (nextCanvasId++),
        name: 'Revenue Model',
        nodes, edges, computedValues, computeErrors, portValues, portErrors
      });
      activeCanvasId = canvases[0].id;
      syncAutoConnections();
      evaluateAll();
      renderCanvasTabs();
    }

    syncMacroCommands();   // also renders the ribbon with any restored layout
    updateHistoryButtons();

    // Autosave the whole workspace (system + templates + format presets + shortcuts) so
    // nothing needs re-loading next time the app is opened — no explicit save action needed.
    // Saving is asynchronous, so it also happens as soon as the page is hidden (switching
    // tab, minimising, closing): a write started only while the page unloads may not finish.
    workspaceRestored = true;
    updateDocTitle();
    showRecoveryNotice();
    setInterval(saveWorkspace, 8000);
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') saveWorkspace(); });
    window.addEventListener('beforeunload', saveWorkspace);

    // Debug/test hook only — not used by the running app itself. Lets an isolated Node.js
    // test harness load this whole file in a stubbed DOM and drive the computation engine
    // directly (load a system export, evaluate, inspect results) without simulating any UI.
    if(typeof window !== 'undefined'){
      window.__fmIDE = {
        applySystemData: applySystemDataDirect,
        evaluateAll,
        getCanvases: () => canvases,
        getPeriods: () => periods,
        getMacros: () => MACROS,
        recorder,
        startRecording, stopRecording, runMacroInteractive, importMacros, syncMacroCommands,
        getRibbonConfig: () => ribbonState.config
      };
      // Public automation API: every action a user can take with the mouse/keyboard.
      // fm.actions() lists them with their parameters.
      window.fm = fm;
    }
  });
})();
</script>
</body>
