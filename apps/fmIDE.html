  defineAction({ name:'connect', label:'Connect', category:'Connect', icon:'→', returns:'edge',
    desc:'Draws an arrow from one node to another. Block instances take a port: its name or 1-based number.',
    params:[ P('from','node'), P('to','node'), P('fromPort','string',{ def:'', label:'from port', help:'block outputs only' }),
      P('toPort','string',{ def:'', label:'to port', help:'block inputs only' }) ],
    run(a){
      const A = onActiveCanvas(a.from), B = onActiveCanvas(a.to);
      if(A === B) fail('A node cannot be connected to itself.');
      let fp = null, tp = null;
      if(A.type === 'blockInstance') fp = resolvePort(A, a.fromPort, 'out');
      else if(a.fromPort !== '') fail(`${describeNode(A)} has no output ports — leave "from port" empty.`);
      if(B.type === 'blockInstance') tp = resolvePort(B, a.toPort, 'in');
      else if(a.toPort !== '') fail(`${describeNode(B)} has no input ports — leave "to port" empty.`);
      if(tp === null){
        const dup = edges.find(e => e.from === A.id && e.to === B.id && (fp == null ? e.fromPort == null : e.fromPort === fp) && e.toPort == null);
        if(dup) return NOOP;
      }
      pushHistory();
      if(tp !== null) edges = edges.filter(e => !(e.to === B.id && e.toPort === tp));
      const edge = { id: uid('e'), from: A.id, to: B.id };
      if(fp !== null) edge.fromPort = fp;
      if(tp !== null) edge.toPort = tp;
      edges.push(edge);
      clearComputed();
      return edge.id;
    },
    recordAs(a){
      const out = Object.assign({}, a);
      [['fromPort', a.from, 'out'], ['toPort', a.to, 'in']].forEach(([k, n, dir]) => {
        if(n.type !== 'blockInstance' || !/^\d+$/.test(String(a[k]))) return;
        const def = canvases.find(c => c.id === n.blockDefCanvasId);
        const ports = blockPortsOf(def)[dir === 'in' ? 'inputs' : 'outputs'];
        const idx = Number(a[k]) - 1;
        const nm = ports[idx] ? portLabel(ports[idx], idx, dir) : '';
        if(nm && ports.filter((p, i) => portLabel(p, i, dir).toLowerCase() === nm.toLowerCase()).length === 1 && !/^\d+$/.test(nm)) out[k] = nm;
      });
      return { name:'connect', args: out };
    } });

  // The function library through fm actions (the Functions manager uses them too, so macros
  // record what it does). References are "Name" (the latest version), "Name@latest",
  // "Name@3", the same with the family id, or { family, version, versionId }.

  // A definition as the actions return it (a copy; the text is data, never run).
  function functionInfo(d){
    const parsed = parseFunctionText(d.text);
    return { family: d.family, version: d.version, versionId: d.versionId, name: functionNameOf(d),
      inputs: parsed.ok ? parsed.params.slice() : [], readable: parsed.ok, text: d.text,
      description: d.description, note: d.note, latest: isLatestFunction(d),
      calls: d.calls.map(c => ({ name: c.name, family: c.family, version: c.version, versionId: c.versionId })) };
  }
  // fm actions that take a file object as their first input also accept { file, … } (the fm
  // wrapper passes a lone object as the first input when that input is JSON).
  function unwrapFileArgs(a){
    if(a.file && typeof a.file === 'object' && !a.file.kind && !Array.isArray(a.file.functions) && a.file.file) Object.assign(a, a.file);

  defineAction({ name:'saveFunction', label:'Save Function', category:'Insert', icon:'ƒ', returns:'value', tx:false,
    desc:'Saves a function to your library: text is the whole definition, like "Margin(Revenue, Cost) = (Revenue - Cost) / Revenue". A name already used fails unless newVersionOf names that function (its next version). calls pins the functions it calls, like {"Margin": "Margin@1"}; without it a new version keeps the pins of the latest version, and a name one function has takes its latest version. Returns "Name@version".',

    run(a){
      const base = a.newVersionOf.trim() ? latestFunctionOf(resolveFunctionRef(a.newVersionOf).family) : null;

      if(a.calls != null){
        if(typeof a.calls !== 'object' || Array.isArray(a.calls)) fail('calls must be like {"Margin": "Margin@1"}.');
        Object.keys(a.calls).forEach(k => { picks[k.trim().toLowerCase()] = resolveFunctionRef(a.calls[k]); });

      if(check.problem) fail(check.problem.message + (typeof check.problem.at === 'number' && !check.parsed.ok ? ` (at character ${check.problem.at + 1})` : ''));
      if(!base){
        const taken = functionFamiliesNamed(check.parsed.name)[0];
        if(taken) fail(`There is already a function called ${functionLabel(taken)}. Choose another name, or use newVersionOf to save its next version.`);

  function isMac(){
    const p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent || '';
    return /Mac|iPhone|iPad|iPod/i.test(p);
  }
  // Human-readable combo: "⌃⌥⇧⌘R" on a Mac (Apple's modifier order), "Ctrl+Alt+Shift+R" elsewhere.
  function prettyCombo(combo){
    if(!combo) return '';
    const tokens = combo.split('+');
    let key = tokens.pop();
    if(key === '' && combo.endsWith('+')) key = '+';
    const mods = new Set(tokens);
    const mac = isMac();
    const keyNames = mac
      ? { Plus:'+', Escape:'⎋', Delete:'⌦', Backspace:'⌫', Enter:'↩', Tab:'⇥', Space:'Space', ArrowUp:'↑', ArrowDown:'↓', ArrowLeft:'←', ArrowRight:'→', PageUp:'⇞', PageDown:'⇟', Home:'↖', End:'↘' }
      : { Plus:'+', Escape:'Esc', Delete:'Del', ArrowUp:'↑', ArrowDown:'↓', ArrowLeft:'←', ArrowRight:'→' };
    const k = keyNames[key] || key;
    if(mac){
      return (mods.has('Ctrl') ? '⌃' : '') + (mods.has('Alt') ? '⌥' : '') + (mods.has('Shift') ? '⇧' : '') + (mods.has('Mod') || mods.has('Meta') ? '⌘' : '') + k;
    }
    const out = [];
    if(mods.has('Mod') || mods.has('Ctrl')) out.push('Ctrl');
    if(mods.has('Alt')) out.push('Alt');
    if(mods.has('Shift')) out.push('Shift');
    if(mods.has('Meta')) out.push('Win');
    out.push(k);
    return out.join('+');
  }
  function triggerLabel(t){
    t = t || keytipTrigger;
    if(t.type === 'tap'){

      return 'tap ' + (names[t.key] || t.key);
    }
    return prettyCombo(t.combo);
  }

  // ---------- KeyTips ----------
  // Tap the trigger key (Alt / Option by default; configurable) to show a letter badge on
  // every tab and QAT button; type a tab's letter to show its commands' badges; type a
  // command's letters to run it. Esc goes back a level. Holding Alt and pressing a
  // letter (e.g. Alt+H) jumps straight in, like Office.
  const keytips = { active:false, level:null, tabId:null, buffer:'', entries:[], armed:false, layer:null, hint:null, openedFlyout:false };

  function keytipChars(label){
    const up = String(label || '').toUpperCase();
    const words = up.split(/[^A-Z0-9]+/).filter(Boolean);
    const out = [];
    words.forEach(w => out.push(w[0]));
    up.replace(/[^A-Z0-9]/g, '').split('').forEach(ch => out.push(ch));
    return out;
  }

  // Assigns 1–2 character KeyTips to entries in one scope. Fixed tips win; auto tips use a
  // letter from the label, then any free letter, then two letters that don't collide with
  // any single-letter tip (so typing is never ambiguous).
  function assignKeytips(entries, reserved){
    const used = new Set(reserved || []);
    entries.forEach(e => { if(e.fixed){ e.key = e.fixed.toUpperCase(); used.add(e.key); } });
    const singles = () => new Set(Array.from(used).filter(k => k.length === 1));
    entries.forEach(e => {
      if(e.key) return;
      const cand = keytipChars(e.label).concat('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''));
      const hit = cand.find(ch => !used.has(ch) && !Array.from(used).some(k => k.length > 1 && k[0] === ch));
      if(hit){ e.key = hit; used.add(hit); return; }
      const s1 = singles();
      const first = keytipChars(e.label).concat('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')).filter(ch => !s1.has(ch));
      const second = keytipChars(e.label).concat('ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split(''));
      outer: for(const a of first){ for(const b of second){ if(!used.has(a + b)){ e.key = a + b; used.add(e.key); break outer; } } }
    });
    return entries;
  }

  function keytipsTopEntries(){
    const entries = ribbonTabEls.map(t => ({ kind:'tab', el: t.el, tab: t.tab, label: t.tab.label, fixed: t.tab.keytip || null }));
    const qatBtns = ribbonButtons.filter(b => b.scope === 'qat');
    const qatKeys = qatBtns.map((b, i) => i < 9 ? String(i + 1) : ('0' + (i - 8)));
    assignKeytips(entries, qatKeys);
    qatBtns.forEach((b, i) => entries.push({ kind:'cmd', el: b.el, cmdId: b.cmdId, key: qatKeys[i] }));
    return entries;
  }
  function keytipsTabEntries(){
    const entries = ribbonButtons.filter(b => b.scope === 'tab').map(b => {
      const c = getCommand(b.cmdId);
      return { kind:'cmd', el: b.el, cmdId: b.cmdId, label: b.item.label || c.short || c.label, fixed: b.item.keytip || null };
    });
    return assignKeytips(entries, []);
  }

  function keytipsStart(){
    if(document.querySelector('.modal-overlay, .launcher-overlay')) return false;
    keytips.active = true;
    keytips.level = 'top';
    keytips.buffer = '';
    keytips.openedFlyout = false;
    keytipsBuildEntries();
    return true;
  }
  function keytipsBuildEntries(){ keytipsRedraw(); }
  function keytipsRedraw(){
    if(!keytips.layer){ keytips.layer = el('div'); keytips.layer.id = 'keytipLayer'; document.body.appendChild(keytips.layer); }
    keytips.layer.innerHTML = '';
    // rebuilt every time: the ribbon may have re-rendered (assignment is deterministic)
    keytips.entries = keytips.level === 'top' ? keytipsTopEntries() : keytipsTabEntries();
    keytips.entries.forEach(e => {
      if(!e.el || !e.el.isConnected) return;
      const r = e.el.getBoundingClientRect();
      if(r.width === 0 && r.height === 0) return;
      const b = el('div', 'keytip');
      const matches = e.key.startsWith(keytips.buffer);
      if(!matches) b.classList.add('dim');
      if(keytips.buffer && matches){
        b.appendChild(el('span', 'typed', e.key.slice(0, keytips.buffer.length)));
        b.appendChild(document.createTextNode(e.key.slice(keytips.buffer.length)));
      } else b.textContent = e.key;
      const disabled = e.kind === 'cmd' && e.el.disabled;
      if(disabled) b.style.opacity = '.45';
      if(e.cmdId) b.dataset.cmd = e.cmdId;
      if(e.el.classList.contains('small')){
        // small buttons: badge sits on the icon so the label stays readable
        b.style.left = (r.left + 13) + 'px';
        b.style.top = (r.top + r.height / 2) + 'px';
        b.style.transform = 'translate(-50%, -50%)';
      } else {
        b.style.left = (r.left + r.width / 2) + 'px';
        b.style.top = (e.kind === 'tab' ? r.bottom - 4 : r.bottom + 1) + 'px';
        if(e.kind !== 'tab') b.style.transform = 'translate(-50%, -50%)';
      }
      keytips.layer.appendChild(b);
    });
    const hint = el('div', 'keytip-hint', keytips.level === 'top'
      ? 'KeyTips — type a tab letter (or a number for Quick Access). Esc to exit.'
      : 'KeyTips — type the letters of a command. Esc to go back.');
    keytips.layer.appendChild(hint);
  }
  function keytipsExit(){
    keytips.active = false;
    keytips.buffer = '';
    keytips.entries = [];
    if(keytips.layer){ keytips.layer.remove(); keytips.layer = null; }
    if(keytips.openedFlyout){ keytips.openedFlyout = false; closeRibbonFlyout(); }
  }
  function keytipsBack(){
    if(keytips.level === 'tab'){
      keytips.level = 'top';
      keytips.buffer = '';
      if(keytips.openedFlyout){ keytips.openedFlyout = false; closeRibbonFlyout(); }
      keytipsBuildEntries();
    } else keytipsExit();
  }
  function keytipsType(ch){
    keytips.buffer += ch;
    const cands = keytips.entries.filter(e => e.key.startsWith(keytips.buffer));
    if(cands.length === 0){ keytips.buffer = ''; keytipsRedraw(); return; }
    const exact = cands.find(e => e.key === keytips.buffer);
    if(exact){ keytipsActivate(exact); return; }
    keytipsRedraw();
  }
  function keytipsActivate(e){
    if(e.kind === 'tab'){
      ribbonState.activeTab = e.tab.id;
      if(ribbonState.collapsed){ ribbonState.flyout = true; keytips.openedFlyout = true; }
      renderRibbon();
      keytips.level = 'tab';
      keytips.tabId = e.tab.id;
      keytips.buffer = '';
      keytipsBuildEntries();
      return;
    }
    const c = getCommand(e.cmdId);
    if(c && !commandEnabled(c)){ keytips.buffer = ''; keytipsRedraw(); toast(`"${commandLabel(c)}" isn't available right now.`); return; }
    keytipsExit();
    runCommand(e.cmdId);
  }
  function keyCharOf(ev){
    if(/^Key[A-Z]$/.test(ev.code)) return ev.code.slice(3);
    if(/^Digit[0-9]$/.test(ev.code)) return ev.code.slice(5);
    if(ev.key && ev.key.length === 1 && /[a-z0-9]/i.test(ev.key)) return ev.key.toUpperCase();
    return null;
  }
  function focusIsTyping(){
    const a = document.activeElement;
    return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable));
  }
  let keytipCaptureListener = null; // set while the trigger-capture UI is listening

  window.addEventListener('keydown', (ev) => {
    if(keytipCaptureListener){ keytipCaptureListener(ev); return; }
    if(keytips.active){
      ev.preventDefault();
      ev.stopPropagation();
      if(ev.key === 'Escape'){ keytipsBack(); return; }
      if(ev.key === 'Backspace'){ keytips.buffer = keytips.buffer.slice(0, -1); keytipsRedraw(); return; }
      if(keytipTrigger.type === 'tap' && ev.key === keytipTrigger.key){ keytips.armed = true; return; }
      if(keytipTrigger.type === 'combo' && normalizeCombo(ev) === keytipTrigger.combo){ keytipsExit(); return; }
      const ch = keyCharOf(ev);
      if(ch) keytipsType(ch);
      return;
    }
    if(keytipTrigger.type === 'tap'){
      if(ev.key === keytipTrigger.key){
        const others = (ev.ctrlKey && ev.key !== 'Control') || (ev.metaKey && ev.key !== 'Meta') || (ev.shiftKey && ev.key !== 'Shift') || (ev.altKey && ev.key !== 'Alt');
        keytips.armed = !ev.repeat && !others;
        if(keytipTrigger.key === 'Alt' && keytips.armed) ev.preventDefault();
        return;
      }
      keytips.armed = false;
      // Alt+letter chord (Office style): jump straight into a tab
      if(keytipTrigger.key === 'Alt' && ev.altKey && !ev.ctrlKey && !ev.metaKey && !ev.shiftKey){
        const ch = keyCharOf(ev);
        if(ch && !shortcutMap[normalizeCombo(ev)] && !focusIsTyping() && keytipsStart()){
          ev.preventDefault(); ev.stopPropagation();
          keytipsType(ch);
        }
      }
      return;
    }
    if(keytipTrigger.type === 'combo' && normalizeCombo(ev) === keytipTrigger.combo){
      if(focusIsTyping()) return;
      ev.preventDefault(); ev.stopPropagation();
      keytipsStart();
    }
  }, true);

  window.addEventListener('keyup', (ev) => {
    if(keytipCaptureListener) return;
    if(keytipTrigger.type !== 'tap' || ev.key !== keytipTrigger.key) return;
    const wasArmed = keytips.armed;
    keytips.armed = false;
    if(!wasArmed) return;
    ev.preventDefault();
    if(keytips.active){ keytipsExit(); return; }
    if(focusIsTyping()) return;
    keytipsStart();
  }, true);
  window.addEventListener('mousedown', () => { keytips.armed = false; if(keytips.active) keytipsExit(); }, true);
  window.addEventListener('blur', () => { keytips.armed = false; if(keytips.active) keytipsExit(); });

  // =====================================================================================
  // ---------- shared parameter form (Command Launcher + Macro Builder) ----------
  // =====================================================================================
  function refSuggestions(p, extraVars){
    const out = [];
    if(p.type === 'node' || p.type === 'nodes'){
      const seen = {};
      nodes.forEach(n => { const nm = refNameOf(n); if(nm && isPlainRefName(nm)) seen[nm] = (seen[nm] || 0) + 1; });
      Object.keys(seen).filter(k => seen[k] === 1).sort().forEach(k => out.push(k));
      out.push('@sel', '@sel[0]', '@sel[1]', '@cur', '@all');
      if(p.type === 'node' && selectedNodeIds.size === 1) out.push('#' + Array.from(selectedNodeIds)[0]);
    } else if(p.type === 'canvas'){
      canvases.forEach(c => out.push(c.name));
    } else if(p.type === 'template'){
      templateFamilies().forEach(t => {
        out.push(t.name);
        familyVersions(t.family).slice(1).forEach(o => out.push(t.name + '@' + o.version));
      });
    } else if(p.type === 'macro'){
      MACROS.forEach(m => out.push(m.name));
    }
    (extraVars || []).forEach(v => out.push('$' + v));
    return out;
  }

  let pformSeq = 0;
  // params: action param defs; values: {name: raw}; opts.onChange(name, raw); opts.vars (names)
  function buildParamForm(params, values, opts){
    opts = opts || {};
    const wrap = el('div', 'pform');
    const inputs = {};
    params.forEach(p => {
      const row = el('div', 'pform-row');
      const lab = el('label', '', p.label);
      row.appendChild(lab);
      let input;
      const cur = values[p.name];
      const defText = p.def === undefined ? (p.optional ? 'optional' : 'required') : (typeof p.def === 'function' ? 'auto' : String(p.def));
      if(p.type === 'enum'){
        input = el('select');
        if(p.def !== undefined || p.optional){
          const o = el('option', '', p.def !== undefined && typeof p.def !== 'function' ? `(default: ${p.def})` : '(default)');
          o.value = '';
          input.appendChild(o);
        }
        paramOptions(p).forEach(v => { const o = el('option', '', String(v)); o.value = String(v); input.appendChild(o); });
        input.value = cur == null ? '' : String(cur);
        if(input.value === '' && p.def === undefined && !p.optional && paramOptions(p).length) input.value = String(paramOptions(p)[0]);
      } else if(p.type === 'bool'){
        input = el('select');
        [['', p.def !== undefined ? `(default: ${p.def})` : '(choose)'], ['true','true'], ['false','false']].forEach(([v, t]) => {
          const o = el('option', '', t); o.value = v; input.appendChild(o);
        });
        input.value = cur === undefined || cur === null ? '' : String(cur);
      } else if(p.type === 'text' || p.type === 'json'){
        input = el('textarea');
        input.rows = p.type === 'json' ? 4 : 3;
        input.value = cur == null ? '' : (typeof cur === 'object' ? JSON.stringify(cur, null, 1) : String(cur));
        input.placeholder = defText;
      } else {
        input = el('input');
        input.type = 'text';
        input.value = cur == null ? '' : (Array.isArray(cur) ? cur.join(', ') : String(cur));
        input.placeholder = defText;
        const sugg = refSuggestions(p, opts.vars);
        if(sugg.length){
          const dl = el('datalist');
          dl.id = 'pformdl' + (++pformSeq);
          sugg.forEach(s => { const o = el('option'); o.value = s; dl.appendChild(o); });
          row.appendChild(dl);
          input.setAttribute('list', dl.id);
          input.setAttribute('autocomplete', 'off');
        }
      }
      input.dataset.param = p.name;
      input.addEventListener('keydown', ev => ev.stopPropagation());
      const fire = () => { if(opts.onChange) opts.onChange(p.name, readOne(p, input)); };
      input.addEventListener('input', fire);
      input.addEventListener('change', fire);
      row.appendChild(input);
      wrap.appendChild(row);
      const helpBits = [];
      if(p.help) helpBits.push(p.help);
      if(p.coord) helpBits.push('expressions like 100 + $i*80 are allowed');
      if(helpBits.length){ const h = el('div', 'pform-help', helpBits.join(' · ')); wrap.appendChild(h); }
      inputs[p.name] = input;
    });
    function readOne(p, input){
      const v = input.value;
      if(p.type === 'nodes' && v.includes(',')) return v.split(',').map(s => s.trim()).filter(Boolean);
      return v;
    }
    return {
      el: wrap,
      read(){
        const out = {};
        params.forEach(p => {
          const v = readOne(p, inputs[p.name]);
          if(v === '' || (Array.isArray(v) && v.length === 0)){
            if(STRINGY.has(p.type) && p.def === undefined && !p.optional) out[p.name] = '';
            return;
          }
          out[p.name] = v;
        });
        return out;
      },
      focusFirst(){ const f = wrap.querySelector('input,select,textarea'); if(f){ f.focus(); if(f.select) f.select(); } },
    };
  }

  // =====================================================================================
  // ---------- Command Launcher ----------
  // =====================================================================================
  // Ctrl/Cmd+K (configurable): fuzzy-search every command, parameterised action and macro,
  // then Enter/click to run. Actions with arguments open an inline form first.
  let launcherRecent = [];
  const LAUNCHER_RECENT_MAX = 8;

  function launcherItems(){
    const items = [];
    COMMANDS.forEach(c => {
      if(c.id.startsWith('macro:')) return;
      items.push({ key:'cmd:' + c.id, icon: c.icon || '•', label: commandLabel(c), search: c.label + ' ' + c.category + (c.short ? ' ' + c.short : ''),
        category: c.category, shortcut: shortcutBindings[c.id] || '', enabled: commandEnabled(c),
        run: () => runCommand(c.id) });
    });
    ACTION_LIST.forEach(d => {
      if(d.params.length === 0) return; // zero-argument actions are already covered by commands
      items.push({ key:'act:' + d.name, icon: d.icon || 'ƒ', label: d.label + '…', search: d.label + ' ' + d.name + ' ' + d.category,
        category: 'Action · ' + d.category, enabled: true, action: d });
    });
    MACROS.forEach(m => {
      items.push({ key:'mac:' + m.id, icon:'⚡', label: m.name, search: 'macro ' + m.name + ' ' + (m.description || ''),
        category:'Macro', shortcut: shortcutBindings['macro:' + m.id] || '', enabled: true,
        run: () => runMacroInteractive(m.id) });
    });
    return items;
  }

  // Returns { score, idx } or null. Contiguous and word-start matches score higher.
  function fuzzyMatch(q, text){
    const t = text.toLowerCase();
    q = q.toLowerCase().trim();
    if(!q) return { score: 0, idx: [] };
    const sub = t.indexOf(q);
    if(sub >= 0){
      const wordStart = sub === 0 || /[^a-z0-9]/.test(t[sub - 1]);
      return { score: 1000 - sub + (wordStart ? 200 : 0) - t.length * 0.1, idx: Array.from({ length: q.length }, (_, k) => sub + k) };
    }
    const idx = [];
    let ti = 0, score = 0, prev = -2;
    for(const ch of q){
      if(ch === ' ') continue;
      const found = t.indexOf(ch, ti);
      if(found < 0) return null;
      idx.push(found);
      if(found === prev + 1) score += 15;
      if(found === 0 || /[^a-z0-9]/.test(t[found - 1])) score += 25;
      score -= (found - ti);
      prev = found; ti = found + 1;
    }
    return { score, idx };
  }

  function highlightLabel(label, idx){
    const frag = document.createDocumentFragment();
    const set = new Set(idx.filter(i => i < label.length));
    let buf = '';
    for(let i = 0; i < label.length; i++){
      if(set.has(i)){
        if(buf){ frag.appendChild(document.createTextNode(buf)); buf = ''; }
        frag.appendChild(el('b', '', label[i]));
      } else buf += label[i];
    }
    if(buf) frag.appendChild(document.createTextNode(buf));
    return frag;
  }

  function rememberLauncherItem(key){
    launcherRecent = [key].concat(launcherRecent.filter(k => k !== key)).slice(0, LAUNCHER_RECENT_MAX);
  }

  let launcherOpen = false;
  function openLauncher(){
    if(launcherOpen) return;
    if(keytips.active) keytipsExit();
    launcherOpen = true;
    const overlay = el('div', 'launcher-overlay');
    const box = el('div', 'launcher');
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const prevFocus = document.activeElement;

    let all = launcherItems();
    let shown = [];
    let selIdx = 0;
    let mode = 'init';

    function close(){
      launcherOpen = false;
      overlay.remove();
      document.removeEventListener('keydown', onDocKey, true);
      if(prevFocus && prevFocus.focus && document.body.contains(prevFocus)) try{ prevFocus.focus(); }catch(err){}
    }
    overlay.addEventListener('mousedown', ev => { if(ev.target === overlay) close(); });

    const input = el('input', 'lq');
    input.placeholder = 'Type a command, action or macro…';
    input.setAttribute('autocomplete', 'off');
    input.spellcheck = false;
    const res = el('div', 'lres');
    const foot = el('div', 'lfoot');
    foot.appendChild(el('span', '', '↑↓ select'));
    foot.appendChild(el('span', '', '↵ run'));
    foot.appendChild(el('span', '', 'Esc close'));
    foot.appendChild(el('span', '', `KeyTips: ${triggerLabel()}`));

    function renderList(){
      if(mode !== 'list' || input.parentNode !== box){
        box.innerHTML = '';
        box.appendChild(input);
        box.appendChild(res);
        box.appendChild(foot);
      }
      mode = 'list';
      res.innerHTML = '';
      const q = input.value.trim();
      if(!q){
        const recent = launcherRecent.map(k => all.find(i => i.key === k)).filter(Boolean);
        const rest = all.filter(i => !recent.includes(i));
        const catRank = c => { const base = c.replace(/^Action · /, ''); const r = CATEGORY_ORDER.indexOf(base); return (c.startsWith('Action') ? 100 : 0) + (c === 'Macro' ? 50 : 0) + (r < 0 ? 40 : r); };
        rest.sort((a, b) => catRank(a.category) - catRank(b.category));
        shown = recent.concat(rest).map(i => ({ item: i, idx: [] }));
        if(recent.length) res.appendChild(el('div', 'lsec', 'Recently used'));
        let lastCat = null;
        shown.forEach((s, k) => {
          if(k === recent.length) lastCat = null;
          if(k >= recent.length && s.item.category !== lastCat){ lastCat = s.item.category; res.appendChild(el('div', 'lsec', lastCat)); }
          res.appendChild(rowEl(s, k));
        });
      } else {
        shown = all.map(i => {
          const m = fuzzyMatch(q, i.label) || fuzzyMatch(q, i.search);
          if(!m) return null;
          const onLabel = fuzzyMatch(q, i.label);
          return { item: i, score: m.score + (i.enabled ? 0 : -300) + (launcherRecent.includes(i.key) ? 30 : 0), idx: onLabel ? onLabel.idx : [] };
        }).filter(Boolean).sort((a, b) => b.score - a.score);
        if(shown.length === 0) res.appendChild(el('div', 'lsec', 'No matching commands'));
        shown.forEach((s, k) => res.appendChild(rowEl(s, k)));
      }
      selIdx = Math.min(selIdx, Math.max(0, shown.length - 1));
      markSel();
      input.focus();
    }
    function rowEl(s, k){
      const i = s.item;
      const row = el('div', 'lrow' + (i.enabled ? '' : ' disabled'));
      row.dataset.k = k;
      row.appendChild(el('span', 'lic', i.icon));
      const lb = el('span', 'llabel');
      lb.appendChild(highlightLabel(i.label, s.idx));
      row.appendChild(lb);
      if(input.value.trim()) row.appendChild(el('span', 'lcat', i.category));
      if(i.shortcut) row.appendChild(el('span', 'lkbd', prettyCombo(i.shortcut)));
      row.addEventListener('mousemove', () => { if(selIdx !== k){ selIdx = k; markSel(); } });
      row.addEventListener('click', () => { selIdx = k; choose(); });
      return row;
    }
    function markSel(){
      res.querySelectorAll('.lrow').forEach(r => r.classList.toggle('sel', +r.dataset.k === selIdx));
      const r = res.querySelector('.lrow.sel');
      if(r) r.scrollIntoView({ block:'nearest' });
    }
    function choose(){
      const s = shown[selIdx];
      if(!s) return;
      const i = s.item;
      if(!i.enabled){ toast(`"${i.label}" isn't available right now.`); return; }
      if(i.action){ renderForm(i); return; }
      rememberLauncherItem(i.key);
      close();
      i.run();
    }

    function renderForm(item){
      mode = 'form';
      const d = item.action;
      box.innerHTML = '';
      const form = el('div', 'lform');
      form.appendChild(el('h4', '', d.icon + '  ' + d.label));
      form.appendChild(el('p', 'ldesc', (d.desc ? d.desc + ' ' : '') + 'Blank fields use their default. Node fields accept a name, #id, @sel or @all.'));
      const pf = buildParamForm(d.params, {}, {});
      form.appendChild(pf.el);
      box.appendChild(form);
      const err = el('div', 'lerr');
      box.appendChild(err);
      const f2 = el('div', 'lfoot');
      f2.appendChild(el('span', '', '↵ run'));
      f2.appendChild(el('span', '', 'Esc back'));
      const runBtn = el('button', 'mbtn primary', 'Run');
      runBtn.style.marginLeft = 'auto';
      f2.appendChild(runBtn);
      box.appendChild(f2);
      function go(){
        err.textContent = '';
        try{
          const result = callAction(d.name, pf.read());
          rememberLauncherItem(item.key);
          close();
          if(d.returns === 'node' && result) selectNodesOnly([result]);
          else if(d.returns === 'nodes' && Array.isArray(result)) selectNodesOnly(result);
          else if(d.returns === 'value') toast(`${d.label}: ${Array.isArray(result) ? result.map(formatNum).join(', ') : formatNum(result)}`, 4000);
        }catch(ex){
          err.textContent = ex instanceof FmError ? ex.message : ('Error: ' + ex.message);
        }
      }
      runBtn.addEventListener('click', go);
      form.addEventListener('keydown', ev => {
        if(ev.key === 'Enter' && ev.target.tagName !== 'TEXTAREA'){ ev.preventDefault(); go(); }
        if(ev.key === 'Enter' && ev.target.tagName === 'TEXTAREA' && (ev.ctrlKey || ev.metaKey)){ ev.preventDefault(); go(); }
      }, true);
      pf.focusFirst();
    }

    function onDocKey(ev){
      if(ev.key === 'Escape'){
        ev.preventDefault(); ev.stopPropagation();
        if(mode === 'form') renderList(); else close();
        return;
      }
      if(mode !== 'list') return;
      if(ev.key === 'ArrowDown'){ ev.preventDefault(); selIdx = Math.min(shown.length - 1, selIdx + 1); markSel(); }
      else if(ev.key === 'ArrowUp'){ ev.preventDefault(); selIdx = Math.max(0, selIdx - 1); markSel(); }
      else if(ev.key === 'Enter'){ ev.preventDefault(); ev.stopPropagation(); choose(); }
    }
    document.addEventListener('keydown', onDocKey, true);
    input.addEventListener('input', () => { selIdx = 0; renderList(); });
    input.addEventListener('keydown', ev => { if(!['ArrowDown','ArrowUp','Enter','Escape'].includes(ev.key)) ev.stopPropagation(); });
    renderList();
  }

  // =====================================================================================
  // ---------- Macros: model · recorder · runner ----------
  // =====================================================================================
  // A macro is a tree of steps:
  //   { kind:'action',  action:'createRect', args:{...}, assign:'r1' }   run one fm action
  //   { kind:'group',   label, children:[...] }                          just organises steps
  //   { kind:'repeat',  count:'3', var:'i', children:[...] }             $i = 1..count
  //   { kind:'forEach', nodes:'@sel', var:'item', children:[...] }       $item = each node's id
  //   { kind:'set',     var:'x', value:'100 + $i*80' }                   set a variable
  //   { kind:'comment', text }
  // Every step may have disabled:true and comment:'...'.
  let MACROS = [];
  let nextMacroNum = 1;
  let lastRunMacroId = null;
  let stepSeq = 1;
  function newStepId(){ return 's' + (stepSeq++) + Math.random().toString(36).slice(2, 6); }
  const CONTAINER_KINDS = new Set(['group', 'repeat', 'forEach']);

  function walkSteps(steps, fn, parentStep){
    (steps || []).forEach((st, i) => { fn(st, steps, i, parentStep || null); if(CONTAINER_KINDS.has(st.kind)) walkSteps(st.children, fn, st); });
  }
  function findStep(steps, id){
    let hit = null;
    walkSteps(steps, (st, arr, i, parent) => { if(!hit && st.id === id) hit = { step: st, arr, index: i, parent }; });
    return hit;
  }
  function normalizeSteps(steps){
    return (Array.isArray(steps) ? steps : []).filter(s => s && typeof s === 'object').map(s => {
      const st = Object.assign({}, s, { id: newStepId() });
      if(!st.kind) st.kind = 'action';
      if(st.kind === 'action') st.args = Object.assign({}, st.args || {});
      if(CONTAINER_KINDS.has(st.kind)) st.children = normalizeSteps(st.children);
      return st;
    });
  }
  function createMacro(name){
    const m = { id: 'mac' + Date.now().toString(36) + (nextMacroNum++), name: name || ('Macro ' + (MACROS.length + 1)), description:'', relative:false, pinned:false, steps:[] };
    MACROS.push(m);
    return m;
  }
  function countSteps(steps){ let n = 0; walkSteps(steps, () => n++); return n; }

  function fmtArg(v){
    if(Array.isArray(v)) return '[' + v.map(fmtArg).join(', ') + ']';
    if(v && typeof v === 'object') return JSON.stringify(v);
    const s = String(v);
    return /[\s,=]/.test(s) || s === '' ? JSON.stringify(s) : s;
  }
  function stepSummaryText(st){
    switch(st.kind){
      case 'action': {
        const args = Object.keys(st.args || {}).map(k => k + '=' + fmtArg(st.args[k])).join(' ');
        return st.action + (args ? ' ' + args : '') + (st.assign ? '  → $' + st.assign : '');
      }
      case 'group': return 'Group: ' + (st.label || '(untitled)');
      case 'repeat': return `Repeat ${st.count || 1}× (as $${st.var || 'i'})`;
      case 'forEach': return `For each node in ${fmtArg(st.nodes || '@sel')} (as $${st.var || 'item'})`;
      case 'set': return `$${st.var || 'x'} = ${st.value == null ? '' : st.value}`;
      case 'comment': return '# ' + (st.text || '');
    }
    return st.kind;
  }

  // ---------- recorder ----------
  const recorder = {
    active:false, steps:[], created:new Map(), createdCanvases:new Map(), counter:0,
    selRefs:false, initialSel:[], selCanvasId:null, origin:null, macroId:null, isNewMacro:false, histAtStart:0,

    refOf(n){
      if(this.created.has(n.id)) return this.created.get(n.id);
      if(this.selRefs && n && this.initialSel.includes(n.id)) return `@sel[${this.initialSel.indexOf(n.id)}]`;
      const c = canvasOfNode(n);
      const nm = refNameOf(n);
      if(nm && isPlainRefName(nm) && c){
        try{ if(resolveOneNode(nm, c) === n) return nm; }catch(err){ /* ambiguous: fall back to id */ }
      }
      return '#' + n.id;
    },
    refsOf(list){
      const ids = list.map(n => n.id);
      if(this.selRefs && ids.length && ids.length === this.initialSel.length && ids.every(id => this.initialSel.includes(id))) return '@sel';
      return list.map(n => this.refOf(n));
    },
    canvasRef(c){
      if(this.createdCanvases.has(c.id)) return this.createdCanvases.get(c.id);
      const same = canvases.filter(x => x.name.trim().toLowerCase() === c.name.trim().toLowerCase());
      return same.length === 1 && isPlainRefName(c.name) ? c.name : '#' + c.id;
    },
    convertArgs(name, args){
      const def = ACTIONS[name];
      const out = {};
      def.params.forEach(p => {
        if(!(p.name in args)) return;
        let v = args[p.name];
        if(v === null || v === undefined) return;
        if(p.type === 'node') v = this.refOf(v);
        else if(p.type === 'nodes') v = this.refsOf(v);
        else if(p.type === 'canvas') v = this.canvasRef(v);
        else if(p.type === 'template') v = templateRefText(v);
        else if(p.type === 'macro') v = v.name;
        else if(p.coord && this.origin && typeof v === 'number') v = v - this.origin[p.coord];
        if(typeof v === 'number') v = Math.round(v * 1000) / 1000;
        const simple = !['node', 'nodes', 'canvas', 'template', 'macro'].includes(p.type);
        if(simple && p.def !== undefined && typeof p.def !== 'function' && String(v) === String(p.def)) return;
        out[p.name] = v;
      });
      return out;
    },
    push(name, args, result){
      const def = ACTIONS[name];
      const step = { id: newStepId(), kind:'action', action: name, args };
      if(def.returns && def.returns !== 'value' && def.returns !== 'edge' && result != null){
        const v = (def.returns === 'canvas' ? 'c' : 'r') + (++this.counter);
        step.assign = v;
        if(Array.isArray(result)) result.forEach((id, i) => this.created.set(id, `$${v}[${i}]`));
        else if(def.returns === 'canvas') this.createdCanvases.set(result, '$' + v);
        else this.created.set(result, '$' + v);
      }
      if(!this.coalesce(step)) this.steps.push(step);
      refreshCommandStates();
    },
    // record an interaction that was already applied directly (e.g. a mouse drag)
    add(name, resolvedArgs, result){
      if(!this.active) return;
      this.push(name, this.convertArgs(name, resolvedArgs), result);
    },
    // folds follow-up edits into the step that created the node, and merges repeats
    coalesce(step){
      const last = this.steps[this.steps.length - 1];
      if(!last || last.kind !== 'action') return false;
      const A = step.args, L = last.args;
      const sameList = (a, b) => JSON.stringify(Array.isArray(a) ? a : [a]) === JSON.stringify(Array.isArray(b) ? b : [b]);
      if(last.assign){
        const ref = '$' + last.assign;
        if(step.action === 'setText' && last.action === 'createRect' && A.node === ref){
          const parts = textParts({ text: A.text });
          ['name', 'value', 'uom'].forEach(k => { if(parts[k] !== '' || k !== 'uom') L[k] = parts[k]; else delete L[k]; });
          if(L.name === 'New Node') delete L.name;
          if(L.value === '0') delete L.value;
          return true;
        }
        if(step.action === 'setOperator' && last.action === 'createOperator' && A.node === ref){ L.op = A.op; return true; }
        if(step.action === 'setShift' && last.action === 'createPeriodShift' && A.node === ref){ L.shift = A.shift; return true; }
        if(step.action === 'move' && /^create/.test(last.action) && sameList(A.nodes, ref) && typeof L.x === 'number' && typeof L.y === 'number'){
          L.x = Math.round((L.x + (A.dx || 0)) * 1000) / 1000; L.y = Math.round((L.y + (A.dy || 0)) * 1000) / 1000; return true;
        }
        if(step.action === 'resize' && last.action === 'createRect' && A.node === ref){ L.w = A.w; L.h = A.h; return true; }
      }
      if(step.action === 'move' && last.action === 'move' && sameList(A.nodes, L.nodes)){
        L.dx = (L.dx || 0) + (A.dx || 0); L.dy = (L.dy || 0) + (A.dy || 0);
        if(!L.dx) delete L.dx;
        if(!L.dy) delete L.dy;
        return true;
      }
      if((step.action === 'setPeriod' || step.action === 'switchCanvas') && last.action === step.action){ last.args = A; return true; }
      if(step.action === 'setText' && last.action === 'setText' && L.node === A.node){ L.text = A.text; return true; }
      return false;
    },
    onUndo(){
      if(history.length <= this.histAtStart || !this.steps.length) return;
      const isMut = s => s.kind === 'action' && ACTIONS[s.action] && ACTIONS[s.action].mutates !== false;
      while(this.steps.length && !isMut(this.steps[this.steps.length - 1])) this.steps.pop();
      if(this.steps.length) this.steps.pop();
      toast('Undo — the last recorded step was removed.');
      refreshCommandStates();
    },
  };

  function viewCenter(){
    return { x: Math.round(viewport.scrollLeft + viewport.clientWidth / 2 - 85), y: Math.round(viewport.scrollTop + viewport.clientHeight / 2 - 32) };
  }
  // Origin for relative-coordinate macros: the selection's top-left corner, else the view centre.
  function computeOrigin(){
    const sel = selectedNodesList();
    if(sel.length){ const bb = boundingBoxOf(sel); return { x: Math.round(bb.minX), y: Math.round(bb.minY) }; }
    return viewCenter();
  }

  function startRecording(opts){
    if(recorder.active) return;
    let m = opts.macroId ? MACROS.find(x => x.id === opts.macroId) : null;
    recorder.isNewMacro = !m;
    if(!m){ m = createMacro(opts.name); m.relative = !!opts.relative; }
    recorder.macroId = m.id;
    recorder.steps = [];
    recorder.created = new Map();
    recorder.createdCanvases = new Map();
    let maxN = 0;
    walkSteps(m.steps, st => { const mm = /^[rc](\d+)$/.exec(st.assign || ''); if(mm) maxN = Math.max(maxN, +mm[1]); });
    recorder.counter = maxN;
    recorder.initialSel = Array.from(selectedNodeIds);
    recorder.selRefs = !!opts.selRefs && recorder.initialSel.length > 0;
    recorder.selCanvasId = activeCanvasId;
    recorder.origin = m.relative ? computeOrigin() : null;
    recorder.histAtStart = history.length;
    recorder.active = true;
    renderRibbon();
    toast('Recording — work on the canvas as usual. Click the red pill to stop.', 3500);
  }

  function stopRecording(){
    if(!recorder.active) return;
    recorder.active = false;
    const m = MACROS.find(x => x.id === recorder.macroId);
    const steps = recorder.steps;
    recorder.steps = [];
    if(!m){ renderRibbon(); return; }
    if(steps.length === 0){
      if(recorder.isNewMacro) MACROS = MACROS.filter(x => x !== m);
      syncMacroCommands();
      toast('Nothing was recorded.');
      return;
    }
    m.steps = m.steps.concat(steps);
    syncMacroCommands();
    saveWorkspace();
    showMacroBuilder(m.id, steps[0].id);
    mbSetStatus(`Recorded ${steps.length} step${steps.length === 1 ? '' : 's'}.`, 'ok');
  }

  function toggleRecordingQuick(){
    if(recorder.active) stopRecording();
    else showRecordDialog({});
  }

  // ---------- runner ----------
  function evalSetValue(v){
    if(typeof v === 'number') return v;
    const s = String(v == null ? '' : v).trim();
    if(/^\$[A-Za-z_]\w*(\[\d+\])?$/.test(s)) return lookupVar(s);
    try{ return evalNumber(s, 'value'); }catch(err){ return interpolate(s); }
  }

  function execSteps(steps){
    for(const st of steps || []){
      if(st.disabled) continue;
      try{
        switch(st.kind){
          case 'action': {
            const r = callAction(st.action, Object.assign({}, st.args || {}));
            if(st.assign) runCtx.vars[st.assign] = r;
            break;
          }
          case 'group': execSteps(st.children); break;
          case 'repeat': {
            const n = Math.floor(evalNumber(st.count == null || st.count === '' ? 1 : st.count, 'Repeat count'));
            if(n < 0) fail('Repeat count cannot be negative.');
            if(n > 5000) fail('Repeat count is limited to 5000.');
            const v = st.var || 'i';
            for(let k = 1; k <= n; k++){ runCtx.vars[v] = k; execSteps(st.children); }
            break;
          }
          case 'forEach': {
            const ids = resolveNodes(st.nodes == null || st.nodes === '' ? '@sel' : st.nodes).map(n => n.id);
            const v = st.var || 'item';
            ids.forEach((id, k) => { runCtx.vars[v] = id; runCtx.vars[v + 'Index'] = k + 1; execSteps(st.children); });
            break;
          }
          case 'set': runCtx.vars[st.var || 'x'] = evalSetValue(st.value); break;
          default: break;
        }
      }catch(err){
        if(!err.macroStepId){
          err.macroStepId = st.id;
          err.macroId = runCtx && runCtx.macro ? runCtx.macro.id : null;
          if(err instanceof FmError) err.message = `Step "${stepSummaryText(st)}" — ${err.message}`;
        }
        throw err;
      }
    }
  }

  function executeMacro(m, onlySteps){
    if(macroDepth >= 16) fail('Macros are nested too deeply — is a macro running itself?');
    const prev = runCtx;
    runCtx = { vars: {}, startSelection: prev ? prev.startSelection : Array.from(selectedNodeIds), origin: m.relative ? computeOrigin() : null, macro: m };
    macroDepth++;
    try{ execSteps(onlySteps || m.steps); }
    finally{ macroDepth--; runCtx = prev; }
  }

  defineAction({ name:'runMacro', label:'Run Macro', category:'Macros', icon:'⚡', batch:true,
    desc:'Runs another macro (as one undo step; if any step fails, nothing is changed).',
    params:[ P('macro','macro') ],
    run(a){ executeMacro(a.macro); } });

  function runMacroInteractive(id, onlyStepIds){
    const m = MACROS.find(x => x.id === id);
    if(!m) return false;
    lastRunMacroId = id;
    try{
      if(onlyStepIds){
        const steps = onlyStepIds.map(sid => { const f = findStep(m.steps, sid); return f && f.step; }).filter(Boolean);
        apiDepth++;
        try{ runBatch(() => executeMacro(m, steps)); } finally{ apiDepth--; }
      } else {
        callAction('runMacro', { macro: m });
      }
      refreshCommandStates();
      if(!mb.overlay) toast(`Macro "${m.name}" finished.`);
      return true;
    }catch(err){
      refreshCommandStates();
      const msg = (err instanceof FmError ? err.message : ('Error: ' + (err && err.message)));
      if(mb.overlay && mb.macroId === id){
        mb.errorStepId = err.macroStepId || null;
        if(err.macroStepId) mb.selStepId = err.macroStepId;
        renderMBTree(); renderMBProps();
        mbSetStatus('Stopped — nothing was changed. ' + msg, 'err');
      } else {
        showMessage(`Macro "${m.name}" stopped, and nothing was changed.\n\n${msg}`);
      }
      return false;
    }
  }

  // Keeps the COMMANDS list (and so shortcuts, launcher, ribbon) in step with MACROS.
  function syncMacroCommands(){
    for(let i = COMMANDS.length - 1; i >= 0; i--) if(COMMANDS[i].id.startsWith('macro:')) COMMANDS.splice(i, 1);
    MACROS.forEach(m => {
      COMMANDS.push({ id:'macro:' + m.id, label:'Macro: ' + m.name, short: m.name, icon:'⚡', category:'Macros', defaultShortcut:null,
        action:() => runMacroInteractive(m.id) });
    });
    Object.keys(shortcutBindings).forEach(k => { if(k.startsWith('macro:') && !getCommand(k)) delete shortcutBindings[k]; });
    COMMANDS.forEach(c => { if(!(c.id in shortcutBindings)) shortcutBindings[c.id] = c.defaultShortcut || null; });
    rebuildShortcutMap();
    syncPinnedMacrosIntoRibbon();
    renderRibbon();
  }
  function syncPinnedMacrosIntoRibbon(){
    const cfg = ribbonState.config;
    const alive = id => !id.startsWith('macro:') || MACROS.some(m => 'macro:' + m.id === id);
    cfg.qat = (cfg.qat || []).filter(alive);
    cfg.tabs.forEach(t => t.groups.forEach(g => { g.items = (g.items || []).filter(it => alive(it.cmd)); }));
    let g = null;
    cfg.tabs.forEach(t => t.groups.forEach(gg => { if(gg.id === 'myMacros') g = gg; }));
    const pinned = MACROS.filter(m => m.pinned);
    if(!g && pinned.length){
      let t = cfg.tabs.find(x => x.id === 'macros');
      if(!t){ t = { id:'macros', label:'Macros', keytip:'X', groups:[] }; cfg.tabs.push(t); }
      g = { label:'My Macros', id:'myMacros', items:[] };
      t.groups.push(g);
    }
    if(!g) return;
    g.items = g.items.filter(it => { const m = MACROS.find(x => 'macro:' + x.id === it.cmd); return !m || m.pinned; });
    pinned.forEach(m => { if(!g.items.some(it => it.cmd === 'macro:' + m.id)) g.items.push({ cmd:'macro:' + m.id, size:'large' }); });
  }

  // =====================================================================================
  // ---------- Macro Builder UI ----------
  // =====================================================================================
  const mb = { overlay:null, macroId:null, selStepId:null, errorStepId:null, collapsed:new Set(), els:{}, dragId:null };
  function mbMacro(){ return MACROS.find(m => m.id === mb.macroId) || null; }
  function mbSetStatus(text, kind){
    const s = mb.els.status;
    if(!s) return;
    s.textContent = text || '';
    s.className = 'status' + (kind ? ' ' + kind : '');
  }
  function mbChanged(){ saveWorkspaceSoon(); }

  function showMacroBuilder(macroId, stepId){
    if(recorder.active){ toast('Stop recording first (click the red pill).'); return; }
    if(mb.overlay) closeMacroBuilder(true);
    if(macroId) mb.macroId = macroId;
    if(!mbMacro()) mb.macroId = MACROS[0] ? MACROS[0].id : null;
    mb.selStepId = stepId || null;
    mb.errorStepId = null;

    const overlay = el('div', 'modal-overlay');
    overlay.style.background = 'rgba(15,23,42,.22)';
    const box = el('div', 'modal-box macro-box');
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    mb.overlay = overlay;
    overlay.addEventListener('mousedown', ev => { if(ev.target === overlay) closeMacroBuilder(); });
    overlay.addEventListener('keydown', ev => {
      if(ev.key === 'Escape' && !focusIsTyping()){ ev.stopPropagation(); closeMacroBuilder(); }
    });

    const title = el('p', 'mtitle', '🧩 Macro Builder');
    box.appendChild(title);
    const layout = el('div', 'macro-layout');
    box.appendChild(layout);
    const list = el('div', 'macro-list');
    const main = el('div', 'macro-main');
    layout.appendChild(list);
    layout.appendChild(main);
    const foot = el('div', 'macro-foot');
    box.appendChild(foot);
    mb.els = { box, list, main, foot };
    renderMBList();
    renderMBMain();
    renderMBFoot();
  }

  function closeMacroBuilder(silent){
    if(!mb.overlay) return;
    mb.overlay.remove();
    mb.overlay = null;
    mb.els = {};
    syncMacroCommands();
    if(!silent) saveWorkspace();
  }

  function renderMBList(){
    const list = mb.els.list;
    list.innerHTML = '';
    const bar = el('div', '');
    bar.style.cssText = 'display:flex; gap:4px; flex-wrap:wrap;';
    const newBtn = el('button', 'mbtn primary', '+ New');
    newBtn.addEventListener('click', () => { const m = createMacro(); mb.macroId = m.id; mb.selStepId = null; syncMacroCommands(); renderMBList(); renderMBMain(); renderMBFoot(); mbChanged(); });
    const dupBtn = el('button', 'mbtn', 'Duplicate');
    dupBtn.disabled = !mbMacro();
    dupBtn.addEventListener('click', () => {
      const src = mbMacro(); if(!src) return;
      const m = createMacro(src.name + ' (copy)');
      Object.assign(m, { description: src.description, relative: src.relative, steps: normalizeSteps(cloneData(src.steps)) });
      mb.macroId = m.id; syncMacroCommands(); renderMBList(); renderMBMain(); renderMBFoot(); mbChanged();
    });
    const delBtn = el('button', 'mbtn', 'Delete');
    delBtn.disabled = !mbMacro();
    delBtn.addEventListener('click', () => {
      const m = mbMacro(); if(!m) return;
      showConfirm(`Delete macro "${m.name}"?`, () => {
        MACROS = MACROS.filter(x => x !== m);
        mb.macroId = MACROS[0] ? MACROS[0].id : null; mb.selStepId = null;
        syncMacroCommands(); renderMBList(); renderMBMain(); renderMBFoot(); mbChanged();
      });
    });
    bar.appendChild(newBtn); bar.appendChild(dupBtn); bar.appendChild(delBtn);
    list.appendChild(bar);

    const items = el('div', 'mitems');
    if(MACROS.length === 0){
      const e = el('div', 'macro-empty', 'No macros yet. Click “+ New” to build one step by step, or “⏺ Record” to capture what you do on the canvas.');
      e.style.padding = '8px 4px';
      items.appendChild(e);
    }
    MACROS.forEach(m => {
      const b = el('button', 'mitem' + (m.id === mb.macroId ? ' active' : ''));
      b.appendChild(document.createTextNode((m.pinned ? '📌 ' : '') + m.name));
      const sc = shortcutBindings['macro:' + m.id];
      b.appendChild(el('span', 'msub', `${countSteps(m.steps)} step${countSteps(m.steps) === 1 ? '' : 's'}${sc ? ' · ' + prettyCombo(sc) : ''}`));
      b.addEventListener('click', () => { mb.macroId = m.id; mb.selStepId = null; mb.errorStepId = null; renderMBList(); renderMBMain(); renderMBFoot(); });
      items.appendChild(b);
    });
    list.appendChild(items);

    const io = el('div', '');
    io.style.cssText = 'display:flex; gap:4px; flex-wrap:wrap;';
    const exp = el('button', 'mbtn', '⇩ Export');
    exp.title = 'Download all macros as JSON';
    exp.disabled = MACROS.length === 0;
    exp.addEventListener('click', () => downloadJSON({ version:1, kind:'fmIDE-macros', macros: MACROS }, `fmIDE-macros-${timestamp()}.json`));
    const imp = el('button', 'mbtn', '⇧ Import');
    imp.title = 'Add macros from a JSON file';
    const fileIn = el('input'); fileIn.type = 'file'; fileIn.accept = 'application/json,.json'; fileIn.style.display = 'none';
    imp.addEventListener('click', () => fileIn.click());
    fileIn.addEventListener('change', () => {
      const f = fileIn.files && fileIn.files[0]; fileIn.value = '';
      if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        openFmFileText(r.result, ['fmIDE-macros'], (data) => {
          if(!Array.isArray(data.macros)){ mbSetStatus('That macros file has no "macros" list.', 'err'); return; }
          const n = importMacros(data.macros, 'add');
          syncMacroCommands(); renderMBList(); renderMBMain(); renderMBFoot(); mbChanged();
          mbSetStatus(`Imported ${n} macro${n === 1 ? '' : 's'}.`, 'ok');
        });
      };
      r.readAsText(f);
    });
    io.appendChild(exp); io.appendChild(imp); io.appendChild(fileIn);
    list.appendChild(io);
  }

  // mode 'add': imported macros are added (renamed if the name exists); 'replace': same id replaced
  function importMacros(list, mode){
    let n = 0;
    list.forEach(src => {
      if(!src || typeof src !== 'object' || !Array.isArray(src.steps)) return;
      const existing = src.id ? MACROS.find(m => m.id === src.id) : null;
      const m = {
        id: (existing && mode === 'replace') ? existing.id : (src.id && !existing ? src.id : 'mac' + Date.now().toString(36) + (nextMacroNum++)),
        name: String(src.name || 'Imported macro'), description: String(src.description || ''),
        relative: !!src.relative, pinned: !!src.pinned, steps: normalizeSteps(cloneData(src.steps))
      };
      if(existing && mode === 'replace'){ MACROS[MACROS.indexOf(existing)] = m; }
      else {
        if(MACROS.some(x => x.name === m.name)) m.name += ' (imported)';
        MACROS.push(m);
      }
      n++;
    });
    return n;
  }

  function renderMBMain(){
    const main = mb.els.main;
    main.innerHTML = '';
    const m = mbMacro();

    nameIn.addEventListener('change', () => { if(!m.name.trim()) m.name = 'Untitled macro'; nameIn.value = m.name; syncMacroCommands(); renderMBList(); });
    const descIn = el('input'); descIn.type = 'text'; descIn.value = m.description || ''; descIn.placeholder = 'Description (optional)'; descIn.style.flex = '1'; descIn.style.minWidth = '160px';
    descIn.addEventListener('input', () => { m.description = descIn.value; mbChanged(); });
    const relLab = el('label'); const relCb = el('input'); relCb.type = 'checkbox'; relCb.checked = !!m.relative;
    relLab.appendChild(relCb); relLab.appendChild(document.createTextNode('Relative positions'));
    relLab.title = 'When ticked, x/y arguments are offsets from the top-left of the selection when the macro runs (or from the centre of the view if nothing is selected), so the same macro can build its shapes anywhere.';
    relCb.addEventListener('change', () => { m.relative = relCb.checked; mbChanged(); });
    const pinLab = el('label'); const pinCb = el('input'); pinCb.type = 'checkbox'; pinCb.checked = !!m.pinned;
    pinLab.appendChild(pinCb); pinLab.appendChild(document.createTextNode('Show on Ribbon'));
    pinLab.title = 'Adds a button for this macro to Macros › My Macros on the Ribbon';
    pinCb.addEventListener('change', () => { m.pinned = pinCb.checked; syncMacroCommands(); renderMBList(); mbChanged(); });
    const sc = shortcutBindings['macro:' + m.id];
    const scLab = el('span', '', sc ? `Shortcut: ${prettyCombo(sc)}` : 'No shortcut');
    scLab.style.cssText = 'font-size:11px; color:#6b7280;';
    scLab.title = 'Assign a shortcut in View › Keyboard Shortcuts (category Macros)';
    [nameIn, descIn, relLab, pinLab, scLab].forEach(x => meta.appendChild(x));

    const tools = el('div', 'macro-tools');
    const tb = (label, title, fn) => { const b = el('button', 'mbtn', label); b.title = title; b.addEventListener('click', fn); tools.appendChild(b); return b; };
    tb('+ Action', 'Add a step that runs one fmIDE action', () => mbInsert({ kind:'action', action:'createRect', args:{} }));
    tb('+ Group', 'Add a group to organise steps', () => mbInsert({ kind:'group', label:'Group', children:[] }));
    tb('+ Repeat', 'Repeat the steps inside N times ($i = 1…N)', () => mbInsert({ kind:'repeat', count:'3', var:'i', children:[] }));
    tb('+ For each', 'Run the steps inside once per node ($item = its id)', () => mbInsert({ kind:'forEach', nodes:'@sel', var:'item', children:[] }));
    tb('+ Set var', 'Set a variable, e.g. $x = 100 + $i*80', () => mbInsert({ kind:'set', var:'x', value:'0' }));
    tb('+ Comment', 'A note; does nothing', () => mbInsert({ kind:'comment', text:'' }));
    const sep = el('span', ''); sep.style.cssText = 'width:1px; background:#e5e7eb; margin:0 4px;'; tools.appendChild(sep);
    tb('↑', 'Move up (Alt+↑)', () => mbMove(-1));
    tb('↓', 'Move down (Alt+↓)', () => mbMove(1));
    tb('→', 'Indent into the group/loop above (Alt+→)', () => mbIndent());
    tb('←', 'Move out of the group/loop (Alt+←)', () => mbOutdent());
    tb('⧉', `Duplicate (${prettyCombo('Mod+D')})`, () => mbDuplicate());
    tb('⊘', 'Enable / disable', () => mbToggleDisabled());

    main.appendChild(tools);

    const split = el('div', 'macro-split');
    const tree = el('div', 'macro-tree');
    tree.tabIndex = 0;
    tree.addEventListener('keydown', mbTreeKey);
    const props = el('div', 'macro-props');
    split.appendChild(tree); split.appendChild(props);
    main.appendChild(split);
    mb.els.tree = tree; mb.els.props = props;
    renderMBTree();
    renderMBProps();
  }

  function renderMBTree(){
    const tree = mb.els.tree;
    const m = mbMacro();
    if(!tree || !m) return;
    const scroll = tree.scrollTop;
    tree.innerHTML = '';
    if(m.steps.length === 0){
      tree.appendChild(el('div', 'macro-empty', 'This macro has no steps yet.\n\nUse “+ Action” to add steps (e.g. createRect, connect, setValue), or “⏺ Record into this macro” and just use the canvas — every action becomes a step.'));
      tree.firstChild.style.whiteSpace = 'pre-wrap';
      return;
    }
    const icons = { action:'▸', group:'▣', repeat:'↻', forEach:'∀', set:'𝑥', comment:'#' };
    function rows(steps, depth){
      steps.forEach(st => {
        const r = el('div', 'mrow' + (st.id === mb.selStepId ? ' sel' : '') + (st.disabled ? ' disabled' : '') + (st.id === mb.errorStepId ? ' err' : ''));
        r.style.paddingLeft = (8 + depth * 18) + 'px';
        r.dataset.id = st.id;
        r.draggable = true;
        const isC = CONTAINER_KINDS.has(st.kind);
        const tw = el('span', 'mtw', isC ? (mb.collapsed.has(st.id) ? '▸' : '▾') : '');
        if(isC) tw.addEventListener('click', ev => { ev.stopPropagation(); if(mb.collapsed.has(st.id)) mb.collapsed.delete(st.id); else mb.collapsed.add(st.id); renderMBTree(); });
        r.appendChild(tw);
        const def = st.kind === 'action' ? ACTIONS[st.action] : null;
        r.appendChild(el('span', 'mki', st.kind === 'action' ? (def && def.icon || '▸') : icons[st.kind]));
        r.appendChild(stepSummaryDom(st));
        r.addEventListener('click', () => { mb.selStepId = st.id; renderMBTree(); renderMBProps(); tree.focus(); });
        r.addEventListener('dragstart', ev => { mb.dragId = st.id; ev.dataTransfer.effectAllowed = 'move'; try{ ev.dataTransfer.setData('text/plain', st.id); }catch(err){} });
        r.addEventListener('dragover', ev => {
          if(!mb.dragId || mb.dragId === st.id) return;
          ev.preventDefault();
          const rect = r.getBoundingClientRect();
          const t = (ev.clientY - rect.top) / rect.height;
          const zone = isC && t > 0.3 && t < 0.7 ? 'inside' : (t < 0.5 ? 'before' : 'after');
          r.classList.remove('drop-before', 'drop-after', 'drop-inside');
          r.classList.add('drop-' + zone);
          r.dataset.zone = zone;
        });
        r.addEventListener('dragleave', () => r.classList.remove('drop-before', 'drop-after', 'drop-inside'));
        r.addEventListener('drop', ev => {
          ev.preventDefault();
          r.classList.remove('drop-before', 'drop-after', 'drop-inside');
          mbDropOn(st.id, r.dataset.zone || 'after');
        });
        r.addEventListener('dragend', () => { mb.dragId = null; });
        tree.appendChild(r);
        if(isC && !mb.collapsed.has(st.id)) rows(st.children || [], depth + 1);
      });
    }
    rows(m.steps, 0);
    tree.scrollTop = scroll;
  }

  function stepSummaryDom(st){
    const span = el('span', 'msum');
    if(st.kind === 'action'){
      span.appendChild(el('span', 'act', st.action));
      Object.keys(st.args || {}).forEach(k => { span.appendChild(document.createTextNode(' ')); span.appendChild(el('span', 'arg', k + '=' + fmtArg(st.args[k]))); });
      if(st.assign){ span.appendChild(document.createTextNode('  ')); span.appendChild(el('span', 'asg', '→ $' + st.assign)); }
    } else {
      span.appendChild(document.createTextNode(stepSummaryText(st)));
    }
    if(st.comment){ span.appendChild(document.createTextNode('  ')); span.appendChild(el('span', 'cmt', '# ' + st.comment)); }
    return span;
  }

  function mbVarNames(){
    const m = mbMacro();
    const names = new Set();
    if(m) walkSteps(m.steps, st => {
      if(st.assign) names.add(st.assign);
      if(st.kind === 'set' && st.var) names.add(st.var);
      if(st.kind === 'repeat') names.add(st.var || 'i');
      if(st.kind === 'forEach'){ names.add(st.var || 'item'); names.add((st.var || 'item') + 'Index'); }
    });
    return Array.from(names);
  }

  function refreshMBRow(st){
    const tree = mb.els.tree;
    if(!tree) return;
    const row = tree.querySelector(`.mrow[data-id="${st.id}"]`);
    if(row){ const old = row.querySelector('.msum'); if(old) old.replaceWith(stepSummaryDom(st)); row.classList.toggle('disabled', !!st.disabled); }
  }

  function renderMBProps(){
    const props = mb.els.props;
    const m = mbMacro();
    if(!props || !m) return;
    props.innerHTML = '';
    const f = mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f){
      props.appendChild(el('h5', '', 'Step properties'));
      props.appendChild(el('p', 'pdesc', 'Select a step to edit it. Drag steps to reorder or drop them into groups and loops.'));
      props.appendChild(refHelp());
      return;
    }
    const st = f.step;
    const changed = () => { refreshMBRow(st); mbChanged(); mb.errorStepId = null; };
    const row = (label, input) => { const r = el('div', 'pform-row'); r.appendChild(el('label', '', label)); r.appendChild(input); props.appendChild(r); return input; };
    const textIn = (val, ph) => { const i = el('input'); i.type = 'text'; i.value = val == null ? '' : String(val); if(ph) i.placeholder = ph; i.addEventListener('keydown', ev => ev.stopPropagation()); return i; };

    if(st.kind === 'action'){
      props.appendChild(el('h5', '', 'Action step'));
      const sel = el('select');
      const cats = {};
      ACTION_LIST.filter(d => d.name !== 'getValue' || true).forEach(d => { (cats[d.category] = cats[d.category] || []).push(d); });
      Object.keys(cats).sort((a, b) => (ACTION_CATEGORY_ORDER.indexOf(a) + 100) % 100 - (ACTION_CATEGORY_ORDER.indexOf(b) + 100) % 100).forEach(cat => {
        const og = el('optgroup'); og.label = cat;
        cats[cat].forEach(d => { const o = el('option', '', `${d.label}  (${d.name})`); o.value = d.name; og.appendChild(o); });
        sel.appendChild(og);
      });
      sel.value = st.action;
      row('Action', sel);
      sel.addEventListener('change', () => {
        const d2 = ACTIONS[sel.value];
        const keep = {};
        d2.params.forEach(p => { if(st.args && p.name in st.args) keep[p.name] = st.args[p.name]; });
        st.action = sel.value; st.args = keep;
        if(!d2.returns) delete st.assign;
        changed(); renderMBProps();
      });
      const def = ACTIONS[st.action];
      if(!def){ props.appendChild(el('p', 'pdesc', `Unknown action "${st.action}".`)); return; }
      if(def.desc) props.appendChild(el('p', 'pdesc', def.desc));
      const pf = buildParamForm(def.params, st.args || {}, {
        vars: mbVarNames(),
        onChange: (name, raw) => {
          st.args = st.args || {};
          if(raw === '' || (Array.isArray(raw) && !raw.length)) delete st.args[name]; else st.args[name] = raw;
          changed();
        }
      });
      props.appendChild(pf.el);
      if(def.returns && def.returns !== 'edge'){
        const asg = row('Save result as $', textIn(st.assign, def.returns === 'nodes' ? 'e.g. copies' : 'e.g. rev'));
        asg.addEventListener('input', () => { const v = asg.value.trim().replace(/^\$/, ''); if(v && /^[A-Za-z_]\w*$/.test(v)) st.assign = v; else delete st.assign; changed(); });
      }
    } else if(st.kind === 'group'){
      props.appendChild(el('h5', '', 'Group'));
      const i = row('Label', textIn(st.label));
      i.addEventListener('input', () => { st.label = i.value; changed(); });
    } else if(st.kind === 'repeat'){
      props.appendChild(el('h5', '', 'Repeat'));
      props.appendChild(el('p', 'pdesc', 'Runs the steps inside N times. The loop variable counts 1, 2, … N — use it in arguments, e.g. y = 100 + $i*90, or name = Line ${i}.'));
      const c = row('Times', textIn(st.count, 'e.g. 5 or $periods'));
      c.addEventListener('input', () => { st.count = c.value; changed(); });
      const v = row('Variable', textIn(st.var, 'i'));
      v.addEventListener('input', () => { st.var = v.value.trim().replace(/^\$/, '') || 'i'; changed(); });
    } else if(st.kind === 'forEach'){
      props.appendChild(el('h5', '', 'For each node'));
      props.appendChild(el('p', 'pdesc', 'Runs the steps inside once per node. The variable holds that node (use it as $item in node fields); $itemIndex counts 1, 2, …'));
      const n = row('Nodes', textIn(st.nodes, '@sel'));
      n.addEventListener('input', () => { st.nodes = n.value; changed(); });
      const v = row('Variable', textIn(st.var, 'item'));
      v.addEventListener('input', () => { st.var = v.value.trim().replace(/^\$/, '') || 'item'; changed(); });
    } else if(st.kind === 'set'){
      props.appendChild(el('h5', '', 'Set variable'));
      props.appendChild(el('p', 'pdesc', 'A number expression (100 + $i*80), another variable ($r1), or text (${name} inserts a variable).'));
      const v = row('Variable', textIn(st.var, 'x'));
      v.addEventListener('input', () => { st.var = v.value.trim().replace(/^\$/, '') || 'x'; changed(); });
      const val = row('Value', textIn(st.value));
      val.addEventListener('input', () => { st.value = val.value; changed(); });
    } else if(st.kind === 'comment'){
      props.appendChild(el('h5', '', 'Comment'));
      const t = el('textarea'); t.value = st.text || ''; t.addEventListener('keydown', ev => ev.stopPropagation());
      row('Text', t);
      t.addEventListener('input', () => { st.text = t.value; changed(); });
    }
    if(st.kind !== 'comment'){
      const note = row('Note', textIn(st.comment, 'optional comment'));
      note.addEventListener('input', () => { st.comment = note.value; if(!st.comment) delete st.comment; changed(); });
    }
    const enLab = el('label', '');
    enLab.style.cssText = 'display:flex; align-items:center; gap:6px; font-size:12px; color:#374151; margin:6px 0;';
    const enCb = el('input'); enCb.type = 'checkbox'; enCb.checked = !st.disabled;
    enLab.appendChild(enCb); enLab.appendChild(document.createTextNode('Step enabled'));
    enCb.addEventListener('change', () => { if(enCb.checked) delete st.disabled; else st.disabled = true; changed(); });
    props.appendChild(enLab);
    props.appendChild(refHelp());
  }

  function refHelp(){
    const h = el('div', 'macro-ref-help');
    const add = (code, text) => { const line = el('div'); line.appendChild(el('code', '', code)); line.appendChild(document.createTextNode(' ' + text)); h.appendChild(line); };
    h.appendChild(el('div', '', 'Referring to nodes:'));
    add('Revenue', 'a rectangle by name (aliases/blocks by the name they show)');
    add('@sel  @sel[0]', 'the selection when the macro started');
    add('@cur  @all', 'the live selection · every node on the canvas');
    add('$r1  $r1[0]', 'a node saved by an earlier step');
    add('#n12', 'a node by id');
    add('Canvas::Name', 'a rectangle on another canvas (alias sources)');
    add('Name@3  Name@latest', 'a template: version 3, or the latest (the name alone is the latest too)');
    h.appendChild(el('div', '', 'Numbers accept expressions: 100 + $i*80, $periods, round($x/2).'));
    return h;
  }

  // ----- tree editing operations -----
  function mbInsert(step){
    const m = mbMacro(); if(!m) return;
    step.id = newStepId();
    const f = mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f) m.steps.push(step);
    else if(CONTAINER_KINDS.has(f.step.kind) && !mb.collapsed.has(f.step.id)){ f.step.children = f.step.children || []; f.step.children.push(step); }
    else f.arr.splice(f.index + 1, 0, step);
    mb.selStepId = step.id;
    renderMBTree(); renderMBProps(); renderMBList(); mbChanged();
  }
  function mbMove(dir){
    const m = mbMacro(); const f = m && mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f) return;
    const j = f.index + dir;
    if(j < 0 || j >= f.arr.length) return;
    f.arr.splice(f.index, 1); f.arr.splice(j, 0, f.step);
    renderMBTree(); mbChanged();
  }
  function mbIndent(){
    const m = mbMacro(); const f = m && mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f || f.index === 0) return;
    const prev = f.arr[f.index - 1];
    if(!CONTAINER_KINDS.has(prev.kind)) return;
    f.arr.splice(f.index, 1);
    prev.children = prev.children || [];
    prev.children.push(f.step);
    mb.collapsed.delete(prev.id);
    renderMBTree(); mbChanged();
  }
  function mbOutdent(){
    const m = mbMacro(); const f = m && mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f || !f.parent) return;
    const pf = findStep(m.steps, f.parent.id);
    f.arr.splice(f.index, 1);
    pf.arr.splice(pf.index + 1, 0, f.step);
    renderMBTree(); mbChanged();
  }
  function mbDuplicate(){
    const m = mbMacro(); const f = m && mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f) return;
    const copy = normalizeSteps([cloneData(f.step)])[0];
    delete copy.assign;
    f.arr.splice(f.index + 1, 0, copy);
    mb.selStepId = copy.id;
    renderMBTree(); renderMBProps(); renderMBList(); mbChanged();
  }
  function mbToggleDisabled(){
    const m = mbMacro(); const f = m && mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f) return;
    if(f.step.disabled) delete f.step.disabled; else f.step.disabled = true;
    renderMBTree(); renderMBProps(); mbChanged();
  }
  function mbDelete(){
    const m = mbMacro(); const f = m && mb.selStepId ? findStep(m.steps, mb.selStepId) : null;
    if(!f) return;
    f.arr.splice(f.index, 1);
    const next = f.arr[f.index] || f.arr[f.index - 1] || f.parent;
    mb.selStepId = next ? next.id : null;
    renderMBTree(); renderMBProps(); renderMBList(); mbChanged();
  }
  function mbDropOn(targetId, zone){
    const m = mbMacro(); if(!m || !mb.dragId) return;
    const src = findStep(m.steps, mb.dragId);
    const dst = findStep(m.steps, targetId);
    mb.dragId = null;
    if(!src || !dst) return;
    let inside = false;
    walkSteps([src.step], st => { if(st.id === targetId) inside = true; });
    if(inside) return; // can't drop a step into itself
    src.arr.splice(src.index, 1);
    const d2 = findStep(m.steps, targetId);
    if(zone === 'inside'){ d2.step.children = d2.step.children || []; d2.step.children.push(src.step); mb.collapsed.delete(d2.step.id); }
    else d2.arr.splice(d2.index + (zone === 'after' ? 1 : 0), 0, src.step);
    mb.selStepId = src.step.id;
    renderMBTree(); renderMBProps(); mbChanged();
  }
  function mbTreeKey(ev){
    const m = mbMacro(); if(!m) return;
    const flat = [];
    walkSteps(m.steps, (st, arr, i, parent) => {
      let hidden = false, p = parent;
      while(p){ if(mb.collapsed.has(p.id)) hidden = true; const pf = findStep(m.steps, p.id); p = pf ? pf.parent : null; }
      if(!hidden) flat.push(st);
    });
    const k = flat.findIndex(s => s.id === mb.selStepId);
    if(ev.altKey && ev.key === 'ArrowUp'){ ev.preventDefault(); mbMove(-1); return; }
    if(ev.altKey && ev.key === 'ArrowDown'){ ev.preventDefault(); mbMove(1); return; }
    if(ev.altKey && ev.key === 'ArrowRight'){ ev.preventDefault(); mbIndent(); return; }
    if(ev.altKey && ev.key === 'ArrowLeft'){ ev.preventDefault(); mbOutdent(); return; }
    if(ev.key === 'ArrowDown'){ ev.preventDefault(); if(flat[k + 1]){ mb.selStepId = flat[k + 1].id; renderMBTree(); renderMBProps(); } return; }
    if(ev.key === 'ArrowUp'){ ev.preventDefault(); if(k > 0){ mb.selStepId = flat[k - 1].id; renderMBTree(); renderMBProps(); } return; }
    if(ev.key === 'Delete' || ev.key === 'Backspace'){ ev.preventDefault(); ev.stopPropagation(); mbDelete(); return; }
    if(normalizeCombo(ev) === 'Mod+D'){ ev.preventDefault(); mbDuplicate(); return; }
    ev.stopPropagation();
  }

  function renderMBFoot(){
    const foot = mb.els.foot;
    foot.innerHTML = '';
    const status = el('span', 'status', '');
    mb.els.status = status;
    foot.appendChild(status);
    const m = mbMacro();
    const recBtn = el('button', 'mbtn rec', '⏺ Record into this macro');
    recBtn.disabled = !m;
    recBtn.title = 'Close the builder and record what you do on the canvas; the steps are appended to this macro';
    recBtn.addEventListener('click', () => showRecordDialog({ macroId: m.id }));
    const runSel = el('button', 'mbtn', '▶ Run selected step');
    runSel.disabled = !m;
    runSel.title = 'Run only the selected step (and anything inside it)';
    runSel.addEventListener('click', () => {
      if(!mb.selStepId){ mbSetStatus('Select a step first.', 'err'); return; }
      mb.errorStepId = null;
      if(runMacroInteractive(m.id, [mb.selStepId])){ renderMBTree(); mbSetStatus('Step ran.', 'ok'); }
    });
    const runBtn = el('button', 'mbtn primary', '▶ Run macro');
    runBtn.disabled = !m;
    runBtn.addEventListener('click', () => {
      mb.errorStepId = null;
      if(runMacroInteractive(m.id)){ renderMBTree(); mbSetStatus(`Ran "${m.name}" — ${shortcutBindings.undo ? prettyCombo(shortcutBindings.undo) : 'Undo'} undoes the whole run.`, 'ok'); }
    });
    const closeBtn = el('button', 'mbtn', 'Close');
    closeBtn.addEventListener('click', () => closeMacroBuilder());
    [recBtn, runSel, runBtn, closeBtn].forEach(b => foot.appendChild(b));
  }

  // ---------- "Record Macro" dialog ----------
  function showRecordDialog(opts){
    if(recorder.active) return;
    const target = opts.macroId ? MACROS.find(m => m.id === opts.macroId) : null;
    const overlay = el('div', 'modal-overlay');
    const box = el('div', 'modal-box');
    box.style.minWidth = '420px';
    box.style.maxWidth = '480px';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.addEventListener('mousedown', ev => { if(ev.target === overlay) close(); });
    box.appendChild(el('p', '', target ? `Record more steps into "${target.name}"` : 'Record a new macro'));
    const desc = el('p', 'template-desc', 'Everything you do on the canvas — adding, connecting, typing, moving, formatting, switching canvases — becomes a step. Undo removes the last recorded step. Click the red Recording pill on the Ribbon to finish.');
    box.appendChild(desc);
    let nameIn = null;
    if(!target){
      const r = el('div', 'pform-row'); r.appendChild(el('label', '', 'Macro name'));
      nameIn = el('input'); nameIn.type = 'text'; nameIn.value = 'Macro ' + (MACROS.length + 1);
      nameIn.addEventListener('keydown', ev => { ev.stopPropagation(); if(ev.key === 'Enter') start(); });
      r.appendChild(nameIn); box.appendChild(r);
    }
    const nSel = selectedNodeIds.size;
    const cbRow = (text, checked, disabled, title) => {
      const l = el('label'); l.style.cssText = 'display:flex; gap:8px; align-items:flex-start; font-size:13px; margin:8px 0; color:#1e2937;';
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = checked; cb.disabled = disabled;
      l.appendChild(cb); l.appendChild(document.createTextNode(text));
      if(title) l.title = title;
      box.appendChild(l);
      return cb;
    };
    const selCb = cbRow(nSel ? `Refer to the ${nSel} selected node${nSel === 1 ? '' : 's'} as @sel (so the macro works on whatever is selected when it runs)` : 'Refer to selected nodes as @sel (nothing is selected now)', nSel > 0, nSel === 0);
    const relCb = cbRow(target ? `Relative positions: ${target.relative ? 'on' : 'off'} (set in the Macro Builder)` : 'Record positions relative to the selection (or the view centre), so the macro can build anywhere',
      target ? !!target.relative : false, !!target);
    const actions = el('div', 'modal-actions');
    const cancel = el('button', '', 'Cancel');
    cancel.addEventListener('click', close);
    const go = el('button', 'primary', '⏺ Start recording');
    go.addEventListener('click', start);
    actions.appendChild(cancel); actions.appendChild(go);
    box.appendChild(actions);
    if(nameIn){ nameIn.focus(); nameIn.select(); } else go.focus();
    function start(){
      close();
      if(mb.overlay) closeMacroBuilder();
      startRecording({ macroId: target ? target.id : null, name: nameIn ? (nameIn.value.trim() || undefined) : undefined, selRefs: selCb.checked, relative: relCb.checked });
    }
  }

  // =====================================================================================
  // ---------- Documents: New · Open · Save · Save As · Open Recent ----------
  // =====================================================================================
  // A document is a .fmide file holding the whole workspace — exactly the fmIDE-workspace
  // JSON that Export Workspace writes, so there is no new file format. Where the browser
  // has the File System Access API (Chrome, Edge) Open and Save As get a file handle and
  // Save writes straight back to the file; elsewhere Open uses a file input and Save
  // downloads name.fmide. Browser storage (05, src/shared/store.js) is the safety net:
  // the autosave also keeps which document is open and whether it has unsaved changes,
  // and Recent keeps a copy of each document as it was last opened or saved.
  // Opening a document never overwrites the person's own setup: the model and its format
  // presets/roles come from the file; its templates and macros are added when not already
  // present; its shortcuts and ribbon/KeyTips settings are ignored.
  const DOC_EXT = '.fmide';
  const DOC_PICKER_TYPES = [{ description: 'fmIDE document', accept: { 'application/json': [DOC_EXT, '.json'] } }];
  const DOC_SAVE_TYPES = [{ description: 'fmIDE document', accept: { 'application/json': [DOC_EXT] } }];
  const SESSION_KEY = 'fmIDE-session';               // { name, fileName, recentId, dirty } (JSON)
  const SESSION_HANDLE_KEY = 'fmIDE-session-handle'; // the open document's file handle
  const RECENT_KEY = 'fmIDE-recent';                 // [{ id, name, fileName, lastOpened, copySavedAt }] (JSON)
  const RECENT_MAX = 10;
  const recentCopyKey = (id) => 'fmIDE-recent:' + id;
  const recentHandleKey = (id) => 'fmIDE-recent-handle:' + id;
  const fileInputDocument = document.getElementById('fileInputDocument');

  // name: shown in the title (null = "Untitled"); fileName: the .fmide file it lives in,
  // if any (Save downloads it again where there is no handle); handle: the file handle.
  // serial changes whenever another document is opened or a new one started.
  const currentDoc = { name: null, fileName: null, handle: null, recentId: null, dirty: false, serial: 0 };
  const recentHandles = new Map(); // handles from this session, for when the browser can't store them
  let docChangeCount = 0;          // bumped on every change: a save only marks clean what it wrote
  let dirtySaveTimer = null;
