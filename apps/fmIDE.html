  // Hand-drawn per-period value editor. Only meaningful for value rectangles with no
  // incoming edge (i.e. inputs, not formula-driven) — the render()/curve-btn visibility
  // logic already restricts when this can be opened.
  function showPeriodValuesEditor(node){
    closePicker();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box period-values-box';
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function cleanup(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('keydown', onKey);
      overlay.remove();
    }
    function onKey(ev){ if(ev.key === 'Escape') cleanup(); }
    overlay.addEventListener('mousedown', (ev) => { if(ev.target === overlay) cleanup(); });
    document.addEventListener('keydown', onKey);

    const {name} = parseNode(node);
    const title = document.createElement('p');
    title.textContent = 'Draw values across periods' + (name ? ' — ' + name : '');
    box.appendChild(title);
    const desc = document.createElement('p');
    desc.className = 'template-desc';
    desc.textContent = "Set a min/max range, then drag a point — or click-drag across the chart like drawing a line — to set this rectangle's value at each period. Saving overrides its typed number with these per-period values.";
    box.appendChild(desc);

    // ---- initial values ----
    let curValues;
    if(Array.isArray(node.periodValues) && node.periodValues.length){
      curValues = padPeriodValuesArray(node.periodValues.slice(), periods.length);
    } else {
      const {literal} = parseNode(node);
      const base = (typeof literal === 'number') ? literal : 0;
      curValues = new Array(periods.length).fill(base);
    }
    const existingRange = node.periodValuesRange || {};
    let rangeMin = (typeof existingRange.min === 'number') ? existingRange.min : Math.min(0, ...curValues);
    let rangeMax = (typeof existingRange.max === 'number') ? existingRange.max : Math.max(1, ...curValues);
    if(rangeMin >= rangeMax) rangeMax = rangeMin + 1;

    // ---- range + quick-tool controls ----
    const rangeRow = document.createElement('div');
    rangeRow.style.cssText = 'display:flex; gap:14px; align-items:center; margin-bottom:10px; flex-wrap:wrap;';
    function numField(labelText, value){
      const wrap = document.createElement('label');
      wrap.style.cssText = 'display:flex; align-items:center; gap:6px; font-size:12px; color:#374151;';
      wrap.textContent = labelText;
      const inp = document.createElement('input');
      inp.type = 'number'; inp.value = value; inp.step = 'any';
      inp.style.cssText = 'width:90px; font-size:13px; padding:5px 7px; border-radius:6px; border:1px solid #d1d5db;';
      wrap.appendChild(inp);
      return {wrap, inp};
    }
    const minField = numField('Min', rangeMin);
    const maxField = numField('Max', rangeMax);
    rangeRow.appendChild(minField.wrap);
    rangeRow.appendChild(maxField.wrap);
    const flatBtn = document.createElement('button');
    flatBtn.className = 'tbtn'; flatBtn.type = 'button';
    flatBtn.textContent = 'Flatten to first value';
    const interpBtn = document.createElement('button');
    interpBtn.className = 'tbtn'; interpBtn.type = 'button';
    interpBtn.textContent = 'Straight line: first → last';
    rangeRow.appendChild(flatBtn);
    rangeRow.appendChild(interpBtn);
    box.appendChild(rangeRow);

    // ---- chart ----
    const chartWrap = document.createElement('div');
    chartWrap.style.cssText = 'overflow-x:auto; border:1px solid #e5e7eb; border-radius:8px; background:#fafafa; margin-bottom:10px;';
    box.appendChild(chartWrap);

    const padL = 54, padR = 20, padT = 16, padB = 26;
    const stepX = Math.max(46, Math.min(90, Math.floor(760 / Math.max(periods.length, 1))));
    const plotW = stepX * Math.max(periods.length - 1, 1);
    const svgW = padL + plotW + padR;
    const svgH = 240;
    const plotH = svgH - padT - padB;

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', svgW);
    svg.setAttribute('height', svgH);
    svg.style.display = 'block';
    svg.style.cursor = 'crosshair';
    chartWrap.appendChild(svg);

    function yFor(v){
      const t = (v - rangeMin) / (rangeMax - rangeMin);
      return padT + (1 - Math.max(0, Math.min(1, t))) * plotH;
    }
    function valueFromY(y){
      const t = 1 - (y - padT) / plotH;
      const v = rangeMin + Math.max(0, Math.min(1, t)) * (rangeMax - rangeMin);
      return Math.round(v * 1000) / 1000;
    }
    function xFor(i){ return padL + i * stepX; }

    function redraw(){
      svg.innerHTML = '';
      const gl = document.createElementNS(svgNS, 'g');
      [0, 0.25, 0.5, 0.75, 1].forEach(t => {
        const y = padT + (1 - t) * plotH;
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', padL); line.setAttribute('x2', padL + plotW);
        line.setAttribute('y1', y); line.setAttribute('y2', y);
        line.setAttribute('stroke', '#e2e8f0');
        line.setAttribute('stroke-dasharray', '3,4');
        gl.appendChild(line);
        const lbl = document.createElementNS(svgNS, 'text');
        lbl.setAttribute('x', padL - 8); lbl.setAttribute('y', y + 4);
        lbl.setAttribute('text-anchor', 'end'); lbl.setAttribute('font-size', '10'); lbl.setAttribute('fill', '#94a3b8');
        lbl.textContent = formatNum(rangeMin + t * (rangeMax - rangeMin));
        gl.appendChild(lbl);
      });
      periods.forEach((label, i) => {
        const x = xFor(i);
        const vline = document.createElementNS(svgNS, 'line');
        vline.setAttribute('x1', x); vline.setAttribute('x2', x);
        vline.setAttribute('y1', padT); vline.setAttribute('y2', padT + plotH);
        vline.setAttribute('stroke', '#eef2f7');
        gl.appendChild(vline);
        const xlbl = document.createElementNS(svgNS, 'text');
        xlbl.setAttribute('x', x); xlbl.setAttribute('y', svgH - 8);
        xlbl.setAttribute('text-anchor', 'middle'); xlbl.setAttribute('font-size', '9'); xlbl.setAttribute('fill', '#94a3b8');
        xlbl.textContent = (i + 1);
        gl.appendChild(xlbl);
      });
      svg.appendChild(gl);

      const path = document.createElementNS(svgNS, 'path');
      let d = '';
      curValues.forEach((v, i) => { d += (i === 0 ? 'M' : 'L') + xFor(i) + ' ' + yFor(v) + ' '; });
      path.setAttribute('d', d.trim());
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#4f46e5');
      path.setAttribute('stroke-width', '2');
      svg.appendChild(path);

      curValues.forEach((v, i) => {
        const c = document.createElementNS(svgNS, 'circle');
        c.setAttribute('cx', xFor(i)); c.setAttribute('cy', yFor(v));
        c.setAttribute('r', 6);
        c.setAttribute('fill', '#fff');
        c.setAttribute('stroke', '#4f46e5');
        c.setAttribute('stroke-width', '2');
        c.style.cursor = 'ns-resize';
        svg.appendChild(c);
        const vlbl = document.createElementNS(svgNS, 'text');
        vlbl.setAttribute('x', xFor(i)); vlbl.setAttribute('y', yFor(v) - 10);
        vlbl.setAttribute('text-anchor', 'middle'); vlbl.setAttribute('font-size', '10'); vlbl.setAttribute('fill', '#374151');
        vlbl.textContent = formatNum(v);
        svg.appendChild(vlbl);
      });
    }

    // ---- per-period precise numeric entry, synced with the chart ----
    const listWrap = document.createElement('div');
    listWrap.style.cssText = 'display:flex; flex-wrap:wrap; gap:6px; max-height:120px; overflow-y:auto; margin-bottom:12px; padding:8px; border:1px solid #e5e7eb; border-radius:8px;';
    box.appendChild(listWrap);
    let numberInputs = [];
    function buildNumberInputs(){
      listWrap.innerHTML = '';
      numberInputs = periods.map((label, i) => {
        const cell = document.createElement('div');
        cell.style.cssText = 'display:flex; flex-direction:column; align-items:center; width:64px;';
        const lab = document.createElement('span');
        lab.style.cssText = 'font-size:9px; color:#9ca3af; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:64px;';
        lab.textContent = label;
        const inp = document.createElement('input');
        inp.type = 'number'; inp.step = 'any';
        inp.style.cssText = 'width:100%; font-size:12px; padding:3px 4px; border-radius:5px; border:1px solid #d1d5db; text-align:center;';
        inp.value = curValues[i];
        inp.addEventListener('change', () => {
          const v = parseFloat(inp.value);
          if(isFinite(v)) curValues[i] = v;
          else inp.value = curValues[i];
          redraw();
        });
        cell.appendChild(lab); cell.appendChild(inp);
        listWrap.appendChild(cell);
        return inp;
      });
    }
    function syncNumberInputs(){ numberInputs.forEach((inp, i) => { inp.value = curValues[i]; }); }
    buildNumberInputs();
    redraw();

    minField.inp.addEventListener('change', () => {
      const v = parseFloat(minField.inp.value);
      if(isFinite(v) && v < rangeMax) rangeMin = v;
      minField.inp.value = rangeMin;
      redraw();
    });
    maxField.inp.addEventListener('change', () => {
      const v = parseFloat(maxField.inp.value);
      if(isFinite(v) && v > rangeMin) rangeMax = v;
      maxField.inp.value = rangeMax;
      redraw();
    });
    flatBtn.addEventListener('click', () => {
      const v = curValues[0];
      curValues = curValues.map(() => v);
      redraw(); syncNumberInputs();
    });
    interpBtn.addEventListener('click', () => {
      const first = curValues[0], last = curValues[curValues.length - 1], n = curValues.length;
      curValues = curValues.map((_, i) => Math.round((n > 1 ? first + (last - first) * (i / (n - 1)) : first) * 1000) / 1000);
      redraw(); syncNumberInputs();
    });

    // ---- drag-to-draw interaction ----
    let drawing = false, lastIdx = null;
    function svgPointFromEvent(ev){
      const rect = svg.getBoundingClientRect();
      return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
    }
    function nearestIndex(x){ return Math.max(0, Math.min(periods.length - 1, Math.round((x - padL) / stepX))); }
    function onDown(ev){
      ev.preventDefault();
      drawing = true;
      const p = svgPointFromEvent(ev);
      const idx = nearestIndex(p.x);
      curValues[idx] = valueFromY(p.y);
      lastIdx = idx;
      redraw(); syncNumberInputs();
    }
    function onMove(ev){
      if(!drawing) return;
      const p = svgPointFromEvent(ev);
      const idx = nearestIndex(p.x);
      if(lastIdx !== null && idx !== lastIdx){
        const y0 = yFor(curValues[lastIdx]);
        const lo = Math.min(lastIdx, idx), hi = Math.max(lastIdx, idx);
        for(let i = lo; i <= hi; i++){
          const t = (idx === lastIdx) ? 1 : (i - lastIdx) / (idx - lastIdx);
          curValues[i] = valueFromY(y0 + (p.y - y0) * t);
        }
      } else {
        curValues[idx] = valueFromY(p.y);
      }
      lastIdx = idx;
      redraw(); syncNumberInputs();
    }
    function onUp(){ drawing = false; lastIdx = null; }
    svg.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);

    // ---- actions ----
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const clearBtn = document.createElement('button');
    clearBtn.textContent = 'Clear (use typed number instead)';
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel';
    const saveBtn = document.createElement('button');
    saveBtn.className = 'primary';
    saveBtn.textContent = 'Save';
    actions.appendChild(clearBtn); actions.appendChild(cancelBtn); actions.appendChild(saveBtn);
    box.appendChild(actions);

    clearBtn.addEventListener('click', () => {
      cleanup();
      guarded(() => fm.setPeriodValues(node.id, ''));
    });
    cancelBtn.addEventListener('click', cleanup);
    saveBtn.addEventListener('click', () => {
      cleanup();
      guarded(() => fm.setPeriodValues(node.id, curValues.join(','), rangeMin, rangeMax));
    });
  }

  // Builds the number-format/fill/border/font fields shared by the per-rectangle
  // formatting dialog and the format-preset editor. Appends fields into `box` (before
  // any element already in it — callers add their own rows/actions after calling this)
  // and returns a readStyle() to collect the current field values into a style object.
  function buildStyleFieldsUI(box, st, opts){
    function fieldRow(labelText, inputEl){
      const row = document.createElement('div');
      row.style.display = 'flex'; row.style.alignItems = 'center'; row.style.gap = '8px'; row.style.marginBottom = '8px';

  function applyNodeStyle(el, n){
    const nameEl = el.querySelector('.line-name');
    const valEl = el.querySelector('.line-value');
    const st = resolveNodeStyle(n);
    // Clear first: a rectangle can switch role (an arrow added/removed), and a role
    // preset may leave some properties unset — never keep the previous role's look.
    el.style.background = ''; el.style.borderColor = ''; el.style.borderWidth = ''; el.style.borderStyle = '';
    [nameEl, valEl].forEach(e => { if(e){ e.style.fontFamily = ''; e.style.fontSize = ''; e.style.fontWeight = ''; } });
    if(nameEl) nameEl.style.color = '';
    if(!st) return;
    el.style.background = st.fill || '';
    if(st.border){
      el.style.borderColor = st.border.color || '';
      el.style.borderWidth = (st.border.width != null ? st.border.width + 'px' : '');
      el.style.borderStyle = st.border.style || '';
    }
    if(st.font){
      [nameEl, valEl].forEach(e => {
        if(!e) return;
        e.style.fontFamily = st.font.family || '';
        e.style.fontSize = st.font.size ? st.font.size + 'px' : '';

  // ---------- plug / socket ----------
  // plugsOf (a rectangle's plug names) and plugLinks (which links plugs make) are shared
  // (src/shared/ir.js): the calculation works the links out itself from the names, and the
  // automatic aliases and arrows drawn here are exactly those links.
  function syncAutoConnections(){
    syncActiveIntoRegistry();
    invalidateIR();

    // wipe everything auto-generated from a previous sync, everywhere
    canvases.forEach(c => {
      const autoAliasIds = new Set(c.nodes.filter(n => n.type === 'alias' && n.auto).map(n => n.id));
      c.nodes = c.nodes.filter(n => !(n.type === 'alias' && n.auto));
      c.edges = c.edges.filter(e => !e.auto && !autoAliasIds.has(e.from) && !autoAliasIds.has(e.to));
    });

    // each plugged rectangle is connected at most once to each socket: an arrow on the same
    // canvas, an alias from another canvas
    const links = plugLinks(canvases);
    canvases.forEach((c, ci) => links[ci].forEach(l => {
      if(!l.alias){
        c.edges.push({ id: uid('e'), from: l.from, to: l.to, auto: true });
        return;
      }
      const aliasId = uid('n');
      c.nodes.push({
        id: aliasId, type: 'alias', auto: true,
        x: l.alias.x, y: l.alias.y,
        w: 170, h: 64,
        sourceCanvasId: l.alias.sourceCanvasId, sourceNodeId: l.alias.sourceNodeId, plugs: []
      });
      c.edges.push({ id: uid('e'), from: aliasId, to: l.to, auto: true });
    }));

    loadCanvasState(canvases.find(cc => cc.id === activeCanvasId));
  }

  // Sockets nothing feeds: operators whose socket name matches no plug on any of `list`'s
  // canvases ({ name, nodes }), by the same rule as syncAutoConnections (trimmed, any
  // capitals). Returns [{ canvas, socket }], each socket once per canvas.
  function unfedSocketsIn(list){
    const plugged = new Set();
    list.forEach(c => (c.nodes || []).forEach(n => { if(n && n.type === 'value') plugsOf(n).forEach(p => plugged.add(p.toLowerCase())); }));
    const out = [], seen = new Set();
    list.forEach(c => (c.nodes || []).forEach(n => {
      if(!n || n.type !== 'operator' || typeof n.socket !== 'string' || !n.socket.trim()) return;
      const k = n.socket.trim().toLowerCase(), key = c.name + '\u0000' + k;
      if(plugged.has(k) || seen.has(key)) return;
      seen.add(key);
      out.push({ canvas: c.name, socket: n.socket.trim() });
    }));
    return out;
  }

  // Every plug name (lower case) → the rectangles carrying it, as "Canvas::Name", across
  // `list`'s canvases ({ name, nodes }).
  function plugSourcesIn(list){
    const map = new Map();
    list.forEach(c => (c.nodes || []).forEach(n => {
      if(!n || n.type !== 'value') return;
      plugsOf(n).forEach(p => {
        const k = p.toLowerCase();
        if(!map.has(k)) map.set(k, []);
        map.get(k).push((c.name || 'Canvas') + '::' + ((parseNode(n).name || '').trim() || '(unnamed)'));
      });
    }));
    return map;
  }
  // Sockets fed by more than one plug: their values are added together, which can double a
  // number by accident (the same template added twice). Returns [{ canvas, socket, sources }],
  // each socket once per canvas.
  function multiFedSocketsIn(list){
    const sources = plugSourcesIn(list);
    const out = [], seen = new Set();
    list.forEach(c => (c.nodes || []).forEach(n => {
      if(!n || n.type !== 'operator' || typeof n.socket !== 'string' || !n.socket.trim()) return;
      const k = n.socket.trim().toLowerCase(), key = c.name + '\u0000' + k;
      const from = sources.get(k) || [];
      if(from.length < 2 || seen.has(key)) return;
      seen.add(key);
      out.push({ canvas: c.name, socket: n.socket.trim(), sources: from.slice() });
    }));
    return out;
  }
  function multiFedSocketsText(list){
    return 'Sockets fed by more than one plug (their values are added): '
      + list.map(m => `“${m.socket}” (${m.canvas}) ← ${m.sources.join(', ')}`).join('; ') + '.';
  }
  // The canvases as they are now ({ name, nodes }), the one on screen included.
  function liveCanvasList(){
    return canvases.map(c => ({ name: c.name, nodes: c.id === activeCanvasId ? nodes : c.nodes }));
  }

  function collectAllTagNames(){
    const values = new Set();
    canvases.forEach(c => {
      const pool = c.id === activeCanvasId ? nodes : c.nodes;
      pool.forEach(n => {
        if(n.type === 'value') plugsOf(n).forEach(p => values.add(p));
        if(n.type === 'operator' && n.socket && n.socket.trim() !== '') values.add(n.socket.trim());
      });
    });
    return Array.from(values).sort((a,b) => a.localeCompare(b));
  }

  function tagNameDatalist(){
    const datalist = document.createElement('datalist');
    datalist.id = 'tagNameOptions';
    collectAllTagNames().forEach(name => {
      const o = document.createElement('option');
      o.value = name;
      datalist.appendChild(o);
    });
    return datalist;
  }

  // A rectangle's plugs: one chip per name (✕ removes it) and a field that adds another.
  // Each add or remove is its own undo step; a name typed but not yet added is added when
  // the popup closes by a click elsewhere (Escape drops it).
  function showPlugEditor(node){
    closePicker();
    const el = canvas.querySelector(`.node[data-id="${node.id}"]`);
    if(!el) return;

    const popup = document.createElement('div');
    popup.className = 'tag-popup plug-editor';
    popup.style.left = node.x + 'px';
    popup.style.top = Math.max(0, node.y - 46) + 'px';

    const list = document.createElement('div');
    list.className = 'plug-list';

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Add a plug name (e.g. Revenue)';
    input.setAttribute('list', 'tagNameOptions');
    input.setAttribute('autocomplete', 'off');

    const addBtn = document.createElement('button');
    addBtn.textContent = 'Add';
    const clearBtn = document.createElement('button');
    clearBtn.textContent = 'Clear all';

    function refreshList(){
      list.textContent = '';
      const names = plugsOf(getNode(node.id) || node);
      names.forEach(name => {
        const chip = document.createElement('span');
        chip.className = 'plug-item';
        const txt = document.createElement('span');
        txt.textContent = '🔌 ' + name;
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'plug-remove';
        rm.textContent = '✕';
        rm.title = 'Remove this plug';
        rm.addEventListener('mousedown', (ev) => ev.stopPropagation());
        rm.addEventListener('click', () => { guarded(() => fm.removePlug(node.id, name)); render(); refreshList(); input.focus(); });
        chip.appendChild(txt);
        chip.appendChild(rm);
        list.appendChild(chip);
      });
      list.style.display = names.length ? 'flex' : 'none';
      clearBtn.style.display = names.length ? '' : 'none';
    }
    function addTyped(){
      const v = input.value.trim();
      if(!v) return;
      guarded(() => fm.addPlug(node.id, v));
      input.value = '';
      render();
      refreshList();
    }

    const row = document.createElement('div');
    row.className = 'plug-add-row';
    row.appendChild(input);
    row.appendChild(addBtn);
    row.appendChild(clearBtn);
    popup.appendChild(list);
    popup.appendChild(row);
    popup.appendChild(tagNameDatalist());
    canvas.appendChild(popup);
    activePicker = popup;
    refreshList();
    input.focus();

    let docListener = null;
    function finish(commit){
      if(docListener) document.removeEventListener('mousedown', docListener);
      if(commit) addTyped();
      closePicker();
      render();
    }
    input.addEventListener('keydown', (ev) => {
      ev.stopPropagation();
      if(ev.key === 'Enter'){ if(input.value.trim()) addTyped(); else finish(false); }
      if(ev.key === 'Escape'){ finish(false); }
    });
    [addBtn, clearBtn].forEach(b => b.addEventListener('mousedown', (ev) => ev.stopPropagation()));
    addBtn.addEventListener('click', () => { addTyped(); input.focus(); });
    clearBtn.addEventListener('click', () => { input.value = ''; guarded(() => fm.setPlugs(node.id, [])); finish(false); });

    setTimeout(() => {
      docListener = (ev) => { if(!popup.contains(ev.target)) finish(true); };
      document.addEventListener('mousedown', docListener);
    }, 0);
  }

  function showTagEditor(node, kind){

    clearBtn.addEventListener('click', () => { input.value = ''; finish(true); });

  // ---------- escaping & validation (shared: src/shared/escaping.js, used by both apps) ----------
  // Anything that came from a file (names, labels, kinds — including shared/community
  // content) must never be parsed as markup: escape it (text), coerce it (numbers), or
  // validate it (colours) before it goes into a markup string.
  // escapeXml(s): for HTML/SVG markup — escapes & < > " and '.
  // escapeXml(s, true): for XML 1.0 files (the .xlsx writer) — also drops the characters
  // XML 1.0 forbids, and leaves ' as is (the writer quotes attributes with ").
  function escapeXml(s, xmlFile){
    let t = String(s);
    if(xmlFile) t = t.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '');
    t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    return xmlFile ? t : t.replace(/'/g, '&#39;');
  }
  function safeNum(v, fallback){ const n = Number(v); return Number.isFinite(n) ? n : (fallback || 0); }
  function safeColor(c, fallback){ return (typeof c === 'string' && /^#[0-9a-f]{3,8}$/i.test(c)) ? c : fallback; }

  // ---------- templates ----------

  function buildPreviewSVG(previewNodes, previewEdges){
    // Coordinates go into a markup string below — coerce them to numbers first.
    previewNodes = (previewNodes || []).map(n => Object.assign({}, n, { x: safeNum(n.x), y: safeNum(n.y), w: safeNum(n.w, 170), h: safeNum(n.h, 64) }));
    if(previewNodes.length === 0) return '<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg"></svg>';
    const minX = Math.min(...previewNodes.map(n => n.x));
    const minY = Math.min(...previewNodes.map(n => n.y));
    const maxX = Math.max(...previewNodes.map(n => n.x + n.w));
    const maxY = Math.max(...previewNodes.map(n => n.y + n.h));
    const pad = 30;
    const vx = minX - pad, vy = minY - pad, vw = (maxX - minX) + pad*2, vh = (maxY - minY) + pad*2;

    let svg = `<svg viewBox="${vx} ${vy} ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">`;
    svg += '<defs><marker id="pvArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker></defs>';

    previewEdges.forEach(e => {
      const a = previewNodes.find(n => n.id === e.from), b = previewNodes.find(n => n.id === e.to);
      if(!a || !b) return;
      const { p1, p2 } = edgePath(rectOf(a), rectOf(b));
      svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#94a3b8" stroke-width="2" marker-end="url(#pvArrow)"/>`;
    });

    previewNodes.forEach(n => {
      let fill = '#ffffff', stroke = '#cbd5e1', dash = '';
      if(n.type === 'operator'){ fill = '#fef3c7'; stroke = '#f59e0b'; }
      else if(n.type === 'periodShift'){ fill = '#fdf4ff'; stroke = '#a855f7'; }
      else if(n.type === 'alias'){ fill = '#ecfeff'; stroke = '#0891b2'; dash = 'stroke-dasharray="5 3"'; }
      else if(n.type === 'blockInstance'){ fill = '#f5f3ff'; stroke = '#7c3aed'; }
      else if(n.blockRole === 'input'){ stroke = '#22c55e'; }
      else if(n.blockRole === 'output'){ stroke = '#3b82f6'; }
      svg += `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="1.5" ${dash}/>`;
      const label = n.type === 'operator' ? n.text : (n.type === 'periodShift' ? shiftLabel(typeof n.shift === 'number' ? n.shift : -1) : (n.type === 'alias' ? '🔗' : (n.type === 'blockInstance' ? '(block)' : (parseNode(n).name || ''))));
      svg += `<text x="${n.x + n.w/2}" y="${n.y + n.h/2 + 4}" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1e293b">${escapeXml(label)}</text>`;
    });

    svg += '</svg>';
    return svg;
  }

  function cloneData(d){ return JSON.parse(JSON.stringify(d)); }

  function showTemplateForm(opts){
