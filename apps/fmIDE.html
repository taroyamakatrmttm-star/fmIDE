<style>

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;}
  #app{position:relative;height:100%;overflow:hidden;}

  /* Canvas tabs */
  #canvasTabs{
    position:fixed; top:var(--ribbon-h); left:0; right:0; height:40px;
    background:rgba(17,24,39,.92);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.08);
    display:flex; align-items:flex-end; gap:2px; padding:0 8px;
    z-index:90; overflow-x:auto; overflow-y:hidden;
  }
  .canvas-tab{
    display:flex; align-items:center; gap:6px; padding:0 10px; height:32px; margin-bottom:0;
    border-radius:8px 8px 0 0; background:rgba(255,255,255,.04); color:#9ca3af;
    font-size:13px; cursor:pointer; white-space:nowrap; border:1px solid transparent; border-bottom:none;
    max-width:180px; flex-shrink:0; position:relative;
    user-select:none; -webkit-user-select:none;
  }
  .canvas-tab.tab-dragging{ opacity:.85; z-index:2; background:#374151; color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.35); pointer-events:none; }
  .tab-drop-marker{ position:absolute; top:6px; bottom:0; width:3px; border-radius:2px; background:#818cf8; pointer-events:none; }
  .canvas-tab:hover{ background:rgba(255,255,255,.09); color:#e5e7eb; }
  .canvas-tab.active{ background:#1f2937; color:#fff; border-color:#374151; }
  .canvas-tab .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .canvas-tab input.rename-input{
    background:transparent; border:none; outline:none; color:inherit; font:inherit; width:100px;
    user-select:text; -webkit-user-select:text;
  }
  .canvas-tab .close-x{
    font-size:11px; color:#6b7280; border-radius:4px; padding:1px 4px; line-height:14px;
  }
  .canvas-tab .close-x:hover{ background:#374151; color:#fca5a5; }
  #btnAddCanvas{
    align-self:center; margin-bottom:4px; width:26px; height:26px; border-radius:7px;
    background:transparent; border:1px solid #374151; color:#9ca3af; cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  #btnAddCanvas:hover{ background:#1f2937; color:#e5e7eb; }

  /* ---------- Ribbon (replaces the old floating toolbar) ---------- */
  :root{ --ribbon-h:126px; }
  #ribbon{
    position:fixed; top:0; left:0; right:0; z-index:95; color:#e5e7eb; user-select:none;
    background:#111827; border-bottom:1px solid #030712;
  }
  .rb-strip{ height:32px; display:flex; align-items:stretch; gap:2px; padding:0 8px; }
  .rb-brand{ font-weight:700; font-size:14px; color:#fff; padding:0 10px 0 4px; display:flex; align-items:center; letter-spacing:.2px; }
  .rb-qat{ display:flex; align-items:center; gap:1px; padding-right:8px; margin-right:6px; border-right:1px solid #374151; }
  .rb-qat button{
    position:relative; width:26px; height:24px; border-radius:6px; border:none; background:transparent; color:#d1d5db;
    font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .rb-qat button:hover:not(:disabled){ background:#1f2937; color:#fff; }
  .rb-qat button:disabled{ opacity:.35; cursor:default; }
  .rb-tab{
    position:relative; padding:0 14px; display:flex; align-items:center; font-size:13px; color:#9ca3af; cursor:pointer;
    border-radius:7px 7px 0 0; margin-top:4px; white-space:nowrap;
  }
  .rb-tab:hover{ color:#e5e7eb; background:rgba(255,255,255,.04); }
  .rb-tab.active{ background:#1f2937; color:#fff; }

  .rb-right{ margin-left:auto; display:flex; align-items:center; gap:6px; }
  .rb-search{
    display:flex; align-items:center; gap:8px; height:24px; min-width:230px; padding:0 10px; border-radius:7px;
    background:#1f2937; border:1px solid #374151; color:#9ca3af; font-size:12px; cursor:pointer;
  }
  .rb-search:hover{ border-color:#6366f1; color:#e5e7eb; }
  .rb-search .kbd{ margin-left:auto; font-family:Menlo,Consolas,monospace; font-size:10px; color:#6b7280; }
  .rb-iconbtn{
    width:26px; height:24px; border-radius:6px; border:1px solid #374151; background:transparent; color:#9ca3af;
    cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .rb-iconbtn:hover{ background:#1f2937; color:#fff; }
  .rb-rec{
    display:none; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:12px;
    background:#7f1d1d; color:#fecaca; font-size:12px; font-weight:600; cursor:pointer;
  }
  .rb-rec.show{ display:flex; }
  .rb-rec .dot{ width:8px; height:8px; border-radius:50%; background:#ef4444; animation:rbpulse 1.1s infinite; }
  @keyframes rbpulse{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }
  .rb-body{
    height:94px; background:#1f2937; display:flex; align-items:stretch; padding:5px 6px 0; overflow-x:auto; overflow-y:hidden;
    border-top:1px solid #374151;
  }
  #ribbon.collapsed .rb-body{ display:none; }
  #ribbon.collapsed.flyout .rb-body{
    display:flex; position:absolute; top:32px; left:0; right:0; box-shadow:0 14px 30px rgba(0,0,0,.4);
  }
  .rb-group{ display:flex; flex-direction:column; padding:0 6px; border-right:1px solid #374151; flex-shrink:0; }
  .rb-group:last-child{ border-right:none; }
  .rb-group-items{ flex:1; display:flex; gap:2px; align-items:flex-start; }
  .rb-group-label{ font-size:10.5px; color:#9ca3af; text-align:center; padding:1px 0 3px; white-space:nowrap; }
  .rb-col{ display:flex; flex-direction:column; gap:1px; }
  .rb-btn{
    position:relative; border:1px solid transparent; background:transparent; color:#e5e7eb; cursor:pointer;
    border-radius:6px; font-family:inherit; padding:0;
  }
  .rb-btn:hover:not(:disabled){ background:#374151; border-color:#4b5563; }
  .rb-btn:active:not(:disabled){ background:#4b5563; }
  .rb-btn:disabled{ opacity:.35; cursor:default; }
  .rb-btn.large{
    min-width:52px; max-width:84px; height:66px; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; gap:4px; padding:5px 5px 0; font-size:11.5px; line-height:1.15; text-align:center;
  }
  .rb-btn.large .ic{ font-size:22px; line-height:26px; height:26px; }
  .rb-btn.small{
    height:21px; display:flex; align-items:center; gap:6px; padding:0 7px 0 4px; font-size:12px; white-space:nowrap;
  }
  .rb-btn.small .ic{ width:18px; text-align:center; font-size:13px; }
  .rb-btn.active-choice{ background:#4338ca; border-color:#6366f1; }
  .rb-empty-note{ font-size:11px; color:#6b7280; padding:8px 6px; max-width:180px; white-space:normal; }

  /* ---------- KeyTips ---------- */
  #keytipLayer{ position:fixed; inset:0; pointer-events:none; z-index:400; }
  .keytip{
    position:fixed; transform:translate(-50%, -20%); pointer-events:none;
    font:700 11px/1 Menlo,Consolas,monospace; color:#111827; background:#fde68a; border:1px solid #b45309;
    border-radius:4px; padding:3px 5px; box-shadow:0 2px 6px rgba(0,0,0,.35); letter-spacing:.5px;
  }
  .keytip.dim{ opacity:.25; }
  .keytip .typed{ color:#b45309; }
  .keytip-hint{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:rgba(17,24,39,.94); color:#e5e7eb;
    font-size:12px; padding:6px 12px; border-radius:8px; pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,.35);
  }

  /* ---------- Command Launcher ---------- */
  .launcher-overlay{ position:fixed; inset:0; z-index:250; background:rgba(15,23,42,.25); }
  .launcher{
    position:fixed; top:84px; left:50%; transform:translateX(-50%); width:620px; max-width:calc(100vw - 32px);
    background:#fff; border-radius:12px; box-shadow:0 22px 60px rgba(0,0,0,.35); overflow:hidden;
    border:1px solid #e5e7eb;
  }
  .launcher input.lq{
    width:100%; border:none; outline:none; font-size:16px; padding:14px 16px; border-bottom:1px solid #e5e7eb; font-family:inherit;
  }
  .launcher .lres{ max-height:420px; overflow-y:auto; padding:4px 0; }
  .launcher .lsec{ font-size:10.5px; font-weight:700; color:#9ca3af; text-transform:uppercase; letter-spacing:.5px; padding:8px 16px 3px; }
  .launcher .lrow{
    display:flex; align-items:center; gap:10px; padding:7px 16px; cursor:pointer; font-size:13px; color:#1e2937;
  }
  .launcher .lrow .lic{ width:22px; text-align:center; font-size:15px; }
  .launcher .lrow .llabel{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .launcher .lrow .llabel b{ color:#4f46e5; }
  .launcher .lrow .lcat{ font-size:11px; color:#9ca3af; }
  .launcher .lrow .lkbd{ font-family:Menlo,Consolas,monospace; font-size:10.5px; color:#6b7280; background:#f3f4f6; border:1px solid #e5e7eb; border-radius:5px; padding:1px 6px; }
  .launcher .lrow.sel{ background:#eef2ff; }
  .launcher .lrow.disabled{ opacity:.45; }
  .launcher .lfoot{ font-size:11px; color:#9ca3af; padding:7px 16px; border-top:1px solid #f1f5f9; display:flex; gap:14px; }
  .launcher .lform{ padding:12px 16px 4px; }
  .launcher .lform h4{ margin:0 0 2px; font-size:14px; color:#111827; }
  .launcher .lform .ldesc{ font-size:12px; color:#6b7280; margin:0 0 10px; }
  .launcher .lerr{ color:#b91c1c; font-size:12px; padding:0 16px 8px; }

  /* shared parameter form (launcher + macro editor) */
  .pform-row{ display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .pform-row label{ min-width:104px; font-size:12px; color:#374151; }
  .pform-row input[type=text], .pform-row input[type=number], .pform-row select, .pform-row textarea{
    flex:1; min-width:0; font-size:13px; padding:5px 8px; border-radius:6px; border:1px solid #d1d5db; font-family:inherit; background:#fff;
  }
  .pform-row textarea{ resize:vertical; min-height:48px; }
  .pform-row .phelp{ font-size:10.5px; color:#9ca3af; }
  .pform-help{ font-size:11px; color:#9ca3af; margin:-3px 0 8px 112px; }

  /* ---------- Macro builder ---------- */
  .modal-box.macro-box{ width:1060px; max-width:96vw; height:640px; max-height:92vh; display:flex; flex-direction:column; padding:16px 18px; }
  .macro-box > p.mtitle{ margin:0 0 10px; font-weight:600; }
  .macro-layout{ flex:1; display:flex; gap:12px; min-height:0; }

  .macro-list .mitems{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
  .macro-list .mitem{
    text-align:left; padding:7px 9px; border-radius:7px; border:1px solid #e5e7eb; background:#fff; cursor:pointer; font-size:13px;
    color:#1e2937; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .macro-list .mitem:hover{ background:#f8fafc; }
  .macro-list .mitem.active{ border-color:#6366f1; background:#eef2ff; }
  .macro-list .mitem .msub{ display:block; font-size:10.5px; color:#9ca3af; }
  .mbtn{
    font-size:12px; padding:5px 9px; border-radius:6px; border:1px solid #d1d5db; background:#fff; cursor:pointer; color:#1e2937; white-space:nowrap;
  }
  .mbtn:hover:not(:disabled){ background:#f3f4f6; }
  .mbtn:disabled{ opacity:.4; cursor:default; }
  .mbtn.primary{ background:#6366f1; border-color:#6366f1; color:#fff; font-weight:600; }
  .mbtn.primary:hover{ background:#4f46e5; }
  .mbtn.rec{ background:#fef2f2; border-color:#fca5a5; color:#b91c1c; font-weight:600; }
  .macro-main{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .macro-meta{ display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .macro-meta input[type=text]{ font-size:13px; padding:5px 8px; border-radius:6px; border:1px solid #d1d5db; font-family:inherit; }
  .macro-meta label{ font-size:12px; color:#374151; display:flex; align-items:center; gap:4px; }
  .macro-tools{ display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
  .macro-split{ flex:1; display:flex; gap:10px; min-height:0; }
  .macro-tree{
    flex:1; overflow:auto; border:1px solid #e5e7eb; border-radius:8px; background:#fbfcfe; padding:4px 0; min-width:0;
    font-size:12.5px;
  }
  .macro-tree:focus{ outline:2px solid #c7d2fe; outline-offset:-1px; }
  .mrow{
    display:flex; align-items:center; gap:6px; padding:3px 8px; cursor:pointer; border-top:2px solid transparent; border-bottom:2px solid transparent;
    white-space:nowrap; color:#1e2937;
  }
  .mrow:hover{ background:#f1f5f9; }
  .mrow.sel{ background:#e0e7ff; }
  .mrow.disabled .msum{ opacity:.45; text-decoration:line-through; }
  .mrow.err{ background:#fee2e2; }
  .mrow.drop-before{ border-top-color:#6366f1; }
  .mrow.drop-after{ border-bottom-color:#6366f1; }
  .mrow.drop-inside{ background:#c7d2fe; }
  .mrow .mtw{ width:14px; text-align:center; color:#6b7280; flex-shrink:0; }
  .mrow .mki{ width:18px; text-align:center; flex-shrink:0; }
  .mrow .msum{ overflow:hidden; text-overflow:ellipsis; }
  .mrow .msum .act{ font-family:Menlo,Consolas,monospace; font-weight:700; color:#4338ca; }
  .mrow .msum .arg{ font-family:Menlo,Consolas,monospace; color:#475569; }
  .mrow .msum .asg{ font-family:Menlo,Consolas,monospace; color:#059669; font-weight:700; }
  .mrow .msum .cmt{ color:#94a3b8; font-style:italic; }
  .macro-empty{ color:#94a3b8; font-size:12px; padding:18px; line-height:1.5; }
  .macro-props{ width:340px; flex-shrink:0; overflow-y:auto; border:1px solid #e5e7eb; border-radius:8px; padding:10px 12px; background:#fff; }
  .macro-props h5{ margin:0 0 8px; font-size:13px; color:#111827; }
  .macro-props .pdesc{ font-size:11.5px; color:#6b7280; margin:-4px 0 10px; line-height:1.4; }
  .macro-foot{ display:flex; gap:6px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .macro-foot .status{ font-size:12px; color:#6b7280; margin-right:auto; }
  .macro-foot .status.err{ color:#b91c1c; }
  .macro-foot .status.ok{ color:#047857; }
  .macro-ref-help{ font-size:11px; color:#6b7280; line-height:1.45; background:#f8fafc; border-radius:6px; padding:6px 8px; margin-top:8px; }
  .macro-ref-help code{ font-family:Menlo,Consolas,monospace; color:#4338ca; }

  /* ---------- Customize Ribbon ---------- */
  .modal-box.rbc-box{ width:900px; max-width:96vw; height:600px; max-height:92vh; display:flex; flex-direction:column; padding:16px 18px; }
  .rbc-layout{ flex:1; display:flex; gap:12px; min-height:0; }
  .rbc-pane{ flex:1; display:flex; flex-direction:column; min-height:0; min-width:0; }

  .rbc-row .ic{ width:18px; text-align:center; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:500; background:#111827; color:#f9fafb;
    font-size:13px; padding:8px 14px; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.3); pointer-events:none;
    transition:opacity .2s;
  }
  .tsep{ width:1px; height:22px; background:#374151; margin:0 2px; }
  button.tbtn{
    font-size:13px; padding:7px 12px; border-radius:8px; border:1px solid #374151;
    background:transparent; color:#e5e7eb; cursor:pointer; white-space:nowrap;
    transition:background .12s ease, transform .08s ease;
  }
  button.tbtn:hover{background:#1f2937;}
  button.tbtn:active{ transform:scale(.96); }
  button.tbtn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.tbtn.primary:hover{background:var(--accent-hover);}
  button.tbtn.op{ background:var(--op-bg); border-color:var(--op-border); color:var(--op-text); font-weight:700; }
  button.tbtn.alias-btn{ background:#ecfeff; border-color:#0891b2; color:#0e7490; font-weight:700; }
  button.tbtn.alias-btn:hover{ background:#cffafe; }
  button.tbtn.block-btn{ background:#f5f3ff; border-color:#7c3aed; color:#5b21b6; font-weight:700; }
  button.tbtn.block-btn:hover{ background:#ede9fe; }
  button.tbtn.templates-btn{ background:#fff7ed; border-color:#ea580c; color:#9a3412; font-weight:700; }
  button.tbtn.templates-btn:hover{ background:#ffedd5; }
  button.tbtn.shortcuts-btn{ background:#f0fdf4; border-color:#16a34a; color:#15803d; font-weight:700; }
  button.tbtn.shortcuts-btn:hover{ background:#dcfce7; }

  .shortcuts-box{ min-width:560px; max-width:680px; }
  .shortcuts-search{
    width:100%; box-sizing:border-box; font-size:13px; padding:8px 10px; border-radius:8px;
    border:1px solid #d1d5db; margin-bottom:12px; font-family:inherit;
  }
  .shortcuts-list{ max-height:420px; overflow-y:auto; margin-bottom:12px; }
  .shortcut-cat-header{
    font-size:11px; font-weight:700; color:#9ca3af; text-transform:uppercase; letter-spacing:.4px;
    margin:12px 0 4px;
  }
  .shortcut-row{
    display:flex; align-items:center; gap:8px; padding:6px 4px; border-bottom:1px solid #f1f5f9;
  }
  .shortcut-row .cmd-label{ flex:1; font-size:13px; color:var(--text); }
  .kbd-badge{
    font-family:Menlo,Consolas,monospace; font-size:11px; padding:2px 8px; border-radius:6px;

  }

  .shortcut-row button{
    font-size:11px; padding:4px 8px; border-radius:6px; border:1px solid #d1d5db; background:#fff; cursor:pointer;
  }
  .shortcut-row button:hover{ background:#f3f4f6; }

  .template-box{ min-width:600px; max-width:760px; }
  .dedupe-box{ min-width:620px; max-width:820px; }

  .dedupe-body{ display:flex; gap:12px; margin-bottom:12px; }

  .modal-actions button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }

  .modal-actions button.danger{ background:#dc2626; border-color:#dc2626; color:#fff; font-weight:600; }

  /* A canvas made from a template that has a newer version (Update this canvas) */

  #templateUpdateBanner button{ flex:none; padding:5px 10px; border-radius:6px; border:1px solid #93c5fd; background:#fff; color:#1e3a8a; cursor:pointer; font-size:12.5px; }
  #templateUpdateBanner button.template-update-go{ background:#2563eb; border-color:#2563eb; color:#fff; font-weight:600; }
  .canvas-tab .template-update-mark{ margin-left:5px; font-size:11px; color:#2563eb; }

  .template-update-pick{ display:flex; align-items:center; gap:6px; font-size:13px; margin-bottom:8px; }

  .template-update-box .template-update-warning{ font-size:12px; color:#92400e; background:#fffbeb; border:1px solid #fde68a; border-radius:6px; padding:6px 8px; margin:0 0 10px; }
  .template-update-box .template-update-kept, .template-update-box .template-update-dropped{ font-size:12px; color:#374151; margin:0 0 8px; }
  .template-update-box .template-desc{ font-size:12px; color:#374151; margin:0 0 8px; }

  /* Recipes: templates made of canvas templates (Templates window, recipe editor) */
  .template-list button .kind-tag.recipe{ background:#dcfce7; color:#166534; }
  .recipe-editor{ min-width:480px; max-width:620px; }
  .recipe-editor .recipe-field{ display:block; margin-bottom:8px; font-size:12px; color:#6b7280; }
  .recipe-editor .recipe-field span{ display:block; margin-bottom:3px; }
  .recipe-parts-head{ font-size:12px; font-weight:600; color:#374151; margin:10px 0 6px; }
  .recipe-parts{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .recipe-part{ display:flex; align-items:center; gap:6px; }
  .recipe-part select{ font-size:12.5px; padding:4px 6px; border-radius:6px; border:1px solid #d1d5db; }
  .recipe-part .recipe-part-family{ flex:1; min-width:0; }
  .recipe-part button{ padding:3px 8px; border-radius:6px; border:1px solid #d1d5db; background:#fff; cursor:pointer; }
  .recipe-part button:disabled{ opacity:.4; cursor:default; }
  .recipe-part-state{ font-size:12px; }
  .recipe-part-state.ok{ color:#15803d; }
  .recipe-part-state.differs, .recipe-part-state.missing-version, .recipe-part-state.missing-family, .recipe-part-state.wrong-kind{ color:#b45309; }
  .recipe-add-part{ padding:4px 10px; border-radius:6px; border:1px dashed #9ca3af; background:#fff; cursor:pointer; font-size:12.5px; }
  .recipe-check{ font-size:12px; color:#15803d; margin:10px 0; }
  .recipe-check.warn{ color:#92400e; background:#fffbeb; border:1px solid #fde68a; border-radius:6px; padding:6px 8px; }
  .recipe-detail-parts{ margin:4px 0 8px 18px; padding:0; font-size:13px; }
  .recipe-detail-parts li{ margin-bottom:3px; }

  /* A socket fed by more than one plug: their values are added (maybe by accident) */
  .socket-chip.multi{ background:#fef3c7; color:#92400e; border-color:#f59e0b; pointer-events:auto; cursor:help; }
  .recipe-check{ white-space:pre-line; }
  /* Messages and questions keep the line breaks they are written with */
  .modal-box > p:first-child{ white-space:pre-line; }
</style>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const svg = document.getElementById('edges');
  const viewport = document.getElementById('viewport');
  const app = document.getElementById('app');
  const ribbonEl = document.getElementById('ribbon');
  const fileInputWorkspace = document.getElementById('fileInputWorkspace');
  const fileInputSystem = document.getElementById('fileInputSystem');
  const fileInputModule = document.getElementById('fileInputModule');
  const guideV = document.getElementById('guideV');
  const guideH = document.getElementById('guideH');
  const SVGNS = 'http://www.w3.org/2000/svg';
  const SNAP_THRESHOLD = 6;

  // ---------- operator catalogue (shared: src/shared/operators.js) ----------
  // Every built-in operator, keyed by a lasting id that never changes (plugins and saved
  // references use the id, never the symbol or a display name). `symbol` is what a file
  // saves in an operator node's `text`; the order is the palette's order (fmIDE's
  // "Insert Operator" commands are numbered by it, so new operators go at the end).
  // `word` is the plain name shown next to a symbol ("+ Add"); function operators (fn) show
  // ƒ and their symbol instead.
  //
  // How each one calculates, from its inputs' values in left-to-right order:
  // - fold: combines the values pairwise from the left (a result of NaN is a 'math-error');
  // - all: takes the whole list;
  // - unary: exactly one input (otherwise 'unary-only');
  // - compare: a chain a < b < c means a < b and b < c; 1 = true, 0 = false (needs two inputs:
  //   otherwise 'needs-two');
  // - fallback (iferror): its first input, or when that fails its second, or 0.
  // `unit` is how the unit of measure passes through: 'multiply', 'divide', 'same' (every
  // input must have the same unit, which the result takes), or null (no unit).
  // How each operator is spelled in Excel lives in ExcelExporter, not here.
  const OPERATORS = [
    { id: 'add',      symbol: '+',       word: 'Add',          fold: (a, b) => a + b, unit: 'same' },
    { id: 'subtract', symbol: '−',       word: 'Subtract',     fold: (a, b) => a - b, unit: 'same' },
    { id: 'multiply', symbol: '×',       word: 'Multiply',     fold: (a, b) => a * b, unit: 'multiply' },
    { id: 'divide',   symbol: '÷',       word: 'Divide',       fold: (a, b) => b === 0 ? NaN : a / b, unit: 'divide' },
    { id: 'power',    symbol: '^',       word: 'Power',        fold: (a, b) => Math.pow(a, b), unit: null },
    // Excel's MOD: the result takes the divisor's sign (MOD(-7,3) = 2).
    { id: 'mod',      symbol: '%',       word: 'Modulo',       fold: (a, b) => b === 0 ? NaN : a - b * Math.floor(a / b), unit: null },
    { id: 'le',       symbol: '≤',       word: 'At most',      compare: (a, b) => a <= b, unit: null },
    { id: 'ge',       symbol: '≥',       word: 'At least',     compare: (a, b) => a >= b, unit: null },
    { id: 'lt',       symbol: '<',       word: 'Less than',    compare: (a, b) => a < b, unit: null },
    { id: 'gt',       symbol: '>',       word: 'Greater than', compare: (a, b) => a > b, unit: null },
    { id: 'abs',      symbol: 'abs',     fn: true, unary: (a) => Math.abs(a), unit: 'same' },
    { id: 'min',      symbol: 'min',     fn: true, all: (vs) => Math.min(...vs), unit: 'same' },
    { id: 'max',      symbol: 'max',     fn: true, all: (vs) => Math.max(...vs), unit: 'same' },
    { id: 'average',  symbol: 'ave',     fn: true, all: (vs) => vs.reduce((a, b) => a + b, 0) / vs.length, unit: 'same' },
    { id: 'iferror',  symbol: 'iferror', fn: true, fallback: true, unit: 'same' },
  ];
  const OPERATOR_BY_SYMBOL = new Map(OPERATORS.map(op => [op.symbol, op]));
  const OPERATOR_BY_ID = new Map(OPERATORS.map(op => [op.id, op]));

  // The catalogue entry for an operator node's saved text, or null (an unknown operator).
  function operatorForSymbol(symbol){ return OPERATOR_BY_SYMBOL.get(symbol) || null; }
  function operatorById(id){ return OPERATOR_BY_ID.get(id) || null; }

  // Applies an operator to its inputs' values (every one a number; iferror is handled by the
  // evaluator, which reads its inputs one at a time). Returns { value } or { error: code }.
  // An unknown operator (only a hand-edited file has one) passes its first input through.
  function applyOperator(op, values){
    if(!op) return { value: values[0] };
    if(op.unary){
      return values.length === 1 ? { value: op.unary(values[0]) } : { error: 'unary-only' };
    }
    if(op.compare){
      if(values.length < 2) return { error: 'needs-two' };
      return { value: values.slice(1).every((v, i) => op.compare(values[i], v)) ? 1 : 0 };
    }
    if(op.all) return { value: op.all(values) };
    const result = values.reduce((acc, v, idx) => idx === 0 ? v : op.fold(acc, v));
    return Number.isNaN(result) ? { error: 'math-error' } : { value: result };
  }
  // The operators, in palette order, from the shared catalogue.
  const OPS = OPERATORS.map(op => op.symbol);
  const WORD_OPS = OPERATORS.filter(op => op.fn).map(op => op.symbol);

  function operatorSize(sym){
    if(WORD_OPS.includes(sym)){
      return { w: Math.max(56, 24 + sym.length * 10), h: 40 };
    }
    return { w: 56, h: 56 };
  }

  // ---------- built-in templates ----------
  let TEMPLATES = []; // built-in starter templates removed by request — this now holds only user-saved templates
  let nextTemplateId = 1;
  // What "Remove duplicates…" requires to match, besides kind and the calculation (saved with the UI settings).
  let dedupeMatch = { name: true, layout: false, group: false, description: false };

  // Reusable rectangle-formatting presets (number format / border / font / fill),
  // saved and applied independently of any one rectangle, and exportable via JSON.
  let FORMAT_PRESETS = [];
  let nextFormatPresetId = 1;

  let nodes = [];   // {id, type:'value'|'operator', x, y, w, h, text}
  let edges = [];   // {id, from, to}
  let nextId = 1;
  let nextCanvasId = 1;
  let canvases = [];        // {id, name, nodes, edges, history, future, computedValues, computeErrors}
  let activeCanvasId = null;
  let periods = ['Period 1']; // shared timeline across every canvas; period-shift nodes read across these
  let currentPeriod = 0;      // which period's computed values are currently shown on canvas
  const canvasTabsEl = document.getElementById('canvasTabs');
  const btnAddCanvas = document.getElementById('btnAddCanvas');

  // ---------- command registry & keyboard shortcuts ----------
  // Every user-facing command lives here: the Ribbon, the Quick Access Toolbar, KeyTips,
  // the Command Launcher and keyboard shortcuts all read from this one list. Commands that
  // change the model call the `fm` automation API (defined further down), so a command run
  // from the Ribbon, a shortcut, the Launcher or a macro all go through the same code path.
  //   icon     — glyph shown on Ribbon/QAT/Launcher
  //   enabled  — optional () => bool; drives disabled state everywhere
  //   dynLabel — optional () => string; a live label (e.g. the current period)
  const hasNodeSel = () => selectedNodeIds.size > 0;
  let installPrompt = null; // the browser's offer to install fmIDE (21-web-app.js)
  const COMMANDS = [
    { id:'undo',        label:'Undo',                  icon:'↶', category:'Edit', defaultShortcut:'Mod+Z',       enabled:() => history.length > 0, action:() => undo() },
    { id:'redo',        label:'Redo',                  icon:'↷', category:'Edit', defaultShortcut:'Mod+Shift+Z', enabled:() => future.length > 0,  action:() => redo() },
    { id:'copy',        label:'Copy',                  icon:'⧉', category:'Edit', defaultShortcut:'Mod+C',       enabled:hasNodeSel, action:() => fm.copy() },
    { id:'cut',         label:'Cut',                   icon:'✂', category:'Edit', defaultShortcut:'Mod+X',       enabled:hasNodeSel, action:() => fm.cut() },
    { id:'paste',       label:'Paste',                 icon:'📋', category:'Edit', defaultShortcut:'Mod+V',      enabled:() => !!(clipboard && clipboard.nodes.length), action:() => { const ids = fm.paste(); if(ids) selectNodesOnly(ids); } },
    { id:'deleteSel',   label:'Delete Selected',       icon:'🗑', category:'Edit', defaultShortcut:'Delete',      enabled:() => !!(selectedEdgeId || selectedNodeIds.size), action:() => fm.deleteSelected() },
    { id:'selectAll',   label:'Select All',            icon:'▦', category:'Edit', defaultShortcut:'Mod+A',       enabled:() => nodes.length > 0, action:() => fm.selectAll() },
    { id:'deselect',    label:'Deselect / Cancel',     icon:'⎋', category:'Edit', defaultShortcut:'Escape',       action:() => { closePicker(); if(selectedEdgeId || selectedNodeIds.size) clearSelection(); } },

    { id:'addRect',     label:'Add Rectangle',         icon:'▭', category:'Insert', defaultShortcut:null, action:() => addRectangleInteractive() },
    { id:'addOperator', label:'Add Operator',          icon:'±', category:'Insert', defaultShortcut:null, action:() => addOperatorInteractive() },
    { id:'addAlias',    label:'Add Alias',             icon:'🔗', category:'Insert', defaultShortcut:null, action:() => showAliasPicker(null) },
    { id:'addBlock',    label:'Add Block',             icon:'▣', category:'Insert', defaultShortcut:null, action:() => showBlockPicker(null) },
    { id:'addPeriodShift', label:'Add Period Shift',   icon:'⇥', category:'Insert', defaultShortcut:null, action:() => addPeriodShiftInteractive() },
    { id:'newCanvas',   label:'New Canvas',            icon:'🗋', category:'Canvas', defaultShortcut:null, action:() => fm.addCanvas() },
    { id:'renameCanvas',label:'Rename Canvas',         icon:'✎', category:'Canvas', defaultShortcut:null, action:() => startRenameActiveCanvas() },
    { id:'deleteCanvas',label:'Delete Canvas',         icon:'🗙', category:'Canvas', defaultShortcut:null, enabled:() => canvases.length > 1, action:() => deleteCanvasById(activeCanvasId) },
    { id:'clearCanvas', label:'Clear Canvas',          icon:'⌫', category:'Canvas', defaultShortcut:null, enabled:() => nodes.length > 0 || edges.length > 0, action:() => clearCanvasInteractive() },
    { id:'clearAll',    label:'Clear All Canvases',    icon:'🧹', category:'Canvas', defaultShortcut:null,
      enabled:() => canvases.length > 1 || nodes.length > 0 || edges.length > 0 || canvases[0].name !== 'Canvas 1',
      action:() => showConfirm('Clear everything? All canvases are removed, leaving one empty canvas named "Canvas 1". (You can Undo.)', () => fm.clearAll()) },
    { id:'moveCanvasLeft',  label:'Move Canvas Left',  icon:'⇠', category:'Canvas', defaultShortcut:null,
      enabled:() => canvases.findIndex(c => c.id === activeCanvasId) > 0, action:() => fm.moveCanvas('@current', canvases.findIndex(c => c.id === activeCanvasId)) },
    { id:'moveCanvasRight', label:'Move Canvas Right', icon:'⇢', category:'Canvas', defaultShortcut:null,
      enabled:() => canvases.findIndex(c => c.id === activeCanvasId) < canvases.length - 1, action:() => fm.moveCanvas('@current', canvases.findIndex(c => c.id === activeCanvasId) + 2) },

    { id:'alignLeft',   label:'Align Left',              icon:'⇤', category:'Arrange', defaultShortcut:null, enabled:() => selectedNodeIds.size >= 2, action:() => fm.align('left') },
    { id:'alignCenterH',label:'Align Center (horizontal)',icon:'⇹', category:'Arrange', defaultShortcut:null, enabled:() => selectedNodeIds.size >= 2, action:() => fm.align('centerH') },
    { id:'alignRight',  label:'Align Right',             icon:'⇥', category:'Arrange', defaultShortcut:null, enabled:() => selectedNodeIds.size >= 2, action:() => fm.align('right') },
    { id:'alignTop',    label:'Align Top',               icon:'⤒', category:'Arrange', defaultShortcut:null, enabled:() => selectedNodeIds.size >= 2, action:() => fm.align('top') },
    { id:'alignCenterV',label:'Align Middle (vertical)',  icon:'⇳', category:'Arrange', defaultShortcut:null, enabled:() => selectedNodeIds.size >= 2, action:() => fm.align('centerV') },
    { id:'alignBottom', label:'Align Bottom',            icon:'⤓', category:'Arrange', defaultShortcut:null, enabled:() => selectedNodeIds.size >= 2, action:() => fm.align('bottom') },
    { id:'distH',       label:'Distribute Horizontally', icon:'⇿', category:'Arrange', defaultShortcut:null, enabled:() => selectedNodeIds.size >= 3, action:() => fm.distribute('h') },
    { id:'distV',       label:'Distribute Vertically',   icon:'↕', category:'Arrange', defaultShortcut:null, enabled:() => selectedNodeIds.size >= 3, action:() => fm.distribute('v') },

    { id:'evaluate',    label:'Evaluate',              icon:'▶', category:'Compute', defaultShortcut:'F9', action:() => fm.evaluate() },
    { id:'prevPeriod',  label:'Previous Period',       icon:'‹', category:'Compute', defaultShortcut:null, enabled:() => currentPeriod > 0, action:() => fm.prevPeriod() },
    { id:'nextPeriod',  label:'Next Period',           icon:'›', category:'Compute', defaultShortcut:null, enabled:() => currentPeriod < periods.length - 1, action:() => fm.nextPeriod() },
    { id:'managePeriods',label:'Manage Periods',       icon:'📅', category:'Compute', defaultShortcut:null,
      dynLabel:() => `${periods[currentPeriod] || ('Period ' + (currentPeriod + 1))} (${currentPeriod + 1}/${periods.length})`,
      action:() => showPeriodsManager() },

    { id:'saveSystem',  label:'Save System',           icon:'💾', category:'File', defaultShortcut:null, action:() => fm.saveSystem() },
    { id:'loadSystem',  label:'Load System (replace)', icon:'📂', category:'File', defaultShortcut:null, action:() => promptLoadSystem('replace') },
    { id:'addSystem',   label:'Add System (merge)',    icon:'➕', category:'File', defaultShortcut:null, action:() => promptLoadSystem('add') },
    { id:'saveModule',  label:'Save Module',           icon:'📦', category:'File', defaultShortcut:null, action:() => fm.saveModule() },
    { id:'loadModule',  label:'Load Module',           icon:'📥', category:'File', defaultShortcut:null, action:() => fileInputModule.click() },
    { id:'exportWorkspace', label:'Export Workspace',  icon:'⇩', category:'File', defaultShortcut:null, action:() => fm.exportWorkspace() },
    { id:'importWorkspace', label:'Import Workspace',  icon:'⇧', category:'File', defaultShortcut:null, action:() => fileInputWorkspace.click() },
    { id:'exportPreferences', label:'Export Preferences…', icon:'⚙', category:'File', defaultShortcut:null, action:() => exportPreferencesToFile() },
    { id:'importPreferences', label:'Import Preferences…', icon:'⚙', category:'File', defaultShortcut:null, action:() => importPreferencesInteractive() },
    { id:'openTemplates',label:'Templates',            icon:'📚', category:'File', defaultShortcut:null, action:() => showTemplatesPicker() },
    { id:'openFunctions', label:'Functions',            icon:'ƒ', category:'File', defaultShortcut:null, action:() => showFunctionsManager() },
    { id:'importFunctions', label:'Import Functions…',  icon:'⇧', category:'File', defaultShortcut:null, action:() => pickFunctionsFile() },
    { id:'removeDuplicateTemplates', label:'Remove Duplicate Templates…', icon:'🧹', category:'File', defaultShortcut:null, enabled:() => templateFamilies().length > 1, action:() => showRemoveDuplicatesDialog() },
    { id:'clearAllTemplates', label:'Clear All Templates', icon:'🗑', category:'File', defaultShortcut:null, enabled:() => TEMPLATES.length > 0, action:() => clearAllTemplates() },
    { id:'updateCanvasTemplate', label:'Update Canvas from Template…', icon:'⬆', category:'File', defaultShortcut:null, enabled:() => { const c = canvases.find(x => x.id === activeCanvasId); return !!(c && c.template); }, action:() => showUpdateCanvasDialog() },
    { id:'unlinkCanvasTemplate', label:'Unlink Canvas from Template', icon:'⛓', category:'File', defaultShortcut:null, enabled:() => { const c = canvases.find(x => x.id === activeCanvasId); return !!(c && c.template); }, action:() => guarded(() => fm.unlinkCanvasFromTemplate()) },
    { id:'openFormats', label:'Format Presets',        icon:'🎨', category:'File', defaultShortcut:null, action:() => showFormatPresetsPicker(null) },
    // Documents (.fmide files) — last in the File list, so a shortcut someone already gave
    // another command keeps priority over these defaults.
    { id:'newDocument', label:'New',                   icon:'📄', category:'File', defaultShortcut:null, action:() => newDocument() },
    { id:'openDocument',label:'Open…',                 icon:'📁', category:'File', defaultShortcut:'Mod+O', action:() => openDocument() },
    { id:'saveDocument',label:'Save',                  icon:'💾', category:'File', defaultShortcut:'Mod+S', action:() => saveDocument() },
    { id:'saveDocumentAs',label:'Save As…',            icon:'📝', category:'File', defaultShortcut:'Mod+Shift+S', action:() => saveDocumentAs() },
    { id:'openRecent',  label:'Open Recent…',          icon:'🕘', category:'File', defaultShortcut:null, action:() => showOpenRecent() },
    { id:'openExcelExporter', label:'Open ExcelExporter', icon:'📊', category:'File', defaultShortcut:null, action:() => openExcelExporter() },
    { id:'installApp',  label:'Install fmIDE',         icon:'⤓', category:'File', defaultShortcut:null, enabled:() => !!installPrompt, action:() => installApp() },

    { id:'openLauncher',label:'Command Launcher',      icon:'🔎', category:'View', defaultShortcut:'Mod+K', action:() => openLauncher() },
    { id:'openShortcuts',label:'Keyboard Shortcuts',   icon:'⌨', category:'View', defaultShortcut:null, action:() => showShortcutsPicker() },
    { id:'toggleRibbon',label:'Collapse / Expand Ribbon', icon:'⌃', category:'View', defaultShortcut:'Mod+F1', action:() => setRibbonCollapsed(!ribbonState.collapsed) },
    { id:'customizeRibbon',label:'Customize Ribbon & KeyTips', icon:'⚙', category:'View', defaultShortcut:null, action:() => showCustomizeRibbon() },

    { id:'openMacros',  label:'Macro Builder',         icon:'🧩', category:'Macros', defaultShortcut:null, action:() => showMacroBuilder() },
    { id:'toggleRecord',label:'Record Macro',          icon:'⏺', category:'Macros', defaultShortcut:null,
      dynLabel:() => recorder.active ? 'Stop Recording' : 'Record Macro', action:() => toggleRecordingQuick() },
    { id:'runLastMacro',label:'Run Last Macro',        icon:'⏵', category:'Macros', defaultShortcut:null, enabled:() => !!lastRunMacroId && MACROS.some(m => m.id === lastRunMacroId), action:() => runMacroInteractive(lastRunMacroId) },
  ];
  // Symbol operators show the symbol as the icon and a word as the label ("+ Add");
  // function operators show ƒ plus their name ("ƒ max"), so nothing is printed twice.
  const OP_NAMES = Object.fromEntries(OPERATORS.filter(op => op.word).map(op => [op.symbol, op.word]));
  OPS.forEach((sym, i) => {
    const word = OP_NAMES[sym];
    COMMANDS.push({ id:'insertOp' + i, label:'Insert Operator ' + sym + (word ? ' (' + word + ')' : ''), short: word || sym,
      icon: word ? sym : 'ƒ', category:'Insert', defaultShortcut:null, action:() => addOperatorInteractive(sym) });
  });
  const CATEGORY_ORDER = ['Edit','Insert','Arrange','Compute','Canvas','File','View','Macros'];
  function getCommand(id){ return COMMANDS.find(c => c.id === id); }
  function commandEnabled(c){ try{ return !c.enabled || !!c.enabled(); }catch(err){ return false; } }
  function commandLabel(c){ try{ return c.dynLabel ? c.dynLabel() : c.label; }catch(err){ return c.label; } }
  function runCommand(id){
    const c = getCommand(id);
    if(!c || !commandEnabled(c)) return false;
    try{ c.action(); }
    catch(err){ reportError(err); }
    return true;
  }

  let shortcutBindings = {};
  let shortcutMap = {};

  // ---------- key combos ----------
  // Stored combos use platform-neutral tokens, always in this order:
  //   Mod   — the primary modifier: Command (⌘) on Mac, Ctrl on Windows/Linux
  //   Ctrl  — the Control key on Mac (⌃); not used elsewhere (Ctrl there is Mod)
  //   Alt   — Option (⌥) on Mac, Alt elsewhere
  //   Shift
  //   Meta  — the Windows key (Windows/Linux only)
  // so "Mod+Z" is Cmd+Z on a Mac and Ctrl+Z on Windows, while Cmd+R and Control+R on a
  // Mac are different shortcuts ("Mod+R" vs "Ctrl+R").
  const COMBO_MOD_ORDER = ['Mod', 'Ctrl', 'Alt', 'Shift', 'Meta'];
  const MODIFIER_KEY_NAMES = ['Control', 'Meta', 'Alt', 'Shift', 'AltGraph', 'CapsLock', 'Fn', 'FnLock', 'OS', 'Hyper', 'Super'];

  // The key part of a combo. Letters and digits come from the physical key when the typed
  // character is altered by a modifier (Option+R types "®" on a Mac, Shift+1 types "!").
  function comboKeyName(e){
    let key = e.key || '';
    if(/^Key[A-Z]$/.test(e.code || '') && !/^[a-z]$/i.test(key)) key = e.code.slice(3);
    else if(/^Digit[0-9]$/.test(e.code || '') && (e.shiftKey || e.altKey || !/^[0-9]$/.test(key))) key = e.code.slice(5);
    if(key === ' ' || key === 'Spacebar') return 'Space';
    if(key === '+') return 'Plus';
    if(key === 'Esc') return 'Escape';
    if(key === 'Del') return 'Delete';
    if(key.length === 1) return key.toUpperCase();
    return key;
  }

  function normalizeCombo(e){
    if(!e.key || MODIFIER_KEY_NAMES.includes(e.key) || e.key === 'Dead' && !/^Key|^Digit/.test(e.code || '')) return null;
    const mac = isMac();
    const mods = new Set();
    if(mac){ if(e.metaKey) mods.add('Mod'); if(e.ctrlKey) mods.add('Ctrl'); }
    else { if(e.ctrlKey) mods.add('Mod'); if(e.metaKey) mods.add('Meta'); }
    if(e.altKey) mods.add('Alt');
    if(e.shiftKey) mods.add('Shift');
    return COMBO_MOD_ORDER.filter(m => mods.has(m)).concat(comboKeyName(e)).join('+');
  }

  // Canonicalises a stored/imported combo string. `legacy` = written before Mac modifiers
  // were told apart, when "Ctrl" meant "Ctrl, or Cmd on a Mac" — i.e. today's "Mod".
  function canonicalCombo(str, legacy){
    if(!str || typeof str !== 'string') return null;
    const raw = str.split('+');
    // a literal "+" key written as "Ctrl++"
    if(str.endsWith('++')){ raw.splice(raw.length - 2, 2, 'Plus'); }
    const tokens = raw.map(t => t.trim()).filter(Boolean);
    if(!tokens.length) return null;
    const key = tokens.pop();
    const alias = { cmd:'Mod', command:'Mod', '⌘':'Mod', mod:'Mod', option:'Alt', opt:'Alt', '⌥':'Alt', alt:'Alt',
      control:'Ctrl', ctl:'Ctrl', '⌃':'Ctrl', ctrl: legacy ? 'Mod' : 'Ctrl', shift:'Shift', '⇧':'Shift', meta:'Meta', win:'Meta', super:'Meta' };
    const mods = new Set();
    for(const t of tokens){
      const m = alias[t.toLowerCase()];
      if(!m) return null;
      mods.add(m);
    }
    const k = key.length === 1 ? key.toUpperCase() : key;
    return COMBO_MOD_ORDER.filter(m => mods.has(m)).concat(k).join('+');
  }

  // Combos browsers/OSes keep for themselves: pages never see them, so warn before binding.
  const RESERVED_COMBOS = new Set(['Mod+W', 'Mod+T', 'Mod+N', 'Mod+Shift+N', 'Mod+Shift+T', 'Mod+Shift+W', 'Mod+Q', 'Mod+Tab', 'Mod+Shift+Tab',
    'Mod+H', 'Mod+M', 'Mod+Alt+H', 'Mod+Alt+M', 'Mod+Space', 'Ctrl+Space', 'Alt+F4', 'Ctrl+Tab', 'Mod+Shift+Q']);
  function comboReservedNote(combo){
    if(!combo || !RESERVED_COMBOS.has(combo)) return '';
    return `${prettyCombo(combo)} is usually reserved by the browser or operating system, so it may never reach fmIDE.`;
  }

  function rebuildShortcutMap(){
    shortcutMap = {};
    COMMANDS.forEach(c => { const combo = shortcutBindings[c.id]; if(combo) shortcutMap[combo] = c.id; });
  }

  function dedupeBindings(){
    const seen = {};
    COMMANDS.forEach(c => {
      const combo = shortcutBindings[c.id];
      if(!combo) return;
      if(seen[combo]) shortcutBindings[c.id] = null;
      else seen[combo] = c.id;
    });
  }

  COMMANDS.forEach(c => { shortcutBindings[c.id] = c.defaultShortcut; });
  dedupeBindings();
  rebuildShortcutMap();

  let selectedNodeIds = new Set();
  let selectedEdgeId = null;
  let activePicker = null;

  let computedValues = {};
  let computeErrors = {};
  let portValues = {};   // blockInstanceId -> [value, value, ...] per declared output
  let portErrors = {};   // blockInstanceId -> [errCode, errCode, ...] per declared output

  // ---------- selection ----------
  function selectNodesOnly(ids){ selectedEdgeId = null; selectedNodeIds = new Set(ids); closePicker(); render(); }
  function toggleNodeSelection(id){ selectedEdgeId = null; if(selectedNodeIds.has(id)) selectedNodeIds.delete(id); else selectedNodeIds.add(id); closePicker(); render(); }
  function selectEdgeOnly(id){ selectedNodeIds.clear(); selectedEdgeId = id; closePicker(); render(); }
  function clearSelection(){ selectedNodeIds.clear(); selectedEdgeId = null; closePicker(); render(); }

  // ---------- helpers ----------
  function uid(prefix){ return prefix + (nextId++); }
  function getNode(id){ return nodes.find(n => n.id === id); }

  // A value rectangle's name, typed number and unit (parseRectText: src/shared/ir.js).
  function parseNode(n){ return parseRectText(n.text); }

  function formatNum(v){
    if(v === null || v === undefined || !isFinite(v)) return '?';
    const r = Math.round(v * 1e6) / 1e6;
    return r.toString();
  }

  // ---------- Unit of measure (UOM) ----------
  // Parsing and unit arithmetic are shared (src/shared/uom.js); a node's unit comes from the
  // IR (nodeUOM, in 06-align-marquee-computation.js).
  // ---------- unit of measure (UOM) (shared: src/shared/uom.js) ----------
  // A rectangle's optional 3rd text line ("Name\nValue\nUOM") is a manual unit label,
  // e.g. "kt", "$/t". For rectangles with no manual UOM, the UOM of a formula-driven
  // rectangle is derived automatically from its inputs' UOMs through the same × ÷ + −
  // (and abs/min/max/ave/iferror) logic used to compute its value — so "Unit Price ($/t)
  // × Volume (kt)" resolves to "$k" automatically. A UOM is represented internally as
  // {scale, dims}: dims maps a base symbol (e.g. '$', 't') to its exponent (denominator
  // atoms are negative), and scale is the numeric multiplier from a recognized prefix
  // (k=1e3, m/mm=1e6, bn=1e9) that may be attached to either end of an atom's token.
  const UOM_PREFIXES = [['bn', 1e9], ['mm', 1e6], ['k', 1e3], ['m', 1e6]]; // checked longest-first
  const UOM_CURRENCY_SYMBOLS = new Set(['$', '€', '£', '¥']);
  const UOM_SCALE_TO_PREFIX = { 1: '', 1000: 'k', 1000000: 'm', 1000000000: 'bn' };

  function parseUOMAtom(tok){
    tok = tok.trim();
    if(!tok) return null;
    if(tok === '%') return { scale: 0.01, symbol: '' };
    for(const [pfx, mult] of UOM_PREFIXES){
      if(tok.length > pfx.length){
        if(tok.slice(0, pfx.length).toLowerCase() === pfx) return { scale: mult, symbol: tok.slice(pfx.length).trim() };
        if(tok.slice(-pfx.length).toLowerCase() === pfx) return { scale: mult, symbol: tok.slice(0, -pfx.length).trim() };
      }
    }
    return { scale: 1, symbol: tok };
  }

  function parseUOMSegment(seg){
    return seg.split(/[*·]/).map(parseUOMAtom).filter(Boolean);
  }

  // Parses a manually-typed UOM string (e.g. "$/t", "kt", "$k") into {scale, dims}, or
  // null if blank/unparseable.
  function parseUOM(str){
    if(!str) return null;
    const s = str.trim();
    if(!s) return null;
    const slashIdx = s.indexOf('/');
    const numAtoms = parseUOMSegment(slashIdx === -1 ? s : s.slice(0, slashIdx));
    const denAtoms = slashIdx === -1 ? [] : parseUOMSegment(s.slice(slashIdx + 1));
    if(numAtoms.length === 0 && denAtoms.length === 0) return null;
    let scale = 1;
    const dims = {};
    numAtoms.forEach(a => { scale *= a.scale; if(a.symbol) dims[a.symbol] = (dims[a.symbol] || 0) + 1; });
    denAtoms.forEach(a => { scale /= a.scale; if(a.symbol) dims[a.symbol] = (dims[a.symbol] || 0) - 1; });
    Object.keys(dims).forEach(k => { if(dims[k] === 0) delete dims[k]; });
    return { scale, dims };
  }

  // Renders {scale, dims} back to a display string, e.g. {scale:1000, dims:{$:1}} -> "$k".
  function formatUOM(u){
    if(!u) return '';
    const numSyms = Object.keys(u.dims).filter(k => u.dims[k] > 0).sort();
    const denSyms = Object.keys(u.dims).filter(k => u.dims[k] < 0).sort();
    const prefix = UOM_SCALE_TO_PREFIX.hasOwnProperty(u.scale) ? UOM_SCALE_TO_PREFIX[u.scale] : '';
    const atomStr = (sym, exp) => (exp > 1 ? sym + '^' + exp : sym);
    let numPart;
    if(numSyms.length === 0){
      numPart = prefix;
    } else if(numSyms.length === 1 && prefix){
      const sym = numSyms[0];
      numPart = UOM_CURRENCY_SYMBOLS.has(sym) ? (atomStr(sym, u.dims[sym]) + prefix) : (prefix + atomStr(sym, u.dims[sym]));
    } else {
      numPart = (prefix ? prefix + '·' : '') + numSyms.map(s => atomStr(s, u.dims[s])).join('·');
    }
    const denPart = denSyms.map(s => atomStr(s, -u.dims[s])).join('·');
    return denPart ? (numPart || '1') + '/' + denPart : numPart;
  }

  function uomCombineDims(a, b, sign){
    const dims = Object.assign({}, a.dims);
    Object.keys(b.dims).forEach(k => {
      dims[k] = (dims[k] || 0) + sign * b.dims[k];
      if(dims[k] === 0) delete dims[k];
    });
    return dims;
  }
  function uomMultiply(a, b){ return (a && b) ? { scale: a.scale * b.scale, dims: uomCombineDims(a, b, 1) } : null; }
  function uomDivide(a, b){ return (a && b) ? { scale: a.scale / b.scale, dims: uomCombineDims(a, b, -1) } : null; }
  function uomDimsEqual(a, b){
    const ak = Object.keys(a.dims), bk = Object.keys(b.dims);
    return ak.length === bk.length && ak.every(k => a.dims[k] === b.dims[k]);
  }


  // Pads/truncates a per-period explicit-value array to a target length, holding the
  // last known value flat when growing so extending the timeline never breaks a drawn curve.
  function padPeriodValuesArray(arr, len){
    arr = (arr || []).slice(0, len);
    while(arr.length < len) arr.push(arr.length ? arr[arr.length - 1] : 0);
    return arr;
  }

  // Re-pads every node's periodValues (across every canvas) to the current periods.length.
  function reconcilePeriodValuesInCanvasList(list){
    (list || []).forEach(c => {
      (c.nodes || []).forEach(n => {
        if(Array.isArray(n.periodValues)) n.periodValues = padPeriodValuesArray(n.periodValues, periods.length);
      });
    });
  }

  function reconcilePeriodValuesEverywhere(){
    syncActiveIntoRegistry();
    reconcilePeriodValuesInCanvasList(canvases);
    const active = canvases.find(c => c.id === activeCanvasId);
    if(active) loadCanvasState(active);
  }

  // ---------- format roles (shared: src/shared/format-roles.js, used by both apps) ----------
  // One place defines how every kind of cell looks — on the canvas AND in the Excel file
  // ExcelExporter writes. Each role is an ordinary format preset with a reserved name
  // (edit it in the Formats manager); ExcelExporter reads these presets from the saved
  // workspace/system JSON. "Inputs" and "Calculations" also style canvas rectangles; the
  // rest only exist in the spreadsheet. A rectangle's own 🎨 format sets how it looks
  // (number format, weight, size, border); the ROLE owns the colours (fill, font colour)
  // (and border) in Excel unless the rectangle's format has "Use this fill, font colour &
  // border in Excel too" ticked. Border sides and "Use Excel's default font size" are
  // Excel-only settings of a style.
  const FORMAT_ROLES = [
    { name: 'Inputs', where: 'Canvas + Excel',
      desc: 'Hard-coded numbers: input rectangles, scenario values, and the cells you type on the Scenarios tab.',
      style: { numberFormat: { kind: 'general', decimals: 2, currencySymbol: '$' }, fill: '#eff6ff',
               border: { color: '#93c5fd', width: 1.5, style: 'solid' }, font: { family: '', size: 14, weight: 'normal', color: '#1e3a8a' } } },
    { name: 'Calculations', where: 'Canvas + Excel',
      desc: 'Formulas: rectangles fed by an arrow, and every calculated cell in Excel. Blank by default (the normal rectangle look).',
      style: { numberFormat: { kind: 'general', decimals: 2, currencySymbol: '$' }, fill: null, border: null, font: { family: '', size: null, weight: 'normal', color: null } } },
    { name: 'Links', where: 'Excel',
      desc: 'Formulas that only pull a value from another sheet (e.g. a row linked to the Inputs tab).',
      style: { numberFormat: { kind: 'general', decimals: 2, currencySymbol: '$' }, fill: null, border: null, font: { family: '', size: null, weight: 'normal', color: '#008000' } } },
    { name: 'Headers', where: 'Excel',
      desc: 'Each sheet\'s title and column-header row.',
      style: { numberFormat: { kind: 'general', decimals: 2, currencySymbol: '$' }, fill: '#f1f5f9', border: null, font: { family: '', size: null, weight: '700', color: null } } },
    { name: 'Section Headers', where: 'Excel',
      desc: 'The INPUTS / CALCULATIONS / OUTPUTS bands.',
      style: { numberFormat: { kind: 'general', decimals: 2, currencySymbol: '$' }, fill: '#f8fafc', border: null, font: { family: '', size: null, weight: '700', color: '#475569' } } },
    { name: 'Labels', where: 'Excel',
      desc: 'Custom / label rows and group headers (unless the row has its own format in ExcelExporter).',
      style: { numberFormat: { kind: 'general', decimals: 2, currencySymbol: '$' }, fill: null, border: null, font: { family: '', size: null, weight: '700', color: '#475569' } } },
    { name: 'Notes', where: 'Excel',
      desc: 'Notes, the Period # counter, scenario numbering and other helper text.',
      style: { numberFormat: { kind: 'general', decimals: 2, currencySymbol: '$' }, fill: null, border: null, font: { family: '', size: 9, weight: 'normal', color: '#94a3b8' } } }
  ];
  function formatRoleOf(name){ return FORMAT_ROLES.find(r => r.name === name) || null; }
  function rolePresetStyle(name){
    const p = FORMAT_PRESETS.find(x => x.name === name);
    if(p) return p.style;
    const r = formatRoleOf(name);
    return r ? r.style : null;
  }

  // ---------- input-rectangle rule (shared: src/shared/input-rule.js, used by both apps) ----------
  // `canvas` is { nodes, edges }.
  // True if nothing actually feeds `nodeId`: an operator (or period shift) whose every input
  // is itself fed by nothing — including one with no inputs at all, like a socket operator
  // with nothing plugged into it. Aliases, rectangles and block instances always count as a
  // real source.
  function feedsNothing(canvas, nodeId, visiting){
    if(visiting.has(nodeId)) return false;
    visiting.add(nodeId);
    const n = canvas.nodes.find(x => x.id === nodeId);
    if(!n) return true;
    if(n.type !== 'operator' && n.type !== 'periodShift') return false;
    return canvas.edges.filter(e => e.to === nodeId).every(e => feedsNothing(canvas, e.from, visiting));
  }
  // An input rectangle: a value rectangle with no incoming arrow, or whose single incoming
  // arrow comes from something fed by nothing (feedsNothing) — e.g. Cash ← [+] where the
  // + operator's socket has nothing plugged in. fmIDE then uses the rectangle's own typed
  // number, so both apps treat it as an input everywhere (canvas look, Excel section,
  // values, the "Inputs" role, Constant eligibility and the Inputs tab).
  function isInputRectangle(canvas, node){
    if(!canvas || !node || node.type !== 'value') return false;
    const inc = canvas.edges.filter(e => e.to === node.id);
    if(inc.length === 0) return true;
    return inc.length === 1 && feedsNothing(canvas, inc[0].from, new Set());
  }

  // ---------- reaching outside the timeline (shared: src/shared/input-rule.js) ----------
  // True if what feeds `nodeId` at `period` needs a period before the first or after the last,
  // through a period shift (e.g. a corkscrew's opening balance in period 1). A rectangle fed
  // this way shows its own typed number there, or 0 — in fmIDE and in Excel alike. The walk
  // follows what both apps compute in one step — operators, period shifts and aliases — and
  // stops at rectangles and block instances, which settle their own value. An iferror with a
  // fallback only fails when both of its first two inputs fail; with one input it gives 0. A
  // function node (functions.js) is followed like an operator: through any of its inputs.
  // `canvasOf(id)` returns a canvas { nodes, edges }; inputs are in left-to-right order.
  function reachesOutsideTimeline(canvasOf, canvasId, nodeId, period, periodCount, visiting){
    visiting = visiting || new Set();
    const key = canvasId + '|' + nodeId + '|' + period;
    if(visiting.has(key)) return false;
    visiting.add(key);
    const canvas = canvasOf(canvasId);
    const n = canvas && canvas.nodes.find(x => x.id === nodeId);
    if(!n) return false;
    const reach = (cid, id, p) => reachesOutsideTimeline(canvasOf, cid, id, p, periodCount, visiting);
    if(n.type === 'alias'){
      return !!(n.sourceCanvasId && n.sourceNodeId) && reach(n.sourceCanvasId, n.sourceNodeId, period);
    }
    const incoming = canvas.edges.filter(e => e.to === nodeId);
    if(n.type === 'periodShift'){
      if(incoming.length !== 1) return false;
      const target = period + ((typeof n.shift === 'number') ? n.shift : -1);
      if(target < 0 || target >= periodCount) return true;
      return reach(canvasId, incoming[0].from, target);
    }
    if(n.type !== 'operator' && n.type !== 'function') return false;
    const inputs = incoming.map(e => canvas.nodes.find(x => x.id === e.from)).filter(Boolean)
      .sort((a, b) => (a.x - b.x) || (a.y - b.y));
    if(n.type === 'operator' && n.text === 'iferror'){
      return inputs.length >= 2 && reach(canvasId, inputs[0].id, period) && reach(canvasId, inputs[1].id, period);
    }
    return inputs.some(src => reach(canvasId, src.id, period));
  }
  // The rule applied to the active canvas.
  function isInputRect(n){ return isInputRectangle({ nodes, edges }, n); }
  // The role a value rectangle takes on the canvas.
  function canvasRoleOf(n){
    if(!n || n.type !== 'value') return null;
    return isInputRect(n) ? 'Inputs' : 'Calculations';
  }

  // A rectangle's effective formatting on the canvas: an explicit per-node override
  // (node.style) always wins; otherwise its role's preset ("Inputs" / "Calculations") —
  // so editing that one preset re-styles every rectangle in that role at once.
  function resolveNodeStyle(n){
    if(n.style) return n.style;
    const role = canvasRoleOf(n);
    return role ? rolePresetStyle(role) : null;
  }

  // Seeds any missing role preset (by name), in role order, ahead of your own presets.
  function ensureDefaultFormatPresets(){
    const missing = FORMAT_ROLES.filter(r => !FORMAT_PRESETS.some(p => p.name === r.name))
      .map(r => ({ id: 'fmt-role-' + r.name.toLowerCase().replace(/\s+/g, '-'), name: r.name, style: cloneData(r.style) }));
    if(missing.length) FORMAT_PRESETS = missing.concat(FORMAT_PRESETS);
  }

  function formatNumForNode(v, n){
    if(v === null || v === undefined || !isFinite(v)) return '?';
    const rs = n && resolveNodeStyle(n);
    const fmt = rs && rs.numberFormat;
    if(!fmt || !fmt.kind || fmt.kind === 'general') return formatNum(v);
    const decimals = (typeof fmt.decimals === 'number') ? fmt.decimals : 2;
    if(fmt.kind === 'percent'){
      return (v * 100).toFixed(decimals) + '%';
    }
    if(fmt.kind === 'currency'){
      return (fmt.currencySymbol || '$') + v.toLocaleString(undefined, { minimumFractionDigits:decimals, maximumFractionDigits:decimals });
    }
    if(fmt.kind === 'number'){
      return v.toLocaleString(undefined, { minimumFractionDigits:decimals, maximumFractionDigits:decimals });
    }
    return formatNum(v);
  }

  function shiftLabel(offset){
    if(offset > 0) return 't+' + offset;
    if(offset < 0) return 't−' + Math.abs(offset);
    return 't';
  }

  function errorTitle(code){
    switch(code){
      case 'unset': return 'No number set, and nothing feeds into this rectangle.';
      case 'ambiguous': return 'Multiple rectangles point straight into this one — route them through an operator instead.';
      case 'missing-input': return "One of this operator's inputs could not be computed.";
      case 'no-input': return 'This operator has nothing connected to it.';
      case 'math-error': return 'Invalid result (e.g. divide by zero).';
      case 'unary-only': return 'This operator takes exactly one input.';
      case 'needs-two': return 'A comparison needs at least two inputs.';
      case 'alias-unset': return "This alias isn't linked to a rectangle yet — click its 🔗 icon to choose one.";
      case 'alias-missing-canvas': return 'The canvas this alias points to no longer exists.';
      case 'alias-missing-node': return 'The rectangle this alias points to no longer exists.';
      case 'block-missing-def': return 'The Block this instance uses no longer exists.';
      case 'block-missing-output': return 'This output no longer exists on the Block definition.';
      case 'block-cycle': return 'This Block contains an instance of itself, directly or indirectly.';
      case 'cycle': return 'This is part of a circular reference.';
      case 'period-out-of-range': return "There's no period that far back/forward for this shifter to read — it's fine at the timeline's edge.";
      case 'function-missing': return "This function's definition isn't in the model (or a function it calls is missing).";
      case 'function-unreadable': return "This function's formula can't be read.";
      case 'function-cycle': return 'This function calls itself through other functions, in a loop.';
      case 'function-too-deep': return 'This function calls other functions nested too deeply.';
      case 'function-arguments': return 'This function calls another function with the wrong number of inputs.';
      case 'function-input-unwired': return "One of this function's inputs isn't connected.";
      default: return 'Could not compute.';
    }
  }

  function clearComputed(){ invalidateIR(); computedValues = {}; computeErrors = {}; portValues = {}; portErrors = {}; }

  // ---------- canvases + whole-system undo/redo ----------
  const MAX_HISTORY = 80;
  let history = [];
  let future = [];

  // writes the live nodes/edges/computedValues/computeErrors back into the
  // canvases registry entry for whichever canvas is currently active
  function syncActiveIntoRegistry(){
    const c = canvases.find(c => c.id === activeCanvasId);
    if(!c) return;
    c.nodes = nodes; c.edges = edges;
    c.computedValues = computedValues; c.computeErrors = computeErrors;
    c.portValues = portValues; c.portErrors = portErrors;
  }

  function loadCanvasState(c){
    invalidateIR();
    nodes = c.nodes; edges = c.edges;
    computedValues = c.computedValues; computeErrors = c.computeErrors;
    portValues = c.portValues || {}; portErrors = c.portErrors || {};
  }

  function snapshot(){
    syncActiveIntoRegistry();
    // The model's function definitions are part of it (undoing an insert takes back the
    // definitions it brought).
    return JSON.stringify({ canvases, activeCanvasId, nextId, nextCanvasId, periods, currentPeriod, modelFunctions });
  }

  function pushHistory(){
    invalidateIR(); // the model is about to change
    // Inside a transaction (one API action, or a whole macro run) only the first push
    // records a snapshot, so the entire transaction undoes as a single step.
    if(tx.depth > 0){ if(tx.pushed) return; tx.pushed = true; }
    history.push(snapshot());
    if(history.length > MAX_HISTORY) history.shift();
    future = [];
    updateHistoryButtons();
    requestStoragePersistence();
    markDocDirty();
  }

  function restore(snap){
    const data = JSON.parse(snap);
    canvases = data.canvases;
    activeCanvasId = data.activeCanvasId;
    nextId = data.nextId;
    nextCanvasId = data.nextCanvasId;
    periods = Array.isArray(data.periods) && data.periods.length ? data.periods : ['Period 1'];
    currentPeriod = (typeof data.currentPeriod === 'number') ? Math.max(0, Math.min(periods.length - 1, data.currentPeriod)) : 0;
    modelFunctions = Array.isArray(data.modelFunctions) ? data.modelFunctions : [];
    const active = canvases.find(c => c.id === activeCanvasId) || canvases[0];
    activeCanvasId = active.id;
    loadCanvasState(active);
    renderPeriodControls();
  }

  function undo(){
    if(tx.depth > 0) fail('Undo cannot run inside a macro or another action.');
    if(history.length === 0) return;
    if(recorder.active) recorder.onUndo();
    future.push(snapshot());
    restore(history.pop());
    clearSelection();
    render();
    renderCanvasTabs();
    updateHistoryButtons();
    markDocDirty();
  }

  function redo(){
    if(tx.depth > 0) fail('Redo cannot run inside a macro or another action.');
    if(future.length === 0) return;
    if(recorder.active) toast('Redo is not captured by the macro recorder.');
    history.push(snapshot());
    restore(future.pop());
    clearSelection();
    render();
    renderCanvasTabs();
    updateHistoryButtons();
    markDocDirty();
  }

  function updateHistoryButtons(){ refreshCommandStates(); }

  function switchToCanvas(id){
    if(id === activeCanvasId) return;
    const target = canvases.find(c => c.id === id);
    if(!target) return;
    syncActiveIntoRegistry();
    activeCanvasId = id;
    loadCanvasState(target);
    clearSelection();
    renderCanvasTabs();
  }

  function addCanvas(){
    pushHistory();
    const c = {
      id: 'c' + (nextCanvasId++),
      name: 'Canvas ' + canvases.length,
      nodes: [], edges: [], computedValues: {}, computeErrors: {}, portValues: {}, portErrors: {}
    };
    canvases.push(c);
    activeCanvasId = c.id;
    loadCanvasState(c);
    clearSelection();
    renderCanvasTabs();
  }

  function deleteCanvasById(id){
    if(canvases.length <= 1){ showMessage('You need at least one canvas.'); return; }
    const c = canvases.find(c => c.id === id);
    if(!c) return;
    showConfirm(`Delete canvas "${c.name}" and everything on it?`, () => fm.deleteCanvas(id));
  }

  // Canvas tabs are rendered keyed by canvas id: an existing tab element is updated and
  // re-ordered in place rather than rebuilt, so a double-click (rename) and a drag always
  // land on the same element even when a click re-renders the tab strip in between.
  function canvasOfTab(tab){ return canvases.find(x => x.id === tab.dataset.id) || null; }

  function buildCanvasTab(id){
    const tab = document.createElement('div');
    tab.className = 'canvas-tab';
    tab.dataset.id = id;
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    const closeX = document.createElement('span');
    closeX.className = 'close-x';
    closeX.textContent = '✕';
    closeX.title = 'Delete canvas';
    tab.appendChild(nameSpan);
    tab.appendChild(closeX);
    tab.title = 'Click to open · double-click to rename · drag to reorder';

    tab.addEventListener('click', (ev) => {
      if(ev.target === closeX || tabDragJustEnded || tab.dataset.renaming) return;
      const c = canvasOfTab(tab);
      if(c && c.id !== activeCanvasId) fm.switchCanvas(c.id);
    });
    tab.addEventListener('dblclick', (ev) => {
      if(ev.target === closeX || tab.dataset.renaming) return;
      const c = canvasOfTab(tab);
      if(c) startRenameCanvasTab(tab, c, tab.querySelector('.name'));
    });
    tab.addEventListener('mousedown', (ev) => {
      if(ev.target === closeX || ev.target.tagName === 'INPUT' || tab.dataset.renaming) return;
      // no text selection on tabs: a selected tab name would turn a drag into a native text drag
      ev.preventDefault();
      if(ev.button !== 0) return;
      startCanvasTabDrag(ev, tab.dataset.id, tab);
    });
    tab.addEventListener('dragstart', (ev) => ev.preventDefault());
    closeX.addEventListener('click', (ev) => {
      ev.stopPropagation();
      deleteCanvasById(tab.dataset.id);
    });
    return tab;
  }

  function renderCanvasTabs(){
    const existing = new Map();
    canvasTabsEl.querySelectorAll('.canvas-tab').forEach(t => existing.set(t.dataset.id, t));
    let cursor = canvasTabsEl.querySelector('.canvas-tab') || btnAddCanvas;
    canvases.forEach(c => {
      let tab = existing.get(c.id);
      if(tab) existing.delete(c.id); else tab = buildCanvasTab(c.id);
      tab.classList.toggle('active', c.id === activeCanvasId);
      if(!tab.dataset.renaming){
        const nameSpan = tab.querySelector('.name');
        if(nameSpan && nameSpan.textContent !== c.name) nameSpan.textContent = c.name;
      }
      if(tab === cursor) cursor = cursor.nextSibling;
      else canvasTabsEl.insertBefore(tab, cursor);
    });
    existing.forEach(t => t.remove());
    if(btnAddCanvas.parentNode === canvasTabsEl && btnAddCanvas.nextSibling && btnAddCanvas.nextSibling.classList && btnAddCanvas.nextSibling.classList.contains('canvas-tab')){
      canvasTabsEl.appendChild(btnAddCanvas);
    }
    refreshTemplateNotices();
  }

  // Drag a canvas tab left/right to reorder canvases: the tab follows the pointer and a
  // marker shows the drop slot; the drop runs fm.moveCanvas (one undo step, recordable).
  let tabDragJustEnded = false;
  function startCanvasTabDrag(downEv, canvasId, tabEl){
    const startX = downEv.clientX;
    let dragging = false, marker = null, targetPos = null;
    function computeTarget(clientX){
      const others = Array.from(canvasTabsEl.querySelectorAll('.canvas-tab')).filter(t => t !== tabEl);
      let idx = 0;
      others.forEach(t => { const r = t.getBoundingClientRect(); if(clientX > r.left + r.width / 2) idx++; });
      const hostRect = canvasTabsEl.getBoundingClientRect();
      let x;
      if(idx < others.length) x = others[idx].getBoundingClientRect().left - 2;
      else { const last = others[others.length - 1] || tabEl; x = last.getBoundingClientRect().right + 1; }
      marker.style.left = (x - hostRect.left + canvasTabsEl.scrollLeft) + 'px';
      return idx + 1;
    }
    function onMove(ev){
      const dx = ev.clientX - startX;
      if(!dragging){
        if(Math.abs(dx) < 5) return;
        dragging = true;
        tabEl.classList.add('tab-dragging');
        document.body.classList.add('dragging');
        marker = document.createElement('div');
        marker.className = 'tab-drop-marker';
        canvasTabsEl.appendChild(marker);
      }
      tabEl.style.transform = `translateX(${dx}px)`;
      targetPos = computeTarget(ev.clientX);
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if(!dragging) return;
      tabEl.classList.remove('tab-dragging');
      tabEl.style.transform = '';
      document.body.classList.remove('dragging');
      if(marker) marker.remove();
      tabDragJustEnded = true;
      setTimeout(() => { tabDragJustEnded = false; }, 0);
      if(targetPos) guarded(() => fm.moveCanvas(canvasId, targetPos));
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  function startRenameCanvasTab(tab, c, nameSpan){
    if(!nameSpan || tab.dataset.renaming) return;
    tab.dataset.renaming = '1';
    const input = document.createElement('input');
    input.className = 'rename-input';
    input.value = c.name;
    nameSpan.replaceWith(input);
    input.focus();
    input.select();
    let done = false;
    function finish(save){
      if(done) return;
      done = true;
      const val = input.value.trim();
      delete tab.dataset.renaming;
      if(input.parentNode) input.replaceWith(nameSpan);
      if(save && val && val !== c.name) guarded(() => fm.renameCanvas(c.id, val));
      else renderCanvasTabs();
    }
    input.addEventListener('keydown', (ev) => {
      ev.stopPropagation();
      if(ev.key === 'Enter') finish(true);
      if(ev.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
    input.addEventListener('mousedown', (ev) => ev.stopPropagation());
    input.addEventListener('dblclick', (ev) => ev.stopPropagation());
  }

  btnAddCanvas.addEventListener('click', () => fm.addCanvas());

  function deleteSelected(){
    if(selectedEdgeId){
      pushHistory();
      edges = edges.filter(e => e.id !== selectedEdgeId);
      selectedEdgeId = null;
    } else if(selectedNodeIds.size){
      pushHistory();
      nodes = nodes.filter(n => !selectedNodeIds.has(n.id));
      edges = edges.filter(e => !selectedNodeIds.has(e.from) && !selectedNodeIds.has(e.to));
      selectedNodeIds.clear();
    } else {
      return;
    }
    clearComputed();
    render();
  }

  // ---------- clipboard: copy / cut / paste ----------
  let clipboard = null;       // { nodes:[...], edges:[...], originCanvasId }
  let clipboardPasteCount = 0;

  function copySelection(){ copyNodeIds(Array.from(selectedNodeIds)); }

  // Copies the given node ids (on the active canvas) plus the edges between them.
  function copyNodeIds(ids){
    if(!ids || ids.length === 0) return;
    const idSet = new Set(ids);
    clipboard = {
      nodes: ids.map(id => getNode(id)).filter(Boolean).map(n => Object.assign({}, n)),
      edges: edges.filter(e => !e.auto && idSet.has(e.from) && idSet.has(e.to)).map(e => Object.assign({}, e)),
      originCanvasId: activeCanvasId
    };
    clipboardPasteCount = 0;
    updateClipboardButtons();
  }

  function pasteClipboard(){
    if(!clipboard || clipboard.nodes.length === 0) return;
    pushHistory();
    clipboardPasteCount++;
    const offset = clipboardPasteCount * 24;
    const idMap = {};
    const newNodes = clipboard.nodes.map(n => {
      const newId = uid('n');
      idMap[n.id] = newId;
      return Object.assign({}, n, { id: newId, x: n.x + offset, y: n.y + offset });
    });
    newNodes.forEach(n => {
      if(n.type === 'alias' && n.sourceCanvasId === clipboard.originCanvasId && idMap[n.sourceNodeId] !== undefined){
        n.sourceNodeId = idMap[n.sourceNodeId];
        n.sourceCanvasId = activeCanvasId;
      }
    });
    const newEdges = clipboard.edges.map(e => Object.assign({}, e, { id: uid('e'), from: idMap[e.from], to: idMap[e.to] }));
    nodes = nodes.concat(newNodes);
    edges = edges.concat(newEdges);
    syncAutoConnections();
    clearComputed();
    return newNodes.map(n => n.id);
  }

  function updateClipboardButtons(){ refreshCommandStates(); }

  // Save / Save As / Open shortcuts also work while typing (the edit is committed first),
  // and are kept from the browser's own "Save page" / "Open file" while a dialog is open.
  // Listening on window in the capture phase: text boxes stop their key events bubbling,
  // and a dialog that captures keys itself (e.g. assigning a shortcut) still gets them.
  const DOCUMENT_SHORTCUT_COMMANDS = new Set(['saveDocument', 'saveDocumentAs', 'openDocument']);
  window.addEventListener('keydown', (e) => {
    const editing = document.activeElement && (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT');
    const dialogOpen = !!document.querySelector('.modal-overlay, .launcher-overlay');
    if(!editing && !dialogOpen) return; // the handler below takes it
    const docCmd = shortcutMap[normalizeCombo(e) || ''];
    if(!docCmd || !DOCUMENT_SHORTCUT_COMMANDS.has(docCmd)) return;
    e.preventDefault();
    if(dialogOpen) return;
    e.stopPropagation();
    document.activeElement.blur();
    runCommand(docCmd);
  }, true);
  document.addEventListener('keydown', (e) => {
    const editing = document.activeElement && (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT');
    if(editing) return;
    // dialogs own the keyboard while open (they handle their own Escape/Enter)
    if(document.querySelector('.modal-overlay, .launcher-overlay')) return;

    if(e.key === 'Backspace' && (selectedEdgeId || selectedNodeIds.size)){
      e.preventDefault(); runCommand('deleteSel'); return;
    }

    const combo = normalizeCombo(e);
    if(!combo) return;
    const cmdId = shortcutMap[combo];
    if(!cmdId) return;
    const cmd = COMMANDS.find(c => c.id === cmdId);
    if(!cmd) return;
    e.preventDefault();
    runCommand(cmd.id);
  });

  // Interactive (mouse/Ribbon) versions of the Insert commands: create through the API,
  // then do the UI-only follow-up (select, open the inline editor/picker).
  function addRectangleInteractive(){
    const {x,y} = spawnPoint();
    const id = fm.createRect({ x, y });
    selectNodesOnly([id]);
    startEdit(id, true);
  }
  function addOperatorInteractive(sym){
    const {x,y} = spawnPoint();
    const id = fm.createOperator(sym ? { x, y, op: sym } : { x, y });
    selectNodesOnly([id]);
    if(!sym) showOpPicker(id);
  }
  function addPeriodShiftInteractive(){
    const {x,y} = spawnPoint();
    const id = fm.createPeriodShift({ x, y });
    selectNodesOnly([id]);
  }
  function renderPeriodControls(){ refreshCommandStates(); }

  function spawnPoint(){
    const x = viewport.scrollLeft + viewport.clientWidth/2 - 60 + (nodes.length % 5) * 14;
    const y = viewport.scrollTop + viewport.clientHeight/2 - 30 + (nodes.length % 5) * 14;
    return { x: Math.max(10,x), y: Math.max(10,y) };
  }

  // ---------- in-page dialogs (native confirm/alert are blocked in many embedded previews) ----------
  function showConfirm(message, onConfirm){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    const p = document.createElement('p');
    p.textContent = message;
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel';
    const okBtn = document.createElement('button');
    okBtn.className = 'danger';
    okBtn.textContent = 'OK';
    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    box.appendChild(p);
    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function close(){ overlay.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(ev){ if(ev.key === 'Escape') close(); }
    cancelBtn.addEventListener('click', close);
    overlay.addEventListener('mousedown', (ev) => { if(ev.target === overlay) close(); });
    okBtn.addEventListener('click', () => { close(); onConfirm(); });
    document.addEventListener('keydown', onKey);
    okBtn.focus();
  }

  function showMessage(message){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    const p = document.createElement('p');
    p.textContent = message;
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const okBtn = document.createElement('button');
    okBtn.className = 'primary';
    okBtn.textContent = 'OK';
    actions.appendChild(okBtn);
    box.appendChild(p);
    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function close(){ overlay.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(ev){ if(ev.key === 'Escape' || ev.key === 'Enter') close(); }
    okBtn.addEventListener('click', close);
    overlay.addEventListener('mousedown', (ev) => { if(ev.target === overlay) close(); });
    document.addEventListener('keydown', onKey);
    okBtn.focus();
  }

  function clearCanvasInteractive(){
    if(nodes.length === 0 && edges.length === 0) return;
    showConfirm('Remove all rectangles and connections?', () => fm.clearCanvas());
  }

  // ---------- save / load ----------
  // ============================================================
