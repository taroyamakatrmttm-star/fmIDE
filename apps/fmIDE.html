  // File formats — every JSON file fmIDE writes carries { kind, version }. Every file it
  // reads goes through readFmFile(), which:
  //   1. identifies the kind (older files without "kind" are recognised by their shape),
  //   2. rejects the wrong kind of file with a message saying what it is and where to open it,
  //   3. upgrades older versions one step at a time via FILE_MIGRATIONS,
  //   4. flags a file saved by a NEWER fmIDE (version above what this build reads), so the
  //      caller can warn before a best-effort open,
  //   5. does the same for nested content (a workspace's system, each template's model).
  // To change a format: bump its "current" here, and add FILE_MIGRATIONS[kind][oldVersion]
  // that upgrades a copy of an old payload by exactly one version. The system and
  // workspace formats are shared with ExcelExporter: change those in src/shared/file-formats.js.
  // ============================================================
  // ---------- file formats (shared: src/shared/file-formats.js, used by both apps) ----------
  // The two kinds both apps read — a system and a workspace — keep their current version
  // and their upgrade steps here, once. Each app builds its own FILE_FORMATS and
  // FILE_MIGRATIONS from these, adding its own kinds, labels and messages
  // (docs/file-formats.md). To change one of these formats: raise its version here and add
  // SHARED_FILE_MIGRATIONS[kind][oldVersion], which upgrades a copy of an old payload by
  // exactly one version.
  const SHARED_FILE_VERSIONS = { 'system': 5, 'fmIDE-workspace': 4 };
  // Before system v3 (module v2) a rectangle had one plug name, `plug: "Revenue"`; now it
  // has a list, `plugs: ["Revenue", …]`. Upgrades a list of nodes in place.
  function upgradeNodePlugs(nodes){
    (Array.isArray(nodes) ? nodes : []).forEach(n => {
      if(!n || typeof n !== 'object' || !('plug' in n)) return;
      if(!Array.isArray(n.plugs)){
        const p = typeof n.plug === 'string' ? n.plug.trim() : '';
        n.plugs = p ? [p] : [];
      }
      delete n.plug;
    });
  }
  // A random ID in the UUID v4 form, for things that must never clash between people (a
  // template family, one version of it). crypto.getRandomValues works everywhere, file:// too.
  function newRandomId(){
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }
  // Before templates file v2 (workspace v2) a template had no family or version. Each one
  // becomes a family of its own, version 1, with no change note. Upgrades a list in place.
  function upgradeTemplateEntries(list){
    (Array.isArray(list) ? list : []).forEach(t => {
      if(!t || typeof t !== 'object') return;
      if(t.family === undefined) t.family = newRandomId();
      if(t.version === undefined) t.version = 1;
      if(t.note === undefined) t.note = '';
      if(t.versionId === undefined) t.versionId = newRandomId();
    });
  }
  const SHARED_FILE_MIGRATIONS = {
    // v1 → v2: templates get a family, a version number, a change note and a version id.
    'fmIDE-workspace': {
      1: d => upgradeTemplateEntries(d.templates),
      // v2 → v3: templates may be recipes (kind "recipe"); older files have none.
      2: () => {},
      // v3 → v4: a workspace may carry a library of functions (`functions`); older ones have
      // none.
      3: () => {}
    },
    'system': {
      // v1 systems were accepted with fields the loader already defaults (periods, ids…);
      // the only structural difference handled here is a single-canvas file that kept its
      // nodes/edges at the top level.
      1: d => {
        if(!Array.isArray(d.canvases) && Array.isArray(d.nodes)){
          d.canvases = [{ id: 'c1', name: d.name || 'Canvas 1', nodes: d.nodes, edges: Array.isArray(d.edges) ? d.edges : [] }];
          d.activeCanvasId = 'c1';
          delete d.nodes; delete d.edges;
        }
      },
      // v2 → v3: one plug name per rectangle becomes a list of plug names.
      2: d => { (Array.isArray(d.canvases) ? d.canvases : []).forEach(c => { if(c) upgradeNodePlugs(c.nodes); }); },
      // v3 → v4: a canvas may remember the canvas template it came from (`template`). Older
      // systems have no such links, so there is nothing to change.
      3: () => {},
      // v4 → v5: a system may carry the function definitions its function nodes use
      // (`functions`, src/shared/functions.js); older systems have none.
      4: () => {}
    }
  };
  // A file's kind: its "kind" field, or — for files saved before kinds were written — its
  // shape, so either app can say where a file belongs.
  function inferFileKind(d){
    if(Array.isArray(d)) return 'fmIDE-macros';                       // a bare macro list
    if(typeof d.kind === 'string') return d.kind;
    if(Array.isArray(d.canvases)) return 'system';
    if(Array.isArray(d.nodes) && Array.isArray(d.edges)) return 'module';
    if(Array.isArray(d.tabs) && Array.isArray(d.rows)) return 'fmIDE-excel-mapping'; // an ExcelExporter mapping saved before versions were written
    if(Array.isArray(d.templates)) return 'fmIDE-templates';
    if(Array.isArray(d.presets)) return 'fmIDE-format-presets';
    if(d.bindings && typeof d.bindings === 'object') return 'fmIDE-shortcuts';
    if(Array.isArray(d.macros)) return 'fmIDE-macros';
    return null;
  }
  // The version check and step-by-step upgrade, applied in place to `data` (a copy of the
  // file, of a kind listed in `formats`). A file from a NEWER version is left as it is so the
  // caller can ask before a best-effort open. Returns { fromVersion, newer }.
  function upgradeFileData(data, kind, formats, migrations){
    const fmt = formats[kind];
    let version = Number(data.version);
    if(!Number.isInteger(version) || version < 1) version = 1;          // files from before versions were written
    const newer = version > fmt.current;
    if(!newer){
      for(let v = version; v < fmt.current; v++){
        const step = migrations[kind] && migrations[kind][v];
        if(step) step(data);
      }
      data.version = fmt.current;
    }
    data.kind = kind;
    return { fromVersion: version, newer };
  }
  const FILE_FORMATS = {
    'system':               { current: SHARED_FILE_VERSIONS['system'], label: 'system', where: 'File → Load System' },
    'module':               { current: 3, label: 'module',              where: 'File → Load Module' },
    'fmIDE-workspace':      { current: SHARED_FILE_VERSIONS['fmIDE-workspace'], label: 'workspace', where: 'File → Import Workspace' },
    'fmIDE-templates':      { current: 4, label: 'templates file',      where: 'Templates → Import Templates' },
    'fmIDE-functions':      { current: 1, label: 'functions file',      where: 'Functions → Import Functions' },
    'fmIDE-format-presets': { current: 1, label: 'format presets file', where: 'Format Presets → Import Presets' },
    'fmIDE-shortcuts':      { current: 2, label: 'shortcuts file',      where: 'Keyboard Shortcuts → Import Shortcuts' },
    'fmIDE-macros':         { current: 1, label: 'macros file',         where: 'Macro Builder → Import' },
    'fmIDE-preferences':    { current: 1, label: 'preferences file',    where: 'File → Import Preferences' }
  };
  const FILE_MIGRATIONS = Object.assign({}, SHARED_FILE_MIGRATIONS, {
    // v1 → v2: one plug name per rectangle becomes a list of plug names (as system v2 → v3).
    'module': {
      1: d => upgradeNodePlugs(d.nodes),
      // v2 → v3: a module may carry the function definitions it uses (`functions`); older
      // modules have none.
      2: () => {}
    },
    // v1 → v2: templates get a family, a version number, a change note and a version id.
    'fmIDE-templates': {
      1: d => upgradeTemplateEntries(d.templates),
      // v2 → v3: templates may be recipes (kind "recipe"); older files have none.
      2: () => {},
      // v3 → v4: a template's module or system may carry function definitions; older ones
      // have none.
      3: () => {}
    },
    // v1 shortcut files stored combos in the old notation.
    'fmIDE-shortcuts': {
      1: d => { Object.keys(d.bindings || {}).forEach(k => { d.bindings[k] = canonicalCombo(d.bindings[k], true); }); }
    }
  });
  function fileKindLabel(kind){ return FILE_FORMATS[kind] ? FILE_FORMATS[kind].label : 'file'; }
  // Returns { error } or { kind, data (a migrated copy), fromVersion, newer, warnings }.
  function readFmFile(raw, accept){
    if(!raw || typeof raw !== 'object') return { error: "That file doesn't contain fmIDE data." };
    const kind = inferFileKind(raw);
    const fmt = kind && FILE_FORMATS[kind];
    if(!fmt){
      return { error: kind === 'fmIDE-excel-mapping'
        ? 'That is an ExcelExporter mapping file — open it in ExcelExporter (Import Mapping JSON).'
        : "That file isn't an fmIDE file this version recognises" + (kind ? ` (kind "${String(kind).slice(0, 40)}")` : '') + '.' };
    }
    if(!accept.includes(kind)){
      const wanted = accept.map(fileKindLabel);
      return { error: `That is an fmIDE ${fmt.label}, not a ${wanted.join(' or ')}. Open it with ${fmt.where}.` };
    }
    let data = cloneData(Array.isArray(raw) ? { kind, version: 1, macros: raw } : raw);
    const { fromVersion: version, newer } = upgradeFileData(data, kind, FILE_FORMATS, FILE_MIGRATIONS);
    const warnings = [];
    // Nested content.
    const nestedTemplates = (list) => (list || []).map(t => {
      // A recipe holds no model (only its parts, checked when it joins the library).
      if(!t || !t.data || (t.kind !== 'module' && t.kind !== 'system')) return t;
      const r = readFmFile(t.data, [t.kind]);
      if(r.error){ warnings.push(`Template "${String(t.name || '').slice(0, 60)}" was skipped: ${r.error}`); return null; }
      if(r.newer) warnings.push(`Template "${String(t.name || '').slice(0, 60)}" was saved by a newer fmIDE and may not load completely.`);
      return Object.assign({}, t, { data: r.data });
    }).filter(Boolean);
    if(kind === 'fmIDE-workspace'){
      if(data.system){
        const r = readFmFile(data.system, ['system']);
        if(r.error) return { error: 'The workspace\'s system is unreadable: ' + r.error };
        data.system = r.data;
        if(r.newer) warnings.push('Its system was saved by a newer fmIDE and may not load completely.');
      }
      data.templates = nestedTemplates(data.templates);
      // shortcuts embedded in a v1 workspace may still use the old combo notation
      if(data.shortcutBindings && typeof data.shortcutBindings === 'object' && !(data.shortcutBindingsVersion >= 2)){
        Object.keys(data.shortcutBindings).forEach(k => { data.shortcutBindings[k] = canonicalCombo(data.shortcutBindings[k], true); });
        data.shortcutBindingsVersion = 2;
      }
    }
    if(kind === 'fmIDE-templates') data.templates = nestedTemplates(data.templates);
    return { kind, data, fromVersion: version, newer, warnings };
  }
  // UI wrapper: parse → read → (warn if newer) → onOk(data, result). Returns nothing.
  function openFmFileText(text, accept, onOk){
    let raw;
    try{ raw = JSON.parse(text); }
    catch(err){ showMessage('That file is not valid JSON.'); return; }
    const r = readFmFile(raw, accept);
    if(r.error){ showMessage(r.error); return; }
    const go = () => onOk(r.data, r);
    // Anything to flag (a newer format, or nested parts that are newer / were skipped)
    // is asked about ONCE, before the normal import flow starts.
    if(r.newer || r.warnings.length){
      const fmt = FILE_FORMATS[r.kind];
      const lines = [];
      if(r.newer) lines.push(`This ${fmt.label} was saved by a newer version of fmIDE (format version ${r.fromVersion}; this fmIDE reads up to version ${fmt.current}). Updating fmIDE is the safe option; anything the newer version added may be lost.`);
      r.warnings.forEach(w => lines.push(w));
      lines.push('Continue?');
      showConfirm(lines.join('\n\n'), go);
      return;
    }
    go();
  }

  function downloadJSON(payload, filename){
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function timestamp(){ return new Date().toISOString().replace(/[:.]/g,'-'); }

  // Whole system: every canvas, replaces everything on load. It carries the function
  // definitions its canvases use (11b-functions.js).
  function buildSystemPayload(){
    syncActiveIntoRegistry();
    return withFunctions({
      version: SHARED_FILE_VERSIONS['system'], kind: 'system',
      nextId, nextCanvasId, activeCanvasId,
      periods, currentPeriod,
      canvases: canvases.map(c => Object.assign({ id:c.id, name:c.name, nodes:c.nodes, edges:c.edges }, c.template ? { template: c.template } : {})),
      // format roles/presets ride along so ExcelExporter formats a plain system export too
      formatPresets: FORMAT_PRESETS.map(p => ({ id: p.id, name: p.name, style: p.style }))
    }, canvases);
  }

  function saveSystemToFile(){
    downloadJSON(buildSystemPayload(), `fmIDE-system-${timestamp()}.json`);
  }

  // ---------- whole-workspace persistence (system + templates + format presets + shortcuts) ----------
  // The workspace autosaves to the browser's IndexedDB (database 'fmIDE') under this key —
  // the same key and JSON text older versions kept in localStorage, copied across once.
  // ---------- browser storage (shared: src/shared/store.js, used by both apps) ----------
  // createStore(dbName): a small promise-based key–value store on IndexedDB, one database
  // per app, one object store ('kv'). Values are mostly strings (the apps store JSON text,
  // exactly what they used to keep in localStorage); IndexedDB also keeps other values the
  // browser can store, such as file handles. Where IndexedDB is missing or will not open
  // (some browsers block it for pages opened from disk, or in private windows) the same
  // calls fall back to localStorage, so the app keeps working — it never fails for that.
  //   ready                        resolves once the store is usable (never rejects)
  //   get(key)                     the stored value, or null
  //   put(key, value)              rejects with the browser's error (e.g. QuotaExceededError,
  //                                or DataCloneError for a value it cannot store); on the
  //                                localStorage fallback, anything but a string is refused
  //   canStoreObjects()            whether put accepts more than strings (after ready)
  //   remove(key)
  //   keys(prefix)                 every stored key that starts with prefix
  //   migrateFromLocalStorage(fn)  once per browser: copy localStorage keys for which fn(key)
  //                                is true into IndexedDB (never over a key already there);
  //                                the localStorage copies are kept
  //   requestPersistence()         ask the browser once, ever, to keep this app's data
  //                                (navigator.storage.persist); the answer is remembered
  function createStore(dbName){
    const KV = 'kv';
    const META_MIGRATED = dbName + '/migrated-from-localStorage';
    const META_PERSIST = dbName + '/persistence-requested';
    let db = null;   // the open IndexedDB database, or null when using localStorage

    const ready = new Promise(resolve => {
      let settled = false;
      const done = (openDb) => {
        if(settled){ if(openDb) openDb.close(); return; }
        settled = true;
        db = openDb || null;
        if(db) db.onversionchange = () => { db.close(); };
        resolve();
      };
      let req;
      try{
        if(!window.indexedDB){ done(null); return; }
        req = window.indexedDB.open(dbName, 1);
      }catch(err){ done(null); return; }
      req.onupgradeneeded = () => { req.result.createObjectStore(KV); };
      req.onsuccess = () => done(req.result);
      req.onerror = (ev) => { if(ev && ev.preventDefault) ev.preventDefault(); done(null); };
      // A browser that never answers must not hold the app up.
      setTimeout(() => done(null), 5000);
    });

    // Runs fn(objectStore) in one transaction; resolves with the result of the request fn
    // returns (if any) once the transaction has committed.
    function run(mode, fn){
      return ready.then(() => new Promise((resolve, reject) => {
        let result;
        try{
          const t = db.transaction(KV, mode);
          t.oncomplete = () => resolve(result);
          t.onabort = t.onerror = () => reject(t.error || new DOMException('The browser did not store the data.', 'UnknownError'));
          const r = fn(t.objectStore(KV));
          if(r) r.onsuccess = () => { result = r.result; };
        }catch(err){ reject(err); }
      }));
    }

    function get(key){
      return ready.then(() => db
        ? run('readonly', s => s.get(key)).then(v => (v === undefined ? null : v))
        : localStorage.getItem(key));
    }
    function put(key, value){
      return ready.then(() => {
        if(db) return run('readwrite', s => { s.put(value, key); });
        if(typeof value !== 'string') throw new TypeError('Only text can be stored in this browser.');
        localStorage.setItem(key, value);
      });
    }
    function remove(key){
      return ready.then(() => db ? run('readwrite', s => { s.delete(key); }) : localStorage.removeItem(key));
    }
    function keys(prefix){
      return ready.then(() => {
        if(db) return run('readonly', s => s.getAllKeys(IDBKeyRange.bound(prefix, prefix + '￿')))
          .then(ks => (ks || []).filter(k => typeof k === 'string' && k.startsWith(prefix)));
        const out = [];
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          if(k !== null && k.startsWith(prefix)) out.push(k);
        }
        return out;
      });
    }

    // The marker makes this happen once: without it, a key deleted later (e.g. a layout
    // reset) would be copied back from the old localStorage copy on the next start.
    function migrateFromLocalStorage(match){
      return ready.then(() => {
        if(!db) return 0; // already using localStorage: nothing to move
        return get(META_MIGRATED).then(migrated => {
          if(migrated) return 0;
          const items = [];
          try{
            for(let i = 0; i < localStorage.length; i++){
              const k = localStorage.key(i);
              if(k !== null && match(k)){ const v = localStorage.getItem(k); if(v !== null) items.push([k, v]); }
            }
          }catch(err){ /* localStorage unavailable: nothing to move */ }
          let copied = 0;
          return run('readwrite', s => {
            items.forEach(([k, v]) => {
              const r = s.get(k);
              r.onsuccess = () => { if(r.result === undefined){ s.put(v, k); copied++; } };
            });
            s.put(new Date().toISOString(), META_MIGRATED);
          }).then(() => copied);
        });
      }).catch(() => 0); // a failed copy leaves the old data where it was; try again next start
    }

    let persistenceRequested = false;
    function requestPersistence(){
      if(persistenceRequested) return;
      persistenceRequested = true;
      const sm = navigator.storage;
      if(!sm || typeof sm.persist !== 'function') return;
      get(META_PERSIST).then(asked => {
        if(asked) return;
        return Promise.resolve(sm.persist()).then(granted =>
          put(META_PERSIST, JSON.stringify({ granted: !!granted, at: new Date().toISOString() })));
      }).catch(() => { /* silent */ });
    }

    return { ready, get, put, remove, keys, migrateFromLocalStorage, requestPersistence, canStoreObjects: () => !!db };
  }
  const WORKSPACE_STORAGE_KEY = 'fmIDE-workspace-v1';
  const workspaceStore = createStore('fmIDE');

  function buildWorkspacePayload(){
    return {
      version: FILE_FORMATS['fmIDE-workspace'].current, kind: 'fmIDE-workspace',
      system: buildSystemPayload(),
      templates: TEMPLATES.filter(t => !t.builtin).map(t => templateRecord(t, true)),
      formatPresets: FORMAT_PRESETS.map(p => ({ id: p.id, name: p.name, style: p.style })),
      shortcutBindings: Object.assign({}, shortcutBindings),
      shortcutBindingsVersion: 2,
      macros: cloneData(MACROS),
      functions: cloneData(FUNCTIONS),
      ui: buildUiPayload()
    };
  }

  // A file's format presets replace the ones with the same name (so its roles win, and
  // no name appears twice); presets only the user has are kept, new ones are added.
  function mergeFormatPresets(list){
    list.forEach(p => {
      if(!p || typeof p.name !== 'string' || !p.style) return;
      const i = FORMAT_PRESETS.findIndex(x => x.name === p.name);
      if(i >= 0) FORMAT_PRESETS[i] = { id: FORMAT_PRESETS[i].id, name: p.name, style: p.style };
      else FORMAT_PRESETS.push({ id: p.id || ('fmt' + (nextFormatPresetId++)), name: p.name, style: p.style });
    });
  }

  // fromImport: File → Import Workspace, where the file's templates join the library only
  // when not already there (addMissingTemplates). Restoring the autosave keeps them as saved.
  function applyWorkspacePayload(data, fromImport){
    // The function library first: the system's own definitions then join it.
    if(fromImport) addMissingFunctions(data.functions);
    else restoreFunctions(data.functions);
    if(data.system && Array.isArray(data.system.canvases) && data.system.canvases.length){
      applySystemDataDirect(data.system);
    }
    // (A workspace has always read a kind other than 'system' as a canvas template.)
    if(fromImport) addMissingTemplates((Array.isArray(data.templates) ? data.templates : [])
      .map(t => (t && typeof t === 'object') ? Object.assign({}, t, { kind: templateKindOf(t.kind) }) : t));
    else restoreTemplates(data.templates);
    if(Array.isArray(data.formatPresets)) mergeFormatPresets(data.formatPresets);
    // ribbon/KeyTips settings, then macros (so macro commands exist before their
    // shortcut bindings are applied below); syncMacroCommands re-renders the ribbon
    if(data.ui) applyUiPayload(data.ui);
    if(Array.isArray(data.macros)) importMacros(data.macros, 'replace');
    if(data.ui || Array.isArray(data.macros)) syncMacroCommands();
    if(data.shortcutBindings && typeof data.shortcutBindings === 'object'){
      Object.keys(data.shortcutBindings).forEach(cmdId => {
        if(COMMANDS.some(c => c.id === cmdId)) shortcutBindings[cmdId] = canonicalCombo(data.shortcutBindings[cmdId], !(data.shortcutBindingsVersion >= 2));
      });
      dedupeBindings();
      rebuildShortcutMap();
    }
  }

  // Autosave runs every 8 s, about 2 s after each change (20), when the page is hidden, and on close. If the browser refuses
  // to store (storage full, or unavailable e.g. in some private-browsing modes) a banner
  // says so ONCE per failure streak — fmIDE keeps working, but nothing done from now on
  // would survive a reload unless exported. It clears itself as soon as a save succeeds.
  // Writes are asynchronous; the browser applies them in the order they were made.
  let autosaveFailing = false, autosaveBannerDismissed = false;
  let workspaceRestored = false; // no autosave before the stored workspace is read: it would overwrite it
  // Returns a promise that settles once the save has been written (or has failed).
  function saveWorkspace(){
    if(!workspaceRestored) return Promise.resolve();
    let text;
    try{ text = JSON.stringify(buildWorkspacePayload()); }
    catch(err){ onAutosaveFailed(err); return Promise.resolve(); }
    // The workspace, plus which document is open and whether it has unsaved changes (20).
    return Promise.all([workspaceStore.put(WORKSPACE_STORAGE_KEY, text), workspaceStore.put(SESSION_KEY, documentSessionText())]).then(() => {
      if(autosaveFailing){ autosaveFailing = false; autosaveBannerDismissed = false; hideAutosaveBanner(); }
    }, onAutosaveFailed);
  }
  function onAutosaveFailed(err){
    autosaveFailing = true;
    if(!autosaveBannerDismissed) showAutosaveBanner(err);
  }
  // Asks the browser (once, ever) to keep fmIDE's data — called on the first change to the
  // model rather than at start-up, since some browsers show the user a question.
  function requestStoragePersistence(){ workspaceStore.requestPersistence(); }
  function showAutosaveBanner(err){
    if(document.getElementById('autosaveBanner')) return;
    const full = err && (err.name === 'QuotaExceededError' || err.code === 22 || err.code === 1014);
    const bar = document.createElement('div');
    bar.id = 'autosaveBanner';
    bar.setAttribute('role', 'alert');
    bar.style.cssText = 'position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:2000; max-width:640px; ' +
      'display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px; background:#7f1d1d; color:#fff; ' +
      'font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.35);';
    const msg = document.createElement('span');
    msg.textContent = (full ? "Autosave failed: the browser's storage for fmIDE is full." : 'Autosave failed: this browser is not letting fmIDE store data.') +
      ' Changes from now on will be lost on reload unless you export your workspace.';
    const exp = document.createElement('button');
    exp.textContent = 'Export workspace now';
    exp.style.cssText = 'flex:none; padding:6px 10px; border-radius:6px; border:none; background:#fff; color:#7f1d1d; font-weight:700; cursor:pointer;';
    exp.addEventListener('click', () => exportWorkspaceToFile());
    const dis = document.createElement('button');
    dis.textContent = 'Dismiss';
    dis.style.cssText = 'flex:none; padding:6px 10px; border-radius:6px; border:1px solid rgba(255,255,255,.5); background:transparent; color:#fff; cursor:pointer;';
    dis.addEventListener('click', () => { autosaveBannerDismissed = true; hideAutosaveBanner(); });
    bar.append(msg, exp, dis);
    document.body.appendChild(bar);
  }
  function hideAutosaveBanner(){ const b = document.getElementById('autosaveBanner'); if(b) b.remove(); }

  // Resolves true when the autosaved workspace was restored. A workspace left in
  // localStorage by an older fmIDE is copied into IndexedDB first (once).
  function loadWorkspaceFromStore(){
    return workspaceStore.migrateFromLocalStorage(k => k === WORKSPACE_STORAGE_KEY)
      .then(() => workspaceStore.get(WORKSPACE_STORAGE_KEY))
      .then(raw => {
        if(typeof raw !== 'string' || !raw) return false;
        let parsed;
        try{ parsed = JSON.parse(raw); }
        catch(err){ return false; }
        // Same reader as file imports (migrates an older autosave). A newer-format autosave
        // (after going back to an older fmIDE) still loads, best effort — there is no UI yet.
        const r = readFmFile(parsed, ['fmIDE-workspace']);
        if(r.error) return false;
        try{
          applyWorkspacePayload(r.data);
          return true;
        }catch(err){ return false; }
      }, () => false);
  }

  function exportWorkspaceToFile(){
    downloadJSON(buildWorkspacePayload(), `fmIDE-workspace-${timestamp()}.json`);
  }

  function importWorkspaceFromFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      openFmFileText(reader.result, ['fmIDE-workspace'], (data) => {
      showConfirm('Import this workspace? It will replace your current system, and add in the file\'s templates you don\'t already have, its format presets, and shortcut bindings. (You can Undo the canvas change afterward if needed.)', () => {
        pushHistory();
        applyWorkspacePayload(data, true);
        ensureDefaultFormatPresets();
        renderCanvasTabs();
        render();
        saveWorkspace();
        showMessage('Workspace imported.');
      });
      });
    };
    reader.onerror = () => showMessage('Could not read that file.');
    reader.readAsText(file);
  }

  function showCanvasMergeDecisionModal(collisions, onContinue){
    const overlay = document.createElement('div');

    document.body.appendChild(overlay);
    function close(){ overlay.remove(); }
    overlay.addEventListener('mousedown', (ev) => { if(ev.target === overlay) close(); });

    const title = document.createElement('p');
    title.textContent = 'Some canvases already exist';
    box.appendChild(title);
    const desc = document.createElement('p');
    desc.className = 'template-desc';

    box.appendChild(desc);

      label.style.cssText = 'flex:1;font-size:13px;';
      const group = document.createElement('div');
      group.className = 'btngroup';

      mergeBtn.className = 'tbtn seg active-choice';
      mergeBtn.textContent = 'Merge into existing';
      const keepBtn = document.createElement('button');
      keepBtn.className = 'tbtn seg';

      keepBtn.addEventListener('click', () => { decisions[c.name] = 'keep'; keepBtn.classList.add('active-choice'); mergeBtn.classList.remove('active-choice'); });

    continueBtn.textContent = 'Continue';

  function performAddSystem(data, decisions){
    pushHistory();
    mergeModelFunctions(data.functions);
    const canvasIdMap = {};
    const nodeIdMap = {};
    const mergeTargets = {};

    data.canvases.forEach((c, idx) => {
      const norm = (c.name || '').trim().toLowerCase();
      const existing = canvases.find(ec => ec.name.trim().toLowerCase() === norm);
      if(existing && decisions[c.name || 'Canvas'] === 'merge'){
        canvasIdMap[c.id] = existing.id;
        mergeTargets[idx] = existing;
      } else {
        canvasIdMap[c.id] = 'c' + (nextCanvasId++);
      }
    });

    const staged = data.canvases.map((c, idx) => {
      const target = mergeTargets[idx];
      const srcNodes = Array.isArray(c.nodes) ? c.nodes : [];
      const srcEdges = Array.isArray(c.edges) ? c.edges : [];
      const localNodeMap = {};
      const nodesToAdd = [];

      function addFresh(n, overrides){
        const newId = uid('n');
        localNodeMap[n.id] = newId;
        nodeIdMap[n.id] = newId;
        nodesToAdd.push(Object.assign({}, n, overrides || {}, { id: newId }));
      }

      if(!target){
        srcNodes.forEach(n => addFresh(n));
        const edgesToAdd = srcEdges
          .filter(e => !e.auto && localNodeMap[e.from] !== undefined && localNodeMap[e.to] !== undefined)
          .map(e => Object.assign({}, e, { id: uid('e'), from: localNodeMap[e.from], to: localNodeMap[e.to] }));
        return { name: (c.name || 'Canvas').toString(), target, nodesToAdd, edgesToAdd, newCanvasId: canvasIdMap[c.id], template: c.template };
      }

      // Pass 1: value rectangles, matched by name (existing anchors for everything else)
      const existingValueByName = {};
      target.nodes.forEach(n => {
        if(n.type === 'value'){
          const nm = (parseNode(n).name || '').trim().toLowerCase();
          if(nm) existingValueByName[nm] = n.id;
        }
      });
      const structural = []; // operators, aliases, blockInstances — resolved in later passes
      srcNodes.forEach(n => {
        if(n.type === 'value'){
          const nm = (parseNode(n).name || '').trim().toLowerCase();
          if(nm && existingValueByName[nm] !== undefined){
            localNodeMap[n.id] = existingValueByName[nm];
            nodeIdMap[n.id] = existingValueByName[nm];
          } else {
            addFresh(n);
          }
        } else {
          structural.push(n);
        }
      });

      // Pass 2: aliases — identity is their resolved (sourceCanvasId, sourceNodeId); value targets are already resolved
      const existingAliasIndex = {};
      target.nodes.forEach(n => {
        if(n.type === 'alias') existingAliasIndex[n.sourceCanvasId + '::' + n.sourceNodeId] = n.id;
      });
      const remaining = [];
      structural.forEach(n => {
        if(n.type !== 'alias'){ remaining.push(n); return; }
        const rCanvas = canvasIdMap[n.sourceCanvasId] !== undefined ? canvasIdMap[n.sourceCanvasId] : n.sourceCanvasId;
        const rNode = nodeIdMap[n.sourceNodeId] !== undefined ? nodeIdMap[n.sourceNodeId] : n.sourceNodeId;
        const sig = rCanvas + '::' + rNode;
        if(existingAliasIndex[sig] !== undefined){
          localNodeMap[n.id] = existingAliasIndex[sig];
          nodeIdMap[n.id] = existingAliasIndex[sig];
        } else {
          addFresh(n, { sourceCanvasId: rCanvas, sourceNodeId: rNode });
        }
      });

      // Pass 3: operators & block instances — identity is symbol/definition + resolved incoming sources.
      // Iterated to a fixed point since one operator's output can feed another.
      function existingOpSig(exId){ return target.edges.filter(e => e.to === exId).map(e => e.from).sort().join(','); }
      function existingBlockSig(exId, portCount){
        const arr = [];
        for(let i=0;i<portCount;i++){ const e = target.edges.find(e2 => e2.to === exId && e2.toPort === i); arr.push(e ? e.from : ''); }
        return arr.join(',');
      }
      const existingOpIndex = {};
      const existingBlockIndex = {};
      target.nodes.forEach(n => {
        if(n.type === 'operator') existingOpIndex[n.text + '|' + existingOpSig(n.id)] = n.id;
        if(n.type === 'blockInstance'){
          const def = canvases.find(cc => cc.id === n.blockDefCanvasId);
          const portCount = def ? blockPortsOf(def).inputs.length : 0;
          existingBlockIndex[n.blockDefCanvasId + '|' + existingBlockSig(n.id, portCount)] = n.id;
        }
      });

      let pending = remaining;
      let progress = true;
      while(pending.length && progress){
        progress = false;
        const next = [];
        pending.forEach(n => {
          if(n.type === 'operator'){
            const incoming = srcEdges.filter(e => e.to === n.id);
            const resolved = [];
            let ok = true;
            incoming.forEach(e => { if(nodeIdMap[e.from] !== undefined) resolved.push(nodeIdMap[e.from]); else ok = false; });
            if(!ok){ next.push(n); return; }
            const sig = n.text + '|' + resolved.sort().join(',');
            if(existingOpIndex[sig] !== undefined){
              localNodeMap[n.id] = existingOpIndex[sig];
              nodeIdMap[n.id] = existingOpIndex[sig];
            } else {
              addFresh(n);
            }
            progress = true;
          } else if(n.type === 'blockInstance'){
            const rDef = canvasIdMap[n.blockDefCanvasId] !== undefined ? canvasIdMap[n.blockDefCanvasId] : n.blockDefCanvasId;
            const def = canvases.find(cc => cc.id === rDef);
            const portCount = def ? blockPortsOf(def).inputs.length : 0;
            const resolvedPorts = [];
            let ok = true;
            for(let i=0;i<portCount;i++){
              const e = srcEdges.find(e2 => e2.to === n.id && e2.toPort === i);
              if(!e){ resolvedPorts.push(''); continue; }
              if(nodeIdMap[e.from] !== undefined) resolvedPorts.push(nodeIdMap[e.from]); else ok = false;
            }
            if(!ok){ next.push(n); return; }
            const sig = rDef + '|' + resolvedPorts.join(',');
            if(existingBlockIndex[sig] !== undefined){
              localNodeMap[n.id] = existingBlockIndex[sig];
              nodeIdMap[n.id] = existingBlockIndex[sig];
            } else {
              addFresh(n, { blockDefCanvasId: rDef });
            }
            progress = true;
          }
        });
        pending = next;
      }
      // Fallback for anything that couldn't be resolved (shouldn't normally happen): add fresh rather than drop it.
      pending.forEach(n => {
        if(n.type === 'blockInstance'){
          const rDef = canvasIdMap[n.blockDefCanvasId] !== undefined ? canvasIdMap[n.blockDefCanvasId] : n.blockDefCanvasId;
          addFresh(n, { blockDefCanvasId: rDef });
        } else {
          addFresh(n);
        }
      });

      const edgesToAdd = srcEdges
        .filter(e => !e.auto && localNodeMap[e.from] !== undefined && localNodeMap[e.to] !== undefined)
        .map(e => Object.assign({}, e, { id: uid('e'), from: localNodeMap[e.from], to: localNodeMap[e.to] }));

      return { name: (c.name || 'Canvas').toString(), target, nodesToAdd, edgesToAdd, newCanvasId: canvasIdMap[c.id] };
    });

    staged.forEach(s => {
      s.nodesToAdd.forEach(n => {
        if(n.type === 'alias' && n.sourceCanvasId && canvasIdMap[n.sourceCanvasId] !== undefined){
          n.sourceCanvasId = canvasIdMap[n.sourceCanvasId];
          if(nodeIdMap[n.sourceNodeId] !== undefined) n.sourceNodeId = nodeIdMap[n.sourceNodeId];
        }
        if(n.type === 'blockInstance' && n.blockDefCanvasId && canvasIdMap[n.blockDefCanvasId] !== undefined){
          n.blockDefCanvasId = canvasIdMap[n.blockDefCanvasId];
        }
      });
    });

    let firstTouchedCanvasId = null;
    staged.forEach(s => {
      if(s.target){
        const edgeKey = e => e.from + '->' + e.to;
        const existingKeys = new Set(s.target.edges.map(edgeKey));
        const newEdgesFiltered = s.edgesToAdd.filter(e => !existingKeys.has(edgeKey(e)));
        s.target.nodes = s.target.nodes.concat(s.nodesToAdd);
        s.target.edges = s.target.edges.concat(newEdgesFiltered);
        if(firstTouchedCanvasId === null) firstTouchedCanvasId = s.target.id;
      } else {
        // A canvas added as it is keeps its template link; one merged into yours doesn't.
        canvases.push(withTemplateLink({
          id: s.newCanvasId, name: s.name,
          nodes: s.nodesToAdd, edges: s.edgesToAdd,
          computedValues: {}, computeErrors: {}, portValues: {}, portErrors: {}
        }, s.template));
        if(firstTouchedCanvasId === null) firstTouchedCanvasId = s.newCanvasId;
      }
    });

    activeCanvasId = firstTouchedCanvasId || activeCanvasId;
    reconcilePeriodValuesInCanvasList(canvases);
    loadCanvasState(canvases.find(c => c.id === activeCanvasId));
    syncAutoConnections();
    clearSelection();
    renderCanvasTabs();
    evaluateAll();
  }

  function applySystemData(data, mode){
    if(!data || !Array.isArray(data.canvases) || data.canvases.length === 0){
      showMessage('That does not look like an fmIDE system (expected a "canvases" array). Use a Module instead.');
      return;
    }

    if(mode === 'add'){
      const collisions = data.canvases
        .filter(c => canvases.some(ec => ec.name.trim().toLowerCase() === (c.name || '').trim().toLowerCase()))
        .map(c => ({ name: c.name || 'Canvas' }));

      if(collisions.length === 0){
        performAddSystem(data, {});
      } else {
        showCanvasMergeDecisionModal(collisions, (decisions) => performAddSystem(data, decisions));
      }
      return;
    }

    showConfirm('Load this system? It will replace everything currently open — all canvases. (You can Undo afterward if needed.)', () => {
      pushHistory();
      applySystemDataDirect(data);
    });
  }

  // Core of a full system replace, with no confirm/undo bookkeeping — used both by the
  // confirmed "Load System" flow above and by silent boot-time workspace restore.
  function applySystemDataDirect(data){
    let maxId = 0, maxCanvasNum = 0;
    data.canvases.forEach(c => {
      const cm = /(\d+)$/.exec(c.id || ''); if(cm) maxCanvasNum = Math.max(maxCanvasNum, +cm[1]);
      (c.nodes||[]).forEach(n => { const m=/(\d+)$/.exec(n.id||''); if(m) maxId=Math.max(maxId,+m[1]); });
      (c.edges||[]).forEach(e => { const m=/(\d+)$/.exec(e.id||''); if(m) maxId=Math.max(maxId,+m[1]); });
    });
    nextCanvasId = Math.max(nextCanvasId, maxCanvasNum + 1, typeof data.nextCanvasId === 'number' ? data.nextCanvasId : 0);
    canvases = data.canvases.map(c => withTemplateLink({
      id: c.id || ('c' + (nextCanvasId++)),
      name: (c.name || 'Canvas').toString(),
      nodes: Array.isArray(c.nodes) ? c.nodes : [],
      edges: Array.isArray(c.edges) ? c.edges : [],
      computedValues: {}, computeErrors: {}, portValues: {}, portErrors: {}
    }, c.template));
    nextId = Math.max(nextId, maxId + 1, typeof data.nextId === 'number' ? data.nextId : 0);
    setModelFunctions(data.functions);
    activeCanvasId = (typeof data.activeCanvasId === 'string' && canvases.some(c => c.id === data.activeCanvasId))
      ? data.activeCanvasId : canvases[0].id;
    periods = Array.isArray(data.periods) && data.periods.length ? data.periods.map(String) : ['Period 1'];
    currentPeriod = (typeof data.currentPeriod === 'number') ? Math.max(0, Math.min(periods.length - 1, data.currentPeriod)) : 0;
    reconcilePeriodValuesInCanvasList(canvases);
    loadCanvasState(canvases.find(c => c.id === activeCanvasId));
    syncAutoConnections();
    clearSelection();
    renderCanvasTabs();
    evaluateAll();
  }

  function loadSystemFromFile(file, mode){
    const reader = new FileReader();
    reader.onload = () => {
      openFmFileText(reader.result, ['system'], (data) => applySystemData(data, mode));
    };
    reader.onerror = () => showMessage('Could not read that file.');
    reader.readAsText(file);
  }

  // Single canvas as a reusable module; loading adds it into the current canvas.
  function saveModuleToFile(){
    const active = canvases.find(c => c.id === activeCanvasId);
    const payload = withFunctions({
      version: FILE_FORMATS['module'].current, kind: 'module',
      name: active ? active.name : 'Canvas',
      selfCanvasId: activeCanvasId,
      nextId, nodes, edges
    }, [{ nodes }]);
    const safeName = (active ? active.name : 'canvas').replace(/[^a-z0-9\-_]+/gi, '_');
    downloadJSON(payload, `fmIDE-module-${safeName}-${timestamp()}.json`);
  }

  function applyModuleData(data){
    if(!data || !Array.isArray(data.nodes) || !Array.isArray(data.edges)){
      showMessage('That does not look like an fmIDE module (expected "nodes" and "edges" arrays). Use a System instead.');
      return;
    }
    pushHistory();
    applyModuleDataDirect(data);
  }

  // Core of inserting a module's nodes/edges into whatever canvas is currently active
  // (remapping ids and self-referencing alias/blockInstance nodes) — used both when adding
  // to the current canvas and when adding to a freshly created one. No history/validation.
  // keepIds (optional): Map of a module node id → the id it should keep (Update this canvas).
  function applyModuleDataDirect(data, keepIds){
    mergeModelFunctions(data.functions);
    const idMap = {};
    const newNodes = data.nodes.map(n => {
      const newId = (keepIds && keepIds.get(n.id)) || uid('n');
      idMap[n.id] = newId;
      return Object.assign({}, n, { id: newId });
    });
    newNodes.forEach(n => {
      if(n.type === 'alias' && n.sourceCanvasId === data.selfCanvasId && idMap[n.sourceNodeId] !== undefined){
        n.sourceNodeId = idMap[n.sourceNodeId];
        n.sourceCanvasId = activeCanvasId;
      }
      if(n.type === 'blockInstance' && n.blockDefCanvasId === data.selfCanvasId){
        n.blockDefCanvasId = activeCanvasId;
      }
    });
    const newEdges = data.edges
      .filter(e => !e.auto && idMap[e.from] !== undefined && idMap[e.to] !== undefined)
      .map(e => Object.assign({}, e, { id: uid('e'), from: idMap[e.from], to: idMap[e.to] }));

    newNodes.forEach(n => { if(Array.isArray(n.periodValues)) n.periodValues = padPeriodValuesArray(n.periodValues, periods.length); });
    nodes = nodes.concat(newNodes);
    edges = edges.concat(newEdges);
    syncAutoConnections();
    clearComputed();
    selectNodesOnly(newNodes.map(n => n.id));
    render();
    evaluateAll();
  }

  // Creates a brand-new canvas and inserts the module template's contents into it,
  // rather than appending onto whatever canvas is currently active.
  function applyModuleDataToNewCanvas(data){
    if(!data || !Array.isArray(data.nodes) || !Array.isArray(data.edges)){
      showMessage('That does not look like an fmIDE module (expected "nodes" and "edges" arrays). Use a System instead.');
      return;
    }
    pushHistory();
    const name = (typeof data.name === 'string' && data.name.trim()) ? data.name.trim() : ('Canvas ' + canvases.length);
    const c = {
      id: 'c' + (nextCanvasId++),
      name,
      nodes: [], edges: [], computedValues: {}, computeErrors: {}, portValues: {}, portErrors: {}
    };
    canvases.push(c);
    activeCanvasId = c.id;
    loadCanvasState(c);
    clearSelection();
    applyModuleDataDirect(data);
    renderCanvasTabs();
  }

  function loadModuleFromFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      openFmFileText(reader.result, ['module'], (data) => applyModuleData(data));
    };
    reader.onerror = () => showMessage('Could not read that file.');
    reader.readAsText(file);
  }

  fileInputWorkspace.addEventListener('change', () => {
    const file = fileInputWorkspace.files && fileInputWorkspace.files[0];
    fileInputWorkspace.value = '';
    if(file) importWorkspaceFromFile(file);
  });
  let pendingSystemLoadMode = 'replace';
  // File pickers can only be opened by a real user gesture, so Load/Add System, Load
  // Module and Import Workspace stay interactive (they are not available to macros).
  function promptLoadSystem(mode){ pendingSystemLoadMode = mode; fileInputSystem.click(); }
  fileInputSystem.addEventListener('change', () => {
    const file = fileInputSystem.files && fileInputSystem.files[0];
    if(file) loadSystemFromFile(file, pendingSystemLoadMode);
    fileInputSystem.value = '';
  });

  fileInputModule.addEventListener('change', () => {
    const file = fileInputModule.files && fileInputModule.files[0];
    if(file) loadModuleFromFile(file);
    fileInputModule.value = '';
  });


  // ---------- align / distribute ----------
  function selectedNodesList(){ return nodes.filter(n => selectedNodeIds.has(n.id)); }

  function boundingBoxOf(list){
    return {
      minX: Math.min(...list.map(n => n.x)),
      maxX: Math.max(...list.map(n => n.x + n.w)),
      minY: Math.min(...list.map(n => n.y)),
      maxY: Math.max(...list.map(n => n.y + n.h)),
    };
  }

  function alignSelected(mode, list){
    list = list || selectedNodesList();
    if(list.length < 2) return;
    pushHistory();
    const bbox = boundingBoxOf(list);
    list.forEach(n => {
      switch(mode){
        case 'left': n.x = bbox.minX; break;
        case 'right': n.x = bbox.maxX - n.w; break;
        case 'centerH': n.x = (bbox.minX + bbox.maxX)/2 - n.w/2; break;
        case 'top': n.y = bbox.minY; break;
        case 'bottom': n.y = bbox.maxY - n.h; break;
        case 'centerV': n.y = (bbox.minY + bbox.maxY)/2 - n.h/2; break;
      }
    });
    clearComputed();
    render();
  }

  function distributeSelected(axis, list){
    list = list || selectedNodesList();
    if(list.length < 3) return;
    pushHistory();
    if(axis === 'h'){
      const sorted = list.slice().sort((a,b) => a.x - b.x);
      const first = sorted[0], last = sorted[sorted.length-1];
      const span = (last.x + last.w) - first.x;
      const totalW = sorted.reduce((s,n) => s + n.w, 0);
      const gap = (span - totalW) / (sorted.length - 1);
      let cursor = first.x + first.w + gap;
      for(let i=1;i<sorted.length-1;i++){
        sorted[i].x = cursor;
        cursor = sorted[i].x + sorted[i].w + gap;
      }
    } else {
      const sorted = list.slice().sort((a,b) => a.y - b.y);
      const first = sorted[0], last = sorted[sorted.length-1];
      const span = (last.y + last.h) - first.y;
      const totalH = sorted.reduce((s,n) => s + n.h, 0);
      const gap = (span - totalH) / (sorted.length - 1);
      let cursor = first.y + first.h + gap;
      for(let i=1;i<sorted.length-1;i++){
        sorted[i].y = cursor;
        cursor = sorted[i].y + sorted[i].h + gap;
      }
    }
    clearComputed();
    render();
  }

  // ---------- marquee (range) selection ----------
  function rectsIntersect(a,b){ return !(b.x > a.x+a.w || b.x+b.w < a.x || b.y > a.y+a.h || b.y+b.h < a.y); }

  function startMarquee(downEvent){
    const additive = downEvent.shiftKey || downEvent.ctrlKey || downEvent.metaKey;
    if(!additive) clearSelection(); else render();
    const canvasRect = canvas.getBoundingClientRect();
    const startX = downEvent.clientX - canvasRect.left, startY = downEvent.clientY - canvasRect.top;
    const box = document.createElement('div');
    box.className = 'marquee';
    canvas.appendChild(box);
    document.body.classList.add('dragging');
    let last = {x:startX,y:startY,w:0,h:0};

    function onMove(ev){
      const curX = ev.clientX - canvasRect.left, curY = ev.clientY - canvasRect.top;
      const x = Math.min(startX,curX), y = Math.min(startY,curY);
      const w = Math.abs(curX-startX), h = Math.abs(curY-startY);
      last = {x,y,w,h};
      box.style.left = x+'px'; box.style.top = y+'px'; box.style.width = w+'px'; box.style.height = h+'px';
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('dragging');
      box.remove();
      if(last.w > 3 || last.h > 3){
        nodes.filter(n => rectsIntersect(last, {x:n.x,y:n.y,w:n.w,h:n.h})).forEach(n => selectedNodeIds.add(n.id));
        render();
      }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  viewport.addEventListener('mousedown', (e) => {
    if(e.button === 2) return; // right button is reserved for arrow-drawing, started from a node
    if(e.target === viewport || e.target === canvas || e.target === svg){
      startMarquee(e);
    }
  });
  viewport.addEventListener('contextmenu', (e) => { e.preventDefault(); });

  // ---------- computation ----------
  // The calculation runs on the shared IR (src/shared/ir.js): compileModel reads the model,
  // evaluateModel calculates it, with the operators of src/shared/operators.js (included in
  // 01-setup-commands-keys.js, where the palette is built from it).
  // ---------- function plugins (shared: src/shared/functions.js) ----------
  // A function is a formula held in a file, written with the operators of the catalogue
  // (operators.js), for example
  //   Margin(Revenue, Cost) = (Revenue - Cost) / Revenue
  // It is read by the parser below — never run as code: no eval, no new Function. Everything
  // in a definition comes from a file and is untrusted; the parser only builds a small tree
  // of plain objects, and names never reach a formula or the page as markup.
  //
  // A definition, as files carry it (system v5, module v3, fmIDE-workspace v4,
  // fmIDE-functions v1; docs/file-formats.md):
  //   { family, version, versionId, text, description, note,
  //     calls: [{ name, family, version, versionId }] }
  // `family` is a lasting random id (never the name), `version` 1, 2, 3…, `versionId` random.
  // `text` is the whole definition: its name, its inputs and its formula. `calls` pins each
  // function the formula calls, by the name it is written with, to a family and version: the
  // calculation follows `calls`, never the name alone.
  // A function node on a canvas refers to one version:
  //   { type: 'function', fn: { family, version, versionId, name } }
  // and each arrow into it carries `toPort`, the index of the input it feeds (from 0).
  // Uses operators.js (applyOperator, operatorById) and uom.js (units).

  // Limits, so a file can't make either app work without end.
  const FUNCTION_LIMITS = { text: 4000, name: 64, inputs: 32, nesting: 64, callDepth: 16, description: 2000, note: 500, calls: 64 };

  // The functions of the syntax that are built in: the catalogue's operators by their Excel
  // names, with Excel's number of arguments. (Lookup tables without a prototype, so no name
  // from a file can match anything but their own entries.)
  const FUNCTION_BUILTINS = Object.assign(Object.create(null), {
    MIN:     { id: 'min',     min: 1, max: Infinity },
    MAX:     { id: 'max',     min: 1, max: Infinity },
    AVERAGE: { id: 'average', min: 1, max: Infinity },
    ABS:     { id: 'abs',     min: 1, max: 1 },
    MOD:     { id: 'mod',     min: 2, max: 2 },
    IFERROR: { id: 'iferror', min: 2, max: 2 },
  });
  // Names kept back: Excel functions that are not available (yet), so a formula using one
  // says so instead of looking for a function of that name.
  const FUNCTION_RESERVED = new Set(['IF', 'IFS', 'AND', 'OR', 'NOT', 'XOR', 'SUM', 'PRODUCT', 'ROUND', 'ROUNDUP',
    'ROUNDDOWN', 'INT', 'TRUNC', 'LN', 'LOG', 'LOG10', 'EXP', 'SQRT', 'POWER', 'SIGN', 'COUNT', 'LET', 'LAMBDA',
    'CHOOSE', 'INDEX', 'NA', 'TRUE', 'FALSE', 'PI', 'CEILING', 'FLOOR', 'MEDIAN', 'SUMPRODUCT']);
  // Symbols and the catalogue operator each one is. The typographic signs fmIDE shows on its
  // operators are accepted too.
  const FUNCTION_SYMBOLS = Object.assign(Object.create(null), {
    '+': 'add', '-': 'subtract', '−': 'subtract', '*': 'multiply', '×': 'multiply', '/': 'divide', '÷': 'divide',
    '^': 'power', '<': 'lt', '<=': 'le', '≤': 'le', '>': 'gt', '>=': 'ge', '≥': 'ge',
  });
  const FUNCTION_COMPARISONS = new Set(['lt', 'le', 'gt', 'ge']);

  // ---- the parser ----
  // Returns { ok: true, name, params, body, calls } or { ok: false, error: { message, at, length } }
  // (`at` is the position in the text, from 0). `body` is a tree of
  //   { t: 'num', v } · { t: 'param', i } (input i, from 0) · { t: 'neg', a } ·
  //   { t: 'op', id, args } (a catalogue operator: binary for symbols, any count for built-ins) ·
  //   { t: 'call', name, key, args } (another function; `key` is its name in lower case)
  // and `calls` lists the called names (lower case) in the order they first appear.
  // Precedence follows Excel: a leading minus binds tightest (-2^2 = 4), then ^ (from the
  // left), then * and /, then + and −, then one comparison.
  function parseFunctionText(text){
    const src = typeof text === 'string' ? text : '';
    const fail = (message, at, length) => { throw { fnParseError: true, message, at: at || 0, length: Math.max(1, length || 1) }; };
    try{
      if(src.length > FUNCTION_LIMITS.text) fail(`The definition is too long (at most ${FUNCTION_LIMITS.text} characters).`, FUNCTION_LIMITS.text, 1);
      const tokens = tokenizeFunctionText(src, fail);
      let pos = 0, depth = 0;
      const peek = () => tokens[pos];
      const next = () => tokens[pos++];
      const at = () => (tokens[pos] ? tokens[pos].at : src.length);
      const expect = (type, value, message) => {
        const tok = peek();
        if(!tok || tok.type !== type || (value !== undefined && tok.value !== value)) fail(message, at(), tok ? tok.text.length : 1);
        return next();
      };

      // The header: Name(Input, Input, …) =
      const nameTok = peek();
      if(!nameTok || nameTok.type !== 'name') fail('A definition starts with the function\'s name and its inputs, like Margin(Revenue, Cost) = (Revenue - Cost) / Revenue.', at(), 1);
      next();
      const name = nameTok.value;
      const upperName = name.toUpperCase();
      if(FUNCTION_BUILTINS[upperName] || FUNCTION_RESERVED.has(upperName)) fail(`"${name}" is the name of a built-in Excel function: choose another name.`, nameTok.at, name.length);
      expect('punct', '(', 'Expected "(" after the function\'s name, then its inputs.');
      const params = [], paramIndex = new Map();
      if(!(peek() && peek().type === 'punct' && peek().value === ')')){
        for(;;){
          const p = expect('name', undefined, 'Expected the name of an input.');
          const key = p.value.toLowerCase();
          const upper = p.value.toUpperCase();
          if(FUNCTION_BUILTINS[upper] || FUNCTION_RESERVED.has(upper)) fail(`"${p.value}" is the name of a built-in Excel function and can't be an input's name.`, p.at, p.text.length);
          if(key === name.toLowerCase()) fail(`An input can't have the function's own name, "${p.value}".`, p.at, p.text.length);
          if(paramIndex.has(key)) fail(`Two inputs are both called "${p.value}".`, p.at, p.text.length);
          if(params.length >= FUNCTION_LIMITS.inputs) fail(`A function can have at most ${FUNCTION_LIMITS.inputs} inputs.`, p.at, p.text.length);
          paramIndex.set(key, params.length);
          params.push(p.value);
          const sep = peek();
          if(sep && sep.type === 'punct' && sep.value === ','){ next(); continue; }
          break;
        }
      }
      expect('punct', ')', 'Expected "," or ")" after an input\'s name.');
      expect('punct', '=', 'Expected "=" after the inputs, then the formula.');
      if(!peek()) fail('The formula after "=" is missing.', src.length, 1);

      const calls = [];
      const enter = () => { if(++depth > FUNCTION_LIMITS.nesting) fail(`The formula is nested too deeply (at most ${FUNCTION_LIMITS.nesting} levels).`, at(), 1); };
      const leave = () => { depth--; };
      const isOp = (ids) => { const tok = peek(); return !!tok && tok.type === 'op' && ids.includes(tok.value); };

      function comparison(){
        const left = additive();
        if(peek() && peek().type === 'op' && FUNCTION_COMPARISONS.has(peek().value)){
          const op = next();
          const right = additive();
          if(peek() && peek().type === 'op' && FUNCTION_COMPARISONS.has(peek().value)){
            fail('Comparisons can\'t be chained (a < b < c): compare two values at a time.', peek().at, peek().text.length);
          }
          return { t: 'op', id: op.value, args: [left, right] };
        }
        return left;
      }
      function additive(){
        let left = multiplicative();
        while(isOp(['add', 'subtract'])){ const op = next(); left = { t: 'op', id: op.value, args: [left, multiplicative()] }; }
        return left;
      }
      function multiplicative(){
        let left = power();
        while(isOp(['multiply', 'divide'])){ const op = next(); left = { t: 'op', id: op.value, args: [left, power()] }; }
        return left;
      }
      function power(){
        let left = unary();
        while(isOp(['power'])){ next(); left = { t: 'op', id: 'power', args: [left, unary()] }; }
        return left;
      }
      function unary(){
        if(isOp(['subtract', 'add'])){
          const op = next();
          enter();
          const a = unary();
          leave();
          return op.value === 'subtract' ? { t: 'neg', a } : a;
        }
        return primary();
      }
      function primary(){
        const tok = peek();
        if(!tok) fail('The formula ends too soon: expected a number, an input or "(".', src.length, 1);
        if(tok.type === 'num'){ next(); return { t: 'num', v: tok.value }; }
        if(tok.type === 'punct' && tok.value === '('){
          next();
          enter();
          const inner = comparison();
          leave();
          expect('punct', ')', 'Expected ")" here.');
          return inner;
        }
        if(tok.type === 'name'){
          next();
          const key = tok.value.toLowerCase();
          const upper = tok.value.toUpperCase();
          const opens = peek() && peek().type === 'punct' && peek().value === '(';
          if(!opens){
            if(paramIndex.has(key)) return { t: 'param', i: paramIndex.get(key) };
            if(FUNCTION_BUILTINS[upper]) fail(`${upper} needs its inputs in brackets, like ${upper}(a, b).`, tok.at, tok.text.length);
            fail(`"${tok.value}" isn't one of this function's inputs.`, tok.at, tok.text.length);
          }
          if(paramIndex.has(key)) fail(`"${tok.value}" is an input, not a function.`, tok.at, tok.text.length);
          if(FUNCTION_RESERVED.has(upper)) fail(`${upper} isn't available in functions yet.`, tok.at, tok.text.length);
          if(key === name.toLowerCase()) fail('A function can\'t call itself.', tok.at, tok.text.length);
          next(); // (
          enter();
          const args = [];
          if(!(peek() && peek().type === 'punct' && peek().value === ')')){
            for(;;){
              args.push(comparison());
              if(peek() && peek().type === 'punct' && peek().value === ','){ next(); continue; }
              break;
            }
          }
          leave();
          expect('punct', ')', 'Expected "," or ")" in the list of inputs.');
          const builtin = FUNCTION_BUILTINS[upper];
          if(builtin){
            if(args.length < builtin.min || args.length > builtin.max){
              const count = builtin.min === builtin.max ? `exactly ${builtin.min}` : `at least ${builtin.min}`;
              fail(`${upper} takes ${count} input${builtin.min === 1 && builtin.max === 1 ? '' : 's'}.`, tok.at, tok.text.length);
            }
            return { t: 'op', id: builtin.id, args };
          }
          if(!calls.includes(key)){
            if(calls.length >= FUNCTION_LIMITS.calls) fail(`A function can call at most ${FUNCTION_LIMITS.calls} other functions.`, tok.at, tok.text.length);
            calls.push(key);
          }
          return { t: 'call', name: tok.value, key, args };
        }
        if(tok.type === 'punct' && tok.value === ')') fail('Unexpected ")".', tok.at, 1);
        if(tok.type === 'punct' && tok.value === '=') fail('"=" can only follow the inputs. To compare, use <, <=, > or >=.', tok.at, 1);
        fail(`Expected a number, an input or "(" here, not "${tok.text}".`, tok.at, tok.text.length);
      }

      const body = comparison();
      if(peek()){
        const tok = peek();
        if(tok.type === 'punct' && tok.value === ')') fail('Unexpected ")": there is no "(" for it to close.', tok.at, 1);
        if(tok.type === 'punct' && tok.value === '=') fail('"=" can only follow the inputs. To compare, use <, <=, > or >=.', tok.at, 1);
        fail(`Unexpected "${tok.text}": expected an operator such as + or *.`, tok.at, tok.text.length);
      }
      return { ok: true, name, params, body, calls };
    } catch(err){
      if(err && err.fnParseError) return { ok: false, error: { message: err.message, at: err.at, length: err.length } };
      if(err instanceof RangeError) return { ok: false, error: { message: 'The formula is nested too deeply.', at: 0, length: 1 } };
      throw err;
    }
  }

  // The text as tokens: { type: 'name' | 'num' | 'op' | 'punct', value, text, at }.
  function tokenizeFunctionText(src, fail){
    const tokens = [];
    const nameStart = /[\p{L}_]/u, namePart = /[\p{L}\p{N}_.]/u;
    let i = 0;
    while(i < src.length){
      const ch = src[i];
      if(/\s/.test(ch)){ i++; continue; }
      const start = i;
      if(/[0-9]/.test(ch) || (ch === '.' && /[0-9]/.test(src[i + 1] || ''))){
        const m = /^(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?/.exec(src.slice(i, i + 400));
        const text = m[0];
        const value = Number(text);
        if(!isFinite(value)) fail('That number is too large.', start, text.length);
        if(nameStart.test(src[i + text.length] || '')) fail(`"${src.slice(i, i + text.length + 1)}" isn't a number or a name: a name can't start with a digit.`, start, text.length + 1);
        tokens.push({ type: 'num', value, text, at: start });
        i += text.length;
        continue;
      }
      if(nameStart.test(ch)){
        let j = i + 1;
        while(j < src.length && namePart.test(src[j])) j++;
        const text = src.slice(i, j);
        if(text.length > FUNCTION_LIMITS.name) fail(`A name can be at most ${FUNCTION_LIMITS.name} characters long.`, start, text.length);
        tokens.push({ type: 'name', value: text, text, at: start });
        i = j;
        continue;
      }
      const two = src.slice(i, i + 2);
      if(two === '<=' || two === '>='){ tokens.push({ type: 'op', value: FUNCTION_SYMBOLS[two], text: two, at: start }); i += 2; continue; }
      if(two === '<>') fail('"<>" isn\'t supported: comparisons are <, <=, > and >=.', start, 2);
      if(FUNCTION_SYMBOLS[ch]){ tokens.push({ type: 'op', value: FUNCTION_SYMBOLS[ch], text: ch, at: start }); i++; continue; }
      if(ch === '(' || ch === ')' || ch === ',' || ch === '='){ tokens.push({ type: 'punct', value: ch, text: ch, at: start }); i++; continue; }
      if(ch === '%') fail('"%" isn\'t supported: use MOD(a, b) for a remainder, or / 100 for a percentage.', start, 1);
      if(ch === ';') fail('Inputs are separated by "," not ";".', start, 1);
      const shown = ch === '"' ? 'a quote (")' : `"${ch}"`;
      fail(`${shown} can't be used in a function's formula.`, start, 1);
    }
    return tokens;
  }

  // ---- definitions from files ----
  // A clean copy of each definition in `list` that has what a definition needs; anything else
  // is left out. Nothing from the file is kept that isn't listed here.
  function cleanFunctionDefinitions(list){
    const out = [];
    (Array.isArray(list) ? list : []).forEach(d => {
      const clean = cleanFunctionDefinition(d);
      if(clean) out.push(clean);
    });
    return out;
  }
  function cleanFunctionDefinition(d){
    if(!d || typeof d !== 'object') return null;
    const ref = cleanFunctionRef(d);
    if(!ref || typeof d.text !== 'string' || !d.text.trim()) return null;
    const str = (v, max) => typeof v === 'string' ? v.slice(0, max) : '';
    const calls = [];
    (Array.isArray(d.calls) ? d.calls : []).slice(0, FUNCTION_LIMITS.calls).forEach(c => {
      const r = cleanFunctionRef(c);
      if(r && typeof c.name === 'string' && c.name.trim()) calls.push({ name: c.name.trim().slice(0, FUNCTION_LIMITS.name), family: r.family, version: r.version, versionId: r.versionId });
    });
    return { family: ref.family, version: ref.version, versionId: ref.versionId, text: d.text.slice(0, FUNCTION_LIMITS.text + 1),
      description: str(d.description, FUNCTION_LIMITS.description), note: str(d.note, FUNCTION_LIMITS.note), calls };
  }
  // { family, version, versionId } from a reference (a function node's `fn`, an entry of
  // `calls`), or null. Ids are 8–64 letters, digits and dashes, as for templates; a malformed
  // `versionId` counts as unknown ('').
  const FUNCTION_ID = /^[A-Za-z0-9-]{8,64}$/;
  function cleanFunctionRef(r){
    if(!r || typeof r !== 'object') return null;
    if(typeof r.family !== 'string' || !FUNCTION_ID.test(r.family)) return null;
    const version = Number(r.version);
    if(!Number.isInteger(version) || version < 1) return null;
    const versionId = (typeof r.versionId === 'string' && FUNCTION_ID.test(r.versionId)) ? r.versionId : '';
    return { family: r.family, version, versionId };
  }
  function functionKey(ref){ return ref.family + '@' + ref.version; }

  // The function name a definition's text starts with, or '' (for showing a definition whose
  // text can't be read).
  function functionNameOf(def){
    const m = def && typeof def.text === 'string' ? /^\s*([\p{L}_][\p{L}\p{N}_.]*)/u.exec(def.text) : null;
    return m ? m[1].slice(0, FUNCTION_LIMITS.name) : '';
  }

  // ---- compiling: the definitions a model carries ----
  // Reads `list` (a file's `functions`) and returns { resolve(ref) → compiled or null, list }.
  // A compiled function is { family, version, versionId, name, params, body, targets, status }:
  // `targets` maps each called name (lower case) to the compiled function it calls, and
  // `status` is null when it can be calculated, or an error code:
  //   function-unreadable (its text doesn't parse), function-missing (it calls a function
  //   that isn't in the file), function-cycle (functions calling each other in a loop),
  //   function-too-deep (calls nested more than FUNCTION_LIMITS.callDepth deep),
  //   function-arguments (it calls a function with the wrong number of inputs).
  // A reference with a versionId matches only the definition with that versionId.
  function compileFunctions(list){
    const byKey = new Map();
    const compiled = [];
    cleanFunctionDefinitions(list).forEach(def => {
      const key = functionKey(def);
      if(byKey.has(key)) return; // the first definition of a family and version is the one used
      const parsed = parseFunctionText(def.text);
      const c = { family: def.family, version: def.version, versionId: def.versionId, def,
        name: parsed.ok ? parsed.name : functionNameOf(def), params: parsed.ok ? parsed.params : [],
        body: parsed.ok ? parsed.body : null, parseError: parsed.ok ? null : parsed.error,
        calledNames: parsed.ok ? parsed.calls : [], targets: new Map(), status: undefined, depth: 0 };
      byKey.set(key, c);
      compiled.push(c);
    });
    const resolve = (ref) => {
      const r = cleanFunctionRef(ref);
      const c = r ? byKey.get(functionKey(r)) : null;
      if(!c) return null;
      if(r.versionId && c.versionId && r.versionId !== c.versionId) return null;
      return c;
    };
    // Status and depth, following the calls (a loop is found by the walk meeting itself).
    const visiting = new Set();
    const settle = (c) => {
      if(c.status !== undefined) return;
      if(visiting.has(c)){ c.status = 'function-cycle'; return; }
      if(c.parseError){ c.status = 'function-unreadable'; return; }
      visiting.add(c);
      let status = null, depth = 1;
      for(const key of c.calledNames){
        const entry = c.def.calls.find(e => e.name.toLowerCase() === key);
        const target = entry ? resolve(entry) : null;
        if(!target){ status = status || 'function-missing'; continue; }
        c.targets.set(key, target);
        settle(target);
        if(visiting.has(target) || target.status === 'function-cycle'){ status = 'function-cycle'; continue; }
        if(target.status) status = status || target.status;
        depth = Math.max(depth, target.depth + 1);
      }
      // Every call gives the function it calls exactly as many inputs as it has.
      if(!status){
        const wrongCount = (x) => {
          if(x.t === 'call' && x.args.length !== c.targets.get(x.key).params.length) return true;
          if(x.t === 'neg') return wrongCount(x.a);
          return (x.t === 'op' || x.t === 'call') && x.args.some(wrongCount);
        };
        if(wrongCount(c.body)) status = 'function-arguments';
      }
      visiting.delete(c);
      if(c.status === 'function-cycle') return; // met itself on the way round
      if(!status && depth > FUNCTION_LIMITS.callDepth) status = 'function-too-deep';
      c.status = status;
      c.depth = depth;
    };
    compiled.forEach(settle);
    return { resolve, list: compiled };
  }

  // ---- calculating a call ----
  // `fn` is a compiled function whose status is null; `input(i)` returns input i's result,
  // { value } or { error, edge? }, and is asked only for inputs the formula actually reads
  // (so IFERROR inside a function catches a failing input, as Excel does). Returns { value }
  // or { error, edge? }: a failing input's own result, or { error: 'math-error' } for a result
  // that isn't a finite number (a divide by zero; Excel shows #DIV/0! or #NUM!).
  function runFunction(fn, input){
    const memo = [];
    const arg = (i) => {
      if(!memo[i]) memo[i] = i < fn.params.length ? input(i) : { error: 'function-input-unwired' };
      return memo[i];
    };
    return evalFunctionExpr(fn, fn.body, arg);
  }
  function evalFunctionExpr(fn, x, arg){
    switch(x.t){
      case 'num': return { value: x.v };
      case 'param': return arg(x.i);
      case 'neg': {
        const r = evalFunctionExpr(fn, x.a, arg);
        return r.error ? r : { value: -r.value };
      }
      case 'call': {
        const target = fn.targets.get(x.key);
        const memo = [];
        const inner = (i) => {
          if(!memo[i]) memo[i] = i < x.args.length ? evalFunctionExpr(fn, x.args[i], arg) : { error: 'function-input-unwired' };
          return memo[i];
        };
        return runFunctionWith(target, inner);
      }
      case 'op': {
        const op = operatorById(x.id);
        if(op.fallback){
          const first = evalFunctionExpr(fn, x.args[0], arg);
          return first.error ? evalFunctionExpr(fn, x.args[1], arg) : first;
        }
        const values = [];
        for(const a of x.args){
          const r = evalFunctionExpr(fn, a, arg);
          if(r.error) return r;
          values.push(r.value);
        }
        const r = applyOperator(op, values);
        if(r.error) return { error: r.error };
        return isFinite(r.value) ? { value: r.value } : { error: 'math-error' };
      }
    }
    return { error: 'function-unreadable' };
  }
  // A call inside a formula: the callee's formula, with its inputs read from the caller.
  function runFunctionWith(target, input){
    return evalFunctionExpr(target, target.body, input);
  }

  // ---- units ----
  // The unit of a call to `fn` (status null), where `inputUnit(i)` is input i's unit (or null).
  // Worked out from the formula with the catalogue's unit rules. A number written in the
  // formula has no unit of its own: it counts as a plain number for × and ÷ (Revenue * 1.1
  // keeps Revenue's unit) and is left out for the rules that need equal units (Revenue + 100
  // keeps it too). Returns a unit or null.
  const FUNCTION_UNIT_NUMBER = { number: true };
  function functionUnit(fn, inputUnit){
    const memo = [];
    const arg = (i) => { if(!(i in memo)) memo[i] = inputUnit(i); return memo[i]; };
    const u = functionExprUnit(fn, fn.body, arg);
    return u === FUNCTION_UNIT_NUMBER ? null : u;
  }
  function functionExprUnit(fn, x, arg){
    switch(x.t){
      case 'num': return FUNCTION_UNIT_NUMBER;
      case 'param': return arg(x.i) || null;
      case 'neg': return functionExprUnit(fn, x.a, arg);
      case 'call': {
        const target = fn.targets.get(x.key);
        const memo = [];
        const inner = (i) => { if(!(i in memo)) memo[i] = i < x.args.length ? functionExprUnit(fn, x.args[i], arg) : null; return memo[i]; };
        return functionExprUnit(target, target.body, inner);
      }
      case 'op': {
        const rule = operatorById(x.id).unit;
        const units = x.args.map(a => functionExprUnit(fn, a, arg));
        if(units.some(u => u === null)) return null;
        if(rule === 'multiply' || rule === 'divide'){
          if(units.every(u => u === FUNCTION_UNIT_NUMBER)) return FUNCTION_UNIT_NUMBER;
          const plain = { scale: 1, dims: {} };
          const us = units.map(u => u === FUNCTION_UNIT_NUMBER ? plain : u);
          return us.reduce((acc, u, i) => i === 0 ? u : (rule === 'multiply' ? uomMultiply(acc, u) : uomDivide(acc, u)));
        }
        if(rule === 'same'){
          const us = units.filter(u => u !== FUNCTION_UNIT_NUMBER);
          if(!us.length) return FUNCTION_UNIT_NUMBER;
          return us.every(u => uomDimsEqual(u, us[0])) ? us[0] : null;
        }
        return null;
      }
    }
    return null;
  }

  // ---- which definitions a model needs ----
  // The definitions in `list` that the function nodes of `canvases` use, and every function
  // those call, in `list`'s order — what a file carries. Unused ones are left out.
  function functionsUsedBy(canvases, list){
    const defs = cleanFunctionDefinitions(list);
    if(!defs.length) return [];
    const byKey = new Map();
    defs.forEach(d => { const k = functionKey(d); if(!byKey.has(k)) byKey.set(k, d); });
    const find = (ref) => {
      const r = cleanFunctionRef(ref);
      const d = r ? byKey.get(functionKey(r)) : null;
      return (d && !(r.versionId && d.versionId && r.versionId !== d.versionId)) ? d : null;
    };
    const used = new Set();
    const visit = (d) => {
      if(!d || used.has(d)) return;
      used.add(d);
      d.calls.forEach(c => visit(find(c)));
    };
    (Array.isArray(canvases) ? canvases : []).forEach(c => (c && Array.isArray(c.nodes) ? c.nodes : []).forEach(n => {
      if(n && n.type === 'function') visit(find(n.fn));
    }));
    // In the list's order; the first definition of a family and version only.
    return defs.filter(d => used.has(d));
  }
  // ---------- the formula IR (shared: src/shared/ir.js) ----------
  // The IR (intermediate representation) is the model's calculation, read once from the saved
  // system — { periods, canvases: [{ id, name, nodes, edges }] } — and kept in memory only
  // (never saved). compileModel(system) is a pure function of that object: it reads nothing
  // else, and changes nothing in it. evaluateModel(ir) calculates every rectangle in every
  // period; unitOf(ir, canvasId, nodeId) gives a rectangle's unit of measure.
  // Uses operators.js (the operator catalogue), uom.js (units), input-rule.js and
  // functions.js (function plugins: the definitions a system carries in `functions`).
  //
  // Lookups follow the file as it is: where a file repeats an id, the first canvas (or the
  // first node on a canvas) with that id is the one used.

  // A value rectangle's text: "Name\nValue\nUnit"; a single line that is a number is a value
  // with no name.
  function parseRectText(text){
    const raw = text || '';
    const lines = raw.split('\n');
    if(lines.length === 1){
      const t = lines[0].trim();
      if(t !== '' && !isNaN(Number(t))) return { name: '', literal: Number(t), uom: null };
      return { name: lines[0], literal: null, uom: null };
    }
    const name = lines[0];
    const second = lines[1].trim();
    const literal = (second !== '' && !isNaN(Number(second))) ? Number(second) : null;
    const uom = (lines.length >= 3 && lines[2].trim() !== '') ? lines[2].trim() : null;
    return { name, literal, uom };
  }

  // A value rectangle's own typed number applies to every period by default.
  // node.literalPeriods, when present, is the sparse list of period indices where
  // the rectangle's own number is used; other periods fall through to an incoming
  // edge instead (e.g. a period-shift connector carrying a prior period forward).
  // node.periodValues, when present, is a number per period (a drawn curve).
  function effectiveLiteral(n, period){
    if(Array.isArray(n.periodValues) && typeof n.periodValues[period] === 'number' && isFinite(n.periodValues[period])){
      return n.periodValues[period];
    }
    const {literal} = parseRectText(n.text);
    if(literal === null) return null;
    if(Array.isArray(n.literalPeriods) && !n.literalPeriods.includes(period)) return null;
    return literal;
  }

  // Left to right, then top to bottom: the order an operator reads its inputs in.
  function irByPosition(a, b){ return (a.x - b.x) || (a.y - b.y); }

  // ---- plugs and sockets ----
  // A rectangle's plug names (system v3: a list, `plugs`). Tolerates a node still holding the
  // older single `plug` text and drops anything that isn't a non-empty name; names match
  // case-insensitively, so a name appears once.
  function plugsOf(n){
    if(!n) return [];
    const raw = Array.isArray(n.plugs) ? n.plugs : (typeof n.plug === 'string' ? [n.plug] : []);
    const out = [], seen = new Set();
    raw.forEach(p => {
      if(typeof p !== 'string') return;
      const t = p.trim(), k = t.toLowerCase();
      if(t && !seen.has(k)){ seen.add(k); out.push(t); }
    });
    return out;
  }

  // The automatic links plugs make: every operator with a socket name is fed by every value
  // rectangle, anywhere in the model, carrying a plug of that name (trimmed, any capitals).
  // `list` is the canvases [{ id, nodes, edges }] in the system's order, without automatic
  // links. Returns one list per canvas, in order: { from, to } — an arrow from a plugged
  // rectangle on the socket's own canvas (none where an arrow is already drawn) — or
  // { to, alias: { sourceCanvasId, sourceNodeId, x, y } } — an alias of a plugged rectangle on
