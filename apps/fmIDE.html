    function renderList(){
      const families = templateFamilies();
      dedupeBtn.textContent = '🧹 Remove duplicates…';
      dedupeBtn.style.display = families.length > 1 ? '' : 'none';
      clearBtn.style.display = TEMPLATES.length ? '' : 'none';
      list.innerHTML = '';
      shown = [];
      if(families.length === 0){
        const empty = document.createElement('p');
        empty.className = 'template-desc';
        empty.textContent = 'No templates yet — use "+ Save Canvas as Template" / "+ Save System as Template" above, or import some.';
        list.appendChild(empty);
        return;
      }
      const q = search.value.trim();
      if(q){
        // Name first; group and description only when the name doesn't match.
        const hits = families.map(t => {
          const onName = fuzzyMatch(q, t.name || '');
          if(onName) return { t, score: onName.score + 500, idx: onName.idx };
          const other = fuzzyMatch(q, t.group || '') || fuzzyMatch(q, t.description || '');
          return other ? { t, score: other.score, idx: [] } : null;
        }).filter(Boolean).sort((a, b) => b.score - a.score);
        if(hits.length === 0){
          const none = document.createElement('p');
          none.className = 'template-desc';
          none.textContent = 'No matching templates';
          list.appendChild(none);
          return;
        }
        hits.forEach(h => templateButton(h.t, h.idx, h.t.group || 'Ungrouped'));
        return;
      }
      const groups = {};
      families.forEach(t => {
        const g = t.group || 'Ungrouped';
        (groups[g] = groups[g] || []).push(t);
      });
      Object.keys(groups).forEach(g => {
        const header = document.createElement('div');
        header.textContent = g;
        header.style.cssText = 'font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.4px;margin:8px 0 2px;';
        list.appendChild(header);
        groups[g].forEach(t => templateButton(t, null, null));
      });
    }

    function selectShown(i){
      if(!shown.length) return;
      selected = shown[Math.max(0, Math.min(shown.length - 1, i))];
      previewCanvasIdx = 0;
      renderList(); renderDetail();
      const b = list.querySelector('button.active');
      if(b) b.scrollIntoView({ block: 'nearest' });
    }
    search.addEventListener('input', () => {
      renderList();
      if(search.value.trim() && shown.length && shown[0] !== selected) selectShown(0);
    });
    // Keys act only while this window is on top (not under a confirm or edit dialog).
    function onKey(ev){
      const overlays = document.querySelectorAll('.modal-overlay');
      if(overlays[overlays.length - 1] !== overlay) return;
      if(ev.key === 'Escape'){ ev.preventDefault(); ev.stopPropagation(); close(); return; }
      if(document.activeElement !== search && !list.contains(document.activeElement)) return;
      if(ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
        ev.preventDefault();
        const i = shown.indexOf(selected);
        selectShown(i < 0 ? 0 : i + (ev.key === 'ArrowDown' ? 1 : -1));
        search.focus();
      } else if(ev.key === 'Enter' && document.activeElement === search){
        ev.preventDefault(); ev.stopPropagation();
        if(selected && shown.includes(selected)) runMain();
      }
    }
    document.addEventListener('keydown', onKey, true);

    renderList();
    renderDetail();

    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const closeBtn = document.createElement('button');
    closeBtn.textContent = 'Close';
    closeBtn.addEventListener('click', close);
    actions.appendChild(closeBtn);
    box.appendChild(actions);
    search.focus();
  }

  // ---------- function plugins: the library and the model's definitions (step 7, phase D) ----------
  // A function is a formula held in files (src/shared/functions.js). fmIDE keeps two lists:
  // - FUNCTIONS, the person's library (one entry per version), saved in the workspace and in
  //   fmIDE-functions files;
  // - modelFunctions (06-align-marquee-computation.js), the definitions the open model carries
  //   and calculates with. A file written from the model carries the ones it uses
  //   (functionsForFile), so a model always takes its functions with it.
  // Definitions from files are cleaned (cleanFunctionDefinitions) and never run as code.
  let FUNCTIONS = [];

  // Same version: the same family and versionId (or, for a definition without a versionId,
  // the same family and version number).
  function sameFunctionVersion(a, b){
    if(a.family !== b.family) return false;
    return (a.versionId || b.versionId) ? a.versionId === b.versionId : a.version === b.version;
  }
  // Definitions from a file (Open, Import Workspace, Import Functions, a model's own) join
  // the library. Nothing of the person's is replaced or removed, as for templates:
  //  - a version already here (the same family and versionId, or — without a versionId —
  //    the same family and text) is skipped;
  //  - a version whose number is free in its family is added as it is;
  //  - a version whose number is taken by a different version is added after the file's
  //    other versions, as the family's next number, keeping its versionId, with a note
  //    saying so. Calls to it in the library follow it (they match by versionId).
  // Returns { added, present, renumbered }.
  function addMissingFunctions(list){
    let added = 0, present = 0, renumbered = 0;
    const clashes = [], moved = [];
    const here = (d) => FUNCTIONS.some(f => sameFunctionVersion(f, d))
      || (!d.versionId && FUNCTIONS.some(f => f.family === d.family && f.text === d.text));
    cleanFunctionDefinitions(list).forEach(d => {
      if(here(d)){ present++; return; }
      if(FUNCTIONS.some(f => f.family === d.family && f.version === d.version)){ clashes.push(d); return; }
      FUNCTIONS.push(d); added++;
    });
    clashes.forEach(d => {
      if(here(d)){ present++; return; } // the same version twice in one file
      const was = d.version;
      d.version = nextFunctionVersion(d.family);
      if(!d.versionId) d.versionId = newRandomId();
      d.note = (`Imported — was v${was} in the file` + (d.note ? ': ' + d.note : '')).slice(0, FUNCTION_LIMITS.note);
      moved.push(d);
      FUNCTIONS.push(d); added++; renumbered++;
    });
    if(moved.length) FUNCTIONS.forEach(f => f.calls.forEach(c => {
      const m = c.versionId && moved.find(d => d.family === c.family && d.versionId === c.versionId);
      if(m) c.version = m.version;
    }));
    return { added, present, renumbered };
  }
  // The library as saved in the autosave.
  function restoreFunctions(list){ FUNCTIONS = cleanFunctionDefinitions(list); }

  // A model's definitions replace the open model's (a system replaces everything).
  function setModelFunctions(list){
    modelFunctions = cleanFunctionDefinitions(list);
    addMissingFunctions(modelFunctions);
    invalidateIR();
  }
  // Definitions of content added to the open model (a module, a system added to it, a
  // template): each family and version the model doesn't carry yet joins it. One it already
  // carries stays as it is — the model's nodes already use it.
  function mergeModelFunctions(list){
    const defs = cleanFunctionDefinitions(list);
    if(!defs.length) return;
    defs.forEach(d => {
      if(!modelFunctions.some(f => f.family === d.family && f.version === d.version)) modelFunctions.push(d);
    });
    addMissingFunctions(defs);
    invalidateIR();
  }
  // What a file written from `canvasList` carries: the definitions its function nodes use,
  // and every function those call (the model's own first, then the library's).
  function functionsForFile(canvasList){
    return functionsUsedBy(canvasList, modelFunctions.concat(FUNCTIONS));
  }
  // `payload` with `functions` added when the canvases use any (files without functions stay
  // as they were).
  function withFunctions(payload, canvasList){
    const list = functionsForFile(canvasList);
    if(list.length) payload.functions = list;
    return payload;
  }

  // ---------- the library: families and versions (step 7, phase D2) ----------
  // FUNCTIONS holds one entry per version, like TEMPLATES: versions of one function share a
  // `family` (a lasting random id) and are numbered 1, 2, 3…, each with its own `versionId`,
  // `note` and `description`. The family's name is its latest version's function name (read
  // from its text). "Save as new version" is the only way to add a version; the latest is
  // deleted only with its whole family, so a number is never used twice.
  function functionFamilyVersions(family){
    return FUNCTIONS.filter(f => f.family === family).sort((a, b) => b.version - a.version);
  }
  function latestFunctionOf(family){ return functionFamilyVersions(family)[0] || null; }
  function isLatestFunction(d){ return latestFunctionOf(d.family) === d; }
  function nextFunctionVersion(family){
    return FUNCTIONS.reduce((m, f) => (f.family === family ? Math.max(m, f.version) : m), 0) + 1;
  }
  // One entry per family (its latest version), in the order the families first appear.
  function functionFamilies(){
    const seen = new Set(), out = [];
    FUNCTIONS.forEach(f => { if(!seen.has(f.family)){ seen.add(f.family); out.push(latestFunctionOf(f.family)); } });
    return out;
  }
  // A definition's function name, for showing (it may be unreadable).
  function functionLabel(d){ return functionNameOf(d) || '(unreadable)'; }
  // Families whose latest version is called `name` (capitals don't matter, as in formulas).
  function functionFamiliesNamed(name){
    const k = String(name || '').trim().toLowerCase();
    return functionFamilies().filter(f => functionNameOf(f).toLowerCase() === k);
  }
  // The library entry a reference (a node's `fn`, an entry of `calls`) means: the one with
  // its versionId (a version renumbered on import keeps it), else — without a versionId —
  // the family and number. Null when the library doesn't have it.
  function libraryFunctionFor(ref){
    const r = cleanFunctionRef(ref);
    if(!r) return null;
    if(r.versionId){
      const hit = FUNCTIONS.find(f => f.family === r.family && f.versionId === r.versionId);
      if(hit) return hit;
    }
    return FUNCTIONS.find(f => f.family === r.family && f.version === r.version && (!r.versionId || !f.versionId)) || null;
  }
  // `d` and every library function it calls, directly or not (each once, callees after).
  function functionWithCallees(d){
    const out = [];
    const visit = (x) => {
      if(!x || out.includes(x)) return;
      out.push(x);
      x.calls.forEach(c => visit(libraryFunctionFor(c)));
    };
    visit(d);
    return out;
  }
  // Library functions that call `d` (any version of them).
  function functionCallersOf(d){
    return FUNCTIONS.filter(f => f !== d && f.calls.some(c => libraryFunctionFor(c) === d));
  }
  // Function nodes of the open model that use `family` (a version of it when `version` is given).
  function functionNodesUsing(family, version){
    syncActiveIntoRegistry();
    const out = [];
    canvases.forEach(c => (c.nodes || []).forEach(n => {
      if(n.type === 'function' && n.fn && n.fn.family === family && (version == null || n.fn.version === version)) out.push({ canvas: c, node: n });
    }));
    return out;
  }
  // A call the function makes to an older version than the library's latest of that family.
  function olderCallsOf(d){
    return d.calls.map(c => {
      const target = libraryFunctionFor(c);
      const latest = target && latestFunctionOf(target.family);
      return (target && latest !== target) ? { name: c.name, version: target.version, latest: latest.version } : null;
    }).filter(Boolean);
  }

  // The name each called function is written with in a parsed formula, by its lower-case key.
  function writtenCallNames(body){
    const out = Object.create(null);
    const walk = (x) => {
      if(!x || typeof x !== 'object') return;
      if(x.t === 'call' && !(x.key in out)) out[x.key] = x.name;
      if(x.a) walk(x.a);
      if(Array.isArray(x.args)) x.args.forEach(walk);
    };
    walk(body);
    return out;
  }

  // How a definition being saved pins each function it calls (decided September 2026):
  //  - one the person picked (`picks`, by lower-case name: a library entry) is used;
  //  - a new version keeps what the version it starts from pinned (while the library has it);
  //  - otherwise a name that one family has takes that family's latest version;
  //  - a name several families have must be picked ('choose'); a name no family has can't be
  //    saved ('missing').
  // Returns { calls: [{ key, name, chosen, options, state, latest }], ok }: `options` are the
  // versions the person can choose from, newest first.
  function planFunctionCalls(parsed, base, picks){
    const names = writtenCallNames(parsed.body);
    const calls = parsed.calls.map(key => {
      const name = names[key] || key;
      const pinned = base && base.calls.find(c => c.name.toLowerCase() === key);
      const pinnedEntry = pinned ? libraryFunctionFor(pinned) : null;
      const families = functionFamiliesNamed(name).map(f => f.family);
      if(pinnedEntry && !families.includes(pinnedEntry.family)) families.unshift(pinnedEntry.family);
      const options = [];
      families.forEach(fam => functionFamilyVersions(fam).forEach(v => options.push(v)));
      let chosen = picks && picks[key] && FUNCTIONS.includes(picks[key]) ? picks[key] : null;
      if(chosen && !options.includes(chosen)) options.unshift(chosen);
      if(!chosen && pinnedEntry) chosen = pinnedEntry;
      if(!chosen && families.length === 1) chosen = latestFunctionOf(families[0]);
      const state = chosen ? 'ok' : (families.length ? 'choose' : 'missing');
      return { key, name, chosen, options, state, latest: chosen ? latestFunctionOf(chosen.family) : null };
    });
    return { calls, ok: calls.every(c => c.state === 'ok') };
  }

  // What a formula typed in the editor (or given to fm.saveFunction) would save as, and what
  // stops it: { parsed, plan, draft, problem } — `problem` is { message, at?, length? } or
  // null. `base` is the version it follows (a new version) or null (a new function).
  function checkFunctionDraft(text, base, picks){
    const parsed = parseFunctionText(text);
    if(!parsed.ok) return { parsed, plan: null, draft: null, problem: parsed.error };
    if(base){
      const famName = functionNameOf(latestFunctionOf(base.family) || base);
      if(famName && parsed.name.toLowerCase() !== famName.toLowerCase()){
        return { parsed, plan: null, draft: null, problem: { message: `A new version keeps the name ${famName}. To make a function with another name, use “+ New Function”.`, at: 0, length: parsed.name.length } };
      }
    }
    const plan = planFunctionCalls(parsed, base, picks);
    const draft = { family: base ? base.family : 'draft-function', version: base ? nextFunctionVersion(base.family) : 1, versionId: 'draft-version',
      text, description: '', note: '',
      calls: plan.calls.filter(c => c.chosen).map(c => ({ name: c.name, family: c.chosen.family, version: c.chosen.version, versionId: c.chosen.versionId })) };
    const missing = plan.calls.find(c => c.state === 'missing');
    if(missing) return { parsed, plan, draft, problem: { message: `${missing.name} isn't in your library — create it first.` } };
    const choose = plan.calls.find(c => c.state === 'choose');
    if(choose) return { parsed, plan, draft, problem: { message: `More than one function in your library is called ${choose.name}: choose which one this function calls.` } };
    // The whole chain calculates: inputs counted, no loop, not too deep.
    const callees = [];
    plan.calls.forEach(c => functionWithCallees(c.chosen).forEach(x => { if(!callees.includes(x)) callees.push(x); }));
    const compiled = compileFunctions([draft].concat(callees)).resolve(draft);
    if(compiled && compiled.status){
      const wrong = plan.calls.find(c => {
        const t = compiled.targets.get(c.key);
        return t && t.params.length !== countCallArgs(parsed.body, c.key);
      });
      const message = wrong
        ? `${wrong.name} v${wrong.chosen.version} takes ${compiled.targets.get(wrong.key).params.length} input${compiled.targets.get(wrong.key).params.length === 1 ? '' : 's'}; here it is given ${countCallArgs(parsed.body, wrong.key)}.`
        : (FUNCTION_DRAFT_PROBLEMS[compiled.status] || 'This function can\'t be calculated.');
      return { parsed, plan, draft, problem: { message } };
    }
    return { parsed, plan, draft, problem: null };
  }
  const FUNCTION_DRAFT_PROBLEMS = {
    'function-missing': 'A function it calls uses another function that isn\'t in your library.',
    'function-unreadable': 'A function it calls can\'t be read.',
    'function-cycle': 'Its functions call each other in a loop.',
    'function-too-deep': `Its calls are nested more than ${FUNCTION_LIMITS.callDepth} functions deep.`,
    'function-arguments': 'A function it calls gives another function the wrong number of inputs.',
  };
  // How many inputs the first call to `key` in a parsed formula is given (-1: none).
  function countCallArgs(body, key){
    let n = -1;
    const walk = (x) => {
      if(n >= 0 || !x || typeof x !== 'object') return;
      if(x.t === 'call' && x.key === key){ n = x.args.length; return; }
      if(x.a) walk(x.a);
      if(Array.isArray(x.args)) x.args.forEach(walk);
    };
    walk(body);
    return n;
  }

  // Saves a checked draft as a new family (base null) or the next version of base's family.
  function saveFunctionDraft(check, base, description, note){
    const d = cleanFunctionDefinition({
      family: base ? base.family : newRandomId(), version: base ? nextFunctionVersion(base.family) : 1, versionId: newRandomId(),
      text: check.draft.text, description: String(description || '').trim(), note: String(note || '').trim(), calls: check.draft.calls });
    FUNCTIONS.push(d);
    saveWorkspaceSoon();
    return d;
  }

  // Deletes one version, or (for the latest) the whole family. Returns how many versions went.
  function deleteLibraryFunction(d){
    const before = FUNCTIONS.length;
    FUNCTIONS = isLatestFunction(d) ? FUNCTIONS.filter(f => f.family !== d.family) : FUNCTIONS.filter(f => f !== d);
    saveWorkspaceSoon();
    return before - FUNCTIONS.length;
  }

  // An fmIDE-functions file holding `families` (all when null): every version of each, and
  // every function those call, in the library's order.
  function functionsFilePayload(families){
    const picked = new Set();
    FUNCTIONS.forEach(f => { if(!families || families.includes(f.family)) functionWithCallees(f).forEach(x => picked.add(x)); });
    return { version: FILE_FORMATS['fmIDE-functions'].current, kind: 'fmIDE-functions',
      functions: cloneData(FUNCTIONS.filter(f => picked.has(f))) };
  }

  // A function reference as typed in fm actions and macros: "Name" (the latest version),
  // "Name@latest", "Name@3", the same with the family id, or an object { family, version }.
  function resolveFunctionRef(ref){
    if(ref && typeof ref === 'object'){
      const hit = libraryFunctionFor(ref);
      if(!hit) fail('That function version isn\'t in your library.');
      return hit;
    }
    const s = String(ref == null ? '' : ref).trim();
    if(!s) fail('Name a function, like "Margin" or "Margin@2".');
    const family = (text) => {
      if(FUNCTIONS.some(f => f.family === text)) return latestFunctionOf(text);
      const named = functionFamiliesNamed(text);
      if(named.length > 1) fail(`More than one function in your library is called "${text}" — refer to it by its family ID.`);
      return named[0] || null;
    };
    const m = /^(.*?)\s*@\s*(latest|\d+)$/i.exec(s);
    const base = family(m ? m[1] : s);
    if(!base) fail(`There is no function called "${m ? m[1] : s}" in your library.`);
    if(!m || m[2].toLowerCase() === 'latest') return base;
    const all = functionFamilyVersions(base.family);
    const v = all.find(f => f.version === Number(m[2]));
    if(!v) fail(`There is no version ${m[2]} of ${functionLabel(base)} (it has version${all.length === 1 ? '' : 's'} ${all.map(f => f.version).reverse().join(', ')}).`);
    return v;
  }
  // How a recorded macro refers to a version: by name when one family has it, else by family id.
  function functionRefText(d){
    const name = functionNameOf(d);
    const head = (name && functionFamiliesNamed(name).length === 1) ? name : d.family;
    return isLatestFunction(d) ? head : head + '@' + d.version;
  }
  // ---------- the Functions manager (step 7, phase D2) ----------
  // A window in the style of the Templates window: the library by family, each family's
  // versions and notes, and New Function / Edit as new version / Delete / Import / Export.
  // Everything shown from a definition (name, formula, description, note) is text from a
  // file: it goes in with textContent only. The buttons act through fm actions, so a macro
  // being recorded records them.

  // The editor: the whole definition in one box, read as it is typed. It shows the name and
  // inputs, a parse error at its place in the text, and how each call to another function
  // is pinned; Save stays off until the formula reads and every call is settled.
  // `base`: the version a new version starts from (null for a new function).
  function showFunctionEditor(base, onSaved){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box function-editor';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); document.removeEventListener('keydown', onKey, true); }
    function onKey(ev){
      const overlays = document.querySelectorAll('.modal-overlay');
      if(overlays[overlays.length - 1] !== overlay) return;
      if(ev.key === 'Escape'){ ev.preventDefault(); ev.stopPropagation(); close(); }
    }
    document.addEventListener('keydown', onKey, true);

    const latest = base ? latestFunctionOf(base.family) : null;
    const title = document.createElement('p');
    title.textContent = base
      ? `New version of ${functionLabel(latest || base)} (version ${nextFunctionVersion(base.family)})`
      : 'New Function';
    box.appendChild(title);

    const label = (text) => { const l = document.createElement('label'); l.className = 'fn-editor-label'; l.textContent = text; box.appendChild(l); return l; };
    label('Definition — name, inputs and formula');
    const textBox = document.createElement('textarea');
    textBox.className = 'fn-editor-text';
    textBox.rows = 4;
    textBox.spellcheck = false;
    textBox.maxLength = FUNCTION_LIMITS.text + 1;
    textBox.placeholder = 'Margin(Revenue, Cost) = (Revenue - Cost) / Revenue';
    textBox.value = base ? base.text : '';
    box.appendChild(textBox);

    const parsedLine = document.createElement('p');
    parsedLine.className = 'fn-editor-parsed';
    box.appendChild(parsedLine);
    const where = document.createElement('pre');
    where.className = 'fn-editor-where';
    box.appendChild(where);
    const errorLine = document.createElement('p');
    errorLine.className = 'fn-editor-error';
    box.appendChild(errorLine);
    const callsBox = document.createElement('div');
    callsBox.className = 'fn-editor-calls';
    box.appendChild(callsBox);

    label('Description');
    const descBox = document.createElement('textarea');
    descBox.className = 'fn-editor-description';
    descBox.rows = 2;
    descBox.maxLength = FUNCTION_LIMITS.description;
    descBox.value = base ? base.description : '';
    box.appendChild(descBox);
    label(base ? 'Change note' : 'Note (optional)');
    const noteBox = document.createElement('input');
    noteBox.type = 'text';
    noteBox.className = 'fn-editor-note';
    noteBox.maxLength = FUNCTION_LIMITS.note;
    noteBox.placeholder = 'What changed (optional)';
    box.appendChild(noteBox);

    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', close);
    const saveBtn = document.createElement('button');
    saveBtn.className = 'primary fn-editor-save';
    saveBtn.textContent = base ? `Save version ${nextFunctionVersion(base.family)}` : 'Save Function';
    actions.append(cancelBtn, saveBtn);
    box.appendChild(actions);

    const picks = Object.create(null); // the person's choices, by lower-case call name
    let check = null;

    function optionText(v){
      const bits = [`${functionLabel(v)} v${v.version}`];
      if(isLatestFunction(v)) bits.push('(latest)');
      if(v.description) bits.push('— ' + v.description.slice(0, 60));
      if(functionFamiliesNamed(functionLabel(v)).length > 1) bits.push(`[family ${v.family.slice(0, 8)}]`);
      return bits.join(' ');
    }
    function renderCalls(){
      callsBox.innerHTML = '';
      if(!check || !check.plan || !check.plan.calls.length) return;
      const head = document.createElement('div');
      head.className = 'fn-editor-label';
      head.textContent = 'Calls to other functions';
      callsBox.appendChild(head);
      check.plan.calls.forEach(c => {
        const row = document.createElement('div');
        row.className = 'fn-editor-call ' + c.state;
        row.dataset.call = c.key;
        const name = document.createElement('b');
        name.textContent = c.name;
        row.appendChild(name);
        row.appendChild(document.createTextNode(' → '));
        if(c.state === 'missing'){
          row.appendChild(document.createTextNode('not in your library'));
        } else {
          const sel = document.createElement('select');
          sel.className = 'fn-editor-call-pick';
          if(!c.chosen){
            const o = document.createElement('option');
            o.value = ''; o.textContent = 'Choose which function…';
            sel.appendChild(o);
          }
          c.options.forEach((v, i) => {
            const o = document.createElement('option');
            o.value = String(i);
            o.textContent = optionText(v);
            if(v === c.chosen) o.selected = true;
            sel.appendChild(o);
          });
          sel.addEventListener('change', () => {
            const v = c.options[Number(sel.value)];
            if(v) picks[c.key] = v;
            refresh();
          });
          row.appendChild(sel);
          if(c.chosen && c.latest && c.latest !== c.chosen){
            const hint = document.createElement('button');
            hint.type = 'button';
            hint.className = 'fn-editor-use-latest';
            hint.textContent = `Use the latest (v${c.latest.version})`;
            hint.addEventListener('click', () => { picks[c.key] = c.latest; refresh(); });
            row.appendChild(hint);
          }
        }
        callsBox.appendChild(row);
      });
    }
    function refresh(){
      check = checkFunctionDraft(textBox.value, base, picks);
      const p = check.problem;
      if(check.parsed.ok){
        const params = check.parsed.params;
        parsedLine.textContent = `${check.parsed.name} — ${params.length ? 'inputs: ' + params.join(', ') : 'no inputs'}`;
      } else parsedLine.textContent = '';
      errorLine.textContent = p ? '⚠ ' + p.message : (textBox.value.trim() ? '✓ The formula reads.' : '');
      errorLine.classList.toggle('ok', !p);
      // The place of the error, marked in a copy of the text.
      where.innerHTML = '';
      if(p && typeof p.at === 'number' && textBox.value){
        const text = textBox.value;
        const at = Math.max(0, Math.min(text.length, p.at));
        const mark = document.createElement('mark');
        mark.textContent = text.slice(at, at + (p.length || 1)) || ' ';
        where.append(document.createTextNode(text.slice(0, at)), mark, document.createTextNode(text.slice(at + (p.length || 1))));
        where.style.display = '';
      } else where.style.display = 'none';
      renderCalls();
      saveBtn.disabled = !!p || !textBox.value.trim();
    }
    textBox.addEventListener('input', refresh);

    function save(newVersionOf){
      const calls = {};
      check.plan.calls.forEach(c => { calls[c.name] = c.chosen.family + '@' + c.chosen.version; });
      const ref = guarded(() => fm.saveFunction({ text: textBox.value, description: descBox.value, note: noteBox.value,
        newVersionOf: newVersionOf || '', calls }));
      if(ref === undefined) return;
      close();
      if(onSaved) onSaved(FUNCTIONS[FUNCTIONS.length - 1]);
    }
    saveBtn.addEventListener('click', () => {
      refresh();
      if(saveBtn.disabled) return;
      if(base){ save(functionRefText(latest)); return; }
      const taken = functionFamiliesNamed(check.parsed.name)[0];
      if(!taken){ save(''); return; }
      askFunctionNameTaken(taken, () => {
        // As the family's next version: its pins and its name rule apply.
        base = taken;
        const again = checkFunctionDraft(textBox.value, base, picks);
        if(again.problem){ showMessage(again.problem.message); base = null; refresh(); return; }
        check = again;
        save(functionRefText(taken));
      }, () => textBox.focus());
    });

    refresh();
    textBox.focus();
  }

  // Saving a new function under a name one of the person's families already has: its next
  // version only when they choose it; otherwise they change the name.
  function askFunctionNameTaken(fam, onNewVersion, onRename){
    showChoice(`There is already a function called ${functionLabel(fam)} (version ${fam.version}). Save this as its next version, or change the name?`,
      [{ label: 'Change the name', run: onRename }, { label: `Save as new version of ${functionLabel(fam)}`, primary: true, run: onNewVersion }], 'function-name-taken');
  }
  // A message with a row of buttons (the last is the default); Escape runs the first.
  function showChoice(message, buttons, className){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box' + (className ? ' ' + className : '');
    const p = document.createElement('p');
    p.textContent = message;
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    function close(){ overlay.remove(); document.removeEventListener('keydown', onKey, true); }
    function onKey(ev){ if(ev.key === 'Escape'){ ev.preventDefault(); ev.stopPropagation(); close(); buttons[0].run(); } }
    const els = buttons.map(b => {
      const el = document.createElement('button');
      el.textContent = b.label;
      if(b.primary) el.className = 'primary';
      if(b.danger) el.className = 'danger';
      el.addEventListener('click', () => { close(); b.run(); });
      actions.appendChild(el);
      return el;
    });
    box.append(p, actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    document.addEventListener('keydown', onKey, true);
    els[els.length - 1].focus();
  }

  // What deleting `d` means (decided September 2026: a warning, never a refusal — the open
  // model carries its own copy, so its nodes keep calculating).
  function functionDeleteMessage(d){
    const whole = isLatestFunction(d);
    const all = functionFamilyVersions(d.family);
    const name = functionLabel(d);
    const lines = [whole
      ? `Delete the function ${name}` + (all.length > 1 ? ` and all ${all.length} of its versions` : '') + '?'
      : `Delete version ${d.version} of ${name}? The other versions stay.`];
    const uses = functionNodesUsing(d.family, whole ? null : d.version).length;
    if(uses) lines.push(`${uses} node${uses === 1 ? '' : 's'} in the open model use${uses === 1 ? 's' : ''} it. ${uses === 1 ? 'It keeps' : 'They keep'} working — the model carries its own copy — but ${uses === 1 ? 'it' : 'they'} won't be offered updates from the library.`);
    const going = whole ? all : [d];
    const callers = [];
    going.forEach(g => functionCallersOf(g).forEach(c => { if(!going.includes(c) && !callers.includes(c)) callers.push(c); }));
    if(callers.length) lines.push(`${callers.map(c => functionLabel(c) + ' v' + c.version).join(', ')} call${callers.length === 1 ? 's' : ''} it: inserting ${callers.length === 1 ? 'that' : 'those'} from the library will leave the call missing.`);
    lines.push("This can't be undone — use ⇩ Export Functions first if you might want it back.");
    return lines.join('\n\n');
  }

  // Import Functions: an fmIDE-functions file joins the library (a file from a newer fmIDE
  // asks first, through openFmFileText).
  function importFunctionsFromFile(file, onDone){
    const reader = new FileReader();
    reader.onload = () => openFmFileText(reader.result, ['fmIDE-functions'], (data) => {
      const r = guarded(() => fm.importFunctions({ file: data, allowNewer: true }));
      if(!r) return;
      const { added, present, renumbered } = r;
      if(added === 0 && present === 0) showMessage("That file didn't contain any functions fmIDE could read.");
      else if(added === 0) showMessage(`All ${present} function version${present === 1 ? ' in that file is' : 's in that file are'} already in your library.`);
      else showMessage(`Imported ${added} function version${added === 1 ? '' : 's'}` + (present ? ` (${present} ${present === 1 ? 'was' : 'were'} already there).` : '.')
        + (renumbered ? ` ${renumbered} ${renumbered === 1 ? 'was' : 'were'} added under a new version number because ${renumbered === 1 ? 'its number was' : 'their numbers were'} already taken by a different version.` : ''));
      if(onDone) onDone(added);
    });
    reader.onerror = () => showMessage('Could not read that file.');
    reader.readAsText(file);
  }
  function pickFunctionsFile(onDone){
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.style.display = 'none';
    input.className = 'function-file-input';
    document.body.appendChild(input);
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      input.remove();
      if(file) importFunctionsFromFile(file, onDone);
    });
    input.click();
  }

  function showFunctionsManager(){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box template-box function-box';
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    overlay.addEventListener('mousedown', (ev) => { if(ev.target === overlay) close(); });

    const title = document.createElement('p');
    title.textContent = 'Functions';
    box.appendChild(title);

    const topRow = document.createElement('div');
    topRow.className = 'template-import-actions';

    newBtn.textContent = '+ New Function…';
    const exportBtn = document.createElement('button');
    exportBtn.textContent = '⇩ Export Functions';
    const importBtn = document.createElement('button');
    importBtn.textContent = '⇧ Import Functions';
    topRow.append(newBtn, exportBtn, importBtn);
    box.appendChild(topRow);

    const layout = document.createElement('div');
    layout.className = 'template-layout';
    box.appendChild(layout);
    const listCol = document.createElement('div');
    listCol.className = 'template-list-col';
    layout.appendChild(listCol);
    const search = document.createElement('input');
    search.type = 'search';
    search.className = 'template-search';
    search.placeholder = 'Search functions…';
    search.setAttribute('autocomplete', 'off');
    search.spellcheck = false;
    listCol.appendChild(search);
    const list = document.createElement('div');
    list.className = 'template-list function-list';
    listCol.appendChild(list);
    const detail = document.createElement('div');
    detail.className = 'template-detail function-detail';
    layout.appendChild(detail);

    let selected = functionFamilies()[0] || null;
    let shown = [];
    const expanded = new Set();
    const reselect = (d) => { selected = d || (selected && FUNCTIONS.includes(selected) ? selected : (selected && latestFunctionOf(selected.family))) || functionFamilies()[0] || null; renderList(); renderDetail(); };

    newBtn.addEventListener('click', () => showFunctionEditor(null, reselect));
    exportBtn.addEventListener('click', exportFunctionsInteractive);
    importBtn.addEventListener('click', () => pickFunctionsFile(() => reselect()));

    const para = (cls, text) => { const p = document.createElement('p'); p.className = cls; p.textContent = text; detail.appendChild(p); return p; };
    function renderDetail(){
      detail.innerHTML = '';
      if(!selected){ para('template-desc', 'No function selected.'); return; }
      const d = selected;
      const h = document.createElement('h4');
      h.textContent = functionLabel(d);
      detail.appendChild(h);
      const all = functionFamilyVersions(d.family);
      const ver = para('template-version-info', '');
      const verLabel = document.createElement('b');
      verLabel.textContent = `Version ${d.version}` + (all.length > 1 ? ` of ${all[0].version}` : '');
      ver.appendChild(verLabel);
      if(!isLatestFunction(d)) ver.appendChild(document.createTextNode(' (an older version)'));
      if(d.note){ const n = document.createElement('span'); n.className = 'template-note'; n.textContent = ' — ' + d.note; ver.appendChild(n); }
      para('template-desc', d.description || '(no description)');
      const pre = document.createElement('pre');
      pre.className = 'function-detail-text';
      pre.textContent = d.text;
      detail.appendChild(pre);
      const parsed = parseFunctionText(d.text);
      if(parsed.ok) para('function-detail-inputs', parsed.params.length ? 'Inputs: ' + parsed.params.join(', ') : 'No inputs');
      else para('function-detail-problem', "⚠ This formula can't be read: " + parsed.error.message);
      d.calls.forEach(c => {
        const target = libraryFunctionFor(c);
        const latest = target && latestFunctionOf(target.family);
        para('function-detail-call' + (target ? '' : ' missing') + (target && latest !== target ? ' older' : ''),
          `Calls ${c.name} v${target ? target.version : c.version}` + (!target ? ' — not in your library' : (latest !== target ? ` (the latest is v${latest.version}: save a new version to use it)` : '')));
      });
      const uses = functionNodesUsing(d.family, d.version).length;
      if(uses) para('function-detail-uses', `Used by ${uses} node${uses === 1 ? '' : 's'} in the open model.`);

      const actionsRow = document.createElement('div');
      actionsRow.className = 'template-import-actions';
      const versionBtn = document.createElement('button');
      versionBtn.className = 'function-new-version';
      versionBtn.textContent = 'Edit as new version…';
      versionBtn.title = `Starts from version ${d.version}; saves version ${nextFunctionVersion(d.family)}`;
      versionBtn.addEventListener('click', () => showFunctionEditor(d, reselect));
      const infoBtn = document.createElement('button');
      infoBtn.className = 'function-edit-info';
      infoBtn.textContent = '✎ Edit description';
      infoBtn.addEventListener('click', () => editFunctionInfo(d, () => reselect(d)));
      const delBtn = document.createElement('button');
      delBtn.className = 'function-delete';
      delBtn.textContent = !isLatestFunction(d) ? `🗑 Delete version ${d.version}` : (all.length > 1 ? `🗑 Delete (all ${all.length} versions)` : '🗑 Delete');
      if(isLatestFunction(d) && all.length > 1) delBtn.title = 'The latest version can only be deleted with the whole function, so its number is never used again. Older versions can be deleted one by one.';
      delBtn.addEventListener('click', () => showConfirm(functionDeleteMessage(d), () => {
        const family = d.family;
        if(guarded(() => fm.deleteFunction({ function: functionRefText(d), whole: isLatestFunction(d) })) === undefined) return;
        reselect(latestFunctionOf(family));
      }));
      actionsRow.append(versionBtn, infoBtn, delBtn);
      detail.appendChild(actionsRow);
    }

    function entryButton(d, idx){
      const b = document.createElement('button');
      b.className = 'template-family function-family' + (selected === d ? ' active' : '');
      const name = functionLabel(d);
      b.appendChild(idx ? highlightLabel(name, idx) : document.createTextNode(name));
      b.appendChild(document.createElement('br'));
      const v = document.createElement('span');
      v.className = 'template-version-tag';
      v.textContent = 'v' + d.version;
      b.appendChild(v);
      // Two families of one name (from imports) are told apart by their family ids.
      if(functionFamiliesNamed(name).length > 1){
        const t = document.createElement('span');
        t.className = 'function-family-id';
        t.textContent = 'family ' + d.family.slice(0, 8);
        t.title = d.description || '';
        b.appendChild(t);
      }
      if(functionNodesUsing(d.family).length){
        const t = document.createElement('span');
        t.className = 'function-in-model-tag';
        t.textContent = 'in this model';
        b.appendChild(t);
      }
      if(olderCallsOf(d).length){
        const t = document.createElement('span');
        t.className = 'function-older-calls-tag';
        t.textContent = '⚠ calls an older version';
        t.title = olderCallsOf(d).map(c => `${c.name} v${c.version} (latest v${c.latest})`).join(', ');
        b.appendChild(t);
      }
      b.addEventListener('click', () => { selected = d; renderList(); renderDetail(); });
      list.appendChild(b);
      shown.push(d);
      const older = functionFamilyVersions(d.family).slice(1);
      if(!older.length) return;
      const open = expanded.has(d.family) || (selected && selected.family === d.family && selected !== d);
      const toggle = document.createElement('button');
      toggle.className = 'template-versions-toggle';
      toggle.textContent = (open ? '▾ ' : '▸ ') + older.length + ' older version' + (older.length === 1 ? '' : 's');
      toggle.setAttribute('aria-expanded', String(open));
      toggle.addEventListener('click', () => {
        if(open){ expanded.delete(d.family); if(selected && selected.family === d.family) selected = d; }
        else expanded.add(d.family);
        renderList(); renderDetail();
      });
      list.appendChild(toggle);
      if(!open) return;
      older.forEach(o => {
        const ob = document.createElement('button');
        ob.className = 'template-version' + (selected === o ? ' active' : '');
        const l = document.createElement('b');
        l.textContent = 'v' + o.version;
        ob.appendChild(l);
        if(o.note) ob.appendChild(document.createTextNode(' — ' + o.note));
        ob.addEventListener('click', () => { selected = o; expanded.add(d.family); renderList(); renderDetail(); });
        list.appendChild(ob);
        shown.push(o);
      });
    }
    function renderList(){
      list.innerHTML = '';
      shown = [];
      const families = functionFamilies();
      if(!families.length){
        const empty = document.createElement('p');
        empty.className = 'template-desc';
        empty.textContent = 'No functions yet — use "+ New Function…" above, or import some.';
        list.appendChild(empty);
        return;
      }
      const q = search.value.trim();
      if(!q){ families.forEach(d => entryButton(d, null)); return; }
      const hits = families.map(d => {
        const onName = fuzzyMatch(q, functionLabel(d));
        if(onName) return { d, score: onName.score + 500, idx: onName.idx };
        const other = fuzzyMatch(q, d.description || '');
        return other ? { d, score: other.score, idx: [] } : null;
      }).filter(Boolean).sort((a, b) => b.score - a.score);
      if(!hits.length){
        const none = document.createElement('p');
        none.className = 'template-desc';
        none.textContent = 'No matching functions';
        list.appendChild(none);
        return;
      }
      hits.forEach(h => entryButton(h.d, h.idx));
    }
    search.addEventListener('input', () => {
      renderList();
      if(search.value.trim() && shown.length && shown[0] !== selected){ selected = shown[0]; renderList(); renderDetail(); }
    });
    function onKey(ev){
      const overlays = document.querySelectorAll('.modal-overlay');
      if(overlays[overlays.length - 1] !== overlay) return;
      if(ev.key === 'Escape'){ ev.preventDefault(); ev.stopPropagation(); close(); return; }
      if(document.activeElement !== search && !list.contains(document.activeElement)) return;
      if(ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
        ev.preventDefault();
        if(!shown.length) return;
        const i = shown.indexOf(selected);
        selected = shown[Math.max(0, Math.min(shown.length - 1, i < 0 ? 0 : i + (ev.key === 'ArrowDown' ? 1 : -1)))];
        renderList(); renderDetail();
        search.focus();
      }
    }
    document.addEventListener('keydown', onKey, true);

    renderList();
    renderDetail();
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const closeBtn = document.createElement('button');
    closeBtn.textContent = 'Close';
    closeBtn.addEventListener('click', close);
    actions.appendChild(closeBtn);
    box.appendChild(actions);
    search.focus();
  }

  // Description and note of one version (library only; neither changes the calculation).

  // ---------- keyboard shortcuts settings ----------
  function exportShortcutsToFile(){
    const payload = { version: 2, kind: 'fmIDE-shortcuts', bindings: {} };
    COMMANDS.forEach(c => { payload.bindings[c.id] = shortcutBindings[c.id] || null; });
    downloadJSON(payload, `fmIDE-shortcuts-${timestamp()}.json`);
  }

  function importShortcutsFromFile(file, onDone){
    const reader = new FileReader();
    reader.onload = () => {
      openFmFileText(reader.result, ['fmIDE-shortcuts'], (data) => {
      if(typeof data.bindings !== 'object' || data.bindings === null){
        showMessage('That shortcuts file has no "bindings".');
        return;
      }
      let count = 0;
      const legacy = false; // readFmFile already converted older combo notation
      Object.keys(data.bindings).forEach(cmdId => {
        if(COMMANDS.some(c => c.id === cmdId)){
          shortcutBindings[cmdId] = canonicalCombo(data.bindings[cmdId], legacy);
          count++;
        }
      });
      dedupeBindings();
      rebuildShortcutMap();
      onDone(count);
      });
    };
    reader.onerror = () => showMessage('Could not read that file.');
    reader.readAsText(file);

  function showShortcutsPicker(){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box shortcuts-box';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); renderRibbon(); saveWorkspaceSoon(); }
    overlay.addEventListener('mousedown', (ev) => { if(ev.target === overlay) close(); });

    const title = document.createElement('p');
    title.textContent = 'Keyboard Shortcuts';
    box.appendChild(title);

    const search = document.createElement('input');
    search.type = 'text';
    search.className = 'shortcuts-search';
    search.placeholder = 'Search commands…';
    box.appendChild(search);

    const conflictNote = document.createElement('div');
    conflictNote.className = 'shortcut-conflict-note';
    conflictNote.style.display = 'none';
    box.appendChild(conflictNote);

    const list = document.createElement('div');
    list.className = 'shortcuts-list';
    box.appendChild(list);

    function renderList(){
      const q = search.value.trim().toLowerCase();
      list.innerHTML = '';
      const byCategory = {};
      COMMANDS.forEach(c => {
        if(q && !c.label.toLowerCase().includes(q) && !c.category.toLowerCase().includes(q)) return;
        (byCategory[c.category] = byCategory[c.category] || []).push(c);
      });
      const catOrder = CATEGORY_ORDER;
      const cats = Object.keys(byCategory).sort((a,b) => catOrder.indexOf(a) - catOrder.indexOf(b));
      if(cats.length === 0){
        const empty = document.createElement('p');
        empty.className = 'template-desc';
        empty.textContent = 'No commands match your search.';
        list.appendChild(empty);
        return;
      }
      cats.forEach(cat => {
        const header = document.createElement('div');
        header.className = 'shortcut-cat-header';
        header.textContent = cat;
        list.appendChild(header);
        byCategory[cat].forEach(c => {
          const row = document.createElement('div');
          row.className = 'shortcut-row';

          const label = document.createElement('span');
          label.className = 'cmd-label';
          label.textContent = c.label;
          row.appendChild(label);

          const badge = document.createElement('span');
          const combo = shortcutBindings[c.id];
          badge.className = 'kbd-badge' + (combo ? '' : ' unbound');
          badge.textContent = combo ? prettyCombo(combo) : 'Unassigned';
          if(combo) badge.title = combo;
          row.appendChild(badge);

          const changeBtn = document.createElement('button');
          changeBtn.textContent = 'Change';
          changeBtn.addEventListener('click', () => {
            badge.textContent = 'Press a key…';
            badge.className = 'kbd-badge listening';
            changeBtn.disabled = true;
            conflictNote.style.display = 'none';

            function onKey(ev){
              ev.preventDefault();
              ev.stopImmediatePropagation();
              if(ev.key === 'Escape'){
                document.removeEventListener('keydown', onKey, true);
                renderList();
                return;
              }
              const newCombo = normalizeCombo(ev);
              if(!newCombo) return; // pure modifier press, keep listening
              document.removeEventListener('keydown', onKey, true);
              const conflictId = shortcutMap[newCombo];
              const notes = [];
              if(conflictId && conflictId !== c.id){
                const conflictCmd = COMMANDS.find(x => x.id === conflictId);
                shortcutBindings[conflictId] = null;
                notes.push(`"${prettyCombo(newCombo)}" was previously assigned to "${conflictCmd ? conflictCmd.label : conflictId}" — that binding has been cleared.`);
              }
              const reserved = comboReservedNote(newCombo);
              if(reserved) notes.push(reserved);
              if(keytipTrigger.type === 'combo' && keytipTrigger.combo === newCombo) notes.push(`${prettyCombo(newCombo)} also opens KeyTips; KeyTips take priority.`);
              if(notes.length){ conflictNote.textContent = notes.join(' '); conflictNote.style.display = 'block'; }
              shortcutBindings[c.id] = newCombo;
              rebuildShortcutMap();
              renderList();
            }
            document.addEventListener('keydown', onKey, true);
          });

    }

    search.addEventListener('input', renderList);
    renderList();

    const ioRow = document.createElement('div');
    ioRow.className = 'template-import-actions';
    ioRow.style.marginBottom = '10px';

  function startConnection(fromId, downEvent, fromPortIndex){
    downEvent.preventDefault();
    downEvent.stopPropagation();
    document.body.classList.add('dragging');

    const temp = document.createElementNS(SVGNS,'path');
    temp.setAttribute('class','temp');
    svg.appendChild(temp);

    const canvasRect = canvas.getBoundingClientRect();
    function toCanvasCoords(ev){ return { x: ev.clientX - canvasRect.left, y: ev.clientY - canvasRect.top }; }

    function onMove(ev){
      const a = getNode(fromId);
      const pt = toCanvasCoords(ev);
      const p1 = fromPortIndex != null
        ? (getPortCanvasPos(fromId, fromPortIndex, 'out') || borderPoint(rectOf(a), pt.x, pt.y))
        : borderPoint(rectOf(a), pt.x, pt.y);
      temp.setAttribute('d', `M ${p1.x} ${p1.y} L ${pt.x} ${pt.y}`);
    }
    function onUp(ev){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('dragging');
      temp.remove();

      const target = document.elementFromPoint(ev.clientX, ev.clientY);
      const targetPortEl = target ? target.closest('.io-port') : null;
      const targetNodeEl = target ? target.closest('.node') : null;
      if(!targetNodeEl || targetNodeEl.dataset.id === fromId){ render(); return; }
      const toId = targetNodeEl.dataset.id;
      const toNode = getNode(toId);

      let toPort = null;
      if(targetPortEl && targetPortEl.dataset.portDir === 'in'){
        toPort = parseInt(targetPortEl.dataset.portIndex, 10);
      } else if(toNode && toNode.type === 'blockInstance'){
        // block instances require dropping precisely on one of their input dots
        render();
        return;
      }

      guarded(() => {
        const edgeId = fm.connect(fromId, toId, fromPortIndex != null ? String(fromPortIndex + 1) : '', toPort !== null ? String(toPort + 1) : '');
        if(edgeId) selectEdgeOnly(edgeId); else render();
      });
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }


  // =====================================================================================
  // ---------- automation layer: transactions · node references · the fm API ----------
  // =====================================================================================
  // Every model-changing interaction in fmIDE is an *action* in ACTIONS below: mouse and
  // keyboard handlers, Ribbon/QAT buttons, the Command Launcher and macros all call the
  // same action through callAction(). An action runs inside a transaction, so it is one
  // undo step and renders once; a macro run is one bigger transaction that rolls back
  // completely if any step fails. The public surface is `window.fm` (fm.createRect(...),
  // fm.connect(...), ...), which is also what the Macro Builder's steps call.

  const tx = { depth: 0, pushed: false, needEval: false };
  let apiDepth = 0;        // >0 while an action is running (nested calls are not recorded)
  let runCtx = null;       // { vars, startSelection, origin, macro } while a macro runs
  let macroDepth = 0;
  const NOOP = { __noop: true };
  const REDUCERS = ['sum', 'max', 'min', 'ave', 'product'];

  class FmError extends Error { constructor(msg){ super(msg); this.name = 'FmError'; } }
  function fail(msg){ throw new FmError(msg); }

  function reportError(err){
    if(err instanceof FmError) showMessage(err.message);
    else { console.error(err); showMessage('Something went wrong: ' + (err && err.message ? err.message : String(err))); }
  }
  function guarded(fn){ try{ return fn(); }catch(err){ reportError(err); return undefined; } }

  let toastTimer = null;
  function toast(msg, ms){
    let el = document.getElementById('fmToast');
    if(!el){ el = document.createElement('div'); el.id = 'fmToast'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.style.opacity = '0'; }, ms || 2200);
  }

  // One transaction: history is pushed at most once, rendering/evaluation happen at the end.
  function inTx(fn){
    tx.depth++;
    try{ return fn(); }
    finally{
      tx.depth--;
      if(tx.depth === 0){
        tx.pushed = false;
        const needEval = tx.needEval;
        tx.needEval = false;
        if(needEval) evaluateAllNow(); else render();
        renderCanvasTabs();
        refreshCommandStates();
      }
    }
  }

  // All-or-nothing transaction: on error everything the batch changed is rolled back.
  function runBatch(fn){
    if(tx.depth > 0) return fn();
    const before = snapshot();
    const histLen = history.length;
    const futureBefore = future.slice();
    const selBefore = Array.from(selectedNodeIds);
    const edgeSelBefore = selectedEdgeId;
    try{
      return inTx(fn);
    }catch(err){
      history.length = histLen;
      future = futureBefore;
      restore(before);
      selectedNodeIds = new Set(selBefore.filter(id => nodes.some(n => n.id === id)));
      selectedEdgeId = edges.some(e => e.id === edgeSelBefore) ? edgeSelBefore : null;
      render(); renderCanvasTabs(); refreshCommandStates();
      throw err;
    }
  }

  // ---------- node / canvas references ----------
  // A reference is how an action argument names something:
  //   Revenue          a rectangle by its name (1st line); aliases/blocks by the name they show
  //   #n12             a node by id           @sel / @sel[0]   the selection (in a macro: as it was when the macro started)
  //   @cur / @cur[0]   the live selection     @all             every node on the canvas
  //   $r1 / $r1[0]     a macro variable (e.g. the id a Create step returned)
  //   Canvas::Name     a rectangle on another canvas (alias sources)
  //   A, B, C          several references (for "nodes" arguments)
  function activeCanvas(){ return canvases.find(c => c.id === activeCanvasId); }
  function nodesIn(c){ return c.id === activeCanvasId ? nodes : c.nodes; }
  function canvasOfNode(n){ return canvases.find(c => nodesIn(c).includes(n)) || null; }

  function refNameOf(n){
    if(!n) return '';
    if(n.type === 'value') return (parseNode(n).name || '').trim();
    if(n.type === 'alias'){
      const sc = canvases.find(c => c.id === n.sourceCanvasId);
      const sn = sc ? nodesIn(sc).find(x => x.id === n.sourceNodeId) : null;
      return sn ? (parseNode(sn).name || '').trim() : '';
    }
    if(n.type === 'blockInstance'){
      const d = canvases.find(c => c.id === n.blockDefCanvasId);
      return d ? d.name.trim() : '';
    }
    return '';
  }
  function describeNode(n){
    const nm = refNameOf(n);
    if(n.type === 'operator') return `operator ${n.text}`;
    if(n.type === 'function') return `function ${n.fn && typeof n.fn.name === 'string' ? n.fn.name : '(unnamed)'}`;
    if(n.type === 'periodShift') return `period shift ${shiftLabel(typeof n.shift === 'number' ? n.shift : -1)}`;
    return nm ? `"${nm}"` : `#${n.id}`;
  }

  function lookupVar(token){
    const m = /^\$([A-Za-z_]\w*)(?:\[(\d+)\])?$/.exec(String(token).trim());
    if(!m) fail(`"${token}" is not a valid variable reference.`);
    const name = m[1];
    const vars = runCtx ? runCtx.vars : {};
    let v;
    if(Object.prototype.hasOwnProperty.call(vars, name)) v = vars[name];
    else if(name === 'periods') v = periods.length;
    else if(name === 'period') v = currentPeriod + 1;
    else fail(`Variable $${name} has no value yet.`);
    if(m[2] !== undefined){
      if(!Array.isArray(v)) fail(`$${name} is not a list, so $${name}[${m[2]}] is not valid.`);
      v = v[+m[2]];
      if(v === undefined) fail(`$${name} has no item [${m[2]}].`);
    }
    return v;
  }

  function isPlainRefName(s){ return !!s && !/^[@$#]/.test(s) && !s.includes(',') && !s.includes('::') && !/^n\d+$/.test(s); }

  function findNodeByName(name, c){
    const lc = name.trim().toLowerCase();
    const pool = nodesIn(c);
    const vals = pool.filter(n => n.type === 'value' && (parseNode(n).name || '').trim().toLowerCase() === lc);
    if(vals.length === 1) return vals[0];
    if(vals.length > 1) fail(`${vals.length} rectangles on "${c.name}" are named "${name}" — rename one, or refer to it by id (#id).`);
    const others = pool.filter(n => (n.type === 'alias' || n.type === 'blockInstance') && refNameOf(n).toLowerCase() === lc);
    if(others.length === 1) return others[0];
    if(others.length > 1) fail(`${others.length} nodes on "${c.name}" are called "${name}" — refer to one by id (#id).`);
    fail(`There is no rectangle named "${name}" on canvas "${c.name}".`);
  }

  function selectionIds(kind){
    if(kind === 'cur' || !runCtx) return Array.from(selectedNodeIds);
    return runCtx.startSelection;
  }

  function resolveNodes(ref, c){
    c = c || activeCanvas();
    if(ref === undefined || ref === null || ref === '') return [];
    if(Array.isArray(ref)) return ref.flatMap(r => resolveNodes(r, c));
    if(typeof ref === 'object'){
      if(ref.id && canvasOfNode(ref)) return [ref];
      fail('Unknown node.');
    }
    const s = String(ref).trim();
    if(s === '') return [];
    if(s.includes(',')) return s.split(',').map(x => x.trim()).filter(Boolean).flatMap(x => resolveNodes(x, c));
    if(s.includes('::')){
      const k = s.indexOf('::');
      return resolveNodes(s.slice(k + 2), resolveCanvasRef(s.slice(0, k)));
    }
    const pool = nodesIn(c);
    let m = /^@(sel|cur)(?:\[(\d+)\])?$/.exec(s);
    if(m){
      const ids = selectionIds(m[1]);
      const list = ids.map(id => pool.find(n => n.id === id)).filter(Boolean);
      if(m[2] === undefined) return list;
      const one = list[+m[2]];
      if(!one) fail(`The selection has no item [${m[2]}] (it has ${list.length}).`);
      return [one];
    }
    if(s === '@all') return pool.slice();
    if(s.startsWith('$')){
      const v = lookupVar(s);
      const list = Array.isArray(v) ? v : [v];
      return list.map(id => {
        const n = pool.find(x => x.id === id);
        if(!n) fail(`${s} does not refer to a node on canvas "${c.name}".`);
        return n;
      });
    }
    if(s.startsWith('#')){
      const n = pool.find(x => x.id === s.slice(1));
      if(!n) fail(`There is no node ${s} on canvas "${c.name}".`);
      return [n];
    }
    if(/^n\d+$/.test(s)){
      const n = pool.find(x => x.id === s);
      if(n) return [n];
    }
    return [findNodeByName(s, c)];
  }

  function resolveOneNode(ref, c){
    const list = resolveNodes(ref, c);
    if(list.length === 1) return list[0];
    if(list.length === 0) fail(ref === '' || ref == null ? 'No node was given.' : `Nothing matched "${ref}".`);
    fail(`Expected one node, but "${Array.isArray(ref) ? ref.join(', ') : ref}" matched ${list.length}.`);
  }

  function resolveCanvasRef(ref){
    if(ref && typeof ref === 'object' && Array.isArray(ref.nodes)) return ref;
    if(ref === undefined || ref === null || ref === '' || ref === '@current') return activeCanvas();
    let s = String(ref).trim();
    if(s.startsWith('$')) s = String(lookupVar(s));
    const id = s.startsWith('#') ? s.slice(1) : s;
    const byId = canvases.find(c => c.id === id);
    if(byId) return byId;
    const lc = s.toLowerCase();
    const byName = canvases.filter(c => c.name.trim().toLowerCase() === lc);
    if(byName.length === 1) return byName[0];
    if(byName.length > 1) fail(`More than one canvas is named "${s}" — refer to it by id (#id).`);
    fail(`There is no canvas called "${s}".`);
  }

  // A template reference: "#usrN" (that exact entry), or a family — its name or its family
  // id — optionally followed by "@latest" or "@<version>". No "@…" means the latest version.
  function resolveTemplateRef(ref){
    if(ref && typeof ref === 'object' && ref.data) return ref;
    const s = String(ref || '').trim();
    const byId = TEMPLATES.find(t => t.id === s || '#' + t.id === s);
    if(byId) return byId;
    const family = (text) => {
      if(TEMPLATES.some(t => t.family === text)) return latestOfFamily(text);
      const named = familiesNamed(text);
      if(named.length > 1) fail(`More than one template family is named "${text}" — refer to it by its family ID.`);
      return named[0] || null;
    };
    const m = /^(.*?)\s*@\s*(latest|\d+)$/i.exec(s);
    const base = m && m[1] ? family(m[1]) : null;
    if(!base){
      const whole = family(s);            // a name that itself ends in "@…"
      if(whole) return whole;
      fail(`There is no template called "${m && m[1] ? m[1] : s}".`);
    }
    if(m[2].toLowerCase() === 'latest') return base;
    const n = Number(m[2]);
    const all = familyVersions(base.family);
    const v = all.find(t => t.version === n);
    if(!v) fail(`There is no version ${n} of "${base.name}" (it has version${all.length === 1 ? '' : 's'} ${all.map(t => t.version).reverse().join(', ')}).`);
    return v;
  }

  // How to refer to a template in a recorded macro: its name when that names one family
  // (else its family id), with "@N" for an older version — the latest follows updates.
  function templateRefText(t){
    const byName = familiesNamed(t.name).length === 1 && !/@\s*(latest|\d+)$/i.test(t.name);
    if(isLatestVersion(t)) return byName ? t.name : t.family + '@latest';
    return (byName ? t.name : t.family) + '@' + t.version;
  }

  function resolveMacroRef(ref){
    if(ref && typeof ref === 'object' && Array.isArray(ref.steps)) return ref;
    const s = String(ref || '').trim();
    const byId = MACROS.find(m => m.id === s || '#' + m.id === s);
    if(byId) return byId;
    const byName = MACROS.filter(m => m.name.trim().toLowerCase() === s.toLowerCase());
    if(byName.length === 1) return byName[0];
    if(byName.length > 1) fail(`More than one macro is named "${s}".`);
    fail(`There is no macro called "${s}".`);
  }

  // ---------- small expression language for numeric arguments ----------
  // Numbers, + - * / % ( ), $variables, and min/max/round/floor/ceil/abs(...).
  function evalExpr(src){
    let i = 0;
    const s = String(src);
    function ws(){ while(i < s.length && /\s/.test(s[i])) i++; }
    function expr(){
      let v = term();
      for(;;){ ws(); const c = s[i]; if(c === '+'){ i++; v += term(); } else if(c === '-'){ i++; v -= term(); } else return v; }
    }
    function term(){
      let v = factor();
      for(;;){
        ws(); const c = s[i];
        if(c === '*'){ i++; v *= factor(); }
        else if(c === '/'){ i++; v /= factor(); }
        else if(c === '%'){ i++; v %= factor(); }
        else return v;
      }
    }
    function factor(){
      ws();
      const c = s[i];
      if(c === '-'){ i++; return -factor(); }
      if(c === '+'){ i++; return factor(); }
      if(c === '('){ i++; const v = expr(); ws(); if(s[i] !== ')') fail(`Missing ")" in "${s}".`); i++; return v; }
      if(c === '$'){
        const m = /^\$[A-Za-z_]\w*(\[\d+\])?/.exec(s.slice(i));
        if(!m) fail(`Bad variable in "${s}".`);
        i += m[0].length;
        const v = lookupVar(m[0]);
        const num = typeof v === 'number' ? v : Number(v);
        if(!isFinite(num)) fail(`${m[0]} is not a number (it is "${v}").`);
        return num;
      }
      let m = /^(\d+\.?\d*|\.\d+)(e[-+]?\d+)?/i.exec(s.slice(i));
      if(m){ i += m[0].length; return Number(m[0]); }
      m = /^(min|max|round|floor|ceil|abs)\s*\(/i.exec(s.slice(i));
      if(m){
        i += m[0].length;
        const args = [expr()];
        ws();
        while(s[i] === ','){ i++; args.push(expr()); ws(); }
        if(s[i] !== ')') fail(`Missing ")" in "${s}".`);
        i++;
        return Math[m[1].toLowerCase()](...args);
      }
      fail(`Could not read the number or expression "${s}".`);
    }
    const v = expr();
    ws();
    if(i < s.length) fail(`Unexpected "${s.slice(i)}" in "${s}".`);
    return v;
  }
  function evalNumber(v, label){
    if(typeof v === 'number'){ if(!isFinite(v)) fail(`${label} is not a finite number.`); return v; }
    if(typeof v === 'boolean') return v ? 1 : 0;
    const s = String(v).trim();
    if(s === '') fail(`${label} is empty.`);
    const n = /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s) ? Number(s) : evalExpr(s);
    if(!isFinite(n)) fail(`${label} is not a finite number.`);
    return n;
  }
  // "${var}" / "${expr}" inside text arguments
  function interpolate(str){
    if(typeof str !== 'string' || !str.includes('${')) return str;
    return str.replace(/\$\{([^}]+)\}/g, (all, inner) => {
      const t = inner.trim();
      if(/^[A-Za-z_]\w*(\[\d+\])?$/.test(t)){
        const v = lookupVar('$' + t);
        return typeof v === 'number' ? formatNum(v) : String(v);
      }
      return formatNum(evalExpr(t.replace(/\b([A-Za-z_]\w*)\b(?!\s*\()/g, '$$$1')));
    });
  }
  function toBool(v){
    if(typeof v === 'boolean') return v;
    const s = String(v).trim().toLowerCase();
    if(['true','yes','y','1','on'].includes(s)) return true;
    if(['false','no','n','0','off',''].includes(s)) return false;
    fail(`"${v}" is not true/false.`);
  }

  // ---------- rectangle text helpers (Name / Value / UOM lines) ----------
  function textParts(n){
    const lines = (n.text || '').split('\n');
    if(lines.length === 1){
      const t = lines[0].trim();
      if(t !== '' && !isNaN(Number(t))) return { name:'', value:t, uom:'' };
      return { name: lines[0], value:'', uom:'' };
    }
    return { name: lines[0], value: (lines[1] || '').trim(), uom: lines.slice(2).join(' ').trim() };
  }
  function composeText(p){
    const l = [p.name == null ? '' : String(p.name), p.value == null ? '' : String(p.value).trim(), p.uom == null ? '' : String(p.uom).trim()];
    while(l.length > 1 && l[l.length - 1] === '') l.pop();
    const t = l.join('\n');
    return t.trim() === '' ? 'Untitled' : t;
  }

  // ---------- action registry ----------
  const ACTIONS = {};
  const ACTION_LIST = [];
  const STRINGY = new Set(['string', 'text', 'numstr']);
  const ACTION_CATEGORY_ORDER = ['Insert', 'Connect', 'Edit', 'Format', 'Arrange', 'Select', 'Canvas', 'Periods', 'Compute', 'File', 'Macros'];
  function P(name, type, extra){ return Object.assign({ name, type, label: name }, extra || {}); }
  const PX = P('x', 'number', { coord:'x', def: () => spawnPoint().x, help:'canvas x (px)' });
  const PY = P('y', 'number', { coord:'y', def: () => spawnPoint().y, help:'canvas y (px)' });
  const SEL_NODES = (help) => P('nodes', 'nodes', { def:'@sel', help: help || 'default: the selection' });

  function defineAction(def){
    def.params = def.params || [];
    def.category = def.category || 'Edit';
    if(def.mutates === undefined) def.mutates = true;
    ACTIONS[def.name] = def;
    ACTION_LIST.push(def);
  }

  function paramOptions(p){ return typeof p.options === 'function' ? p.options() : (p.options || []); }

  function coerceParam(p, v, out, fromDefault){
    switch(p.type){
      case 'number': case 'int': {
        let n = evalNumber(v, p.label);
        if(p.type === 'int') n = Math.round(n);
        if(p.coord && runCtx && runCtx.origin && !fromDefault) n += runCtx.origin[p.coord];
        if(p.min !== undefined && n < p.min) fail(`${p.label} must be at least ${p.min}.`);
        return n;
      }
      case 'string': case 'text': return interpolate(v == null ? '' : String(v));
      case 'numstr': {
        // a rectangle's value line: blank, a number, or an expression (100 * $i)
        if(typeof v === 'number') return formatNum(v);
        const s = interpolate(String(v == null ? '' : v)).trim();
        if(s === '' || /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return s;
        return formatNum(evalNumber(s, p.label));
      }
      case 'bool': return toBool(v);
      case 'enum': {
        const opts = paramOptions(p);
        const s = String(v).trim();
        const hit = opts.find(o => String(o).toLowerCase() === s.toLowerCase());
        if(hit === undefined) fail(`${p.label} must be one of: ${opts.join(', ')} (got "${s}").`);
        return hit;
      }
      case 'json': {
        if(v === null || v === '') return null;
        if(typeof v === 'object') return v;
        try{ return JSON.parse(v); }catch(err){ fail(`${p.label} is not valid JSON.`); }
        return null;
      }
      case 'canvas': return resolveCanvasRef(v);
      case 'template': return resolveTemplateRef(v);
      case 'macro': return resolveMacroRef(v);
      case 'node': return resolveOneNode(v, p.inCanvas && out[p.inCanvas] ? out[p.inCanvas] : undefined);
      case 'nodes': return resolveNodes(v, p.inCanvas && out[p.inCanvas] ? out[p.inCanvas] : undefined);
      default: return v;
    }
  }

  function prepareArgs(def, raw){
    if(Array.isArray(raw)){
      const o = {};
      def.params.forEach((p, i) => { if(i < raw.length) o[p.name] = raw[i]; });
      raw = o;
    }
    raw = raw || {};
    const out = {};
    const isNodeType = p => p.type === 'node' || p.type === 'nodes';
    // node references are resolved last, since they may depend on a canvas argument
    [false, true].forEach(nodePass => {
      def.params.forEach(p => {
        if(isNodeType(p) !== nodePass) return;
        let v = raw[p.name];
        const missing = v === undefined || v === null || (v === '' && !STRINGY.has(p.type));
        if(missing){
          if(p.def !== undefined){
            v = typeof p.def === 'function' ? p.def(out) : p.def;
          } else if(p.optional){
            out[p.name] = p.type === 'nodes' ? [] : null;
            return;
          } else {
            fail(`${def.label}: "${p.label}" is required.`);
          }
        }
        out[p.name] = coerceParam(p, v, out, missing);
      });
    });
    return out;
  }

  // The single entry point for running an action (API, UI, launcher, macros).
  function callAction(name, rawArgs){
    const def = ACTIONS[name];
    if(!def) fail(`Unknown action "${name}".`);
    const top = apiDepth === 0;
    apiDepth++;
    let result, recArgs = null;
    try{
      const args = prepareArgs(def, rawArgs);
      if(top && recorder.active && def.record !== false){
        const rec = def.recordAs ? def.recordAs(args) : { name, args };
        if(rec) recArgs = { name: rec.name, args: recorder.convertArgs(rec.name, rec.args) };
      }
      if(def.batch) result = runBatch(() => def.run(args));
      else if(def.tx === false) result = def.run(args);
      else result = inTx(() => def.run(args));
    }finally{
      apiDepth--;
    }
    if(result === NOOP) return undefined;
    if(recArgs) recorder.push(recArgs.name, recArgs.args, result);
    return result;
  }

  // ---------- helpers used by actions ----------
  function requireType(n, types, what){
    if(!types.includes(n.type)) fail(`${describeNode(n)} is not ${what}.`);
    return n;
  }
  function onActiveCanvas(n){
    if(!nodes.includes(n)) fail(`${describeNode(n)} is not on the current canvas.`);
    return n;
  }
  function clampPos(v){ return Math.max(0, v); }
  function portLabel(portNode, i, dir){ return (parseNode(portNode).name || (dir === 'in' ? 'in' : 'out') + i).trim(); }
  function resolvePort(inst, ref, dir){
    const def = canvases.find(c => c.id === inst.blockDefCanvasId);
    const ports = blockPortsOf(def)[dir === 'in' ? 'inputs' : 'outputs'];
    const kind = dir === 'in' ? 'input' : 'output';
    const bname = def ? def.name : '(missing block)';
    if(ports.length === 0) fail(`Block "${bname}" has no ${kind}s.`);
    const s = ref == null ? '' : String(ref).trim();
    if(s === ''){
      if(ports.length === 1) return 0;
      fail(`Block "${bname}" has ${ports.length} ${kind}s — say which one (${ports.map((p, i) => portLabel(p, i, dir)).join(', ')}).`);
    }
    if(/^\d+$/.test(s)){
      const idx = Number(s) - 1;
      if(idx < 0 || idx >= ports.length) fail(`Block "${bname}" has no ${kind} #${s}.`);
      return idx;
    }
    const idx = ports.findIndex((p, i) => portLabel(p, i, dir).toLowerCase() === s.toLowerCase());
    if(idx < 0) fail(`Block "${bname}" has no ${kind} called "${s}".`);
    return idx;
  }
  function parsePeriodList(v){
    if(Array.isArray(v)) return v.map(x => evalNumber(x, 'period'));
    const s = String(v == null ? '' : v).trim().toLowerCase();
    if(s === '' || s === 'all') return null;
    if(s === 'first') return [1];
    if(s === 'none') return [];
    return s.split(/[,\s]+/).filter(Boolean).flatMap(tok => {
      const m = /^(\d+)\s*-\s*(\d+)$/.exec(tok);
      if(m){ const a = +m[1], b = +m[2]; const r = []; for(let k = Math.min(a,b); k <= Math.max(a,b); k++) r.push(k); return r; }
      return [evalNumber(tok, 'period')];
    });
  }
  function parseNumberList(v){
    if(Array.isArray(v)) return v.map(x => evalNumber(x, 'value'));
    const s = String(v == null ? '' : v).trim();
    if(s === '') return null;
    return s.split(/[,;\s]+/).filter(Boolean).map(x => evalNumber(x, 'value'));
  }

  defineAction({ name:'insertTemplate', label:'Insert Template', category:'Insert', icon:'📚',
    desc:'Inserts a saved template: its name (the latest version), "Name@latest", "Name@3" (version 3), the same with its family id, or "#id". Modules: "here" (this canvas) or "newCanvas". Systems: "add" (merge alongside) or "replace". Recipes: "add" builds one canvas per part and returns { canvases, warnings, unfedSockets }.',

      P('onCollision','enum',{ options:['merge','keep'], def:'merge', label:'same-name canvases', help:'systems added alongside' }),
      P('decisions','json',{ optional:true, help:'per-canvas {"Name":"merge"|"keep"}' }) ],
    run(a){
      const t = a.template;
      if(t.kind === 'recipe'){
        if(a.mode !== 'auto' && a.mode !== 'add') fail(`"${t.name}" is a recipe — use mode "add" (it adds one canvas per part).`);
        return buildRecipe(t);
      }
      const data = cloneData(t.data);
      const mode = a.mode === 'auto' ? (t.kind === 'system' ? 'add' : 'here') : a.mode;
      if(t.kind !== 'system'){
        // The canvas remembers the template when it holds nothing else (Update this canvas).
        const active = () => canvases.find(c => c.id === activeCanvasId);

          const wasEmpty = nodes.length === 0;
          pushHistory(); applyModuleDataDirect(data);

        else if(mode === 'newCanvas'){ applyModuleDataToNewCanvas(data); setCanvasTemplateLink(active(), t); }

      } else {
        if(!Array.isArray(data.canvases) || !data.canvases.length) fail(`Template "${t.name}" has no canvases.`);
        if(mode === 'replace'){ pushHistory(); applySystemDataDirect(data); }
        else if(mode === 'add'){
          const decisions = Object.assign({}, a.decisions || {});
          data.canvases.forEach(c => { const k = c.name || 'Canvas'; if(!(k in decisions)) decisions[k] = a.onCollision; });

  defineAction({ name:'saveRecipe', label:'Save Recipe', category:'Insert', icon:'🧾', returns:'value',
    desc:'Saves a recipe: canvas templates added together, each "Name" / "Name@latest" (follows the latest version) or "Name@2" (that version). A name already in use fails unless newVersionOf names that recipe. Returns the recipe as "Name@version".',

      P('newVersionOf','string',{ def:'', help:'a recipe to save the next version of' }) ],
    run(a){
      if(!Array.isArray(a.parts) || !a.parts.length) fail('A recipe needs a list of parts, e.g. ["Income Statement@latest", "Balance Sheet@2"].');
      if(a.parts.length > RECIPE_MAX_PARTS) fail(`A recipe can have at most ${RECIPE_MAX_PARTS} parts.`);

        const s = String(ref == null ? '' : ref).trim();

        if(t.kind !== 'module') fail(`"${t.name}" is not a canvas template — a recipe's parts are canvas templates.`);

      });
      let base = null;
      if(a.newVersionOf.trim()){
        base = resolveTemplateRef(a.newVersionOf);
        if(base.kind !== 'recipe') fail(`"${base.name}" is not a recipe.`);

  defineAction({ name:'updateCanvasFromTemplate', label:'Update Canvas from Template', category:'Insert', icon:'⬆',
