  function blockPortsOf(defCanvas){
    if(!defCanvas) return { inputs: [], outputs: [], indexNode: null };
    const pool = defCanvas.id === activeCanvasId ? nodes : defCanvas.nodes;
    const inputs = pool.filter(x => x.type === 'value' && x.blockRole === 'input').sort((a,b) => a.x - b.x || a.y - b.y);
    const outputs = pool.filter(x => x.type === 'value' && x.blockRole === 'output').sort((a,b) => a.x - b.x || a.y - b.y);
    // At most one: a rectangle marked as the block's Vertical Index — only meaningful when
    // an instance of this block is used vertically (see computeVerticalBlockInstanceOutput),
    // where it resolves to the current instance's 1-based index instead of being wired in.
    const indexNode = pool.find(x => x.type === 'value' && x.blockRole === 'index') || null;
    return { inputs, outputs, indexNode };
  }

  function renderBlockInstanceBody(el, n){
    const def = canvases.find(c => c.id === n.blockDefCanvasId);
    const { inputs, outputs } = blockPortsOf(def);
    const rows = Math.max(inputs.length, outputs.length, 1);
    const rowH = 20;
    const headerH = 26;
    n.h = headerH + rows * rowH + 8;
    if(!n.w || n.w < 150) n.w = 190;

    el.innerHTML = '';
    const header = document.createElement('div');
    header.className = 'block-header';
    header.textContent = (def ? def.name : '(missing block)') + (n.vertical ? ' ×' + periods.length : '');
    if(n.vertical) header.title = 'Vertical: runs ' + periods.length + ' instances (one per period), reduced into each output.';
    el.appendChild(header);

    const relinkBtn = document.createElement('button');
    relinkBtn.type = 'button';
    relinkBtn.className = 'tag-btn block-relink';
    relinkBtn.title = 'Change block';
    relinkBtn.textContent = '⋯';
    el.appendChild(relinkBtn);

    if(n.vertical){
      const rowsBtn = document.createElement('button');
      rowsBtn.type = 'button';
      rowsBtn.className = 'tag-btn vrows-btn';
      rowsBtn.title = 'View each instance’s own row, not just the combined total';
      rowsBtn.textContent = '▤';
      el.appendChild(rowsBtn);
    }

    const portValsForInstance = portValues[n.id] || [];
    const portErrsForInstance = portErrors[n.id] || [];

    inputs.forEach((inp, i) => {
      const row = document.createElement('div');
      row.className = 'io-row io-row-in';
      row.style.top = (headerH + i * rowH) + 'px';
      const dot = document.createElement('div');
      dot.className = 'io-port';
      dot.dataset.portIndex = i;
      dot.dataset.portDir = 'in';
      const label = document.createElement('span');
      label.className = 'io-label';
      label.textContent = parseNode(inp).name || ('in' + i);
      row.appendChild(dot);
      row.appendChild(label);
      if(n.vertical){
        const inEdge = edges.find(e => e.to === n.id && e.toPort === i);
        const toggle = document.createElement('span');
        toggle.className = 'vindex-toggle' + (inEdge && inEdge.verticalIndexed ? ' on' : '');
        toggle.dataset.portIndex = i;
        toggle.title = inEdge
          ? "Click to switch between 'broadcast' (every instance sees the same value) and 'indexed' (instance i reads this source's value at period i — e.g. a per-period Capex row becoming that vintage's own Capex)."
          : 'Wire an edge into this port first to choose broadcast vs. indexed.';
        toggle.textContent = (inEdge && inEdge.verticalIndexed) ? 'indexed' : 'broadcast';
        row.appendChild(toggle);
      }
      el.appendChild(row);
    });

    outputs.forEach((out, i) => {
      const row = document.createElement('div');
      row.className = 'io-row io-row-out';
      row.style.top = (headerH + i * rowH) + 'px';
      const label = document.createElement('span');
      label.className = 'io-label';
      label.textContent = parseNode(out).name || ('out' + i);
      const valSpan = document.createElement('span');
      valSpan.className = 'io-value';
      const pv = portValsForInstance[i];
      const pe = portErrsForInstance[i];
      if(pv !== undefined && pv !== null){ valSpan.textContent = '=' + formatNum(pv); valSpan.classList.add('computed'); }
      else if(pe){ valSpan.textContent = '?'; valSpan.classList.add('error'); valSpan.title = errorTitle(pe); }
      const dot = document.createElement('div');
      dot.className = 'io-port';
      dot.dataset.portIndex = i;
      dot.dataset.portDir = 'out';
      row.appendChild(label);
      row.appendChild(valSpan);
      row.appendChild(dot);
      el.appendChild(row);
    });
  }

  function rectOf(n){ return {x:n.x, y:n.y, w:n.w, h:n.h, cx:n.x+n.w/2, cy:n.y+n.h/2}; }

  function borderPoint(rect, tx, ty){
    const dx = tx - rect.cx, dy = ty - rect.cy;
    if(dx === 0 && dy === 0) return {x:rect.cx, y:rect.cy};
    const hw = rect.w/2, hh = rect.h/2;
    const scaleX = hw / Math.abs(dx || 1e-6);
    const scaleY = hh / Math.abs(dy || 1e-6);
    const scale = Math.min(scaleX, scaleY);
    return { x: rect.cx + dx*scale, y: rect.cy + dy*scale };
  }

  function edgePath(fromRect, toRect){
    const p1 = borderPoint(fromRect, toRect.cx, toRect.cy);
    const p2 = borderPoint(toRect, fromRect.cx, fromRect.cy);
    return {p1, p2, d:`M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`};
  }

  function getPortCanvasPos(nodeId, portIndex, dir){
    const sel = `.node[data-id="${nodeId}"] .io-port[data-port-index="${portIndex}"][data-port-dir="${dir}"]`;
    const portEl = canvas.querySelector(sel);
    if(!portEl) return null;
    const portRect = portEl.getBoundingClientRect();
    const canvasRect = canvas.getBoundingClientRect();
    return { x: portRect.left + portRect.width/2 - canvasRect.left, y: portRect.top + portRect.height/2 - canvasRect.top };
  }

  function renderEdges(){
    let defs = svg.querySelector('defs');
    if(!defs){
      defs = document.createElementNS(SVGNS,'defs');
      defs.innerHTML =
        '<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#64748b"/></marker>' +
        '<marker id="arrow-sel" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#ef4444"/></marker>' +
        '<marker id="arrow-auto" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8b5cf6"/></marker>';
      svg.appendChild(defs);
    }
    svg.querySelectorAll('g.edge').forEach(g => g.remove());

    edges.forEach(e => {
      const a = getNode(e.from), b = getNode(e.to);
      if(!a || !b) return;
      let {p1, p2, d} = edgePath(rectOf(a), rectOf(b));
      if(e.fromPort != null){
        const pp = getPortCanvasPos(e.from, e.fromPort, 'out');
        if(pp) p1 = pp;
      }
      if(e.toPort != null){
        const pp = getPortCanvasPos(e.to, e.toPort, 'in');
        if(pp) p2 = pp;
      }
      if(e.fromPort != null || e.toPort != null) d = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
      const isSel = selectedEdgeId === e.id;
      const isAuto = !!e.auto;
      const g = document.createElementNS(SVGNS,'g');
      g.setAttribute('class','edge' + (isSel ? ' selected':'') + (isAuto ? ' auto':''));
      g.dataset.id = e.id;
      const marker = isAuto ? 'arrow-auto' : (isSel ? 'arrow-sel' : 'arrow');
      // DOM calls, not a markup string: d is built from node coordinates, which come
      // from files (possibly shared ones) and must never be parsed as markup.
      const hitPath = document.createElementNS(SVGNS, 'path');
      hitPath.setAttribute('class', 'hit'); hitPath.setAttribute('d', d);
      const linePath = document.createElementNS(SVGNS, 'path');
      linePath.setAttribute('class', 'line'); linePath.setAttribute('d', d); linePath.setAttribute('marker-end', `url(#${marker})`);
      g.appendChild(hitPath); g.appendChild(linePath);
      if(isAuto) g.setAttribute('title', 'Auto-connected via plug/socket match');

      if(b.type === 'operator'){
        const siblings = sortedIncoming(b.id);
        if(siblings.length > 1){
          const idx = siblings.findIndex(s => s.id === e.id) + 1;
          const bx = p1.x + (p2.x - p1.x) * 0.78;
          const by = p1.y + (p2.y - p1.y) * 0.78;
          const badge = document.createElementNS(SVGNS,'g');
          badge.setAttribute('class','order-badge');
          const circ = document.createElementNS(SVGNS, 'circle');
          [['cx', bx], ['cy', by], ['r', 8], ['stroke', isSel ? '#ef4444' : (isAuto ? '#8b5cf6' : '#94a3b8')], ['stroke-width', 1.5]].forEach(([k, v]) => circ.setAttribute(k, v));
          const txt = document.createElementNS(SVGNS, 'text');
          [['x', bx], ['y', by + 3.5], ['text-anchor', 'middle'], ['font-size', 10], ['fill', '#334155']].forEach(([k, v]) => txt.setAttribute(k, v));
          txt.textContent = String(idx);
          badge.appendChild(circ); badge.appendChild(txt);
          g.appendChild(badge);
        }
      }

      if(!isAuto){
        g.addEventListener('mousedown', (ev) => { ev.stopPropagation(); selectEdgeOnly(e.id); });
      }
      svg.appendChild(g);
    });
  }

  // ---------- node interaction ----------
  function attachNodeEvents(el){
    el.addEventListener('contextmenu', (ev) => { ev.preventDefault(); });
    el.addEventListener('mousedown', (ev) => {
      const id = el.dataset.id;
      if(ev.target.classList.contains('tag-btn')){ ev.stopPropagation(); ev.preventDefault(); return; }
      if(ev.target.classList.contains('io-port')){
        ev.stopPropagation(); ev.preventDefault();
        if(ev.target.dataset.portDir === 'out'){
          startConnection(id, ev, parseInt(ev.target.dataset.portIndex, 10));
        }
        return;
      }
      if(ev.target.classList.contains('port')){ startConnection(id, ev); return; }
      if(ev.target.classList.contains('resize-handle')){ startResize(id, ev); return; }
      if(ev.target.tagName === 'TEXTAREA') return;

      // Right mouse button, anywhere on the node body: draw an arrow, same as
      // dragging from one of the N/S/E/W port dots but without needing to hit
      // the small port hitbox. Works from any node type onto any node type.
      if(ev.button === 2){
        ev.stopPropagation();
        ev.preventDefault();
        startConnection(id, ev);
        return;
      }

      // Alt+drag: spin off an alias of the dragged rectangle(s) instead of moving
      // them. Only plain value rectangles can be aliased (matches the Alias
      // picker's own rule), so alt+dragging anything else — an operator, an
      // existing alias, a block instance, a period-shift node, or a selection
      // that mixes those in — is a no-op: nothing moves, nothing is created.
      // Shift+alt+drag restricts the alias drag to one axis, same convention
      // as plain shift-drag restricting a normal move.
      if(ev.altKey){
        ev.stopPropagation();
        startAliasDragInit(id, ev);
        return;
      }

      if(ev.shiftKey || ev.ctrlKey || ev.metaKey){
        ev.stopPropagation();
        startModifiedInteraction(id, ev);
        return;
      }
      if(!selectedNodeIds.has(id) || selectedEdgeId){
        selectNodesOnly([id]);
      }
      startDrag(id, ev);
    });
    el.addEventListener('click', (ev) => {
      const n = getNode(el.dataset.id);
      if(!n) return;
      if(ev.target.classList.contains('plug-btn')){ showTagEditor(n, 'plug'); }
      if(ev.target.classList.contains('socket-btn')){ showTagEditor(n, 'socket'); }
      if(ev.target.classList.contains('relink-btn')){
        if(n.auto) showMessage("This alias was auto-created by a Plug/Socket match on another canvas. It regenerates automatically — to change it, edit the Plug or Socket name instead.");
        else showAliasPicker(n);
      }
      if(ev.target.classList.contains('io-btn')){ showRolePicker(n); }
      if(ev.target.classList.contains('block-relink')){ showBlockPicker(n); }
      if(ev.target.classList.contains('vrows-btn')){ showVerticalInstancesViewer(n); }
      if(ev.target.classList.contains('props-btn')){ showPropertiesEditor(n); }
      if(ev.target.classList.contains('period-btn')){ showLiteralPeriodsPicker(n); }
      if(ev.target.classList.contains('curve-btn')){ showPeriodValuesEditor(n); }
      if(ev.target.classList.contains('reducer-chip')){
        const order = REDUCERS;
        const cur = order.includes(n.verticalReducer) ? n.verticalReducer : 'sum';
        guarded(() => fm.setReducer(n.id, order[(order.indexOf(cur) + 1) % order.length]));
      }
      if(ev.target.classList.contains('vindex-toggle')){
        const portIdx = parseInt(ev.target.dataset.portIndex, 10);
        const inEdge = edges.find(e => e.to === n.id && e.toPort === portIdx);
        if(inEdge) guarded(() => fm.setPortMode(n.id, String(portIdx + 1), !inEdge.verticalIndexed));
      }
    });
    el.addEventListener('dblclick', (ev) => {
      if(ev.target.tagName === 'TEXTAREA') return;
      const n = getNode(el.dataset.id);
      if(!n) return;
      if(n.type === 'operator') showOpPicker(n.id);
      else if(n.type === 'periodShift') showShiftPicker(n);
      else if(n.type === 'alias'){
        if(n.auto) showMessage("This alias was auto-created by a Plug/Socket match on another canvas. It regenerates automatically — to change it, edit the Plug or Socket name instead.");
        else showAliasPicker(n);
      }
      else if(n.type === 'blockInstance') showBlockPicker(n);
      else startEdit(n.id);
    });
  }

  function computeSnap(movingNode, x, y, excludeIds){
    const w = movingNode.w, h = movingNode.h;
    const others = nodes.filter(n => !excludeIds.includes(n.id));
    let bestX = x, bestXDist = SNAP_THRESHOLD, guideX = null;
    let bestY = y, bestYDist = SNAP_THRESHOLD, guideY = null;
    const me = { left:x, right:x+w, centerX:x+w/2 };
    const meY = { top:y, bottom:y+h, centerY:y+h/2 };

    others.forEach(o => {
      const oe = { left:o.x, right:o.x+o.w, centerX:o.x+o.w/2 };
      const oeY = { top:o.y, bottom:o.y+o.h, centerY:o.y+o.h/2 };
      ['left','right','centerX'].forEach(k => {
        const dist = Math.abs(me[k]-oe[k]);
        if(dist < bestXDist){
          bestXDist = dist;
          bestX = k==='left' ? oe[k] : (k==='right' ? oe[k]-w : oe[k]-w/2);
          guideX = oe[k];
        }
      });
      ['top','bottom','centerY'].forEach(k => {
        const dist = Math.abs(meY[k]-oeY[k]);
        if(dist < bestYDist){
          bestYDist = dist;
          bestY = k==='top' ? oeY[k] : (k==='bottom' ? oeY[k]-h : oeY[k]-h/2);
          guideY = oeY[k];
        }
      });
    });
    return { x: Math.max(0,bestX), y: Math.max(0,bestY), guideX, guideY };
  }

  function updateGuides(gx, gy){
    if(gx !== null){ guideV.style.left = gx+'px'; guideV.classList.add('show'); } else guideV.classList.remove('show');
    if(gy !== null){ guideH.style.top = gy+'px'; guideH.classList.add('show'); } else guideH.classList.remove('show');
  }
  function hideGuides(){ guideV.classList.remove('show'); guideH.classList.remove('show'); }

  function startModifiedInteraction(id, downEvent){
    const startX = downEvent.clientX, startY = downEvent.clientY;
    let committed = false;

    function onMove(ev){
      if(committed) return;
      const dist = Math.hypot(ev.clientX - startX, ev.clientY - startY);
      if(dist > 3){
        committed = true;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if(!selectedNodeIds.has(id) || selectedEdgeId){
          selectNodesOnly([id]);
        }
        startDrag(id, downEvent);
      }
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if(!committed) toggleNodeSelection(id);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  function startDrag(id, downEvent){
    downEvent.preventDefault();
    let workingIds = selectedNodeIds.size ? Array.from(selectedNodeIds) : [id];
    let workingStartPositions = {};
    workingIds.forEach(nid => { const nd = getNode(nid); if(nd) workingStartPositions[nid] = {x:nd.x, y:nd.y}; });
    let workingPrimaryId = id;
    let workingPrimaryStart = workingStartPositions[id] || (() => { const p = getNode(id); return {x:p.x, y:p.y}; })();
    const startX = downEvent.clientX, startY = downEvent.clientY;
    document.body.classList.add('dragging');
    let historyPushed = false;
    let duplicated = false;
    const originalIds = workingIds.slice();
    // references are taken before anything changes (a duplicate would make names ambiguous)
    const originalRefs = recorder.active ? recorder.refsOf(originalIds.map(getNode).filter(Boolean)) : null;

    function onMove(ev){
      if(!historyPushed){ pushHistory(); historyPushed = true; }

      if(!duplicated && (ev.ctrlKey || ev.metaKey)){
        duplicated = true;
        const idMap = {};
        const clones = workingIds.map(nid => {
          const orig = getNode(nid);
          const newId = uid('n');
          idMap[nid] = newId;
          return Object.assign({}, orig, { id: newId });
        });
        const clonedEdges = edges
          .filter(e => !e.auto && idMap[e.from] !== undefined && idMap[e.to] !== undefined)
          .map(e => Object.assign({}, e, { id: uid('e'), from: idMap[e.from], to: idMap[e.to] }));
        nodes = nodes.concat(clones);
        edges = edges.concat(clonedEdges);

        const newStart = {};
        workingIds.forEach(oldId => { newStart[idMap[oldId]] = { x: workingStartPositions[oldId].x, y: workingStartPositions[oldId].y }; });
        workingIds = workingIds.map(oldId => idMap[oldId]);
        workingStartPositions = newStart;
        workingPrimaryId = idMap[workingPrimaryId];
        workingPrimaryStart = newStart[workingPrimaryId];
        selectedNodeIds = new Set(workingIds);
      }

      let dx = ev.clientX - startX, dy = ev.clientY - startY;
      if(ev.shiftKey){
        if(Math.abs(dx) >= Math.abs(dy)) dy = 0; else dx = 0;
      }
      const tentX = Math.max(0, workingPrimaryStart.x + dx);
      const tentY = Math.max(0, workingPrimaryStart.y + dy);
      const workingPrimaryNode = getNode(workingPrimaryId);
      const snap = computeSnap(workingPrimaryNode, tentX, tentY, workingIds);
      const appliedDX = snap.x - workingPrimaryStart.x;
      const appliedDY = snap.y - workingPrimaryStart.y;
      workingIds.forEach(nid => {
        const nd = getNode(nid), sp = workingStartPositions[nid];
        if(!nd || !sp) return;
        nd.x = Math.max(0, sp.x + appliedDX);
        nd.y = Math.max(0, sp.y + appliedDY);
      });
      updateGuides(snap.guideX, snap.guideY);
      render();
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('dragging');
      hideGuides();
      if(duplicated){ syncAutoConnections(); clearComputed(); render(); }
      if(historyPushed && recorder.active){
        const pn = getNode(workingPrimaryId);
        const dx = pn ? pn.x - workingPrimaryStart.x : 0, dy = pn ? pn.y - workingPrimaryStart.y : 0;
        if(duplicated && originalRefs) recorder.push('duplicate', { nodes: originalRefs, dx, dy }, workingIds.slice());
        else if(dx || dy) recorder.add('move', { nodes: workingIds.map(getNode).filter(Boolean), dx, dy });
      }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  // Alt+drag: gatekeeper. Resolves which nodes would be dragged (mirrors the
  // "click an unselected node -> select just it" rule startDrag itself uses),
  // and refuses to do anything at all — no selection change, no drag, no
  // alias — unless every one of them is a plain value rectangle.
  function startAliasDragInit(id, downEvent){
    const prospectiveIds = (selectedNodeIds.has(id) && !selectedEdgeId) ? Array.from(selectedNodeIds) : [id];
    const allRects = prospectiveIds.length > 0 && prospectiveIds.every(nid => { const nd = getNode(nid); return nd && nd.type === 'value'; });
    if(!allRects){ downEvent.preventDefault(); return; }
    if(!selectedNodeIds.has(id) || selectedEdgeId){
      selectNodesOnly([id]);
    }
    startAliasDrag(prospectiveIds, downEvent);
  }

  // Creates one alias per source rectangle (sourceCanvasId is always the active
  // canvas, since we're dragging nodes that live on it) the first time the mouse
  // actually moves, then drags those new alias nodes — snap-to-align and all —
  // exactly like a normal node drag, leaving the source rectangles untouched.
  // A plain alt+click with no movement creates nothing.
  function startAliasDrag(sourceIds, downEvent){
    downEvent.preventDefault();
    const sourceNodes = sourceIds.map(getNode).filter(Boolean);
    if(sourceNodes.length === 0) return;
    const startX = downEvent.clientX, startY = downEvent.clientY;
    let created = false;
    let historyPushed = false;
    let aliasIds = [];
    let aliasStartPositions = {};
    let primaryId = null;

    function createAliases(){
      if(!historyPushed){ pushHistory(); historyPushed = true; }
      const newNodes = sourceNodes.map(sn => ({
        id: uid('n'), type:'alias', x: sn.x, y: sn.y, w: sn.w, h: sn.h,
        sourceCanvasId: activeCanvasId, sourceNodeId: sn.id, plug:''
      }));
      nodes = nodes.concat(newNodes);
      aliasIds = newNodes.map(n => n.id);
      newNodes.forEach(n => { aliasStartPositions[n.id] = { x:n.x, y:n.y }; });
      primaryId = aliasIds[0];
      selectNodesOnly(aliasIds);
      created = true;
    }

    function onMove(ev){
      if(!created) createAliases();
      let dx = ev.clientX - startX, dy = ev.clientY - startY;
      if(ev.shiftKey){
        if(Math.abs(dx) >= Math.abs(dy)) dy = 0; else dx = 0;
      }
      const primaryStart = aliasStartPositions[primaryId];
      const primaryNode = getNode(primaryId);
      const tentX = Math.max(0, primaryStart.x + dx);
      const tentY = Math.max(0, primaryStart.y + dy);
      const snap = computeSnap(primaryNode, tentX, tentY, aliasIds);
      const appliedDX = snap.x - primaryStart.x;
      const appliedDY = snap.y - primaryStart.y;
      aliasIds.forEach(nid => {
        const nd = getNode(nid), sp = aliasStartPositions[nid];
        if(!nd || !sp) return;
        nd.x = Math.max(0, sp.x + appliedDX);
        nd.y = Math.max(0, sp.y + appliedDY);
      });
      updateGuides(snap.guideX, snap.guideY);
      render();
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('dragging');
      hideGuides();
      if(created){
        clearComputed(); render(); evaluateAll();
        if(recorder.active){
          const pn = getNode(primaryId), ps = aliasStartPositions[primaryId];
          recorder.add('aliasOf', { nodes: sourceNodes.filter(n => nodes.includes(n)), dx: pn.x - ps.x, dy: pn.y - ps.y }, aliasIds.slice());
        }
      }
    }
    document.body.classList.add('dragging');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  function startResize(id, downEvent){
    downEvent.preventDefault();
    downEvent.stopPropagation();
    selectNodesOnly([id]);
    const n = getNode(id);
    const startX = downEvent.clientX, startY = downEvent.clientY;
    const origW = n.w, origH = n.h;
    document.body.classList.add('dragging');
    let historyPushed = false;

    function onMove(ev){
      if(!historyPushed){ pushHistory(); historyPushed = true; }
      n.w = Math.max(80, origW + (ev.clientX - startX));
      n.h = Math.max(44, origH + (ev.clientY - startY));
      render();
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('dragging');
      if(historyPushed && recorder.active) recorder.add('resize', { node: n, w: n.w, h: n.h });
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  function startEdit(id, selectAll){
    const n = getNode(id);
    const el = canvas.querySelector(`.node[data-id="${id}"]`);
    if(!el) return;
    const lbl = el.querySelector('.label');
    if(!lbl) return;
    const ta = document.createElement('textarea');
    ta.value = n.text;
    ta.title = 'Line 1: name · Line 2: value · Line 3: unit of measure, e.g. "kt" or "$/t" (optional). Shift+Enter for a new line.';
    lbl.replaceWith(ta);
    ta.focus();
    if(selectAll) ta.select();

    function commit(){
      const newText = ta.value.trim() || 'Untitled';
      const newLbl = document.createElement('div');
      newLbl.className = 'label';
      newLbl.innerHTML = '<div class="line-name"></div><div class="line-value"></div><div class="line-uom"></div>';
      if(ta.parentNode) ta.replaceWith(newLbl);
      if(newText !== n.text && nodes.includes(n)) guarded(() => fm.setText(n.id, newText));
      clearComputed();
      render();
    }
    ta.addEventListener('blur', commit);
    ta.addEventListener('keydown', (ev) => {
      if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); ta.blur(); }
      if(ev.key === 'Escape'){ ta.value = n.text; ta.blur(); }
    });
  }

  // Hand-drawn per-period value editor. Only meaningful for value rectangles with no
  // incoming edge (i.e. inputs, not formula-driven) — the render()/curve-btn visibility
  // logic already restricts when this can be opened.
  function showPeriodValuesEditor(node){
    closePicker();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box period-values-box';
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function cleanup(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('keydown', onKey);
      overlay.remove();
    }
    function onKey(ev){ if(ev.key === 'Escape') cleanup(); }
    overlay.addEventListener('mousedown', (ev) => { if(ev.target === overlay) cleanup(); });
    document.addEventListener('keydown', onKey);

    const {name} = parseNode(node);
    const title = document.createElement('p');
    title.textContent = 'Draw values across periods' + (name ? ' — ' + name : '');
    box.appendChild(title);
    const desc = document.createElement('p');
    desc.className = 'template-desc';
    desc.textContent = "Set a min/max range, then drag a point — or click-drag across the chart like drawing a line — to set this rectangle's value at each period. Saving overrides its typed number with these per-period values.";
    box.appendChild(desc);

    // ---- initial values ----
    let curValues;
    if(Array.isArray(node.periodValues) && node.periodValues.length){
      curValues = padPeriodValuesArray(node.periodValues.slice(), periods.length);
    } else {
      const {literal} = parseNode(node);
      const base = (typeof literal === 'number') ? literal : 0;
      curValues = new Array(periods.length).fill(base);
    }
    const existingRange = node.periodValuesRange || {};
    let rangeMin = (typeof existingRange.min === 'number') ? existingRange.min : Math.min(0, ...curValues);
    let rangeMax = (typeof existingRange.max === 'number') ? existingRange.max : Math.max(1, ...curValues);
    if(rangeMin >= rangeMax) rangeMax = rangeMin + 1;

    // ---- range + quick-tool controls ----
    const rangeRow = document.createElement('div');
    rangeRow.style.cssText = 'display:flex; gap:14px; align-items:center; margin-bottom:10px; flex-wrap:wrap;';
    function numField(labelText, value){
      const wrap = document.createElement('label');
      wrap.style.cssText = 'display:flex; align-items:center; gap:6px; font-size:12px; color:#374151;';
      wrap.textContent = labelText;
      const inp = document.createElement('input');
      inp.type = 'number'; inp.value = value; inp.step = 'any';
      inp.style.cssText = 'width:90px; font-size:13px; padding:5px 7px; border-radius:6px; border:1px solid #d1d5db;';
      wrap.appendChild(inp);
      return {wrap, inp};
    }
    const minField = numField('Min', rangeMin);
    const maxField = numField('Max', rangeMax);
    rangeRow.appendChild(minField.wrap);
    rangeRow.appendChild(maxField.wrap);
    const flatBtn = document.createElement('button');
    flatBtn.className = 'tbtn'; flatBtn.type = 'button';
    flatBtn.textContent = 'Flatten to first value';
    const interpBtn = document.createElement('button');
    interpBtn.className = 'tbtn'; interpBtn.type = 'button';
    interpBtn.textContent = 'Straight line: first → last';
    rangeRow.appendChild(flatBtn);
    rangeRow.appendChild(interpBtn);
    box.appendChild(rangeRow);

    // ---- chart ----
    const chartWrap = document.createElement('div');
    chartWrap.style.cssText = 'overflow-x:auto; border:1px solid #e5e7eb; border-radius:8px; background:#fafafa; margin-bottom:10px;';
    box.appendChild(chartWrap);

    const padL = 54, padR = 20, padT = 16, padB = 26;
    const stepX = Math.max(46, Math.min(90, Math.floor(760 / Math.max(periods.length, 1))));
    const plotW = stepX * Math.max(periods.length - 1, 1);
    const svgW = padL + plotW + padR;
    const svgH = 240;
    const plotH = svgH - padT - padB;

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', svgW);
    svg.setAttribute('height', svgH);
    svg.style.display = 'block';
    svg.style.cursor = 'crosshair';
    chartWrap.appendChild(svg);

    function yFor(v){
      const t = (v - rangeMin) / (rangeMax - rangeMin);
      return padT + (1 - Math.max(0, Math.min(1, t))) * plotH;
    }
    function valueFromY(y){
      const t = 1 - (y - padT) / plotH;
      const v = rangeMin + Math.max(0, Math.min(1, t)) * (rangeMax - rangeMin);
      return Math.round(v * 1000) / 1000;
    }
    function xFor(i){ return padL + i * stepX; }

    function redraw(){
      svg.innerHTML = '';
      const gl = document.createElementNS(svgNS, 'g');
      [0, 0.25, 0.5, 0.75, 1].forEach(t => {
        const y = padT + (1 - t) * plotH;
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', padL); line.setAttribute('x2', padL + plotW);
        line.setAttribute('y1', y); line.setAttribute('y2', y);
        line.setAttribute('stroke', '#e2e8f0');
        line.setAttribute('stroke-dasharray', '3,4');
        gl.appendChild(line);
        const lbl = document.createElementNS(svgNS, 'text');
        lbl.setAttribute('x', padL - 8); lbl.setAttribute('y', y + 4);
        lbl.setAttribute('text-anchor', 'end'); lbl.setAttribute('font-size', '10'); lbl.setAttribute('fill', '#94a3b8');
        lbl.textContent = formatNum(rangeMin + t * (rangeMax - rangeMin));
        gl.appendChild(lbl);
      });
      periods.forEach((label, i) => {
        const x = xFor(i);
        const vline = document.createElementNS(svgNS, 'line');
        vline.setAttribute('x1', x); vline.setAttribute('x2', x);
        vline.setAttribute('y1', padT); vline.setAttribute('y2', padT + plotH);
        vline.setAttribute('stroke', '#eef2f7');
        gl.appendChild(vline);
        const xlbl = document.createElementNS(svgNS, 'text');
        xlbl.setAttribute('x', x); xlbl.setAttribute('y', svgH - 8);
        xlbl.setAttribute('text-anchor', 'middle'); xlbl.setAttribute('font-size', '9'); xlbl.setAttribute('fill', '#94a3b8');
        xlbl.textContent = (i + 1);
        gl.appendChild(xlbl);
      });
      svg.appendChild(gl);

      const path = document.createElementNS(svgNS, 'path');
      let d = '';
      curValues.forEach((v, i) => { d += (i === 0 ? 'M' : 'L') + xFor(i) + ' ' + yFor(v) + ' '; });
      path.setAttribute('d', d.trim());
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#4f46e5');
      path.setAttribute('stroke-width', '2');
      svg.appendChild(path);

      curValues.forEach((v, i) => {
        const c = document.createElementNS(svgNS, 'circle');
        c.setAttribute('cx', xFor(i)); c.setAttribute('cy', yFor(v));
        c.setAttribute('r', 6);
        c.setAttribute('fill', '#fff');
        c.setAttribute('stroke', '#4f46e5');
        c.setAttribute('stroke-width', '2');
        c.style.cursor = 'ns-resize';
        svg.appendChild(c);
        const vlbl = document.createElementNS(svgNS, 'text');
        vlbl.setAttribute('x', xFor(i)); vlbl.setAttribute('y', yFor(v) - 10);
        vlbl.setAttribute('text-anchor', 'middle'); vlbl.setAttribute('font-size', '10'); vlbl.setAttribute('fill', '#374151');
        vlbl.textContent = formatNum(v);
        svg.appendChild(vlbl);
      });
    }

    // ---- per-period precise numeric entry, synced with the chart ----
    const listWrap = document.createElement('div');
    listWrap.style.cssText = 'display:flex; flex-wrap:wrap; gap:6px; max-height:120px; overflow-y:auto; margin-bottom:12px; padding:8px; border:1px solid #e5e7eb; border-radius:8px;';
    box.appendChild(listWrap);
    let numberInputs = [];
    function buildNumberInputs(){
      listWrap.innerHTML = '';
      numberInputs = periods.map((label, i) => {
        const cell = document.createElement('div');
        cell.style.cssText = 'display:flex; flex-direction:column; align-items:center; width:64px;';
        const lab = document.createElement('span');
        lab.style.cssText = 'font-size:9px; color:#9ca3af; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:64px;';
        lab.textContent = label;
        const inp = document.createElement('input');
        inp.type = 'number'; inp.step = 'any';
        inp.style.cssText = 'width:100%; font-size:12px; padding:3px 4px; border-radius:5px; border:1px solid #d1d5db; text-align:center;';
        inp.value = curValues[i];
        inp.addEventListener('change', () => {
          const v = parseFloat(inp.value);
          if(isFinite(v)) curValues[i] = v;
          else inp.value = curValues[i];
          redraw();
        });
        cell.appendChild(lab); cell.appendChild(inp);
        listWrap.appendChild(cell);
        return inp;
      });
    }
    function syncNumberInputs(){ numberInputs.forEach((inp, i) => { inp.value = curValues[i]; }); }
    buildNumberInputs();
    redraw();

    minField.inp.addEventListener('change', () => {
      const v = parseFloat(minField.inp.value);
      if(isFinite(v) && v < rangeMax) rangeMin = v;
      minField.inp.value = rangeMin;
      redraw();
    });
    maxField.inp.addEventListener('change', () => {
      const v = parseFloat(maxField.inp.value);
      if(isFinite(v) && v > rangeMin) rangeMax = v;
      maxField.inp.value = rangeMax;
      redraw();
    });
    flatBtn.addEventListener('click', () => {
      const v = curValues[0];
      curValues = curValues.map(() => v);
      redraw(); syncNumberInputs();
    });
    interpBtn.addEventListener('click', () => {
      const first = curValues[0], last = curValues[curValues.length - 1], n = curValues.length;
      curValues = curValues.map((_, i) => Math.round((n > 1 ? first + (last - first) * (i / (n - 1)) : first) * 1000) / 1000);
      redraw(); syncNumberInputs();
    });

    // ---- drag-to-draw interaction ----
    let drawing = false, lastIdx = null;
    function svgPointFromEvent(ev){
      const rect = svg.getBoundingClientRect();
      return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
    }
    function nearestIndex(x){ return Math.max(0, Math.min(periods.length - 1, Math.round((x - padL) / stepX))); }
    function onDown(ev){
      ev.preventDefault();
      drawing = true;
      const p = svgPointFromEvent(ev);
      const idx = nearestIndex(p.x);
      curValues[idx] = valueFromY(p.y);
      lastIdx = idx;
      redraw(); syncNumberInputs();
    }
    function onMove(ev){
      if(!drawing) return;
      const p = svgPointFromEvent(ev);
      const idx = nearestIndex(p.x);
      if(lastIdx !== null && idx !== lastIdx){
        const y0 = yFor(curValues[lastIdx]);
        const lo = Math.min(lastIdx, idx), hi = Math.max(lastIdx, idx);
        for(let i = lo; i <= hi; i++){
          const t = (idx === lastIdx) ? 1 : (i - lastIdx) / (idx - lastIdx);
          curValues[i] = valueFromY(y0 + (p.y - y0) * t);
        }
      } else {
        curValues[idx] = valueFromY(p.y);
      }
      lastIdx = idx;
      redraw(); syncNumberInputs();
    }
    function onUp(){ drawing = false; lastIdx = null; }
    svg.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);

    // ---- actions ----
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const clearBtn = document.createElement('button');

  // Builds the number-format/fill/border/font fields shared by the per-rectangle
  // formatting dialog and the format-preset editor. Appends fields into `box` (before
  // any element already in it — callers add their own rows/actions after calling this)
  // and returns a readStyle() to collect the current field values into a style object.
  function buildStyleFieldsUI(box, st, opts){
    function fieldRow(labelText, inputEl){
      const row = document.createElement('div');
      row.style.display = 'flex'; row.style.alignItems = 'center'; row.style.gap = '8px'; row.style.marginBottom = '8px';
      const lab = document.createElement('label');
      lab.textContent = labelText;
      lab.style.fontSize = '12px'; lab.style.color = '#374151'; lab.style.minWidth = '120px';
      row.appendChild(lab); row.appendChild(inputEl);
      return row;
    }

    const nfKind = document.createElement('select');
    [['general','General'],['number','Number'],['percent','Percent'],['currency','Currency']].forEach(([v,l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l; nfKind.appendChild(o);
    });
    nfKind.value = (st.numberFormat && st.numberFormat.kind) || 'general';
    box.appendChild(fieldRow('Number format', nfKind));

    const nfDecimals = document.createElement('input');
    nfDecimals.type = 'number'; nfDecimals.min = '0'; nfDecimals.max = '8'; nfDecimals.style.width = '60px';
    nfDecimals.value = (st.numberFormat && typeof st.numberFormat.decimals === 'number') ? st.numberFormat.decimals : 2;
    box.appendChild(fieldRow('Decimals', nfDecimals));

    const nfCurrency = document.createElement('input');
    nfCurrency.type = 'text'; nfCurrency.maxLength = 3; nfCurrency.style.width = '60px';
    nfCurrency.value = (st.numberFormat && st.numberFormat.currencySymbol) || '$';
    const currencyRow = fieldRow('Currency symbol', nfCurrency);
    box.appendChild(currencyRow);
    function syncCurrencyVisibility(){ currencyRow.style.display = nfKind.value === 'currency' ? 'flex' : 'none'; }
    nfKind.addEventListener('change', syncCurrencyVisibility);
    syncCurrencyVisibility();

    const fillInput = document.createElement('input');
    fillInput.type = 'color'; fillInput.value = st.fill || '#ffffff';
    box.appendChild(fieldRow('Fill color', fillInput));
    const fillNone = document.createElement('input');
    fillNone.type = 'checkbox'; fillNone.checked = !st.fill;
    box.appendChild(fieldRow('No fill (default)', fillNone));

    const borderColor = document.createElement('input');
    borderColor.type = 'color'; borderColor.value = (st.border && st.border.color) || '#94a3b8';
    box.appendChild(fieldRow('Border color', borderColor));
    const borderWidth = document.createElement('input');
    borderWidth.type = 'number'; borderWidth.min = '0'; borderWidth.max = '10'; borderWidth.step = '0.5'; borderWidth.style.width = '60px';
    borderWidth.value = (st.border && st.border.width != null) ? st.border.width : 1.5;
    box.appendChild(fieldRow('Border width (px)', borderWidth));
    const borderStyle = document.createElement('select');
    ['solid','dashed','dotted','none'].forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; borderStyle.appendChild(o); });
    borderStyle.value = (st.border && st.border.style) || 'solid';
    box.appendChild(fieldRow('Border style', borderStyle));
    // Excel only: which sides of each cell get the border. The canvas always draws the
    // whole outline. No sides ticked = no border in Excel. Saved as border.sides
    // (absent in older styles = all four).
    const SIDES = [['top', 'Top'], ['bottom', 'Bottom'], ['left', 'Left'], ['right', 'Right']];
    const savedSides = (st.border && Array.isArray(st.border.sides)) ? st.border.sides : ['top', 'bottom', 'left', 'right'];
    const sidesWrap = document.createElement('span');
    sidesWrap.style.cssText = 'display:inline-flex; gap:10px; font-size:12px;';
    const sideBoxes = {};
    SIDES.forEach(([key, lab]) => {
      const l = document.createElement('label'); l.style.cssText = 'display:inline-flex; align-items:center; gap:3px;';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = savedSides.includes(key);
      sideBoxes[key] = cb; l.append(cb, document.createTextNode(lab)); sidesWrap.appendChild(l);
    });
    const sidesRow = fieldRow('Excel border sides', sidesWrap);
    sidesRow.title = 'Which sides of each Excel cell get this border. The canvas always shows the full outline. Untick all for no border in Excel.';
    box.appendChild(sidesRow);

    const fontFamily = document.createElement('select');
    [['','Default'],['Arial, sans-serif','Arial'],['Georgia, serif','Georgia'],['Menlo, Consolas, monospace','Monospace'],['"Times New Roman", serif','Times New Roman']].forEach(([v,l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l; fontFamily.appendChild(o);
    });
    fontFamily.value = (st.font && st.font.family) || '';
    box.appendChild(fieldRow('Font', fontFamily));
    const fontSize = document.createElement('input');
    fontSize.type = 'number'; fontSize.min = '9'; fontSize.max = '36'; fontSize.style.width = '60px';
    fontSize.value = (st.font && st.font.size) || 14;
    box.appendChild(fieldRow('Font size (px)', fontSize));
    // Excel only: leave the cell's size to the workbook default (normally 11pt) instead
    // of carrying this canvas size across.
    const excelDefaultSize = document.createElement('input');
    excelDefaultSize.type = 'checkbox'; excelDefaultSize.checked = !!(st.font && st.font.excelDefaultSize);
    const sizeRow = fieldRow("Use Excel's default font size", excelDefaultSize);
    sizeRow.title = 'In Excel, give these cells no font size of their own, so they use the workbook default (normally 11pt). The canvas keeps the size above.';
    box.appendChild(sizeRow);
    const fontWeight = document.createElement('select');
    [['normal','Normal'],['600','Semibold'],['700','Bold']].forEach(([v,l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; fontWeight.appendChild(o); });
    fontWeight.value = (st.font && st.font.weight) || 'normal';
    box.appendChild(fieldRow('Font weight', fontWeight));
    const fontColor = document.createElement('input');
    fontColor.type = 'color'; fontColor.value = (st.font && st.font.color) || '#1e2937';
    box.appendChild(fieldRow('Name color', fontColor));

    // Per-rectangle only: in Excel the format ROLE (Inputs / Calculations / Links …)
    // decides fill and font colour, so colour always says what kind of cell it is; tick
    // this to keep this rectangle's own colours there too (e.g. a deliberate highlight).
    let keepColours = null;
    if(opts && opts.showKeepColours){
      keepColours = document.createElement('input');
      keepColours.type = 'checkbox'; keepColours.checked = !!st.keepColours;
      const row = fieldRow('Use this fill, font colour & border in Excel too', keepColours);
      row.title = 'In Excel, a cell\'s fill, font colour and border normally come from its format role (Inputs, Calculations, Links …). Tick to keep this rectangle\'s own instead (e.g. a deliberate highlight).';
      box.appendChild(row);
    }

    return {
      readStyle(){
        const out = {
          numberFormat: { kind: nfKind.value, decimals: parseInt(nfDecimals.value, 10) || 0, currencySymbol: nfCurrency.value || '$' },
          fill: fillNone.checked ? null : fillInput.value,
          border: { color: borderColor.value, width: parseFloat(borderWidth.value) || 0, style: borderStyle.value,
                    sides: SIDES.map(([k]) => k).filter(k => sideBoxes[k].checked) },
          font: { family: fontFamily.value, size: parseInt(fontSize.value, 10) || 14, weight: fontWeight.value, color: fontColor.value }
        };
        if(excelDefaultSize.checked) out.font.excelDefaultSize = true;
        if(keepColours && keepColours.checked) out.keepColours = true;
        return out;
      }
    };
  }

  function applyNodeStyle(el, n){
    const nameEl = el.querySelector('.line-name');
    const valEl = el.querySelector('.line-value');
    const st = resolveNodeStyle(n);
    // Clear first: a rectangle can switch role (an arrow added/removed), and a role
    // preset may leave some properties unset — never keep the previous role's look.
    el.style.background = ''; el.style.borderColor = ''; el.style.borderWidth = ''; el.style.borderStyle = '';
    [nameEl, valEl].forEach(e => { if(e){ e.style.fontFamily = ''; e.style.fontSize = ''; e.style.fontWeight = ''; } });
    if(nameEl) nameEl.style.color = '';
    if(!st) return;
    el.style.background = st.fill || '';
    if(st.border){
      el.style.borderColor = st.border.color || '';
      el.style.borderWidth = (st.border.width != null ? st.border.width + 'px' : '');
      el.style.borderStyle = st.border.style || '';
    }
    if(st.font){
      [nameEl, valEl].forEach(e => {
        if(!e) return;
        e.style.fontFamily = st.font.family || '';
        e.style.fontSize = st.font.size ? st.font.size + 'px' : '';
        e.style.fontWeight = st.font.weight || '';
      });
      if(nameEl) nameEl.style.color = st.font.color || '';
    }
  }

  // ---------- plug / socket ----------
  function syncAutoConnections(){
    syncActiveIntoRegistry();

    // wipe everything auto-generated from a previous sync, everywhere
    canvases.forEach(c => {
      const autoAliasIds = new Set(c.nodes.filter(n => n.type === 'alias' && n.auto).map(n => n.id));
      c.nodes = c.nodes.filter(n => !(n.type === 'alias' && n.auto));
      c.edges = c.edges.filter(e => !e.auto && !autoAliasIds.has(e.from) && !autoAliasIds.has(e.to));
    });

    // every plug-tagged rectangle, system-wide, tagged with which canvas (and its order) it lives on
    const plugSources = [];
    canvases.forEach((c, idx) => {
      c.nodes.forEach(n => {
        if(n.type === 'value' && n.plug && n.plug.trim() !== ''){
          plugSources.push({ canvasId: c.id, canvasIndex: idx, node: n });
        }
      });
    });

    canvases.forEach(c => {
      c.nodes.filter(n => n.type === 'operator' && n.socket && n.socket.trim() !== '').forEach(op => {
        const key = op.socket.trim().toLowerCase();
        const matches = plugSources.filter(p => p.node.plug.trim().toLowerCase() === key);
        const sameCanvas = matches.filter(p => p.canvasId === c.id);
        const cross = matches
          .filter(p => p.canvasId !== c.id)
          .sort((a,b) => (a.canvasIndex - b.canvasIndex) || (a.node.x - b.node.x) || (a.node.y - b.node.y));

        sameCanvas.forEach(p => {
          const already = c.edges.find(e => e.from === p.node.id && e.to === op.id);
          if(!already) c.edges.push({ id: uid('e'), from: p.node.id, to: op.id, auto: true });
        });

        cross.forEach((p, i) => {
          const aliasId = uid('n');
          c.nodes.push({
            id: aliasId, type: 'alias', auto: true,
            x: Math.max(0, op.x - 200 + i * 2), y: op.y + i * 74,
            w: 170, h: 64,
            sourceCanvasId: p.canvasId, sourceNodeId: p.node.id, plug: ''
          });
          c.edges.push({ id: uid('e'), from: aliasId, to: op.id, auto: true });
        });
      });
    });

    loadCanvasState(canvases.find(cc => cc.id === activeCanvasId));
  }

  function collectAllTagNames(){
    const values = new Set();
    canvases.forEach(c => {
      const pool = c.id === activeCanvasId ? nodes : c.nodes;
      pool.forEach(n => {
        if(n.type === 'value' && n.plug && n.plug.trim() !== '') values.add(n.plug.trim());
        if(n.type === 'operator' && n.socket && n.socket.trim() !== '') values.add(n.socket.trim());
      });
    });
    return Array.from(values).sort((a,b) => a.localeCompare(b));
  }

  function showTagEditor(node, kind){

    const popup = document.createElement('div');

    input.value = kind === 'plug' ? (node.plug || '') : (node.socket || '');

    let docListener = null;
    function finish(commit){
      if(docListener) document.removeEventListener('mousedown', docListener);
      if(commit){
        const trimmed = input.value.trim();
        const oldVal = kind === 'plug' ? (node.plug || '') : (node.socket || '');
        if(trimmed !== oldVal){
          if(kind === 'plug') guarded(() => fm.setPlug(node.id, trimmed));
          else guarded(() => fm.setSocket(node.id, trimmed));
        }
      }
      closePicker();
      render();
    }
    input.addEventListener('keydown', (ev) => {
      ev.stopPropagation();
      if(ev.key === 'Enter'){ finish(true); }
      if(ev.key === 'Escape'){ finish(false); }
    });
    clearBtn.addEventListener('mousedown', (ev) => ev.stopPropagation());
    clearBtn.addEventListener('click', () => { input.value = ''; finish(true); });

    setTimeout(() => {
      docListener = (ev) => { if(!popup.contains(ev.target)) finish(true); };
      document.addEventListener('mousedown', docListener);
    }, 0);
  }

  // ---------- escaping & validation (shared: src/shared/escaping.js, used by both apps) ----------
  // Anything that came from a file (names, labels, kinds — including shared/community
  // content) must never be parsed as markup: escape it (text), coerce it (numbers), or
  // validate it (colours) before it goes into a markup string.
  // escapeXml(s): for HTML/SVG markup — escapes & < > " and '.
  // escapeXml(s, true): for XML 1.0 files (the .xlsx writer) — also drops the characters
  // XML 1.0 forbids, and leaves ' as is (the writer quotes attributes with ").
  function escapeXml(s, xmlFile){
    let t = String(s);
    if(xmlFile) t = t.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '');
    t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    return xmlFile ? t : t.replace(/'/g, '&#39;');
  }
  function safeNum(v, fallback){ const n = Number(v); return Number.isFinite(n) ? n : (fallback || 0); }
  function safeColor(c, fallback){ return (typeof c === 'string' && /^#[0-9a-f]{3,8}$/i.test(c)) ? c : fallback; }

  // ---------- templates ----------

  function buildPreviewSVG(previewNodes, previewEdges){
    // Coordinates go into a markup string below — coerce them to numbers first.
    previewNodes = (previewNodes || []).map(n => Object.assign({}, n, { x: safeNum(n.x), y: safeNum(n.y), w: safeNum(n.w, 170), h: safeNum(n.h, 64) }));
    if(previewNodes.length === 0) return '<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg"></svg>';
    const minX = Math.min(...previewNodes.map(n => n.x));
    const minY = Math.min(...previewNodes.map(n => n.y));
    const maxX = Math.max(...previewNodes.map(n => n.x + n.w));
    const maxY = Math.max(...previewNodes.map(n => n.y + n.h));
    const pad = 30;
    const vx = minX - pad, vy = minY - pad, vw = (maxX - minX) + pad*2, vh = (maxY - minY) + pad*2;

    let svg = `<svg viewBox="${vx} ${vy} ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">`;
    svg += '<defs><marker id="pvArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker></defs>';

    previewEdges.forEach(e => {
      const a = previewNodes.find(n => n.id === e.from), b = previewNodes.find(n => n.id === e.to);
      if(!a || !b) return;
      const { p1, p2 } = edgePath(rectOf(a), rectOf(b));
      svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#94a3b8" stroke-width="2" marker-end="url(#pvArrow)"/>`;
    });

    previewNodes.forEach(n => {
      let fill = '#ffffff', stroke = '#cbd5e1', dash = '';
      if(n.type === 'operator'){ fill = '#fef3c7'; stroke = '#f59e0b'; }
      else if(n.type === 'periodShift'){ fill = '#fdf4ff'; stroke = '#a855f7'; }
      else if(n.type === 'alias'){ fill = '#ecfeff'; stroke = '#0891b2'; dash = 'stroke-dasharray="5 3"'; }
      else if(n.type === 'blockInstance'){ fill = '#f5f3ff'; stroke = '#7c3aed'; }
      else if(n.blockRole === 'input'){ stroke = '#22c55e'; }
      else if(n.blockRole === 'output'){ stroke = '#3b82f6'; }
      svg += `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="1.5" ${dash}/>`;
      const label = n.type === 'operator' ? n.text : (n.type === 'periodShift' ? shiftLabel(typeof n.shift === 'number' ? n.shift : -1) : (n.type === 'alias' ? '🔗' : (n.type === 'blockInstance' ? '(block)' : (parseNode(n).name || ''))));
      svg += `<text x="${n.x + n.w/2}" y="${n.y + n.h/2 + 4}" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1e293b">${escapeXml(label)}</text>`;
    });

    svg += '</svg>';
    return svg;
  }

  function importTemplatesFromFile(file, onDone){
    const reader = new FileReader();
    reader.onload = () => {
      openFmFileText(reader.result, ['fmIDE-templates'], (data) => {
      if(!Array.isArray(data.templates)){
        showMessage('That templates file has no "templates" list.');
        return;
      }
      let count = 0;
      data.templates.forEach(t => {
        if(!t || typeof t.name !== 'string' || !t.name.trim() || !t.data || (t.kind !== 'module' && t.kind !== 'system')) return;
        TEMPLATES.push({
          id: 'usr' + (nextTemplateId++),
          name: t.name.trim(),
          description: typeof t.description === 'string' ? t.description : '',
          group: (typeof t.group === 'string' && t.group.trim()) ? t.group.trim() : 'My Templates',
          kind: t.kind, builtin: false, data: t.data
        });
        count++;
      });
      if(count === 0) showMessage("That file didn't contain any templates fmIDE could recognize.");
      onDone(count);
      });
    };
    reader.onerror = () => showMessage('Could not read that file.');
    reader.readAsText(file);
  }

  // ---------- rectangle formatting presets ----------
  function styleSummary(st){
    if(!st) return '(no formatting set)';
    const parts = [];
    if(st.numberFormat && st.numberFormat.kind && st.numberFormat.kind !== 'general') parts.push(st.numberFormat.kind);
    if(st.fill) parts.push('fill');
    if(st.border && st.border.style && st.border.style !== 'none') parts.push(st.border.style + ' border');
    if(st.font && st.font.family) parts.push('custom font');
    return parts.length ? parts.join(', ') : 'general formatting';
  }

          : `<strong>${escapeXml(p.name)}</strong><span class="sub">${escapeXml(styleSummary(p.style))}</span>`;
        const swatch = document.createElement('span');
        const st0 = p.style || {};
        swatch.textContent = 'Aa 1,234';
        // Individual style properties with validated values (never a concatenated cssText).
        swatch.style.display = 'inline-block'; swatch.style.marginLeft = '8px'; swatch.style.padding = '1px 8px';
        swatch.style.borderRadius = '3px'; swatch.style.fontSize = '12px';

        swatch.style.background = safeColor(st0.fill, '#fff');
        swatch.style.color = safeColor(st0.font && st0.font.color, '#1e2937');
        swatch.style.fontWeight = ['normal', '600', '700', 'bold'].includes(String(st0.font && st0.font.weight)) ? String(st0.font.weight) : 'normal';
