      b.w = portNodeWidth(b.w, 150, 190);
      b.ins = bp.inputs.map((p, i) => Object.assign({ name: rectParts(p).name || ('in' + i) }, inAt(PORT_HEADER_H + i * PORT_ROW_H)));
      b.outs = bp.outputs.map((p, i) => Object.assign({ name: rectParts(p).name || ('out' + i), nodeId: cleanId(p.id) }, outAt(PORT_HEADER_H + i * PORT_ROW_H)));
    } else if(type === 'function'){
      const fp = functionPorts(vm, canvas, n);
      b.header = fp.title; b.fnName = fp.name; b.warn = fp.problem;
      b.h = functionNodeHeight(fp.params.length, !!fp.problem);
      b.w = portNodeWidth(b.w, 150, 190);
      b.inTop = PORT_HEADER_H + (fp.problem ? PORT_ROW_H : 0);
      b.ins = fp.params.map((name, i) => Object.assign({ name }, inAt(b.inTop + i * PORT_ROW_H)));
      b.outs = [Object.assign({ name: '' }, outAt(b.inTop))];
    }
    boxes.set(id, b);
    list.push(b);
  });
  // The order an operator reads its inputs in (the calculation's, left to right), for the badges.
  const compiledCanvas = vm.ir.canvases.get(canvasId);
  const edges = [];
  canvas.edges.forEach((e, i) => {
    const a = boxes.get(cleanId(e.from)), b = boxes.get(cleanId(e.to));
    if(!a || !b) return;
    let { p1, p2, d } = edgePath(rectOf(a), rectOf(b));
    const fromPort = e.fromPort != null ? e.fromPort : (a.type === 'function' ? 0 : null);
    if(fromPort != null){
      const pp = Number.isInteger(Number(fromPort)) ? a.outs[Number(fromPort)] : null;
      if(pp) p1 = { x: pp.x, y: pp.y };
    }
    if(e.toPort != null){
      const pp = Number.isInteger(Number(e.toPort)) ? b.ins[Number(e.toPort)] : null;
      if(pp) p2 = { x: pp.x, y: pp.y };
    }
    if(e.fromPort != null || e.toPort != null || a.type === 'function') d = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
    let badge = null;
    if(b.type === 'operator' && !b.portop && compiledCanvas){
      const compiledNode = compiledCanvas.byId.get(b.id);
      const order = compiledNode && compiledNode.inputs ? compiledNode.inputs : [];
      if(order.length > 1){
        const idx = order.findIndex(x => x === e || (x.id != null && e.id != null && cleanId(x.id) === cleanId(e.id)));
        if(idx >= 0) badge = { x: p1.x + (p2.x - p1.x) * 0.78, y: p1.y + (p2.y - p1.y) * 0.78, n: idx + 1 };
      }
    }
    edges.push({ id: cleanId(e.id) || ('e' + i), from: a.id, to: b.id, d, p1, p2, auto: !!e.auto, badge, edge: e });
  });
  // The canvas's extent, for Fit.
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  list.forEach(b => { x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y - 22); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h + 26); });
  const bounds = list.length ? { x: x0, y: y0, w: x1 - x0, h: y1 - y0 } : { x: 0, y: 0, w: 400, h: 300 };
  return { canvasId, nodes: list, byId: boxes, edges, bounds };
}

// ---------- what each node says ----------
// nodeTexts(vm, canvasId, period) → Map(node id → { lines: [{ text, cls }], result, chips, style })
// for one period: the numbers on the canvas follow `period`, so showing another one is only a
// matter of passing it.
function nodeTexts(vm, canvasId, period, layout){
  const canvas = vm.byId.get(canvasId);
  const out = new Map();
  if(!canvas) return out;
  const lay = layout || canvasLayout(vm, canvasId);
  lay.nodes.forEach(b => {
    const n = b.node, t = { lines: [], result: null, chips: [], ports: null };
    const res = nodeResult(vm, canvasId, b.id, period);
    const resultText = () => res.value !== undefined ? '= ' + formatNum(res.value) : (res.error ? '?' : '');
    if(b.type === 'value'){
      const parts = rectParts(n);
      const plugs = plugsOf(n).map(p => cleanText(p, 60));
      if(plugs.length) t.chips.push({ text: '🔌 ' + plugs.join(' · '), cls: 'plug', at: 'top' });
      if(n.blockRole === 'input') t.chips.push({ text: '→ IN', cls: 'role-in', at: 'bottom' });
      else if(n.blockRole === 'output') t.chips.push({ text: 'OUT →', cls: 'role-out', at: 'bottom' });
      else if(n.blockRole === 'index') t.chips.push({ text: '# IDX', cls: 'role-index', at: 'bottom' });
      if(parts.name) t.lines.push({ text: parts.name, cls: 'name' });
      if(!cvHasIncoming(canvas, b.id)){
        const lit = effectiveLiteral(n, period);
        t.lines.push({ text: (Array.isArray(n.periodValues) ? '📈 ' : '') + formatFor(vm, canvas, n, lit !== null ? lit : 0), cls: 'value literal' });
        t.input = true;
      } else if(res.value !== undefined){
        t.lines.push({ text: '= ' + formatFor(vm, canvas, n, res.value), cls: 'value computed' });
      } else if(res.error){
        t.lines.push({ text: '?', cls: 'value error' });
      }
      const u = unitText(vm, canvas, n);
      if(u.text) t.lines.push({ text: u.text, cls: 'unit' + (u.auto ? ' auto' : '') });
      t.style = styleOf(vm, canvas, n);
    } else if(b.type === 'alias'){
      const plugs = plugsOf(n).map(p => cleanText(p, 60));
      if(plugs.length) t.chips.push({ text: '🔌 ' + plugs.join(' · '), cls: 'plug', at: 'top' });
      const src = vm.byId.get(cleanId(n.sourceCanvasId));
      const srcNode = src ? src.nodeById.get(cleanId(n.sourceNodeId)) : null;
      let label;
      if(!n.sourceCanvasId || !n.sourceNodeId) label = '🔗 (not linked)';
      else if(!src) label = '🔗 (canvas missing)';
      else if(!srcNode) label = '🔗 (rectangle missing)';
      else {
        const srcName = rectParts(srcNode).name || '(unnamed)';
        label = src.id === canvasId ? '🔗 ' + srcName : '🔗 ' + src.name + ' ▸ ' + srcName;
      }
      t.lines.push({ text: label, cls: 'name' });
      const rt = resultText();
      if(rt) t.lines.push({ text: rt, cls: 'value ' + (res.error ? 'error' : 'computed') });
      if(src && srcNode){ const u = unitText(vm, src, srcNode); if(u.text) t.lines.push({ text: u.text, cls: 'unit auto' }); }
    } else if(b.type === 'periodShift'){
      t.lines.push({ text: shiftLabel(typeof n.shift === 'number' && isFinite(n.shift) ? n.shift : -1), cls: 'shift' });
      t.result = resultText();
    } else if(b.type === 'operator'){
      t.lines.push({ text: cleanText(n.text, 20), cls: 'opsym' + (operatorForSymbol(n.text) && operatorForSymbol(n.text).fn ? ' word' : '') });
      if(typeof n.socket === 'string' && n.socket.trim()) t.chips.push({ text: '⚡ ' + cleanText(n.socket, 60), cls: 'socket', at: 'top' });
      t.result = resultText();
    } else if(b.type === 'blockInstance'){
      t.ports = b.outs.map((o, i) => { const r = portResult(vm, canvasId, b.id, i, period); return r.value !== undefined ? '=' + formatNum(r.value) : (r.error ? '?' : ''); });
    } else if(b.type === 'function'){
      t.result = res.value !== undefined ? '= ' + formatNum(res.value) : ((res.error || b.warn) ? '?' : '');
      const u = b.warn ? { text: '' } : unitText(vm, canvas, n);
      t.unit = u.text;
    }
    out.set(b.id, t);
  });
  return out;
}

// ---------- drawing ----------
const FONT_FAMILY = /^[A-Za-z0-9 ,'-]{1,80}$/;
const BORDER_STYLE = { solid: '', dashed: '6 4', dotted: '2 3' };
function el(name, attrs, text){
  const e = document.createElementNS(SVGNS, name);
  if(attrs) for(const k in attrs) if(attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, String(attrs[k]));
  if(text !== undefined) e.textContent = text;
  return e;
}
// Text cut to about `width` pixels at `size`, with an ellipsis.
function fit(text, width, size, mono){
  const per = size * (mono ? 0.62 : 0.56);
  const max = Math.max(1, Math.floor(width / per));
  return text.length > max ? text.slice(0, Math.max(1, max - 1)) + '…' : text;
}
// A name over at most two lines, broken between words.
function nameLines(text, width, size){
  const per = size * 0.56, max = Math.max(1, Math.floor(width / per));
  if(text.length <= max) return [text];
  const words = text.split(/\s+/);
  let first = '';
  while(words.length && (first ? first + ' ' + words[0] : words[0]).length <= max) first = first ? first + ' ' + words.shift() : words.shift();
  if(!first) return [fit(text, width, size)];
  return [first, fit(words.join(' '), width, size)];
}

// Draws `layout` into the SVG group `g` (emptied first). Each node is a <g class="cv-node">
// with data-id, for the caller's taps.
function drawCanvas(g, layout, texts){
  while(g.firstChild) g.removeChild(g.firstChild);
  const edgesG = el('g', { class: 'cv-edges' });
  const nodesG = el('g', { class: 'cv-nodes' });
  g.appendChild(edgesG); g.appendChild(nodesG);
  layout.edges.forEach(e => {
    const eg = el('g', { class: 'cv-edge' + (e.auto ? ' auto' : ''), 'data-id': e.id, 'data-from': e.from, 'data-to': e.to });
    eg.appendChild(el('path', { class: 'line', d: e.d, 'marker-end': e.auto ? 'url(#cv-arrow-auto)' : 'url(#cv-arrow)' }));
    if(e.badge){
      const bg = el('g', { class: 'order-badge' });
      bg.appendChild(el('circle', { cx: e.badge.x, cy: e.badge.y, r: 8 }));
      bg.appendChild(el('text', { x: e.badge.x, y: e.badge.y + 3.5, 'text-anchor': 'middle' }, String(e.badge.n)));
      eg.appendChild(bg);
    }
    edgesG.appendChild(eg);
  });
  layout.nodes.forEach(b => nodesG.appendChild(drawNode(b, texts.get(b.id) || { lines: [], chips: [] })));
}

function drawNode(b, t){
  const g = el('g', { class: 'cv-node cv-' + b.type + (b.portop ? ' portop' : '') + (b.node.vertical ? ' vertical' : '') + (b.warn ? ' problem' : ''), 'data-id': b.id, transform: `translate(${b.x} ${b.y})` });
  const box = el('rect', { class: 'box', x: 0, y: 0, width: b.w, height: b.h, rx: b.type === 'operator' || b.type === 'periodShift' ? 10 : 8 });
  g.appendChild(box);
  const mid = b.w / 2;
  if(b.type === 'value' && t.style){
    const st = t.style;
    const fill = safeColor(st.fill, null);
    if(fill) box.style.fill = fill;
    if(st.border && typeof st.border === 'object'){
      const bc = safeColor(st.border.color, null);
      if(bc) box.style.stroke = bc;
      const bw = Number(st.border.width);
      if(Number.isFinite(bw) && bw >= 0 && bw <= 12) box.style.strokeWidth = String(bw);
      if(Object.prototype.hasOwnProperty.call(BORDER_STYLE, st.border.style) && BORDER_STYLE[st.border.style]) box.style.strokeDasharray = BORDER_STYLE[st.border.style];
    }
  }
  const font = b.type === 'value' && t.style && t.style.font && typeof t.style.font === 'object' ? t.style.font : null;
  const fontSize = font && Number(font.size) >= 6 && Number(font.size) <= 72 ? Number(font.size) : null;
  const styleText = (e, isName) => {
    if(!font) return;
    if(fontSize) e.style.fontSize = fontSize + 'px';
    if(font.weight === 'bold' || font.weight === 'normal') e.style.fontWeight = font.weight;
    if(typeof font.family === 'string' && FONT_FAMILY.test(font.family)) e.style.fontFamily = font.family;
    const c = isName ? safeColor(font.color, null) : null;
    if(c) e.style.fill = c;
  };
  if(b.type === 'value' || b.type === 'alias'){
    // Name (up to two lines), value, unit: centred as fmIDE's label.
    const rows = [];
    t.lines.forEach(line => {
      if(line.cls === 'name') nameLines(line.text, b.w - 20, fontSize || 14).forEach(x => rows.push({ text: x, cls: 'name', size: fontSize || 14 }));
      else if(line.cls.startsWith('value')) rows.push({ text: fit(line.text, b.w - 20, fontSize || 12, true), cls: line.cls, size: fontSize || 12 });
      else rows.push({ text: fit(line.text, b.w - 20, 10, true), cls: line.cls, size: 10 });
    });
    const gap = 2, total = rows.reduce((s, r) => s + r.size * 1.2, 0) + gap * Math.max(0, rows.length - 1);
    let y = b.h / 2 - total / 2;
    rows.forEach(r => {
      const tx = el('text', { class: r.cls, x: mid, y: y + r.size * 0.95, 'text-anchor': 'middle' }, r.text);
      styleText(tx, r.cls === 'name');
      g.appendChild(tx);
      y += r.size * 1.2 + gap;
    });
  } else if(b.type === 'operator' || b.type === 'periodShift'){
    const sym = t.lines[0] || { text: '', cls: '' };
    if(b.portop){
      g.appendChild(el('text', { class: 'opsym word', x: mid, y: 18, 'text-anchor': 'middle' }, fit(sym.text, b.w - 12, 13)));
      b.ins.forEach((p, i) => {
        g.appendChild(el('circle', { class: 'port', cx: p.x - b.x, cy: p.y - b.y, r: 5 }));
        g.appendChild(el('text', { class: 'io-label', x: 20, y: PORT_HEADER_H + i * PORT_ROW_H + 14 }, fit(p.name, b.w - 28, 11)));
      });
    } else {
      g.appendChild(el('text', { class: sym.cls, x: mid, y: b.h / 2 + (sym.cls.indexOf('word') >= 0 || b.type === 'periodShift' ? 5 : 8), 'text-anchor': 'middle' }, fit(sym.text, b.w - 6, sym.cls.indexOf('word') >= 0 ? 13 : 24, true)));
    }
    if(t.result){
      const rg = el('g', { class: 'result' + (t.result === '?' ? ' err' : '') });
      const w = Math.max(24, t.result.length * 6.8 + 12);
      rg.appendChild(el('rect', { x: mid - w / 2, y: b.h + 5, width: w, height: 16, rx: 4 }));
      rg.appendChild(el('text', { x: mid, y: b.h + 17, 'text-anchor': 'middle' }, t.result));
      g.appendChild(rg);
    }
  } else if(b.type === 'blockInstance' || b.type === 'function'){
    g.appendChild(el('rect', { class: 'header', x: 0, y: 0, width: b.w, height: PORT_HEADER_H, rx: 6 }));
    g.appendChild(el('text', { class: 'header-text', x: mid, y: 17, 'text-anchor': 'middle' }, fit(b.header || '', b.w - 24, 12)));
    if(b.warn){
      g.appendChild(el('text', { class: 'warning', x: 8, y: PORT_HEADER_H + 14 }, b.warn === 'unreadable' ? "⚠ Formula can't be read" : '⚠ Definition missing'));
    }
    const top = b.type === 'function' ? b.inTop : PORT_HEADER_H;
    b.ins.forEach((p, i) => {
      g.appendChild(el('circle', { class: 'port', cx: p.x - b.x, cy: p.y - b.y, r: 5 }));
      g.appendChild(el('text', { class: 'io-label', x: 16, y: top + i * PORT_ROW_H + 14 }, fit(p.name, (b.type === 'function' ? b.w * 0.5 : b.w / 2) - 16, 11)));
    });
    b.outs.forEach((p, i) => {
      g.appendChild(el('circle', { class: 'port', cx: p.x - b.x, cy: p.y - b.y, r: 5 }));
      if(b.type === 'blockInstance'){
        const v = t.ports && t.ports[i] ? ' ' + t.ports[i] : '';
        g.appendChild(el('text', { class: 'io-label out', x: b.w - 16, y: top + i * PORT_ROW_H + 14, 'text-anchor': 'end' }, fit(p.name + v, b.w / 2 - 16, 11)));
      } else {
        g.appendChild(el('text', { class: 'io-value' + (t.result === '?' ? ' err' : ''), x: b.w - 16, y: top + 14, 'text-anchor': 'end' }, fit(t.result || '', b.w * 0.45 - 16, 11, true)));
        if(t.unit) g.appendChild(el('text', { class: 'unit', x: b.w - 16, y: top + 30, 'text-anchor': 'end' }, fit(t.unit, b.w * 0.45 - 16, 10, true)));
      }
    });
  }
  (t.chips || []).forEach((c, i) => {
    const w = c.text.length * 6.2 + 14;
    const y = c.at === 'top' ? -20 : b.h + 5 + (i > 0 && c.at === 'bottom' ? 0 : 0);
    const cg = el('g', { class: 'chip ' + c.cls });
    cg.appendChild(el('rect', { x: mid - w / 2, y, width: w, height: 15, rx: 7.5 }));
    cg.appendChild(el('text', { x: mid, y: y + 11, 'text-anchor': 'middle' }, c.text));
    g.appendChild(cg);
  });
  return g;
}

// The arrow heads, once per SVG (fmIDE's markers).
function canvasDefs(svg){
  if(svg.querySelector('defs.cv-defs')) return;
  const defs = el('defs', { class: 'cv-defs' });
  [['cv-arrow', '#64748b'], ['cv-arrow-auto', '#8b5cf6']].forEach(([id, colour]) => {
    const m = el('marker', { id, markerWidth: 9, markerHeight: 9, refX: 7, refY: 3.5, orient: 'auto' });
    m.appendChild(el('path', { d: 'M0,0 L7,3.5 L0,7 Z', fill: colour }));
    defs.appendChild(m);
  });
  svg.insertBefore(defs, svg.firstChild);
}
// ---------- showcase files (shared: src/shared/showcase.js; the showcase viewer, later fmIDE and tools/make-viewers.js) ----------
// A showcase says what a viewer shows (docs/viewer-brief.md, docs/file-formats.md): kind
// "fmIDE-showcase", version 1, in two forms — for one model (which canvases, boards, sliders,
// scenarios, the title), and the recipe form ("form": "recipe") that names rectangles by name
// for many models at once. The model itself is never in it.
//
// Everything here is read from a file that may come from anyone: texts are kept as plain
// strings cut to their limits (shown later with textContent only), numbers forced to be
// numbers, ids checked against a pattern and only ever compared. Nothing is run.

const SHOWCASE_KIND = 'fmIDE-showcase';
const SHOWCASE_FORMATS = { 'fmIDE-showcase': { current: 1, label: 'fmIDE showcase' } };
// One step per version, upgrading a copy (none yet: version 1 is the first).
const SHOWCASE_MIGRATIONS = { 'fmIDE-showcase': {} };
const SHOWCASE_LIMITS = { id: 60, title: 80, description: 400, author: 80, licence: 60, canvases: 500, canvasId: 200,
  scenario: 120, file: 120, periods: 10000, range: 100 };

const isObject = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
// A text from the file: a string (or number), control characters out, spaces at the ends
// trimmed, at most `max` characters; one line unless `multiline`.
function showcaseText(v, max, multiline){
  if(typeof v !== 'string' && typeof v !== 'number') return '';
  let t = String(v).replace(/\r\n?/g, '\n');
  t = multiline ? t.replace(/[\u0000-\u0009\u000b-\u001f\u007f]/g, '').replace(/\n{3,}/g, '\n\n')
    : t.replace(/[\u0000-\u001f\u007f]+/g, ' ');
  t = t.trim();
  return t.length > max ? t.slice(0, max).trim() : t;
}
// A file name for a download: no characters a file name can't hold, at most 120, ending .xlsx.
function showcaseFileName(v){
  let t = showcaseText(v, SHOWCASE_LIMITS.file).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').replace(/^[.\s]+|[.\s]+$/g, '');
  if(!t) return '';
  if(!/\.xlsx$/i.test(t)) t = t.slice(0, SHOWCASE_LIMITS.file - 5) + '.xlsx';
  return t;
}
const SHOWCASE_ID = /^[A-Za-z0-9-]{1,60}$/;

// Reads a parsed file: { error } or { data (an upgraded copy), fromVersion, newer, recipe }.
function readShowcaseData(raw){
  if(!isObject(raw)) return { error: "That file isn't a showcase." };
  if(raw.kind !== SHOWCASE_KIND){
    if(typeof raw.kind === 'string') return { error: 'That is an fmIDE file of another kind ("' + raw.kind.slice(0, 40) + '"), not a showcase.' };
    return { error: "That file isn't a showcase." };
  }
  const data = JSON.parse(JSON.stringify(raw));
  const { fromVersion, newer } = upgradeFileData(data, SHOWCASE_KIND, SHOWCASE_FORMATS, SHOWCASE_MIGRATIONS);
  return { data, fromVersion, newer, recipe: data.form === 'recipe' };
}

// The parts both forms share. `problems` gathers what was left out, in plain words.
function cleanCommon(d, problems, recipe){
  const out = {
    title: showcaseText(d.title, SHOWCASE_LIMITS.title),
    description: showcaseText(d.description, SHOWCASE_LIMITS.description, true),
    author: showcaseText(d.author, SHOWCASE_LIMITS.author),
    licence: showcaseText(d.licence, SHOWCASE_LIMITS.licence),
    mark: d.mark !== false,
  };
  if(d.mark !== undefined && typeof d.mark !== 'boolean') problems.push('"mark" is not true or false: the mark is shown.');
  if(recipe && out.title && !/\{model\}/.test(out.title) && /[{}]/.test(out.title)) problems.push('The title uses braces other than {model}: they are shown as they are.');
  return out;
}
// A board file kept as data (fmGraph's own reader takes it in the viewer's Board, phase V2).
function cleanBoardsField(v, problems, template){
  if(v === undefined || v === null) return null;
  if(!isObject(v) || v.kind !== 'fmIDE-graph-board' || !Number.isInteger(v.version) || v.version < 1){
    problems.push('"boards" is not an fmGraph board file: no boards.');
    return null;
  }
  const isTemplate = v.form === 'template';
  if(template && !isTemplate){ problems.push('A recipe\'s "boards" must be the board file\'s template form (rectangles by name): no boards.'); return null; }
  if(!template && isTemplate){ problems.push('"boards" is the template form, which is for recipes: no boards.'); return null; }
  return JSON.parse(JSON.stringify(v));
}

// A showcase for one model: { value, problems }.
// value: { kind, version, id, title, description, author, licence, mark,
//          canvases: { show: [ids] | null, start: id | null }, boards, play, periods, excel }
function cleanShowcase(d){
  const problems = [];
  const v = Object.assign({ kind: SHOWCASE_KIND, version: 1 }, cleanCommon(d, problems, false));
  v.id = null;
  if(d.id !== undefined){
    if(typeof d.id === 'string' && SHOWCASE_ID.test(d.id)) v.id = d.id;
    else problems.push('The id may hold only letters, digits and dashes (at most 60): it is left out.');
  }
  v.canvases = { show: null, start: null };
  if(d.canvases !== undefined){
    if(!isObject(d.canvases)) problems.push('"canvases" is not a list of canvases: every canvas is shown.');
    else {
      if(d.canvases.show !== undefined){
        if(!Array.isArray(d.canvases.show)) problems.push('"canvases.show" is not a list: every canvas is shown.');
        else {
          const ids = [];
          d.canvases.show.forEach(x => { if(typeof x === 'string' && x && x.length <= SHOWCASE_LIMITS.canvasId && !ids.includes(x) && ids.length < SHOWCASE_LIMITS.canvases) ids.push(x); });
          if(ids.length < d.canvases.show.length) problems.push('Some entries of "canvases.show" are not canvas ids, or repeat: they are left out.');
          v.canvases.show = ids;
        }
      }
      if(d.canvases.start !== undefined){
        if(typeof d.canvases.start === 'string' && d.canvases.start && d.canvases.start.length <= SHOWCASE_LIMITS.canvasId) v.canvases.start = d.canvases.start;
        else problems.push('"canvases.start" is not a canvas id: the first canvas shown opens.');
      }
    }
  }
  v.boards = cleanBoardsField(d.boards, problems, false);
  v.play = null;
  if(d.play !== undefined){
    const from = isObject(d.play) ? showcaseText(d.play.from, SHOWCASE_LIMITS.scenario) : '';
    const to = isObject(d.play) ? showcaseText(d.play.to, SHOWCASE_LIMITS.scenario) : '';
    if(from && to) v.play = { from, to };
    else problems.push('"play" needs both ends, from and to: left out.');
  }
  v.periods = null;
  if(d.periods !== undefined){
    const p = d.periods;
    const from = isObject(p) ? Number(p.from) : NaN, to = isObject(p) ? Number(p.to) : NaN;
    if(isObject(p) && p.mode === 'range' && Number.isInteger(from) && Number.isInteger(to) && from >= 0 && to >= from && to < SHOWCASE_LIMITS.periods) v.periods = { mode: 'range', from, to };
    else problems.push('"periods" is not a range of periods (from and to, counted from 0): every period is shown.');
  }
  v.excel = null;
  if(d.excel !== undefined){
    const file = isObject(d.excel) ? showcaseFileName(d.excel.file) : '';
    if(file) v.excel = { file };
    else problems.push('"excel.file" is not a file name: left out.');
  }
  return { value: v, problems };
}

// A recipe: { value, problems }. value: { kind, version, form: 'recipe', title, description,
// author, licence, mark, boards (template form) | null, auto: { sliders, bars, range } | null }.
function cleanShowcaseRecipe(d){
  const problems = [];
  const v = Object.assign({ kind: SHOWCASE_KIND, version: 1, form: 'recipe' }, cleanCommon(d, problems, true));
  v.boards = cleanBoardsField(d.boards, problems, true);
  v.auto = null;
  if(d.auto !== undefined){
    if(!isObject(d.auto)) problems.push('"auto" is not a set of choices: left out.');
    else {
      const sliders = d.auto.sliders === 'inputs' ? 'inputs' : null;
      const bars = d.auto.bars === 'outputs' ? 'outputs' : null;
      if(d.auto.sliders !== undefined && !sliders) problems.push('"auto.sliders" can only be "inputs": no sliders chosen.');
      if(d.auto.bars !== undefined && !bars) problems.push('"auto.bars" can only be "outputs": no bars chosen.');
      let range = 50;
      if(d.auto.range !== undefined){
        const r = Number(d.auto.range);
        if(Number.isFinite(r) && r >= 1 && r <= SHOWCASE_LIMITS.range) range = r;
        else problems.push('"auto.range" is not a percentage from 1 to 100: 50 is used.');
      }
      v.auto = { sliders, bars, range };
    }
  }
  return { value: v, problems };
}

// A showcase against the model it shows: the canvases listed (in the showcase's order, those the
// model has; every canvas when it names none), the one to open on, the periods shown.
// canvases: [{ id, name }] of the model; periodCount: the model's periods.
// Returns { canvases: [ids], start, periods: [indexes], problems }.
function resolveShowcase(sc, canvases, periodCount){
  const problems = [];
  const known = new Set(canvases.map(c => c.id));
  let show = canvases.map(c => c.id);
  if(sc && sc.canvases && Array.isArray(sc.canvases.show)){
    const kept = sc.canvases.show.filter(id => known.has(id));
    const missing = sc.canvases.show.length - kept.length;
    if(missing) problems.push(missing === 1 ? 'One canvas the showcase names is not in the model: it is left out.' : missing + ' canvases the showcase names are not in the model: they are left out.');
    if(kept.length) show = kept;
    else if(sc.canvases.show.length) problems.push('None of the canvases the showcase names is in the model: every canvas is shown.');
  }
  let start = show[0] || null;
  if(sc && sc.canvases && sc.canvases.start){
    if(show.includes(sc.canvases.start)) start = sc.canvases.start;
    else problems.push('The canvas to open on is not among those shown: the first one opens.');
  }
  const count = Math.max(1, Number.isInteger(periodCount) ? periodCount : 1);
  let periods = [];
  for(let i = 0; i < count; i++) periods.push(i);
  if(sc && sc.periods){
    const from = Math.min(sc.periods.from, count - 1), to = Math.min(sc.periods.to, count - 1);
    if(sc.periods.from > count - 1) problems.push('The periods the showcase names are past the model\'s last: every period is shown.');
    else periods = periods.filter(p => p >= from && p <= to);
  }
  return { canvases: show, start, periods, problems };
}
// ---------- pointer input: mouse, touch and pen (shared: src/shared/pointer-input.js, used by both apps) ----------
// Step 9 (docs/step9-touch.md). A mouse keeps the mouse events it always had: an action starts
// on mousedown and follows mousemove / mouseup. A finger or pen starts the same action on
// pointerdown and follows that one pointer (pointermove / pointerup / pointercancel). After a
// tap the browser also sends copies of it as mouse events; code that acts on a press ignores
// those (isEmulatedMouse), while everything else (closing a pop-up on a tap elsewhere) still
// sees them as before. Also here: telling a hold from a drag or a tap (waitForHold), double-tap
// sending a double-click, and body.touch-input (larger touch areas, text boxes that don't make
// the browser zoom).
const touchPointersDown = new Set();
let lastTouchLift = null; // { x, y, time } where the last finger or pen lifted (time: the event's own)
window.addEventListener('pointerdown', (ev) => { if(ev.pointerType !== 'mouse') touchPointersDown.add(ev.pointerId); }, true);
function noteTouchLift(ev){
  if(ev.pointerType === 'mouse') return;
  touchPointersDown.delete(ev.pointerId);
  lastTouchLift = { x: ev.clientX, y: ev.clientY, time: ev.timeStamp };
}
window.addEventListener('pointerup', noteTouchLift, true);
window.addEventListener('pointercancel', noteTouchLift, true);

// A mouse event the browser made from a finger or pen: one is down, or one just lifted there.
// Timed by the events' own timestamps, not when the page gets to them: a copy carries the
// touch's time, so a page busy for a while after a tap (a big model, a slow phone) still knows it.
function isEmulatedMouse(ev){
  if(touchPointersDown.size) return true;
  const t = lastTouchLift;
  return !!t && Math.abs(ev.timeStamp - t.time) < 1000 && Math.abs(ev.clientX - t.x) < 30 && Math.abs(ev.clientY - t.y) < 30;
}

// Run handler(ev) when a mouse button, a finger or a pen goes down on el. Only the first
// finger acts: a second one, while the first is still down, starts nothing.
function onPress(el, handler){
  el.addEventListener('mousedown', (ev) => { if(!isEmulatedMouse(ev)) handler(ev); });
  el.addEventListener('pointerdown', (ev) => { if(ev.pointerType !== 'mouse' && touchPointersDown.size === 1) handler(ev); });
}

// What mousedown's preventDefault did (no text selection, no focus change). A finger's
// pointerdown is left alone: cancelling it would also cancel the mouse events copied from
// a tap, which the rest of the page (closing pop-ups) still listens for.
function pressDefault(ev){ if(ev.type !== 'pointerdown') ev.preventDefault(); }

// Follow the pointer that made downEvent until it lifts: onMove(ev) on each move, then
// onUp(ev, cancelled) once — cancelled when the browser took a finger over (ev is then the
// last move, or downEvent). Returns a function that stops following without calling onUp.
function followPointer(downEvent, onMove, onUp){
  if(downEvent.type !== 'pointerdown'){
    const up = (ev) => { stop(); onUp(ev, false); };
    function stop(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', up);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', up);
    return stop;
  }
  const id = downEvent.pointerId;
  let last = downEvent;
  const move = (ev) => { if(ev.pointerId !== id) return; last = ev; onMove(ev); };
  const up = (ev) => { if(ev.pointerId !== id) return; stop(); onUp(ev, false); };
  const cancel = (ev) => { if(ev.pointerId !== id) return; stop(); onUp(last, true); };
  const cancelNow = () => { stop(); onUp(last, true); };
  fingerActions.add(cancelNow);
  function stop(){
    fingerActions.delete(cancelNow);
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', cancel);
  }
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', cancel);
  return stop;
}

// What fingers and pens are doing now (followPointer): cancelFingerActions() cancels them all, as
// if the browser had taken the fingers over (onUp(last, true)) — a second finger starting a pinch
// (fmIDE's zoom, step 13b) undoes the drag the first one began. The fingers down are then no
// tap or double-tap either.
const fingerActions = new Set();
function cancelFingerActions(){
  Array.from(fingerActions).forEach(cancel => cancel());
  touchDownAt.clear();
  lastTap = null;
}

const HOLD_MS = 500;    // a press this long, with the finger kept still, is a hold
const HOLD_SLOP = 10;   // pixels a finger may wander and still be holding (or tapping)

// Follow a finger's press on something that also has a hold: onMoveFirst(ev) if the finger
// moves before HOLD_MS (the caller then starts its drag from downEvent), onHold() once it has
// been still that long, onRelease(ev, cancelled) if it lifts first (a tap).
function waitForHold(downEvent, { onHold, onMoveFirst, onRelease }){
  const x0 = downEvent.clientX, y0 = downEvent.clientY;
  let settled = false;
  const timer = setTimeout(() => { if(settle()) onHold(); }, HOLD_MS);
  const stop = followPointer(downEvent, (ev) => {
    if(Math.hypot(ev.clientX - x0, ev.clientY - y0) > HOLD_SLOP && settle() && onMoveFirst) onMoveFirst(ev);
  }, (ev, cancelled) => {
    if(settle(true) && onRelease) onRelease(ev, cancelled);
  });
  function settle(lifted){
    if(settled) return false;
    settled = true;
    clearTimeout(timer);
    if(!lifted) stop();
    return true;
  }
}

// Double-tap: two quick taps in about the same place send a double-click to what is under the
// finger, everywhere in the page. The browser's own copy of one (some browsers send it) is
// dropped, so nothing happens twice. A tap: the finger lifts within HOLD_MS, near where it went down.
const DOUBLE_TAP_MS = 400, DOUBLE_TAP_SLOP = 25;
const touchDownAt = new Map(); // pointerId -> { x, y, time }
let lastTap = null;
window.addEventListener('pointerdown', (ev) => {
  if(ev.pointerType !== 'mouse') touchDownAt.set(ev.pointerId, { x: ev.clientX, y: ev.clientY, time: performance.now() });
}, true);
window.addEventListener('pointercancel', (ev) => { touchDownAt.delete(ev.pointerId); lastTap = null; });
window.addEventListener('pointerup', (ev) => {
  if(ev.pointerType === 'mouse') return;
  const down = touchDownAt.get(ev.pointerId);
  touchDownAt.delete(ev.pointerId);
  const now = performance.now();
  if(!down || now - down.time > HOLD_MS || Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > HOLD_SLOP){ lastTap = null; return; }
  const prev = lastTap;
  if(prev && now - prev.time < DOUBLE_TAP_MS && Math.hypot(ev.clientX - prev.x, ev.clientY - prev.y) < DOUBLE_TAP_SLOP){
    lastTap = null;
    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    if(target) target.dispatchEvent(new MouseEvent('dblclick', { bubbles: true, cancelable: true, composed: true, detail: 2, clientX: ev.clientX, clientY: ev.clientY, view: window }));
  } else {
    lastTap = { x: ev.clientX, y: ev.clientY, time: now };
  }
});
window.addEventListener('dblclick', (ev) => {
  if(ev.isTrusted && isEmulatedMouse(ev)){ ev.stopImmediatePropagation(); ev.preventDefault(); }
}, true);

// Larger invisible touch areas (styles.css, body.touch-input): on a touchscreen (pointer:
// coarse) always; elsewhere (a touchscreen laptop) from the first touch until a mouse is used.
const coarsePointer = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
function setTouchInput(on){ if(document.body && document.body.classList.contains('touch-input') !== on) document.body.classList.toggle('touch-input', on); }
if(coarsePointer) setTouchInput(true);
window.addEventListener('pointerdown', (ev) => { setTouchInput(ev.pointerType !== 'mouse' || coarsePointer); }, true);
window.addEventListener('pointermove', (ev) => { if(ev.pointerType === 'mouse' && !coarsePointer) setTouchInput(false); }, true);
// ---------- phones: what fmGraph and fmIDE share on a phone (step 17, docs/step17-phones.md) ----------
// - isPhoneScreen(): a touchscreen whose shorter side is under PHONE_MAX_SIDE pixels, upright or
//   sideways. The screen's own size, not the window's: an on-screen keyboard never turns a
//   tablet into a phone.
// - tick(): a short vibration, where the phone lets a page vibrate (Android; Safari on an
//   iPhone gives web pages none, so there the tick is only seen).
// - createPhoneSlider(options): the phone's own slider. Made for a thumb:
//   · grab anywhere along it: the value moves with the finger from where it is, never jumping
//     to where the finger landed;
//   · finer by sliding the finger up, away from it, while dragging (×½, ×¼, ×⅒, FINE_STEPS),
//     coarse and exact in one gesture, without letting go;
//   · a notch at the base (the model's own number): the value settles there when the finger
//     passes close, with a tick; ticks at round marks too;
//   · the number large, right above the finger (which hides the knob), and "fine ×¼" over the
//     knob while finer; tapping the number lets it be typed; − and + step it, repeating faster while held;
//   · a double-tap goes back to the base; the arrow keys, Page Up / Down, Home and End work.
//   Each finger is followed by its own pointer id, so several sliders move at once.
//   With `vertical`, it stands on end (a fader: up is more) and sliding the finger sideways,
//   away from it, makes it finer.
// - shareFiles(files, title): the phone's own share sheet (Messages, Mail, AirDrop…); the
//   person picks where the files go, nothing is sent first. Where a browser can't share files,
//   they download instead.
// - keepScreenOn(): asks the browser to keep the screen on (Wake Lock) until the function it
//   returns is called; asked again when the page comes back into view.
// Nothing here touches the page until it is called.

const PHONE_MAX_SIDE = 600;
// How far up (pixels from where the finger went down) makes a drag finer, and by how much.
const FINE_STEPS = [[0, 1, ''], [50, 1 / 2, '×½'], [110, 1 / 4, '×¼'], [170, 1 / 10, '×⅒']];
const NOTCH_PX = 9;      // the value settles at the base within this many pixels of it
const MARKS = 8;         // about this many round marks along a slider tick
const TICK_GAP_MS = 45;  // ticks closer than this are one

function isPhoneScreen(){
  try{
    const coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    const side = Math.min(window.screen.width || Infinity, window.screen.height || Infinity);
    return coarse && side < PHONE_MAX_SIDE;
  }catch(e){ return false; }
}

function canVibrate(){
  return typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function';
}
function tick(){
  if(!canVibrate()) return false;
  try{ return navigator.vibrate(8) !== false; }catch(e){ return false; }
}

// The finer factor for a finger this many pixels above where it went down.
function fineStep(up){
  let pick = FINE_STEPS[0];
  FINE_STEPS.forEach(f => { if(up >= f[0]) pick = f; });
  return { factor: pick[1], label: pick[2] };
}

// A 1-2-5 step near x.
function roundStep(x){
  if(!(x > 0) || !isFinite(x)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(x)));
  const f = x / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}
function decimalsOf(step){ return Math.max(0, Math.min(12, Math.ceil(-Math.log10(step)) + 1)); }

// options: { label, min, max, step, value, base, format(v) → text, vibrate() → whether to
//   vibrate on a tick, onStart(), onInput(value, atBase), onEnd(), vertical }
// Returns { el, setValue(v), value(), dragging() }.
function createPhoneSlider(options){

  const base = Number.isFinite(o.base) ? o.base : min;
  const decimals = decimalsOf(step);
  const markStep = roundStep(span / MARKS);
  const format = typeof o.format === 'function' ? o.format : (v) => String(v);
  const vertical = !!o.vertical;
  let value = Number.isFinite(o.value) ? o.value : base;
  let drags = 0;
  let lastTickAt = 0;

  const el = mk('div', vertical ? 'ps vertical' : 'ps');
  const row = mk('div', 'ps-row');
  const minus = mk('button', 'ps-step ps-minus', '−');
  const plus = mk('button', 'ps-step ps-plus', '+');
  const shown = mk('button', 'ps-value');
  [minus, plus, shown].forEach(b => { b.type = 'button'; });
  minus.setAttribute('aria-label', 'Less: ' + o.label);
  plus.setAttribute('aria-label', 'More: ' + o.label);
  shown.title = 'Type a number';
  shown.setAttribute('aria-label', 'Type a number for ' + o.label);
  row.append(minus, shown, plus);
  const track = mk('div', 'ps-track');
  track.tabIndex = 0;
  track.setAttribute('role', 'slider');
  track.setAttribute('aria-label', o.label);
  track.setAttribute('aria-valuemin', String(min));
  track.setAttribute('aria-valuemax', String(max));
  if(vertical) track.setAttribute('aria-orientation', 'vertical');
  const rail = mk('div', 'ps-rail');
  rail.append(mk('div', 'ps-fill'), mk('div', 'ps-notch'));
  const thumb = mk('div', 'ps-thumb');
  const bubble = mk('div', 'ps-bubble');
  bubble.setAttribute('aria-hidden', 'true');
  track.append(rail, thumb, bubble);
  el.append(row, track);

  const clamp = (v) => Math.min(max, Math.max(min, v));
  const frac = (v) => Math.min(1, Math.max(0, (v - min) / span));
  const snap = (v) => Number(clamp(min + Math.round((v - min) / step) * step).toFixed(decimals));
  function paint(){
    el.style.setProperty('--ps-f', String(frac(value)));
    el.style.setProperty('--ps-n', String(frac(base)));
    el.style.setProperty('--ps-a', String(Math.min(frac(value), frac(base))));
    el.style.setProperty('--ps-b', String(Math.max(frac(value), frac(base))));
    el.classList.toggle('at-base', value === base);

    track.setAttribute('aria-valuenow', String(value));

    void el.offsetWidth; // start the little pulse again
    el.classList.add('ticked');
    if(!o.vibrate || o.vibrate()) tick();

  function ticksFor(a, b){
    if(a === b) return;
    if(b === base || (a - base) * (b - base) < 0) return tickNow();
    if(Math.floor(a / markStep + 1e-9) !== Math.floor(b / markStep + 1e-9)) tickNow();
  }

    value = v;

  track.addEventListener('pointerdown', (ev) => {

    if(ev.pointerType === 'mouse') ev.preventDefault(); // no text selection; a finger's is left alone (pointer-input.js)
    try{ track.setPointerCapture(ev.pointerId); }catch(e){ /* followed through the document anyway */ }
    const id = ev.pointerId, x0 = ev.clientX, y0 = ev.clientY;
    const box = rail.getBoundingClientRect();

    // Along the slider (up is more on a fader), and away from it (finer).
    const along = (e) => vertical ? -e.clientY : e.clientX;
    const away = (e) => vertical ? Math.abs(e.clientX - x0) : y0 - e.clientY;
    let anchor = along(ev), raw = value, anchorV = value, factor = 1, moved = false;
    drags++;
    el.classList.add('dragging');
    track.focus({ preventScroll: true });

      const fine = fineStep(away(e));
      if(fine.factor !== factor){ anchor = along(e); anchorV = raw; factor = fine.factor; }
      if(!moved && Math.abs(along(e) - along(ev)) < 3) return;
      moved = true;
      raw = clamp(anchorV + (along(e) - anchor) / length * span * factor);
      const unitsPerPx = span * factor / length;
      const v = Math.abs(raw - base) / unitsPerPx <= NOTCH_PX && base >= min && base <= max ? base : snap(raw);
      el.classList.toggle('fine', factor < 1);
      if(v !== value) setTo(v);
      if(factor < 1) placeBubble('fine ' + fine.label);
    };
    const up = (e) => {
      if(e.pointerId !== id) return;
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      drags = Math.max(0, drags - 1);
      el.classList.remove('dragging', 'fine');
      end();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });
  // "fine ×¼" over the knob, kept inside the slider.
  function placeBubble(text){
    bubble.textContent = text;
    const pad = 24;
    if(vertical){
      const h = track.clientHeight, at = h - pad - frac(value) * (h - 2 * pad);
      bubble.style.top = Math.max(0, Math.min(h - bubble.offsetHeight, at - bubble.offsetHeight - 22)) + 'px';
      return;
    }
    const w = track.clientWidth, half = bubble.offsetWidth / 2 + 4;
    const at = pad + frac(value) * (w - 2 * pad);
    bubble.style.left = Math.max(half, Math.min(w - half, at)) + 'px';

  // A double-tap (pointer-input.js sends a finger's as dblclick) or a double-click: the base.
  track.addEventListener('dblclick', (ev) => { ev.preventDefault(); start(); setTo(base); end(); });
  track.addEventListener('keydown', (ev) => {
    const k = ev.key;
    const by = { ArrowRight: step, ArrowUp: step, ArrowLeft: -step, ArrowDown: -step, PageUp: step * 10, PageDown: -step * 10 }[k];
    let v = null;
    if(by !== undefined) v = snap(value + by);
    else if(k === 'Home') v = min;
    else if(k === 'End') v = max;
    if(v === null) return;
    ev.preventDefault();
    start(); setTo(v); end();
  });

  // ---- − and +: a step, repeating faster while held ----
  [[minus, -1], [plus, 1]].forEach(([b, dir]) => {
    let timer = null;
    const stepOnce = () => setTo(snap(value + dir * step));
    const stop = () => { if(timer === null) return; clearTimeout(timer); timer = null; end(); };
    b.addEventListener('pointerdown', (ev) => {
      if(ev.button > 0) return;
      if(ev.pointerType === 'mouse') ev.preventDefault();
      start();
      stepOnce();
      let gap = 380;
      const again = () => { stepOnce(); gap = Math.max(35, gap * 0.8); timer = setTimeout(again, gap); };
      timer = setTimeout(again, gap);

    b.addEventListener('click', (ev) => { if(ev.detail === 0){ start(); stepOnce(); end(); } }); // the keyboard's Enter or Space
    b.addEventListener('contextmenu', (ev) => ev.preventDefault());
