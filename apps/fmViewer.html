<!-- A viewer made for one model carries its showcase and model here (data, never run: the
     browser runs no script of these types). Empty in the bare app. -->
<script type="application/json" id="showcase"></script>
<script type="application/json" id="model"></script>

<script>
(function(){
'use strict';

// ============================================================
// fmShowcase (the showcase viewer, phase V1 of docs/viewer-brief.md): an fmIDE model shown
// read-only. A visitor looks at the logic — pans and zooms the canvases, taps a rectangle for
// its value in every period and how it is worked out — and can change nothing. There are no
// editing controls at all, and nothing is ever sent anywhere.
//
// Made only from shared code (src/shared/) and its own: no ExcelExporter code, ever. Every
// text from a file is shown with textContent, every number forced to be a number, every
// colour through safeColor (canvas-view.js); nothing from a file is run.
// ============================================================

// ---------- escaping & validation (shared: src/shared/escaping.js, used by both apps) ----------
// Anything that came from a file (names, labels, kinds — including shared/community
// content) must never be parsed as markup: escape it (text), coerce it (numbers), or
// validate it (colours) before it goes into a markup string.
// escapeXml(s): for HTML/SVG markup — escapes & < > " and '.
// escapeXml(s, true): for XML 1.0 files (the .xlsx writer) — also drops the characters
// XML 1.0 forbids, and leaves ' as is (the writer quotes attributes with ").
function escapeXml(s, xmlFile){
  let t = String(s);
  if(xmlFile) t = t.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '');
  t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  return xmlFile ? t : t.replace(/'/g, '&#39;');
}
function safeNum(v, fallback){ const n = Number(v); return Number.isFinite(n) ? n : (fallback || 0); }
function safeColor(c, fallback){ return (typeof c === 'string' && /^#[0-9a-f]{3,8}$/i.test(c)) ? c : fallback; }
// ---------- operator catalogue (shared: src/shared/operators.js) ----------
// Every built-in operator, keyed by a lasting id that never changes (plugins and saved
// references use the id, never the symbol or a display name). `symbol` is what a file
// saves in an operator node's `text`; the order is the palette's order (fmIDE's
// "Insert Operator" commands are numbered by it, so new operators go at the end).
// `word` is the plain name shown next to a symbol ("+ Add"); function operators (fn) show
// ƒ and their symbol instead.
//
// How each one calculates, from its inputs' values in left-to-right order:
// - fold: combines the values pairwise from the left (a result of NaN is a 'math-error');
// - all: takes the whole list;
// - unary: exactly one input (otherwise 'unary-only');
// - compare: a chain a < b < c means a < b and b < c; 1 = true, 0 = false (needs two inputs:
//   otherwise 'needs-two');
// - fallback (iferror): its first input, or when that fails its second, or 0.
// - period (phase E): no inputs; the period being calculated, counted from 1.
// - ports (phase E): named inputs, each arrow into one by its `toPort` (counted from 0), as
//   into a function node; `apply` takes them in that order. `branches` (if, choose): the
//   first input picks one of the others (`pick`), and only that one is read — if: then when
//   the condition isn't 0, else otherwise; choose (phase E2b): choice n for index n. An input
//   read with no arrow is 'operator-input-unwired'. `choices` (choose): after its fixed named
//   inputs come "choice 1", "choice 2"… — as many as its arrows reach (operatorPortNames).
// Comparisons treat two numbers as equal when they differ only in the last few binary
// digits (approxEqual), as Excel and LibreOffice do: 0.1 + 0.2 = 0.3.
// `unit` is how the unit of measure passes through: 'multiply', 'divide', 'same' (every
// input must have the same unit, which the result takes), 'first' (the first input's),
// 'branches' (the inputs it may pick must have the same unit, which the result takes), or null.
// How each operator is spelled in Excel lives in ExcelExporter, not here.
const OPERATORS = [
  { id: 'add',      symbol: '+',       word: 'Add',          fold: (a, b) => a + b, unit: 'same' },
  { id: 'subtract', symbol: '−',       word: 'Subtract',     fold: (a, b) => a - b, unit: 'same' },
  { id: 'multiply', symbol: '×',       word: 'Multiply',     fold: (a, b) => a * b, unit: 'multiply' },
  { id: 'divide',   symbol: '÷',       word: 'Divide',       fold: (a, b) => b === 0 ? NaN : a / b, unit: 'divide' },
  { id: 'power',    symbol: '^',       word: 'Power',        fold: (a, b) => Math.pow(a, b), unit: null },
  // Excel's MOD: the result takes the divisor's sign (MOD(-7,3) = 2).
  { id: 'mod',      symbol: '%',       word: 'Modulo',       fold: (a, b) => b === 0 ? NaN : a - b * Math.floor(a / b), unit: null },
  { id: 'le',       symbol: '≤',       word: 'At most',      compare: (a, b) => a < b || approxEqual(a, b), unit: null },
  { id: 'ge',       symbol: '≥',       word: 'At least',     compare: (a, b) => a > b || approxEqual(a, b), unit: null },
  { id: 'lt',       symbol: '<',       word: 'Less than',    compare: (a, b) => a < b && !approxEqual(a, b), unit: null },
  { id: 'gt',       symbol: '>',       word: 'Greater than', compare: (a, b) => a > b && !approxEqual(a, b), unit: null },
  { id: 'abs',      symbol: 'abs',     fn: true, unary: (a) => Math.abs(a), unit: 'same' },
  { id: 'min',      symbol: 'min',     fn: true, all: (vs) => Math.min(...vs), unit: 'same' },
  { id: 'max',      symbol: 'max',     fn: true, all: (vs) => Math.max(...vs), unit: 'same' },
  { id: 'average',  symbol: 'ave',     fn: true, all: (vs) => vs.reduce((a, b) => a + b, 0) / vs.length, unit: 'same' },
  { id: 'iferror',  symbol: 'iferror', fn: true, fallback: true, unit: 'same' },
  // Phase E1: timing, conditions and rounding.
  { id: 'period',    symbol: 'period',    fn: true, period: true, unit: null },
  { id: 'if',        symbol: 'if',        fn: true, ports: ['condition', 'then', 'else'], branches: true, pick: (c) => c !== 0 ? 1 : 2, unit: 'branches' },
  { id: 'eq',        symbol: '=',         word: 'Equal',     compare: (a, b) => approxEqual(a, b), unit: null },
  { id: 'ne',        symbol: '≠',         word: 'Not equal', compare: (a, b) => !approxEqual(a, b), unit: null },
  { id: 'and',       symbol: 'and',       fn: true, all: (vs) => vs.every(v => v !== 0) ? 1 : 0, unit: null },
  { id: 'or',        symbol: 'or',        fn: true, all: (vs) => vs.some(v => v !== 0) ? 1 : 0, unit: null },
  { id: 'not',       symbol: 'not',       fn: true, unary: (a) => a === 0 ? 1 : 0, unit: null },
  { id: 'round',     symbol: 'round',     fn: true, ports: ['value', 'digits'], apply: (v, d) => roundLikeExcel(v, d, 'half'), unit: 'first' },
  { id: 'roundup',   symbol: 'roundup',   fn: true, ports: ['value', 'digits'], apply: (v, d) => roundLikeExcel(v, d, 'up'), unit: 'first' },
  { id: 'rounddown', symbol: 'rounddown', fn: true, ports: ['value', 'digits'], apply: (v, d) => roundLikeExcel(v, d, 'down'), unit: 'first' },
  // Phase E2a: one-input Excel functions. A result that isn't a finite number (the log of 0
  // or less, the root of a negative, e to a power too large) is a 'math-error', as Excel's
  // #NUM!. The log, e and root have no unit; int and trunc keep their input's. INT goes down
  // (towards minus infinity) and TRUNC towards zero, on the number as stored, as Excel does:
  // INT((0.1 + 0.7) * 10) is 7 (LibreOffice, which rounds first, says 8).
  { id: 'ln',        symbol: 'ln',        fn: true, unary: (a) => a > 0 ? Math.log(a) : NaN, unit: null },
  { id: 'exp',       symbol: 'exp',       fn: true, unary: (a) => Math.exp(a), unit: null },
  { id: 'sqrt',      symbol: 'sqrt',      fn: true, unary: (a) => a >= 0 ? Math.sqrt(a) : NaN, unit: null },
  { id: 'int',       symbol: 'int',       fn: true, unary: (a) => Math.floor(a) + 0, unit: 'same' }, // + 0: never −0, which Excel doesn't have
  { id: 'trunc',     symbol: 'trunc',     fn: true, unary: (a) => Math.trunc(a) + 0, unit: 'same' },
  // Phase E2b: CHOOSE(index, choice 1, choice 2, …), as Excel: the index cut to a whole
  // number picks a choice; below 1 or past the last choice it is 'choose-out-of-range' (Excel's
  // #VALUE!). Only the choice picked is read.
  { id: 'choose',    symbol: 'choose',    fn: true, ports: ['index'], choices: true, branches: true, pick: (c, n) => chooseIndex(c, n), unit: 'branches' },
];

// CHOOSE takes at most 254 choices, as Excel does.
const CHOOSE_MAX_CHOICES = 254;
// The choice an index picks among `n` (1…n), or 0 when it picks none.
function chooseIndex(index, n){
  const i = Math.trunc(index);
  return i >= 1 && i <= n ? i : 0;
}
// An operator's named inputs, or null. For choose, `choiceCount` choices after the index.
function operatorPortNames(op, choiceCount){
  if(!op || !op.ports) return null;
  if(!op.choices) return op.ports;
  const n = Math.max(0, Math.min(CHOOSE_MAX_CHOICES, choiceCount | 0));
  const out = op.ports.slice();
  for(let i = 1; i <= n; i++) out.push('choice ' + i);
  return out;
}
// How many choices a choose has: as many as its highest-numbered arrow reaches (`toPorts`, the
// `toPort` of each arrow into it; choice n is toPort n), at most CHOOSE_MAX_CHOICES.
function chooseChoiceCount(toPorts){
  let most = 0;
  toPorts.forEach(p => { if(Number.isInteger(p) && p >= 1 && p <= CHOOSE_MAX_CHOICES && p > most) most = p; });
  return most;
}

// Equal but for the last few binary digits, as Excel and LibreOffice compare numbers.
function approxEqual(a, b){
  if(a === b) return true;
  const d = Math.abs(a - b);
  return isFinite(d) && d < Math.max(Math.abs(a), Math.abs(b)) * 3.552713678800501e-15; // 2^-48
}

// Excel's ROUND, ROUNDUP and ROUNDDOWN: `value` to `digits` places after the point (a
// negative number rounds to tens, hundreds…; a fraction is cut to a whole number), halves
// away from zero ('half'), away from zero ('up') or towards zero ('down'). Worked out on the
// number's 15 significant digits, as Excel shows it, so ROUND(2.675, 2) is 2.68 although
// 2.675 is stored as a little less. Returns NaN for a value or digits that isn't finite.
function roundLikeExcel(value, digits, mode){
  if(!isFinite(value) || !isFinite(digits)) return NaN;
  const d = Math.trunc(digits);
  if(value === 0) return 0;
  const sign = value < 0 ? -1 : 1;
  const parts = Math.abs(value).toPrecision(15).split('e');
  const exponent = Number(parts[1] || 0) + d;
  if(exponent > 300) return value;         // far more places than the number has
  if(exponent < -300) return mode === 'up' ? sign * Math.pow(10, -d) : 0;
  const shifted = Number(parts[0] + 'e' + exponent);
  let whole;
  if(shifted >= 4503599627370496) whole = shifted; // 2^52: already a whole number
  else if(mode === 'half') whole = Math.floor(shifted + 0.5);
  else if(mode === 'up') whole = Math.ceil(shifted);
  else whole = Math.floor(shifted);
  if(whole === 0) return 0;
  const result = d > 0 ? (d <= 22 ? whole / Math.pow(10, d) : Number(whole + 'e-' + d)) : whole * Math.pow(10, -d);
  return sign * result;
}
const OPERATOR_BY_SYMBOL = new Map(OPERATORS.map(op => [op.symbol, op]));
const OPERATOR_BY_ID = new Map(OPERATORS.map(op => [op.id, op]));

// The catalogue entry for an operator node's saved text, or null (an unknown operator).
function operatorForSymbol(symbol){ return OPERATOR_BY_SYMBOL.get(symbol) || null; }
function operatorById(id){ return OPERATOR_BY_ID.get(id) || null; }

// Applies an operator to its inputs' values (every one a number; iferror, if and period are
// handled by the evaluator, which reads their inputs one at a time). Returns { value } or
// { error: code }. An unknown operator (only a hand-edited file has one) is an error.
function applyOperator(op, values){
  if(!op) return { error: 'operator-unknown' };
  if(op.apply){
    const r = op.apply(...values);
    return isFinite(r) ? { value: r } : { error: 'math-error' };
  }
  if(op.unary){
    if(values.length !== 1) return { error: 'unary-only' };
    const r = op.unary(values[0]);
    return isFinite(r) ? { value: r } : { error: 'math-error' };
  }
  if(op.compare){
    if(values.length < 2) return { error: 'needs-two' };
    return { value: values.slice(1).every((v, i) => op.compare(values[i], v)) ? 1 : 0 };
  }
  if(op.all) return { value: op.all(values) };
  const result = values.reduce((acc, v, idx) => idx === 0 ? v : op.fold(acc, v));
  return Number.isNaN(result) ? { error: 'math-error' } : { value: result };
}
// ---------- unit of measure (UOM) (shared: src/shared/uom.js) ----------
// A rectangle's optional 3rd text line ("Name\nValue\nUOM") is a manual unit label,
// e.g. "kt", "$/t". For rectangles with no manual UOM, the UOM of a formula-driven
// rectangle is derived automatically from its inputs' UOMs through the same × ÷ + −
// (and abs/min/max/ave/iferror) logic used to compute its value — so "Unit Price ($/t)
// × Volume (kt)" resolves to "$k" automatically. A UOM is represented internally as
// {scale, dims}: dims maps a base symbol (e.g. '$', 't') to its exponent (denominator
// atoms are negative), and scale is the numeric multiplier from a recognized prefix
// (k=1e3, m/mm=1e6, bn=1e9) that may be attached to either end of an atom's token.
const UOM_PREFIXES = [['bn', 1e9], ['mm', 1e6], ['k', 1e3], ['m', 1e6]]; // checked longest-first
const UOM_CURRENCY_SYMBOLS = new Set(['$', '€', '£', '¥']);
const UOM_SCALE_TO_PREFIX = { 1: '', 1000: 'k', 1000000: 'm', 1000000000: 'bn' };

function parseUOMAtom(tok){
  tok = tok.trim();
  if(!tok) return null;
  if(tok === '%') return { scale: 0.01, symbol: '' };
  for(const [pfx, mult] of UOM_PREFIXES){
    if(tok.length > pfx.length){
      if(tok.slice(0, pfx.length).toLowerCase() === pfx) return { scale: mult, symbol: tok.slice(pfx.length).trim() };
      if(tok.slice(-pfx.length).toLowerCase() === pfx) return { scale: mult, symbol: tok.slice(0, -pfx.length).trim() };
    }
  }
  return { scale: 1, symbol: tok };
}

function parseUOMSegment(seg){
  return seg.split(/[*·]/).map(parseUOMAtom).filter(Boolean);
}

// Parses a manually-typed UOM string (e.g. "$/t", "kt", "$k") into {scale, dims}, or
// null if blank/unparseable.
function parseUOM(str){
  if(!str) return null;
  const s = str.trim();
  if(!s) return null;
  const slashIdx = s.indexOf('/');
  const numAtoms = parseUOMSegment(slashIdx === -1 ? s : s.slice(0, slashIdx));
  const denAtoms = slashIdx === -1 ? [] : parseUOMSegment(s.slice(slashIdx + 1));
  if(numAtoms.length === 0 && denAtoms.length === 0) return null;
  let scale = 1;
  const dims = {};
  numAtoms.forEach(a => { scale *= a.scale; if(a.symbol) dims[a.symbol] = (dims[a.symbol] || 0) + 1; });
  denAtoms.forEach(a => { scale /= a.scale; if(a.symbol) dims[a.symbol] = (dims[a.symbol] || 0) - 1; });
  Object.keys(dims).forEach(k => { if(dims[k] === 0) delete dims[k]; });
  return { scale, dims };
}

// Renders {scale, dims} back to a display string, e.g. {scale:1000, dims:{$:1}} -> "$k".
function formatUOM(u){
  if(!u) return '';
  const numSyms = Object.keys(u.dims).filter(k => u.dims[k] > 0).sort();
  const denSyms = Object.keys(u.dims).filter(k => u.dims[k] < 0).sort();
  const prefix = UOM_SCALE_TO_PREFIX.hasOwnProperty(u.scale) ? UOM_SCALE_TO_PREFIX[u.scale] : '';
  const atomStr = (sym, exp) => (exp > 1 ? sym + '^' + exp : sym);
  let numPart;
  if(numSyms.length === 0){
    numPart = prefix;
  } else if(numSyms.length === 1 && prefix){
    const sym = numSyms[0];
    numPart = UOM_CURRENCY_SYMBOLS.has(sym) ? (atomStr(sym, u.dims[sym]) + prefix) : (prefix + atomStr(sym, u.dims[sym]));
  } else {
    numPart = (prefix ? prefix + '·' : '') + numSyms.map(s => atomStr(s, u.dims[s])).join('·');
  }
  const denPart = denSyms.map(s => atomStr(s, -u.dims[s])).join('·');
  return denPart ? (numPart || '1') + '/' + denPart : numPart;
}

function uomCombineDims(a, b, sign){
  const dims = Object.assign({}, a.dims);
  Object.keys(b.dims).forEach(k => {
    dims[k] = (dims[k] || 0) + sign * b.dims[k];
    if(dims[k] === 0) delete dims[k];
  });
  return dims;
}
function uomMultiply(a, b){ return (a && b) ? { scale: a.scale * b.scale, dims: uomCombineDims(a, b, 1) } : null; }
function uomDivide(a, b){ return (a && b) ? { scale: a.scale / b.scale, dims: uomCombineDims(a, b, -1) } : null; }
function uomDimsEqual(a, b){
  const ak = Object.keys(a.dims), bk = Object.keys(b.dims);
  return ak.length === bk.length && ak.every(k => a.dims[k] === b.dims[k]);
}

// ---------- input-rectangle rule (shared: src/shared/input-rule.js, used by both apps) ----------
// `canvas` is { nodes, edges }.
// True if nothing actually feeds `nodeId`: an operator (or period shift) whose every input
// is itself fed by nothing — including one with no inputs at all, like a socket operator
// with nothing plugged into it. Aliases, rectangles and block instances always count as a
// real source; so does the period number (phase E1), which has no inputs but gives a value.
function feedsNothing(canvas, nodeId, visiting){
  if(visiting.has(nodeId)) return false;
  visiting.add(nodeId);
  const n = canvas.nodes.find(x => x.id === nodeId);
  if(!n) return true;
  if(n.type !== 'operator' && n.type !== 'periodShift') return false;
  if(n.type === 'operator' && n.text === 'period') return false;
  return canvas.edges.filter(e => e.to === nodeId).every(e => feedsNothing(canvas, e.from, visiting));
}
// An input rectangle: a value rectangle with no incoming arrow, or whose single incoming
// arrow comes from something fed by nothing (feedsNothing) — e.g. Cash ← [+] where the
// + operator's socket has nothing plugged in. fmIDE then uses the rectangle's own typed
// number, so both apps treat it as an input everywhere (canvas look, Excel section,
// values, the "Inputs" role, Constant eligibility and the Inputs tab).
function isInputRectangle(canvas, node){
  if(!canvas || !node || node.type !== 'value') return false;
  const inc = canvas.edges.filter(e => e.to === node.id);
  if(inc.length === 0) return true;
  return inc.length === 1 && feedsNothing(canvas, inc[0].from, new Set());
}

// ---------- reaching outside the timeline (shared: src/shared/input-rule.js) ----------
// True if what feeds `nodeId` at `period` needs a period before the first or after the last,
// through a period shift (e.g. a corkscrew's opening balance in period 1). A rectangle fed
// this way shows its own typed number there, or 0 — in fmIDE and in Excel alike. The walk
// follows what both apps compute in one step — operators, period shifts and aliases — and
// stops at rectangles and block instances, which settle their own value. An iferror with a
// fallback only fails when both of its first two inputs fail; with one input it gives 0. An
// if (phase E1) needs a period outside the timeline when its condition does, or when both of
// its branches do: a branch it may not take doesn't count (inside a branch, such a read is an
// error instead); a choose (phase E2b) likewise, when its index does or every choice does. A
// function node (functions.js) is followed through its formula: only the inputs it must read
// count (functionNeedsOutsideTimeline), when the canvas carries its compiled definition
// (`canvas.calls`, set by the IR); otherwise through any of its inputs.
// `canvasOf(id)` returns a canvas { nodes, edges }; inputs are in left-to-right order.
function reachesOutsideTimeline(canvasOf, canvasId, nodeId, period, periodCount, visiting){
  visiting = visiting || new Set();
  const key = canvasId + '|' + nodeId + '|' + period;
  if(visiting.has(key)) return false;
  visiting.add(key);
  const canvas = canvasOf(canvasId);
  const n = canvas && canvas.nodes.find(x => x.id === nodeId);
  if(!n) return false;
  const reach = (cid, id, p) => reachesOutsideTimeline(canvasOf, cid, id, p, periodCount, visiting);
  if(n.type === 'alias'){
    return !!(n.sourceCanvasId && n.sourceNodeId) && reach(n.sourceCanvasId, n.sourceNodeId, period);
  }
  const incoming = canvas.edges.filter(e => e.to === nodeId);
  if(n.type === 'periodShift'){
    if(incoming.length !== 1) return false;
    const target = period + ((typeof n.shift === 'number') ? n.shift : -1);
    if(target < 0 || target >= periodCount) return true;
    return reach(canvasId, incoming[0].from, target);
  }
  if(n.type !== 'operator' && n.type !== 'function') return false;
  const call = n.type === 'function' && canvas.calls ? canvas.calls.get(nodeId) : null;
  if(call && !call.status){
    return functionNeedsOutsideTimeline(call, (i) => {
      const e = incoming.find(x => x.toPort === i);
      return !!e && reachesOutsideTimeline(canvasOf, canvasId, e.from, period, periodCount, new Set(visiting));
    });
  }
  const inputs = incoming.map(e => canvas.nodes.find(x => x.id === e.from)).filter(Boolean)
    .sort((a, b) => (a.x - b.x) || (a.y - b.y));
  if(n.type === 'operator' && (n.text === 'if' || n.text === 'choose')){
    // Each branch is walked on its own, so a source both branches read counts for both.
    const port = (i) => { const e = incoming.find(x => x.toPort === i); return !!e && reachesOutsideTimeline(canvasOf, canvasId, e.from, period, periodCount, new Set(visiting)); };
    const count = n.text === 'if' ? 2 : chooseChoiceCount(incoming.map(e => e.toPort));
    if(port(0)) return true;
    if(count === 0) return false;
    for(let i = 1; i <= count; i++) if(!port(i)) return false;
    return true;
  }
  if(n.type === 'operator' && n.text === 'iferror'){
    return inputs.length >= 2 && reach(canvasId, inputs[0].id, period) && reach(canvasId, inputs[1].id, period);
  }
  return inputs.some(src => reach(canvasId, src.id, period));
}
// ---------- function plugins (shared: src/shared/functions.js) ----------
// A function is a formula held in a file, written with the operators of the catalogue
// (operators.js), for example
//   Margin(Revenue, Cost) = (Revenue - Cost) / Revenue
// It is read by the parser below — never run as code: no eval, no new Function. Everything
// in a definition comes from a file and is untrusted; the parser only builds a small tree
// of plain objects, and names never reach a formula or the page as markup.
//
// A definition, as files carry it (system v5, module v3, fmIDE-workspace v4,
// fmIDE-functions v1; docs/file-formats.md):
//   { family, version, versionId, text, description, note,
//     calls: [{ name, family, version, versionId }] }
// `family` is a lasting random id (never the name), `version` 1, 2, 3…, `versionId` random.
// `text` is the whole definition: its name, its inputs and its formula. `calls` pins each
// function the formula calls, by the name it is written with, to a family and version: the
// calculation follows `calls`, never the name alone.
// A function node on a canvas refers to one version:
//   { type: 'function', fn: { family, version, versionId, name } }
// and each arrow into it carries `toPort`, the index of the input it feeds (from 0).
// Uses operators.js (applyOperator, operatorById) and uom.js (units).

// Limits, so a file can't make either app work without end.
const FUNCTION_LIMITS = { text: 4000, name: 64, inputs: 32, nesting: 64, callDepth: 16, description: 2000, note: 500, calls: 64 };

// The functions of the syntax that are built in: the catalogue's operators by their Excel
// names, with Excel's number of arguments. (Lookup tables without a prototype, so no name
// from a file can match anything but their own entries.)
const FUNCTION_BUILTINS = Object.assign(Object.create(null), {
  MIN:     { id: 'min',     min: 1, max: Infinity },
  MAX:     { id: 'max',     min: 1, max: Infinity },
  AVERAGE: { id: 'average', min: 1, max: Infinity },
  ABS:     { id: 'abs',     min: 1, max: 1 },
  MOD:     { id: 'mod',     min: 2, max: 2 },
  IFERROR: { id: 'iferror', min: 2, max: 2 },
  // Phase E1.
  IF:        { id: 'if',        min: 3, max: 3 },
  AND:       { id: 'and',       min: 1, max: Infinity },
  OR:        { id: 'or',        min: 1, max: Infinity },
  NOT:       { id: 'not',       min: 1, max: 1 },
  ROUND:     { id: 'round',     min: 2, max: 2 },
  ROUNDUP:   { id: 'roundup',   min: 2, max: 2 },
  ROUNDDOWN: { id: 'rounddown', min: 2, max: 2 },
  PERIOD:    { id: 'period',    min: 0, max: 0 },
  // Phase E2a.
  LN:        { id: 'ln',        min: 1, max: 1 },
  EXP:       { id: 'exp',       min: 1, max: 1 },
  SQRT:      { id: 'sqrt',      min: 1, max: 1 },
  INT:       { id: 'int',       min: 1, max: 1 },
  TRUNC:     { id: 'trunc',     min: 1, max: 1 },
  // Phase E2b: the index and at least one choice, at most 254 (Excel's limit).
  CHOOSE:    { id: 'choose',    min: 2, max: 255 },
});
// Built-in names an input may still have (they came after functions did, so a definition
// may already use them for an input): read as the input unless followed by "(".
const FUNCTION_INPUT_NAMES_ALLOWED = new Set(['PERIOD']);
// Names kept back: Excel functions that are not available (yet), so a formula using one
// says so instead of looking for a function of that name.
const FUNCTION_RESERVED = new Set(['IFS', 'XOR', 'SUM', 'PRODUCT', 'LOG', 'LOG10', 'POWER', 'SIGN', 'COUNT', 'LET', 'LAMBDA',
  'INDEX', 'NA', 'TRUE', 'FALSE', 'PI', 'CEILING', 'FLOOR', 'MEDIAN', 'SUMPRODUCT']);
// Symbols and the catalogue operator each one is. The typographic signs fmIDE shows on its
// operators are accepted too.
const FUNCTION_SYMBOLS = Object.assign(Object.create(null), {
  '+': 'add', '-': 'subtract', '−': 'subtract', '*': 'multiply', '×': 'multiply', '/': 'divide', '÷': 'divide',
  '^': 'power', '<': 'lt', '<=': 'le', '≤': 'le', '>': 'gt', '>=': 'ge', '≥': 'ge',
  '<>': 'ne', '≠': 'ne',
});
const FUNCTION_COMPARISONS = new Set(['lt', 'le', 'gt', 'ge', 'eq', 'ne']);

// ---- the parser ----
// Returns { ok: true, name, params, body, calls } or { ok: false, error: { message, at, length } }
// (`at` is the position in the text, from 0). `body` is a tree of
//   { t: 'num', v } · { t: 'param', i } (input i, from 0) · { t: 'neg', a } ·
//   { t: 'op', id, args } (a catalogue operator: binary for symbols, any count for built-ins) ·
//   { t: 'call', name, key, args } (another function; `key` is its name in lower case)
// and `calls` lists the called names (lower case) in the order they first appear.
// Precedence follows Excel: a leading minus binds tightest (-2^2 = 4), then ^ (from the
// left), then * and /, then + and −, then one comparison.
function parseFunctionText(text){
  const src = typeof text === 'string' ? text : '';
  const fail = (message, at, length) => { throw { fnParseError: true, message, at: at || 0, length: Math.max(1, length || 1) }; };
  try{
    if(src.length > FUNCTION_LIMITS.text) fail(`The definition is too long (at most ${FUNCTION_LIMITS.text} characters).`, FUNCTION_LIMITS.text, 1);
    const tokens = tokenizeFunctionText(src, fail);
    let pos = 0, depth = 0;
    const peek = () => tokens[pos];
    const next = () => tokens[pos++];
    const at = () => (tokens[pos] ? tokens[pos].at : src.length);
    const expect = (type, value, message) => {
      const tok = peek();
      if(!tok || tok.type !== type || (value !== undefined && tok.value !== value)) fail(message, at(), tok ? tok.text.length : 1);
      return next();
    };

    // The header: Name(Input, Input, …) =
    const nameTok = peek();
    if(!nameTok || nameTok.type !== 'name') fail('A definition starts with the function\'s name and its inputs, like Margin(Revenue, Cost) = (Revenue - Cost) / Revenue.', at(), 1);
    next();
    const name = nameTok.value;
    const upperName = name.toUpperCase();
    if(FUNCTION_BUILTINS[upperName] || FUNCTION_RESERVED.has(upperName)) fail(`"${name}" is the name of a built-in Excel function: choose another name.`, nameTok.at, name.length);
    expect('punct', '(', 'Expected "(" after the function\'s name, then its inputs.');
    const params = [], paramIndex = new Map();
    if(!(peek() && peek().type === 'punct' && peek().value === ')')){
      for(;;){
        const p = expect('name', undefined, 'Expected the name of an input.');
        const key = p.value.toLowerCase();
        const upper = p.value.toUpperCase();
        if((FUNCTION_BUILTINS[upper] && !FUNCTION_INPUT_NAMES_ALLOWED.has(upper)) || FUNCTION_RESERVED.has(upper)) fail(`"${p.value}" is the name of a built-in Excel function and can't be an input's name.`, p.at, p.text.length);
        if(key === name.toLowerCase()) fail(`An input can't have the function's own name, "${p.value}".`, p.at, p.text.length);
        if(paramIndex.has(key)) fail(`Two inputs are both called "${p.value}".`, p.at, p.text.length);
        if(params.length >= FUNCTION_LIMITS.inputs) fail(`A function can have at most ${FUNCTION_LIMITS.inputs} inputs.`, p.at, p.text.length);
        paramIndex.set(key, params.length);
        params.push(p.value);
        const sep = peek();
        if(sep && sep.type === 'punct' && sep.value === ','){ next(); continue; }
        break;
      }
    }
    expect('punct', ')', 'Expected "," or ")" after an input\'s name.');
    expect('punct', '=', 'Expected "=" after the inputs, then the formula.');
    if(!peek()) fail('The formula after "=" is missing.', src.length, 1);

    const calls = [];
    const enter = () => { if(++depth > FUNCTION_LIMITS.nesting) fail(`The formula is nested too deeply (at most ${FUNCTION_LIMITS.nesting} levels).`, at(), 1); };
    const leave = () => { depth--; };
    const isOp = (ids) => { const tok = peek(); return !!tok && tok.type === 'op' && ids.includes(tok.value); };
    // In the formula, "=" compares (equal), as in Excel; "<>" and "≠" are not equal.
    const comparisonAhead = () => {
      const tok = peek();
      if(!tok) return null;
      if(tok.type === 'op' && FUNCTION_COMPARISONS.has(tok.value)) return tok.value;

        if(builtin){
          if(args.length < builtin.min || args.length > builtin.max){
            const count = builtin.min === builtin.max ? `exactly ${builtin.min}` : `at least ${builtin.min}`;
            fail(`${upper} takes ${count} input${builtin.min === 1 && builtin.max === 1 ? '' : 's'}.`, tok.at, tok.text.length);
          }
          return { t: 'op', id: builtin.id, args };
        }
        if(!calls.includes(key)){
          if(calls.length >= FUNCTION_LIMITS.calls) fail(`A function can call at most ${FUNCTION_LIMITS.calls} other functions.`, tok.at, tok.text.length);
          calls.push(key);

      if(tok.type === 'punct' && tok.value === ')') fail('Unexpected ")".', tok.at, 1);

    }
    return { ok: true, name, params, body, calls };
  } catch(err){
    if(err && err.fnParseError) return { ok: false, error: { message: err.message, at: err.at, length: err.length } };
    if(err instanceof RangeError) return { ok: false, error: { message: 'The formula is nested too deeply.', at: 0, length: 1 } };

  }
}

// The text as tokens: { type: 'name' | 'num' | 'op' | 'punct', value, text, at }.
function tokenizeFunctionText(src, fail){
  const tokens = [];
  const nameStart = /[\p{L}_]/u, namePart = /[\p{L}\p{N}_.]/u;
  let i = 0;
  while(i < src.length){
    const ch = src[i];
    if(/\s/.test(ch)){ i++; continue; }
    const start = i;
    if(/[0-9]/.test(ch) || (ch === '.' && /[0-9]/.test(src[i + 1] || ''))){
      const m = /^(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?/.exec(src.slice(i, i + 400));
      const text = m[0];
      const value = Number(text);
      if(!isFinite(value)) fail('That number is too large.', start, text.length);
      if(nameStart.test(src[i + text.length] || '')) fail(`"${src.slice(i, i + text.length + 1)}" isn't a number or a name: a name can't start with a digit.`, start, text.length + 1);
      tokens.push({ type: 'num', value, text, at: start });
      i += text.length;
      continue;
    }
    if(nameStart.test(ch)){
      let j = i + 1;
      while(j < src.length && namePart.test(src[j])) j++;
      const text = src.slice(i, j);
      if(text.length > FUNCTION_LIMITS.name) fail(`A name can be at most ${FUNCTION_LIMITS.name} characters long.`, start, text.length);
      tokens.push({ type: 'name', value: text, text, at: start });
      i = j;
      continue;
    }
    const two = src.slice(i, i + 2);
    if(two === '<=' || two === '>=' || two === '<>'){ tokens.push({ type: 'op', value: FUNCTION_SYMBOLS[two], text: two, at: start }); i += 2; continue; }
    if(FUNCTION_SYMBOLS[ch]){ tokens.push({ type: 'op', value: FUNCTION_SYMBOLS[ch], text: ch, at: start }); i++; continue; }
    if(ch === '(' || ch === ')' || ch === ',' || ch === '='){ tokens.push({ type: 'punct', value: ch, text: ch, at: start }); i++; continue; }
    if(ch === '%') fail('"%" isn\'t supported: use MOD(a, b) for a remainder, or / 100 for a percentage.', start, 1);
    if(ch === ';') fail('Inputs are separated by "," not ";".', start, 1);
    const shown = ch === '"' ? 'a quote (")' : `"${ch}"`;
    fail(`${shown} can't be used in a function's formula.`, start, 1);
  }
  return tokens;
}

// ---- definitions from files ----

// { family, version, versionId } from a reference (a function node's `fn`, an entry of

// The function name a definition's text starts with, or '' (for showing a definition whose

// ---- compiling: the definitions a model carries ----
// Reads `list` (a file's `functions`) and returns { resolve(ref) → compiled or null, list }.

    if(c.parseError){ c.status = 'function-unreadable'; return; }
    visiting.add(c);

}

// ---- calculating a call ----
// `fn` is a compiled function whose status is null; `input(i)` returns input i's result,
// { value } or { error, edge? }, and is asked only for inputs the formula actually reads

// the branch it takes). `period` is the period being calculated, from 0 (PERIOD() gives it

// Remembered calls, per set of inputs (`arg`, one for each formula being worked out): a call

// ---- which definitions a model needs ----

// ---------- the formula IR (shared: src/shared/ir.js) ----------

// period; unitOf(ir, canvasId, nodeId) gives a rectangle's unit of measure.
// Uses operators.js (the operator catalogue), uom.js (units), input-rule.js and
