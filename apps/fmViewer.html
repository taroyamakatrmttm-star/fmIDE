  // ---- typing ----
  shown.addEventListener('click', () => {
    const box = mk('input', 'ps-type');
    box.type = 'text';
    box.inputMode = min >= 0 && base >= 0 ? 'decimal' : 'text';
    box.value = String(value);
    box.setAttribute('aria-label', o.label + ' (number)');
    let done = false;
    const finish = (keep) => {
      if(done) return;
      done = true;
      const v = Number(box.value.replace(/[\s,]/g, '').replace(/−/g, '-'));
      box.replaceWith(shown);
      if(keep && box.value.trim() !== '' && isFinite(v)){ start(); setTo(v, true); end(); }
      else paint();
    };
    box.addEventListener('keydown', (ev) => {
      if(ev.key === 'Enter'){ ev.preventDefault(); finish(true); }
      else if(ev.key === 'Escape'){ ev.preventDefault(); finish(false); }
    });
    box.addEventListener('blur', () => finish(true));
    shown.replaceWith(box);
    box.focus();
    box.select();
  });

  paint();
  return {
    el,
    setValue(v){ if(Number.isFinite(v) && !drags){ value = v; paint(); } },
    value: () => value,
    dragging: () => drags > 0,
  };
}

// The phone's share sheet for these files (File objects); else they download. Resolves
// 'shared', 'cancelled' (the person closed the sheet) or 'downloaded'.
async function shareFiles(files, title){
  try{
    if(navigator.share && navigator.canShare && navigator.canShare({ files })){
      await navigator.share({ files, title });
      return 'shared';
    }
  }catch(e){
    if(e && e.name === 'AbortError') return 'cancelled';
    // Not allowed here (or failed): download instead.
  }
  files.forEach(f => {
    const url = URL.createObjectURL(f);
    const a = document.createElement('a');
    a.href = url;
    a.download = f.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  return 'downloaded';
}

// Keeps the screen on while something is being shown; call what it returns to let it sleep.
function keepScreenOn(){
  let on = true, sentinel = null;
  const ask = () => {
    if(!on || !navigator.wakeLock || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(s => {
      if(on) sentinel = s;
      else s.release().catch(() => {});
    }, () => { /* refused (battery saver…): the screen sleeps as usual */ });
  };
  const visible = () => { if(document.visibilityState === 'visible') ask(); };
  document.addEventListener('visibilitychange', visible);
  ask();
  return () => {
    on = false;
    document.removeEventListener('visibilitychange', visible);
    if(sentinel){ sentinel.release().catch(() => {}); sentinel = null; }
  };
}
// ---------- choosing a file on an iPhone or iPad (shared: src/shared/file-picker.js) ----------
// Safari on iOS and iPadOS turns a file box's `accept` list into the file types the system
// knows. It knows nothing of `.fmide`, so a .fmide file shows greyed out and can't be picked,
// even where the list names it. There the list is dropped and any file can be picked: what is
// read is checked anyway (its kind, its version, its limits), so a wrong file is refused with
// a message, as everywhere else. Elsewhere the list stays and filters the files shown.
function isAppleTouchDevice(){
  const nav = window.navigator || {};
  if(/iPad|iPhone|iPod/.test(String(nav.userAgent || ''))) return true;
  // iPadOS asks for the desktop site by default and then calls itself a Mac: a Mac with touch.
  return nav.platform === 'MacIntel' && Number(nav.maxTouchPoints) > 1;
}
function letAnyFileBePicked(inputs){
  if(!isAppleTouchDevice()) return;
  (inputs || []).forEach(input => { if(input && input.removeAttribute) input.removeAttribute('accept'); });
}

const $ = (id) => document.getElementById(id);

function make(tag, cls, text){
  const el = document.createElement(tag);
  if(cls) el.className = cls;
  if(text !== undefined && text !== null) el.textContent = String(text);
  return el;
}

// Messages under the top bar, each with ×. A message with a `slot` replaces the last one in
// the same slot, so they don't pile up.
function notify(text, kind, slot){
  const box = $('notices');
  if(slot){ const old = box.querySelector('[data-slot="' + slot + '"]'); if(old) old.remove(); }
  if(!text) return;
  const n = make('div', 'note ' + (kind || 'info'));
  n.appendChild(make('span', 'note-text', text));
  n.setAttribute('role', kind === 'err' ? 'alert' : 'status');
  if(slot) n.dataset.slot = slot;
  const x = make('button', 'note-x', '×');
  x.type = 'button';
  x.setAttribute('aria-label', 'Dismiss');
  x.addEventListener('click', () => n.remove());
  n.appendChild(x);
  box.appendChild(n);
}

// A question with two answers. Resolves true for OK.
function askConfirm(title, text, okLabel){
  return new Promise(resolve => {
    const back = $('confirmBox');
    $('confirmTitle').textContent = title;
    $('confirmText').textContent = text;
    $('confirmYes').textContent = okLabel || 'OK';
    back.classList.remove('hidden');
    const done = (answer) => {
      back.classList.add('hidden');
      $('confirmYes').removeEventListener('click', yes);
      $('confirmNo').removeEventListener('click', no);
      document.removeEventListener('keydown', key, true);
      resolve(answer);
    };
    const yes = () => done(true), no = () => done(false);
    const key = (ev) => { if(ev.key === 'Escape'){ ev.preventDefault(); done(false); } };
    $('confirmYes').addEventListener('click', yes);
    $('confirmNo').addEventListener('click', no);
    document.addEventListener('keydown', key, true);
    $('confirmYes').focus();
  });
}

// The page as a phone shows it (the shared isPhoneScreen), decided once at start.
const onPhone = isPhoneScreen();
document.body.classList.toggle('phone', onPhone);
// ============================================================
// Reading what a viewer shows: the model (an fmIDE system, or a workspace — a .fmide document
// is one) and the showcase, from the page's own data blocks (a viewer made for one model) or
// from files the visitor drops or chooses (the bare app). Every file goes through the shared
// readers: its size and depth first (fileTextProblem, fileDataProblem), the kind identified,
// a file of another kind refused with where it belongs, older versions upgraded step by step
// (the shared upgrades), a newer version opened only after asking.
// ============================================================
const MODEL_FORMATS = {
  'system':          { current: SHARED_FILE_VERSIONS['system'], label: 'fmIDE system' },
  'fmIDE-workspace': { current: SHARED_FILE_VERSIONS['fmIDE-workspace'], label: 'fmIDE workspace' },
};

// Returns { error } or { kind, data (an upgraded copy), fromVersion, newer, newerParts }.
function readModelData(raw){
  if(!raw || typeof raw !== 'object' || Array.isArray(raw)) return { error: "That file doesn't hold an fmIDE model." };
  const kind = inferFileKind(raw);
  if(!kind || !MODEL_FORMATS[kind]){
    if(typeof kind === 'string' && /^(module|fmIDE-)/.test(kind)){
      return { error: 'That is an fmIDE file of another kind ("' + kind.slice(0, 40) + '"), not a whole model. In fmIDE, save the model with File → Save (a .fmide document).' };
    }
    return { error: "That file isn't an fmIDE model this version recognises." };
  }
  const data = JSON.parse(JSON.stringify(raw));
  const { fromVersion, newer } = upgradeFileData(data, kind, MODEL_FORMATS, SHARED_FILE_MIGRATIONS);
  const newerParts = [];
  if(kind === 'fmIDE-workspace'){
    if(!data.system || typeof data.system !== 'object') return { error: 'That workspace holds no model.' };
    const r = readModelData(data.system);
    if(r.error) return { error: "The workspace's model is unreadable: " + r.error };
    if(r.kind !== 'system') return { error: "The workspace's model is unreadable." };
    data.system = r.data;
    if(r.newer) newerParts.push('its model (format version ' + r.fromVersion + ')');
  }
  return { kind, data, fromVersion, newer, newerParts };
}

// A file's text parsed, with the shared limits: { raw } or { error }.
function parseFileText(text){
  const big = fileTextProblem(text);
  if(big) return { error: big };
  let raw;
  try{ raw = JSON.parse(text); }catch(e){ return { error: "That file isn't JSON fmShowcase can read." }; }
  const deep = fileDataProblem(raw);
  if(deep) return { error: deep };
  return { raw };
}

// A model's text read into { system, presets, name } (null after a message).
async function readModelText(text, name){
  const p = parseFileText(text);
  if(p.error){ notify(p.error, 'err', 'load'); return null; }
  const r = readModelData(p.raw);
  if(r.error){ notify(r.error, 'err', 'load'); return null; }
  if(r.newer || r.newerParts.length){
    const what = r.newer ? 'This ' + MODEL_FORMATS[r.kind].label + ' (format version ' + r.fromVersion + ')' : 'Part of this file — ' + r.newerParts.join(', ') + ' —';
    const go = await askConfirm('Saved by a newer version', what + ' was saved by a newer version of fmIDE. Open it anyway? Anything the newer version added may be ignored.', 'Open Anyway');
    if(!go) return null;
  }
  const system = r.kind === 'fmIDE-workspace' ? r.data.system : r.data;
  if(!system || !Array.isArray(system.canvases) || !system.canvases.length){ notify('That model has no canvases.', 'err', 'load'); return null; }
  const presets = r.kind === 'fmIDE-workspace' && Array.isArray(r.data.formatPresets) ? r.data.formatPresets
    : (Array.isArray(system.formatPresets) ? system.formatPresets : null);
  return { system, presets, name: showcaseText(String(name || '').replace(/\.(fmide|json)$/i, ''), 120) || 'Model' };
}

// A showcase's parsed data read into its clean form (null after a message). A recipe is
// refused: it is for making many viewers, not for viewing.
async function readShowcase(raw){
  const r = readShowcaseData(raw);
  if(r.error){ notify(r.error, 'err', 'showcase'); return null; }
  if(r.newer){
    const go = await askConfirm('Saved by a newer version', 'This showcase (format version ' + r.fromVersion + ') was saved by a newer version of fmIDE. Open it anyway? Anything the newer version added may be ignored.', 'Open Anyway');
    if(!go) return null;
  }
  if(r.recipe){ notify('That is a recipe, for making many viewers at once (tools/make-viewers.js), not a showcase to view.', 'err', 'showcase'); return null; }
  const c = cleanShowcase(r.data);
  if(c.problems.length) notify('The showcase: ' + c.problems.join(' '), 'warn', 'showcase');
  return c.value;
}

// The page's own data blocks (a viewer made for one model): their text, or '' when empty.
function dataBlock(id){
  const el = $(id);
  return el && el.type === 'application/json' ? String(el.textContent || '').trim() : '';
}

// Files dropped or chosen: a model, a showcase, or both. A showcase on its own is laid over
// the model already open.
async function openFiles(files){
  const list = Array.from(files || []).slice(0, 4);
  if(!list.length) return false;
  let modelFile = null, showcaseRaw = null;
  for(const f of list){
    let text;
    try{ text = await f.text(); }catch(e){ notify('That file could not be read.', 'err', 'load'); return false; }
    const p = parseFileText(text);
    if(p.error){ notify(p.error, 'err', 'load'); return false; }
    if(p.raw && typeof p.raw === 'object' && !Array.isArray(p.raw) && p.raw.kind === SHOWCASE_KIND) showcaseRaw = p.raw;
    else modelFile = { text, name: f.name };
  }
  let showcase = null;
  if(showcaseRaw){
    showcase = await readShowcase(showcaseRaw);
    if(!showcase && !modelFile) return false;
  }
  if(modelFile){
    const m = await readModelText(modelFile.text, modelFile.name);
    if(!m) return false;
    showModel(m, showcase);
    return true;
  }
  if(!state.model){ notify('That is a showcase: open the model it shows with it (both files at once).', 'warn', 'load'); return false; }
  showModel(state.model, showcase);
  return true;
}

// Starting: a viewer made for one model opens on it; the bare app waits for a file.
async function startFromPage(){
  const modelText = dataBlock('model');
  if(!modelText) return false;
  let showcase = null;
  const scText = dataBlock('showcase');
  if(scText){
    const p = parseFileText(scText);
    if(p.error) notify('The showcase: ' + p.error, 'err', 'showcase');
    else showcase = await readShowcase(p.raw);
  }
  const m = await readModelText(modelText, showcase && showcase.title ? showcase.title : 'Model');
  if(!m) return false;
  showModel(m, showcase);
  return true;
}

// The drop box, the Open button and dropping anywhere.
function wireFiles(){
  const input = $('fileInput');
  letAnyFileBePicked([input]);
  input.addEventListener('change', async () => { const files = Array.from(input.files || []); input.value = ''; await openFiles(files); });
  $('btnOpen').addEventListener('click', () => input.click());
  const box = $('dropBox');
  box.addEventListener('click', () => input.click());
  box.addEventListener('keydown', (ev) => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); input.click(); } });
  document.addEventListener('dragover', (ev) => { if(ev.dataTransfer && Array.from(ev.dataTransfer.types || []).includes('Files')){ ev.preventDefault(); box.classList.add('over'); } });
  document.addEventListener('dragleave', () => box.classList.remove('over'));
  document.addEventListener('drop', async (ev) => {
    if(!ev.dataTransfer || !ev.dataTransfer.files || !ev.dataTransfer.files.length) return;
    ev.preventDefault();
    box.classList.remove('over');
    await openFiles(ev.dataTransfer.files);
  });
}
// ============================================================
// The Logic view: the model's canvases drawn read-only (src/shared/canvas-view.js), the list
// of canvases, and moving around — drag to pan, the wheel, a pinch or + / − to zoom, Fit.
// ============================================================
const ZOOM_MIN = 0.1, ZOOM_MAX = 4, ZOOM_STEP = 1.25;

// state.model: { system, presets, name }; state.vm: the model as drawn (viewModel);
// state.showcase: the clean showcase or null; state.shown: { canvases, start, periods } —
// what the visitor may see; state.period: the period the canvas's numbers are for (the first
// shown: decision 3, visitors don't change the periods); state.canvasId: the canvas shown;
// state.layout / state.texts: its drawing; state.views: zoom and pan per canvas.
const state = { model: null, vm: null, showcase: null, shown: null, period: 0, canvasId: null, layout: null, texts: null,
  views: new Map(), card: null, modelJson: '' };

function showModel(m, showcase){
  state.model = m;
  state.modelJson = JSON.stringify(m.system);
  try{ state.vm = viewModel(m.system, m.presets); }
  catch(e){ notify('That model could not be shown.', 'err', 'load'); return; }
  state.showcase = showcase || null;
  const canvases = state.vm.canvases.map(c => ({ id: c.id, name: c.name }));
  const r = resolveShowcase(state.showcase, canvases, state.vm.periods.length);
  if(r.problems.length) notify('The showcase: ' + r.problems.join(' '), 'warn', 'resolve');
  else notify('', '', 'resolve');
  state.shown = r;
  state.period = r.periods.length ? r.periods[0] : 0;
  state.views = new Map();
  closeCard();
  notify('', '', 'load');
  renderAbout();
  $('welcome').classList.add('hidden');
  $('logic').classList.remove('hidden');
  document.body.classList.add('has-model');
  renderCanvasList();
  showCanvas(r.start, { quiet: true });
}

// The title, description, author and licence, and the mark.
function renderAbout(){
  const sc = state.showcase;
  const title = sc && sc.title ? sc.title : state.model.name;
  $('showTitle').textContent = title;
  document.title = title + ' — fmShowcase';
  const about = $('about');
  $('showDescription').textContent = sc ? sc.description : '';
  const by = [];
  if(sc && sc.author) by.push('By ' + sc.author);
  $('showByline').textContent = by.join('');
  about.classList.toggle('hidden', !(sc && (sc.description || sc.author)));
  const mark = $('mark');
  mark.classList.toggle('hidden', !!sc && sc.mark === false);
  $('markLicence').textContent = sc && sc.licence ? sc.licence : '';
}

function canvasName(id){ const c = state.vm && state.vm.byId.get(id); return c ? c.name : ''; }

// The canvases a visitor may see: tabs on a computer or an iPad, a menu on a phone.
function renderCanvasList(){
  const tabs = $('canvasTabs'), menu = $('canvasMenu');
  tabs.textContent = ''; menu.textContent = '';
  state.shown.canvases.forEach(id => {
    const t = make('button', 'canvas-tab', canvasName(id));
    t.type = 'button';
    t.setAttribute('role', 'tab');
    t.dataset.canvas = id;
    t.addEventListener('click', () => showCanvas(id));
    tabs.appendChild(t);
    const m = make('button', '', canvasName(id));
    m.type = 'button';
    m.setAttribute('role', 'menuitemradio');
    m.dataset.canvas = id;
    m.addEventListener('click', () => { closeCanvasMenu(); showCanvas(id); });
    menu.appendChild(m);
  });
  const several = state.shown.canvases.length > 1;
  tabs.classList.toggle('hidden', !several);
  $('btnCanvasMenu').classList.toggle('hidden', !several);
  $('logic').style.borderTopLeftRadius = several ? '' : '10px';
}
function markCanvasList(){
  document.querySelectorAll('#canvasTabs .canvas-tab').forEach(t => t.setAttribute('aria-selected', t.dataset.canvas === state.canvasId ? 'true' : 'false'));
  document.querySelectorAll('#canvasMenu button').forEach(b => b.setAttribute('aria-checked', b.dataset.canvas === state.canvasId ? 'true' : 'false'));
  $('canvasMenuName').textContent = canvasName(state.canvasId);
}
function closeCanvasMenu(){ $('canvasMenu').classList.add('hidden'); $('btnCanvasMenu').setAttribute('aria-expanded', 'false'); }

// Shows a canvas the visitor may see. Returns false for one that isn't shown.
function showCanvas(id, opts){
  if(!state.shown || !state.shown.canvases.includes(id)) return false;
  state.canvasId = id;
  markCanvasList();
  drawShown();
  const v = state.views.get(id);
  if(v) applyView(v); else fitView();
  if(!(opts && opts.keepCard)) closeCard();
  return true;
}

// Draws the canvas shown, for the period shown.
function drawShown(){
  const svg = $('canvasSvg');
  canvasDefs(svg);
  state.layout = canvasLayout(state.vm, state.canvasId);
  state.texts = nodeTexts(state.vm, state.canvasId, state.period, state.layout);
  drawCanvas($('world'), state.layout, state.texts);
  const name = state.vm.periods[state.period] || '';
  $('periodNote').textContent = name ? 'Numbers for ' + name : '';
  markPicked();
}

// ---------- zoom and pan ----------
// The view: the canvas point at the stage's top left (x, y), and the zoom.
function currentView(){ return state.views.get(state.canvasId) || { zoom: 1, x: 0, y: 0 }; }
function applyView(v){
  const z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Number(v.zoom) || 1));
  const view = { zoom: z, x: Number(v.x) || 0, y: Number(v.y) || 0 };
  state.views.set(state.canvasId, view);
  $('world').setAttribute('transform', `scale(${z}) translate(${-view.x} ${-view.y})`);
}
function stageSize(){ const r = $('stage').getBoundingClientRect(); return { w: Math.max(1, r.width), h: Math.max(1, r.height) }; }
// The whole canvas in sight, with a margin, never bigger than life-size.
function fitView(){
  const b = state.layout ? state.layout.bounds : { x: 0, y: 0, w: 400, h: 300 };
  const s = stageSize(), m = 24;
  const z = Math.min(1, Math.max(ZOOM_MIN, Math.min((s.w - 2 * m) / Math.max(1, b.w), (s.h - 2 * m) / Math.max(1, b.h))));
  applyView({ zoom: z, x: b.x - (s.w / z - b.w) / 2, y: b.y - (s.h / z - b.h) / 2 });
}
// Zooms by `factor` keeping the canvas point under (sx, sy) on the stage where it is.
function zoomAt(factor, sx, sy){
  const v = currentView();
  const z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, v.zoom * factor));
  const cx = v.x + sx / v.zoom, cy = v.y + sy / v.zoom;
  applyView({ zoom: z, x: cx - sx / z, y: cy - sy / z });
}
function zoomCentre(factor){ const s = stageSize(); zoomAt(factor, s.w / 2, s.h / 2); }
// Puts a node in the middle of the stage (going to an input from the card).
function centreOn(nodeId){
  const b = state.layout && state.layout.byId.get(nodeId);
  if(!b) return;
  const v = currentView(), s = stageSize();
  const z = Math.max(v.zoom, 0.6);
  const sideCard = !onPhone && !$('card').classList.contains('hidden') ? Math.min(380, s.w / 2) : 0;
  const usable = s.w - sideCard;
  applyView({ zoom: z, x: b.x + b.w / 2 - (usable / 2) / z, y: b.y + b.h / 2 - (onPhone ? s.h / 4 : s.h / 2) / z });
}

function stagePoint(ev){ const r = $('stage').getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }

// Drag to pan; a press that doesn't move is a tap (a rectangle's card). Two fingers pinch.
const TAP_SLOP = 6;
const touches = new Map(); // pointer id → its last stage point, for the pinch
let pinch = null;
function wireStage(){
  const stage = $('stage');
  onPress(stage, (ev) => {
    if(ev.button !== undefined && ev.button !== 0 && ev.type === 'mousedown') return;
    pressDefault(ev);
    const start = stagePoint(ev), v0 = currentView();
    const nodeEl = ev.target && ev.target.closest ? ev.target.closest('.cv-node') : null;
    let moved = false;
    followPointer(ev, (mv) => {
      if(pinch) return;
      const p = stagePoint(mv);
      if(!moved && Math.hypot(p.x - start.x, p.y - start.y) < TAP_SLOP) return;
      moved = true;
      stage.classList.add('dragging');
      applyView({ zoom: v0.zoom, x: v0.x - (p.x - start.x) / v0.zoom, y: v0.y - (p.y - start.y) / v0.zoom });
    }, (up, cancelled) => {
      stage.classList.remove('dragging');
      if(moved || cancelled || pinch) return;
      if(nodeEl) openCard(state.canvasId, nodeEl.dataset.id);
      else closeCard();
    });
  });
  // A pinch: two fingers on the stage zoom about their middle, and pan as it moves.
  stage.addEventListener('pointerdown', (ev) => {
    if(ev.pointerType === 'mouse') return;
    touches.set(ev.pointerId, stagePoint(ev));
    if(touches.size === 2){
      cancelFingerActions();
      const [a, b] = [...touches.values()];
      pinch = { dist: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, view: Object.assign({}, currentView()) };
    }
  });
  const lift = (ev) => { touches.delete(ev.pointerId); if(touches.size < 2) pinch = null; };
  stage.addEventListener('pointermove', (ev) => {
    if(!touches.has(ev.pointerId)) return;
    touches.set(ev.pointerId, stagePoint(ev));
    if(!pinch || touches.size < 2) return;
    const [a, b] = [...touches.values()];
    const dist = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const v = pinch.view;
    const z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, v.zoom * dist / pinch.dist));
    const cx = v.x + pinch.mid.x / v.zoom, cy = v.y + pinch.mid.y / v.zoom; // the canvas point first under the middle
    applyView({ zoom: z, x: cx - mid.x / z, y: cy - mid.y / z });
  });
  stage.addEventListener('pointerup', lift);
  stage.addEventListener('pointercancel', lift);
  // The wheel zooms about the pointer (a trackpad's pinch arrives as the wheel with Ctrl).
  stage.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const p = stagePoint(ev);
    const dy = ev.deltaMode === 1 ? ev.deltaY * 16 : ev.deltaY;
    zoomAt(Math.pow(ZOOM_STEP, -Math.max(-4, Math.min(4, dy / 100))), p.x, p.y);
  }, { passive: false });
  $('btnZoomIn').addEventListener('click', () => zoomCentre(ZOOM_STEP));
  $('btnZoomOut').addEventListener('click', () => zoomCentre(1 / ZOOM_STEP));
  $('btnFit').addEventListener('click', () => fitView());
  $('btnCanvasMenu').addEventListener('click', () => {
    const menu = $('canvasMenu'), open = menu.classList.contains('hidden');
    menu.classList.toggle('hidden', !open);
    $('btnCanvasMenu').setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', (ev) => {
    if($('canvasMenu').classList.contains('hidden')) return;
    if(ev.target.closest && (ev.target.closest('#canvasMenu') || ev.target.closest('#btnCanvasMenu'))) return;
    closeCanvasMenu();
  });
  document.addEventListener('keydown', (ev) => {
    if(!$('confirmBox').classList.contains('hidden')) return;
    if(ev.key === 'Escape'){ closeCard(); closeCanvasMenu(); return; }
    if(!state.vm || (ev.target && /^(INPUT|BUTTON|SELECT|TEXTAREA)$/.test(ev.target.tagName) && ev.key !== '+' && ev.key !== '-')) return;
    if(ev.key === '+' || ev.key === '='){ zoomCentre(ZOOM_STEP); ev.preventDefault(); }
    else if(ev.key === '-'){ zoomCentre(1 / ZOOM_STEP); ev.preventDefault(); }
    else if(ev.key === '0'){ fitView(); ev.preventDefault(); }
  });
  window.addEventListener('resize', () => { if(state.vm && state.canvasId && !state.views.has(state.canvasId)) fitView(); });
}
// ============================================================
// A node's card: what it is, its value in every period shown, and how it is worked out — the
// operator and each input it reads, with their values ("Revenue = Price × Volume: 12 × 1,000").
// Tapping an input goes to it, on whatever canvas it sits. Everything is read from the shared
// calculation's compiled model (the IR), never worked out again here.
// ============================================================
const EXPLAIN_DEPTH = 3; // operators feeding operators are followed this far

function irNode(canvasId, nodeId){ const c = state.vm.ir.canvases.get(canvasId); return c ? c.byId.get(nodeId) : undefined; }
function rawNode(canvasId, nodeId){ const c = state.vm.byId.get(canvasId); return c ? c.nodeById.get(nodeId) : undefined; }

// A node's name as the card says it.
function nodeName(canvasId, nodeId){
  const n = rawNode(canvasId, nodeId) || (irNode(canvasId, nodeId) || {}).node;
  if(!n) return '(missing)';
  if(n.type === 'value') return rectParts(n).name || '(unnamed)';
  if(n.type === 'alias'){
    const src = sourceOf(canvasId, nodeId);
    return src ? nodeName(src.canvasId, src.nodeId) : '(an alias to nothing)';
  }
  if(n.type === 'periodShift') return 'Period shift ' + shiftLabel(typeof n.shift === 'number' ? n.shift : -1);
  if(n.type === 'blockInstance'){ const b = blockPorts(state.vm, n.blockDefCanvasId); return b.def ? b.def.name + ' (block)' : '(missing block)'; }
  if(n.type === 'function'){ const c = state.vm.byId.get(canvasId); return c ? functionPorts(state.vm, c, n).name + ' (function)' : '(function)'; }
  return 'Operator ' + String(n.text || '').slice(0, 20);
}
// What an alias shows: { canvasId, nodeId } of its rectangle (following aliases of aliases), or null.
function sourceOf(canvasId, nodeId){
  let c = canvasId, id = nodeId;
  for(let i = 0; i < 20; i++){
    const n = irNode(c, id);
    if(!n || n.type !== 'alias') return n ? { canvasId: c, nodeId: id } : null;
    if(!n.sourceCanvasId || !n.sourceNodeId) return null;
    c = String(n.sourceCanvasId); id = String(n.sourceNodeId);
  }
  return null;
}

// A value in one period, written as its rectangle writes it: { text, error }.
function valueText(canvasId, nodeId, period){
  const c = state.vm.byId.get(canvasId), n = rawNode(canvasId, nodeId);
  const r = nodeResult(state.vm, canvasId, nodeId, period);
  if(r.error) return { text: '?', error: r.error };
  if(n && n.type === 'value' && !cvHasIncoming(c, nodeId)){
    const lit = effectiveLiteral(n, period);
    return { text: formatFor(state.vm, c, n, lit !== null ? lit : 0) };
  }
  if(r.value === undefined) return { text: '—' };
  if(n && n.type === 'value') return { text: formatFor(state.vm, c, n, r.value) };
  if(n && n.type === 'alias'){
    const src = sourceOf(canvasId, nodeId);
    const sn = src && rawNode(src.canvasId, src.nodeId);
    if(sn && sn.type === 'value') return { text: formatFor(state.vm, state.vm.byId.get(src.canvasId), sn, r.value) };
  }
  return { text: formatNum(r.value) };
}

// What an arrow brings into a node, as a term of a formula: { names, values, leaves } — the
// formula with names and with values, and the rectangles it reads (each { canvasId, nodeId,
// name, value }, to go to).
function term(canvasId, edge, period, depth){
  const src = irNode(canvasId, String(edge.from));
  if(!src) return { names: '(missing)', values: '?', leaves: [] };
  const id = String(edge.from);
  if(src.type === 'value' || src.type === 'alias'){
    const target = src.type === 'alias' ? sourceOf(canvasId, id) : { canvasId, nodeId: id };
    const name = nodeName(canvasId, id);
    const v = valueText(canvasId, id, period).text;
    return { names: name, values: v, leaves: [{ canvasId: target ? target.canvasId : canvasId, nodeId: target ? target.nodeId : id, name, value: v, missing: !target }] };
  }
  if(src.type === 'blockInstance'){
    const b = blockPorts(state.vm, src.blockDefCanvasId);
    const port = Number(edge.fromPort) || 0;
    const out = b.outputs[port];
    const name = (out ? rectParts(out).name || ('out' + port) : 'out' + port) + ' of ' + (b.def ? b.def.name : 'a missing block');
    const r = portResult(state.vm, canvasId, id, port, period);
    const v = r.value !== undefined ? formatNum(r.value) : '?';
    return { names: name, values: v, leaves: [{ canvasId, nodeId: id, name, value: v }] };
  }
  if(depth >= EXPLAIN_DEPTH){
    const v = valueText(canvasId, id, period).text;
    return { names: '(…)', values: v, leaves: [{ canvasId, nodeId: id, name: nodeName(canvasId, id), value: v }] };
  }
  const inner = formulaOf(canvasId, id, period, depth + 1);
  // Brackets round an operator inside another; none round the whole formula.
  const wrap = (s) => depth === 0 || /^[^\s(]+\(.*\)$|^[^\s]+$/.test(s) ? s : '(' + s + ')';
  return { names: wrap(inner.names), values: wrap(inner.values), leaves: inner.leaves };
}

// How a node other than a rectangle works out its value: { names, values, leaves, note }.
function formulaOf(canvasId, nodeId, period, depth){
  const n = irNode(canvasId, nodeId);
  const empty = { names: '', values: '', leaves: [] };
  if(!n) return empty;
  const join = (parts, sep, open, close) => ({
    names: open + parts.map(p => p.names).join(sep) + close,
    values: open + parts.map(p => p.values).join(sep) + close,
    leaves: parts.flatMap(p => p.leaves),
  });
  if(n.type === 'periodShift'){
    if(!n.incoming.length) return { names: '(nothing)', values: '?', leaves: [] };
    const t = term(canvasId, n.incoming[0], Math.min(Math.max(0, period + n.offset), state.vm.periods.length - 1), depth);
    const off = n.offset, when = off === -1 ? 'the period before' : off === 1 ? 'the period after' : off === 0 ? 'this period' : (off < 0 ? (-off) + ' periods before' : off + ' periods after');
    return { names: t.names + ' in ' + when, values: t.values, leaves: t.leaves };
  }
  if(n.type === 'function'){
    const fp = functionPorts(state.vm, state.vm.byId.get(canvasId), n.node);
    const c = state.vm.ir.canvases.get(canvasId);
    const ports = c.portEdges.get(nodeId);
    const parts = fp.params.map((p, i) => { const e = ports && ports.get(i); return e ? term(canvasId, e, period, depth) : { names: '(nothing)', values: '?', leaves: [] }; });
    return join(parts, ', ', fp.name + '(', ')');
  }
  if(n.type === 'blockInstance') return { names: nodeName(canvasId, nodeId), values: '', leaves: [] };
  // An operator.
  const op = n.op;
  const sym = String(n.symbol || '?');
  if(op && op.ports && n.portInputs){
    const names = operatorPortNames(op, op.choices ? n.portInputs.length - 1 : 0);
    const parts = n.portInputs.map((e, i) => {
      const t = e ? term(canvasId, e, period, depth) : { names: '(nothing)', values: '?', leaves: [] };
      const label = names[i] || ('input ' + (i + 1));
      return { names: label + ': ' + t.names, values: t.values, leaves: t.leaves };
    }).filter((p, i) => n.portInputs[i] || i < (op.choices ? 1 : names.length));
    return join(parts, ', ', sym + '(', ')');
  }
  const parts = (n.inputs || []).map(e => term(canvasId, e, period, depth));
  if(!parts.length) return { names: '(nothing connected)', values: '0', leaves: [] };
  if(op && !op.fn && parts.length > 1) return join(parts, ' ' + sym + ' ', '', '');
  return join(parts, ', ', sym + '(', ')');
}

// Where a rectangle's value comes from: { kind, names, values, leaves, error }.
function explain(canvasId, nodeId, period){
  const n = irNode(canvasId, nodeId);
  if(!n) return { kind: 'missing' };
  const r = nodeResult(state.vm, canvasId, nodeId, period);
  if(n.type === 'value'){
    if(n.isInput || !n.incoming.length) return { kind: 'input' };
    if(n.incoming.length > 1) return { kind: 'error', error: 'ambiguous' };
    const t = term(canvasId, n.incoming[0], period, 0);
    return { kind: 'calc', names: t.names, values: t.values, leaves: t.leaves, error: r.error };
  }
  if(n.type === 'alias'){
    const src = sourceOf(canvasId, nodeId);
    return { kind: 'alias', leaves: src ? [{ canvasId: src.canvasId, nodeId: src.nodeId, name: nodeName(src.canvasId, src.nodeId), value: valueText(canvasId, nodeId, period).text }] : [], error: r.error };
  }
  if(n.type === 'blockInstance') return { kind: 'block' };
  const f = formulaOf(canvasId, nodeId, period, 0);
  return { kind: 'node', names: f.names, values: f.values, leaves: f.leaves, error: r.error };
}

// Whether a canvas is used as a block (its rectangles then have numbers per use).
function usedAsBlock(canvasId){ return state.vm.canvases.some(c => c.nodes.some(n => n.type === 'blockInstance' && String(n.blockDefCanvasId) === canvasId)); }

function openCard(canvasId, nodeId){
  const n = rawNode(canvasId, nodeId);
  if(!n) return false;
  state.card = { canvasId, nodeId };
  const card = $('card'), body = $('cardBody');
  body.textContent = '';
  const name = n.type === 'alias' ? '🔗 ' + nodeName(canvasId, nodeId) : nodeName(canvasId, nodeId);
  $('cardTitle').textContent = name;
  const where = [canvasName(canvasId)];
  if(n.type === 'value' || n.type === 'alias'){ const u = unitText(state.vm, state.vm.byId.get(canvasId), n); if(u.text) where.push(u.text); }
  $('cardWhere').textContent = where.join(' · ');

  const ex = explain(canvasId, nodeId, state.period);
  // What it is, and how it is worked out.
  if(ex.kind === 'input'){
    body.appendChild(make('p', 'card-kind', 'An input: a number typed into the model.'));
  } else if(ex.kind === 'alias'){
    body.appendChild(make('p', 'card-kind', 'Shows another rectangle\'s value.'));
  } else if(ex.kind === 'block'){
    const b = blockPorts(state.vm, n.blockDefCanvasId);
    body.appendChild(make('p', 'card-kind', b.def ? 'A use of the block "' + b.def.name + '": its inputs feed that canvas, and its outputs come back.' : 'A block whose canvas no longer exists.'));
  } else if(ex.kind === 'error'){
    body.appendChild(make('p', 'card-kind card-error', 'Can\'t be worked out: ' + errorWords(ex.error) + '.'));
  }
  if(ex.kind === 'calc' || ex.kind === 'node'){
    body.appendChild(make('h3', '', 'How it is worked out'));
    const lhs = n.type === 'value' ? (rectParts(n).name || '(unnamed)') + ' = ' : '= ';
    body.appendChild(make('p', 'card-formula', lhs + ex.names));
    if(ex.values) body.appendChild(make('p', 'card-formula with-values', lhs + ex.values + (state.vm.periods[state.period] ? '   (' + state.vm.periods[state.period] + ')' : '')));
  }
  if(ex.error && ex.kind !== 'error') body.appendChild(make('p', 'card-note card-error', 'Can\'t be worked out: ' + errorWords(ex.error) + '.'));

  // Its value in every period shown.
  if(n.type !== 'blockInstance'){
    body.appendChild(make('h3', '', 'Value'));
    const table = make('table', 'card-values');
    state.shown.periods.forEach(p => {
      const tr = make('tr', p === state.period ? 'shown' : '');
      tr.appendChild(make('td', '', state.vm.periods[p] || 'Period ' + (p + 1)));
      const vt = valueText(canvasId, nodeId, p);
      tr.appendChild(make('td', vt.error ? 'card-error' : '', vt.text));
      table.appendChild(tr);
    });
    body.appendChild(table);
  } else {
    const b = blockPorts(state.vm, n.blockDefCanvasId);
    if(b.outputs.length){
      body.appendChild(make('h3', '', 'Outputs'));
      const table = make('table', 'card-values');
      b.outputs.forEach((o, i) => {
        state.shown.periods.forEach(p => {
          const tr = make('tr', p === state.period ? 'shown' : '');
          tr.appendChild(make('td', '', (rectParts(o).name || 'out' + i) + ', ' + (state.vm.periods[p] || 'Period ' + (p + 1))));
          const r = portResult(state.vm, canvasId, nodeId, i, p);
          tr.appendChild(make('td', r.error ? 'card-error' : '', r.value !== undefined ? formatNum(r.value) : '?'));
          table.appendChild(tr);
        });
      });
      body.appendChild(table);
    }
  }

  // The inputs it reads, each to go to.
  const leaves = [];
  (ex.leaves || []).forEach(l => { if(!leaves.some(x => x.canvasId === l.canvasId && x.nodeId === l.nodeId)) leaves.push(l); });
  if(leaves.length){
    body.appendChild(make('h3', '', ex.kind === 'alias' ? 'Shows' : 'Reads'));
    const ul = make('ul', 'card-inputs');
    leaves.forEach(l => {
      const li = make('li');
      const b = make('button', 'card-input');
      b.type = 'button';
      const left = make('span');
      left.appendChild(make('span', 'card-input-name', l.name));
      const shown = state.shown.canvases.includes(l.canvasId);
      const whereText = l.missing ? 'missing' : (shown ? canvasName(l.canvasId) : 'on a canvas not shown here');
      left.appendChild(make('span', 'card-input-where', whereText));
      b.appendChild(left);
      b.appendChild(make('span', 'card-input-value', l.value));
      if(!shown || l.missing) b.disabled = true;
      else b.addEventListener('click', () => goTo(l.canvasId, l.nodeId));
      b.dataset.canvas = l.canvasId; b.dataset.node = l.nodeId;
      li.appendChild(b);
      ul.appendChild(li);
    });
    body.appendChild(ul);
  }
  if(usedAsBlock(canvasId)) body.appendChild(make('p', 'card-note', 'This canvas is a block: each use of it has its own numbers. These are the canvas\'s own.'));

  card.classList.remove('hidden');
  markPicked();
  return true;
}
function closeCard(){
  state.card = null;
  $('card').classList.add('hidden');
  markPicked();
}
// The node whose card is open, and what it reads on this canvas, outlined.
function markPicked(){
  document.querySelectorAll('#world .cv-node.picked, #world .cv-node.reads').forEach(e => e.classList.remove('picked', 'reads'));
  if(!state.card || state.card.canvasId !== state.canvasId) return;
  const find = (id) => Array.from(document.querySelectorAll('#world .cv-node')).find(e => e.dataset.id === id);
  const me = find(state.card.nodeId);
  if(me) me.classList.add('picked');
  const ex = explain(state.card.canvasId, state.card.nodeId, state.period);
  (ex.leaves || []).forEach(l => { if(l.canvasId === state.canvasId){ const e = find(l.nodeId); if(e && e !== me) e.classList.add('reads'); } });
}
// Goes to a rectangle: its canvas, the rectangle in the middle, its card open.
function goTo(canvasId, nodeId){
  if(canvasId !== state.canvasId && !showCanvas(canvasId, { keepCard: true })) return false;
  openCard(canvasId, nodeId);
  centreOn(nodeId);
  return true;
}

function wireCard(){
  $('cardClose').addEventListener('click', () => closeCard());
}
// ============================================================
// window.fmViewer: what the tests read and do, through the page as a visitor would (V2 adds
// setSlider, showScenario and play; V4 excelBytes). It changes nothing in the model: there is
// nothing to change it with.
// ============================================================
window.fmViewer = {
  state(){
    return { loaded: !!state.vm, title: $('showTitle').textContent, canvases: state.shown ? state.shown.canvases.slice() : [],
      canvas: state.canvasId, period: state.period, periods: state.shown ? state.shown.periods.slice() : [],
      zoom: state.vm ? currentView().zoom : null, card: state.card ? Object.assign({}, state.card) : null,
      mark: !$('mark').classList.contains('hidden') };
  },
  canvases(){ return state.vm ? state.shown.canvases.map(id => ({ id, name: canvasName(id) })) : []; },
  showCanvas(id){ return showCanvas(String(id)); },
  openCard(canvasId, nodeId){ if(canvasId !== state.canvasId && !showCanvas(String(canvasId), { keepCard: true })) return false; return openCard(String(canvasId), String(nodeId)); },
  closeCard(){ closeCard(); },
  goTo(canvasId, nodeId){ return goTo(String(canvasId), String(nodeId)); },
  // A node's number in a period (from 0): the number, or { error }, or null.
  value(canvasId, nodeId, period){
    if(!state.vm) return null;
    const n = rawNode(String(canvasId), String(nodeId));
    if(n && n.type === 'value' && !cvHasIncoming(state.vm.byId.get(String(canvasId)), String(nodeId))){
      const lit = effectiveLiteral(n, period); return lit !== null ? lit : 0;
    }
    const r = nodeResult(state.vm, String(canvasId), String(nodeId), Number(period) || 0);
    return r.error ? { error: r.error } : (r.value !== undefined ? r.value : null);
  },
  view(){ return state.vm ? Object.assign({}, currentView()) : null; },
  fit(){ if(state.vm) fitView(); },
  // The drawing of the canvas shown: boxes and arrow ends (to compare with fmIDE's).
  layout(){
    if(!state.layout) return null;
    return { nodes: state.layout.nodes.map(b => ({ id: b.id, type: b.type, x: b.x, y: b.y, w: b.w, h: b.h })),
      edges: state.layout.edges.map(e => ({ id: e.id, from: e.from, to: e.to, d: e.d, auto: e.auto, badge: e.badge ? e.badge.n : null })) };
  },
  // The model as it was read: the same after anything a visitor does.
  modelText(){ return state.model ? JSON.stringify(state.model.system) : ''; },
  modelTextAtLoad(){ return state.modelJson; },
};

wireFiles();
wireStage();
wireCard();
startFromPage().catch(() => notify('That viewer could not be opened.', 'err', 'load'));
})();
</script>
